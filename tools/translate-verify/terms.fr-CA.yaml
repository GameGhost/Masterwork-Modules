# Shared fr-CA game term base for My Father's Work, used by every scenario and the app UI.
#
# Precedence: the official French rulebook, *Le Secret de mon père* (Origames 2023), then the
# Cradle French scripts, then the Unity app's French. Game terms keep the rulebook's capitals.
#
# en/fr/note/from are for the agents (the back-translator gets en/fr reversed). source/target are
# for `checktranslation`: case-insensitive .NET patterns; a term-missing result is a flag the judge
# weighs, not a failure. (?-i:...) makes a pattern case-sensitive. `forbidden` patterns are hard
# failures, so keep them unambiguous.
terms:
  - en: "My Father's Work (the game, in running text)"
    fr: 'Le Secret de mon père'
    from: 'rulebook'
    note: "The app's own name stays My Father's Work, as the rulebook says: « l'application My Father's Work »."
    source: "\\bMy Father's Work\\b"
    target: "Le Secret de mon père|My Father's Work"
  - en: 'A Time of War'
    fr: 'Temps de guerre'
    from: 'rulebook'
    note: 'Scenario title.'
    source: '\bA Time of War\b'
    target: 'Temps de guerre'
  - en: 'The Cost of Disease'
    fr: 'Le Fardeau de la maladie'
    from: 'rulebook'
    note: 'Scenario title.'
    source: '\bThe Cost of Disease\b'
    target: 'Fardeau de la maladie'
  - en: 'Fear of the Unknown'
    fr: "La Peur de l'inconnu"
    from: 'rulebook'
    note: 'Scenario title.'
    source: '\bFear of the Unknown\b'
    target: "Peur de l.inconnu"
  - en: 'Round'
    fr: 'manche (f.)'
    from: 'rulebook, Cradle'
    note: 'Never tour for a game round: tour is a player''s turn. End of Round: fin de la manche.'
    source: '\bRounds?\b'
    target: 'manche'
  - en: 'Generation'
    fr: 'Génération'
    from: 'rulebook'
    note: 'GENERATION I: GÉNÉRATION I. End of Generation: Fin de la Génération.'
    source: '\bGenerations?\b'
    target: 'Génération'
  - en: 'Early Years'
    fr: 'Début de cycle'
    from: 'rulebook, Cradle'
    note: 'The Early Years of the First Generation has ended: Le Début de cycle de la première Génération est terminé.'
    source: '\bEarly Years\b'
    target: 'Début de cycle'
  - en: 'Middle Years'
    fr: 'Milieu de cycle'
    from: 'rulebook, Cradle'
    source: '\bMiddle Years\b'
    target: 'Milieu de cycle'
  - en: 'Late Years'
    fr: 'Fin de cycle'
    from: 'rulebook, Cradle'
    source: '\bLate Years\b'
    target: 'Fin de cycle'
  - en: 'Masterwork (the component)'
    fr: 'Grand Œuvre (m.)'
    from: 'rulebook, Cradle'
    note: 'Write the ligature Œ.'
    source: '(?-i:\bMasterworks?\b)'
    target: 'Grand Œuvre|Grands Œuvres'
  - en: 'Storybook'
    fr: 'Livret Histoire (m.)'
    from: 'rulebook'
    note: 'Storybook token: jeton Livret Histoire.'
    source: '\bStorybook\b'
    target: 'Livret Histoire'
  - en: 'Estate'
    fr: 'Domaine'
    from: 'rulebook'
    source: '(?-i:\bEstates?\b)'
    target: 'Domaine'
  - en: 'Estate Upgrade'
    fr: 'Aménagement de Domaine'
    from: 'rulebook'
    note: 'Plural: Aménagements de Domaine. Lavish Estate Upgrade: Aménagement fastueux de Domaine.'
    source: '\bEstate Upgrades?\b'
    target: 'Aménagement'
  - en: 'Experiment'
    fr: 'Expérience'
    from: 'rulebook'
    note: 'The action is « Expérimenter ».'
    source: '\bExperiments?\b'
