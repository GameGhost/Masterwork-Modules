id: 'masterwork.template'
version: '0.4.2'
languages:
  - 'en-US'
title:
  - en-US: 'My Father''s Work — Template'
description:
  - en-US: 'Design/reference module — not a playable scenario. Exercises every layout and popup shape the app needs to support, so visual treatment can be built and screenshotted here before being copied into real scenario modules (see README.md and scripts/apply-template.ps1 in the Masterwork-Modules repo root).'
thumbnail:
  image: 'image://_demo/thumbnail'
info:
  players-min: 2
  players-max: 4
  playtime:
  - en-US: '5 minutes'
entry: 'Setup_01_PlayerCountSelect'

# Fully hand-authored — there is no extractor step for this module, so everything lives directly in
# passages/ (no passages_override split needed; that split exists for cost-of-disease because its
# passages/ is regenerated by re-extraction and passages-override/ is what survives that).
passages: 'passages'

# This module's own visual styling — the app's chrome only emits structural class hooks
# (layout-{value}, style-{value}); everything those hooks actually look like lives here.
style: 'assets/style.css'

# Standalone module
dependencies: []
