# Exercises the input node inside a popup — reusing the real `prompt` layout (see Example_Entry's
# own "Input prompt (fixed-size field)" demo) rather than an inline passage-level input. Part of the
# Demo Module logic/expression showcase — see Demo_Hub.mws.yaml.
format: 'mws/0.4'
passage_id: 'Demo_Survey'
title: 'restext://Demo_Survey_Title'
layout: 'narration'
nodes:
- type: 'assign'
  var: '_ProgressRound'
  expr: 'demoRoundNum - 1'
- type: 'text'
  value: 'restext://Demo_Survey_Intro'
- type: 'break'
  style: 'paragraph'
- type: 'popup'
  layout: 'prompt'
  label: 'restext://Demo_TakeSurvey'
  content:
  - type: 'text'
    value: 'restext://Demo_Survey_Question'
  - type: 'input'
    var: 'demoSurveyCount'
    min: 0
  okay: 'restext://Demo_Survey_Submit'
  target: 'Demo_SurveyResult'
  snapshot: true
- type: 'break'
- type: 'link'
  label: 'restext://Demo_BackToSquare'
  target: 'Demo_Hub'
  snapshot: true
