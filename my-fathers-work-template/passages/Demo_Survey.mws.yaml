# Exercises the input node inside a popup — reusing the real `prompt` layout (see Example_Entry's
# own "Input prompt (fixed-size field)" demo) rather than an inline passage-level input. Part of the
# Demo Module logic/expression showcase — see Demo_Hub.mws.yaml.
format: 'mws/0.4'
passage_id: 'Demo_Survey'
title: 'A Quick Survey'
layout: 'narration'
nodes:
- type: 'assign'
  var: 'roundNum'
  expr: 'demoRoundNum'
- type: 'text'
  value: 'Before we continue, a quick survey.'
- type: 'break'
  style: 'paragraph'
- type: 'popup'
  layout: 'prompt'
  label: 'Take the survey'
  content:
  - type: 'text'
    value: 'How many people are in your group?'
  - type: 'input'
    var: 'demoSurveyCount'
    min: 0
  okay: 'Submit'
  target: 'Demo_SurveyResult'
  snapshot: true
- type: 'break'
- type: 'link'
  label: '← Back to the square'
  target: 'Demo_Hub'
  snapshot: true
