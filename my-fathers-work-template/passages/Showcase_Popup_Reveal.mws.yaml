# layout: 'reveal' -- the extractor's own fallback for a click-triggered popup with no other
# special-purpose marker (V2Serializer.TransformPopup, docs/mws-format-latest.md §8): "hand the
# device to one player, reveal a private passage of text that ends in a real choice link." Cost of
# Disease's Gen1-CreepyTrackRes is the real-world example this reproduces. Content below is
# deliberately long (several paragraphs) so the popup's own scrolling can be exercised at the
# enlarged box size style.css's .layout-reveal uses -- `note`'s much smaller box never needed this.
# No `okay` -- the player leaves via one of the two choice links at the end, same as every real
# occurrence; `cancel: 'Close'` (rendered as a corner (x), no visible label) lets the player back
# out without choosing, matching what the extractor always emits for this layout.
format: 'mws/0.4'
passage_id: 'Showcase_Popup_Reveal'
title: 'Reveal Popup'
layout: 'narration'
nodes:
- type: 'assign'
  var: 'roundNum'
  expr: 'demoRoundNum'
- type: 'text'
  value: 'Carefully hand this storybook device to the reader and do not allow any other players to see the screen.'
- type: 'break'
  style: 'paragraph'
- type: 'popup'
  layout: 'reveal'
  label: 'Once you are ready, click here to reveal your secret conversation.'
  cancel: 'Close'
  snapshot: true
  content:
  - type: 'text'
    value: '**A Seedy Arrangement**'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'The letter arrived on a Tuesday, though the postmark suggested it had wandered through at least three cities before finding its way to Laurelton. Its author, an old university colleague, wrote with the particular enthusiasm of someone who had not yet learned the cost of ambition.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: '"You will recall," the letter began, "our conversations in the amphitheatre, before the faculty grew tiresome of our methods. I write now not out of nostalgia, but out of necessity -- I have found something in the old records that I believe belongs to your particular expertise, and to no one else''s."'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'What followed was three pages of dense, cramped handwriting, describing a set of experiments abandoned decades prior by a researcher whose name had been carefully struck from every surviving record. The colleague had found only fragments: a single page of notation, a sketch of an apparatus no longer extant, and a warning, underlined twice, that the work should never be resumed by anyone lacking a very particular kind of patience.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'It was, in other words, exactly the sort of correspondence that could not be ignored.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'The household had grown accustomed to such letters by now -- invitations to obscurity dressed up as academic curiosity, forwarded from one estranged colleague to the next until they found a family willing to entertain them. Most were discarded within the hour. This one was not.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'By evening, the notation had been transcribed twice, cross-referenced against the family''s own considerable library, and pinned to the wall of the study alongside a dozen other threads that had, over the years, refused to resolve into anything resembling an answer.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'A representative arrived within the week, unannounced, and was received all the same. Their mannerisms were especially secretive and plotting, though their offer -- once made -- was plain enough: support, substantial and immediate, in exchange for nothing more than a favor to be named later. It was, they noted with an unsettling grin, always easier to ask a friend than a stranger.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'What could be said with some confidence was this: the letter had cost nothing to receive, and everything to answer.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: '**CHOOSE:**'
  - type: 'break'
  - type: 'link'
    label: 'Accept the offer.'
    target: 'Example_Entry'
    snapshot: false
  - type: 'text'
    value: '(To gain $2.)'
  - type: 'break'
  - type: 'text'
    value: 'OR'
  - type: 'break'
  - type: 'link'
    label: 'Refuse the offer.'
    target: 'Example_Entry'
    snapshot: false
  - type: 'text'
    value: '(To avoid a debt in the future.)'
- type: 'link'
  label: '← Back to Showcase'
  target: 'Example_Entry'
