# layout: 'reveal' -- the extractor's own fallback for a click-triggered popup with no other
# special-purpose marker (V2Serializer.TransformPopup, docs/mws-format-latest.md §8): "hand the
# device to one player, reveal a private passage of text that ends in a real choice link." Cost of
# Disease's Gen1-CreepyTrackRes is the real-world example this reproduces. Content below is
# deliberately long (several paragraphs) so the popup's own scrolling can be exercised at the
# enlarged box size style.css's .layout-reveal uses -- `note`'s much smaller box never needed this.
# No `okay` -- the player leaves via one of the two choice links at the end, same as every real
# occurrence; `cancel: 'Close'` (rendered as a corner (x), no visible label) lets the player back
# out without choosing, matching what the extractor always emits for this layout.
format: 'mws/0.4'
passage_id: 'Showcase_Popup_Reveal'
title: 'restext://Showcase_Reveal_Title'
layout: 'narration'
nodes:
- type: 'assign'
  var: '_ProgressRound'
  expr: 'demoRoundNum - 1'
- type: 'text'
  value: 'restext://Showcase_HandDevice'
- type: 'break'
  style: 'paragraph'
- type: 'popup'
  layout: 'reveal'
  label: 'restext://Showcase_Reveal_Label'
  cancel: 'restext://Common_Close'
  snapshot: true
  content:
  - type: 'text'
    value: 'restext://Showcase_Reveal_Heading'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Letter_Arrival'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Reveal_Recall'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Letter_Fragments'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Letter_NotIgnored'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Reveal_Accustomed'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Reveal_Evening'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Reveal_Representative'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Letter_Cost'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Reveal_Choose'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Reveal_Accept'
    target: 'Example_Entry'
    snapshot: false
  - type: 'text'
    value: 'restext://Showcase_Reveal_AcceptNote'
  - type: 'break'
  - type: 'text'
    value: 'restext://Showcase_Reveal_Or'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Reveal_Refuse'
    target: 'Example_Entry'
    snapshot: false
  - type: 'text'
    value: 'restext://Showcase_Reveal_RefuseNote'
- type: 'link'
  label: 'restext://Showcase_Back'
  target: 'Example_Entry'
