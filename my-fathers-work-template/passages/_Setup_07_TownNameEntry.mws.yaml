# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Same self-navigating input pattern as the player-name passages. Acknowledgement text reuses
# NameEntryTownConfirm_001/002's existing restext (passages/00221-NameEntryTownConfirm.mws.yaml).
---
format: 'mws/0.4'
passage_id: 'Setup_07_TownNameEntry'
layout: 'setup'
nodes:
- type: 'conditional'
  if: 'townname == ""'
  then:
  - type: 'text'
    value: 'restext://TCOD_TownName_001'
    style: 'setup-title'
  - type: 'break'
  - type: 'text'
    value: 'restext://TCOD_TownName_002'
  - type: 'break'
    style: 'paragraph'
  - type: 'input'
    label: 'Please collectively enter the name of the town in which your inheritance resides.'
    var: 'townname'
    style: 'setup-input'
  - type: 'link'
    label: 'Continue'
    target: 'Setup_07_TownNameEntry'
    snapshot: false
  # Torn-parchment note popup (screenshot: Setup-06) — auto-displays once townname is set.
  else:
  - type: 'popup'
    layout: 'note'
    content:
    - type: 'text'
      value: 'restext://NameEntryTownConfirm_001'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      value: 'restext://NameEntryTownConfirm_002'
    okay: 'Continue'
    target: '00_Preparations' # TODO replace with module scope passage
    snapshot: true