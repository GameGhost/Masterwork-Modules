# Was a one-link stub ("click here to start scoring"). Now the layout showcase index — the "main
# play passages between setup and scoring" bridge. Every demo below links back here (either via its
# own explicit "Back to Showcase" link, or — for the hub demos — the "Click here..." link that's
# itself part of what's being demoed); the final link continues into the existing scoring flow
# (Scoring_01_ScoreEntry.mws.yaml etc.), unchanged. Demo links deliberately have no `style:` — the
# bracket-link look (inherited from the hub_early layout this passage itself uses) already reads
# fine for a plain list of choices, and matches every other hub-card link on this page instead of
# introducing a second, mismatched button look.
---
format: 'mws/0.4'
passage_id: 'Example_Entry'
title: 'Layout Showcase'
layout: 'hub_early'
nodes:
- type: 'conditional'
  if: 'demoRoundNum == 0'
  then:
  - type: 'assign'
    var: 'demoRoundNum'
    expr: '1'
# This passage's own layout (hub_early) switches its footer's progress bar on `roundNum`, same as
# every other demo — without this assign, `roundNum` keeps whatever stale value a previous demo
# passage last set it to, so the round-selector's onclick links (below) visibly update
# `demoRoundNum`/the "Currently previewing round N" text but the progress bar looked stuck (it
# wasn't a stale-render bug — RenderInPlace re-evaluates chrome fresh on every navigation — the
# chrome was just switching on a variable this passage never re-derived).
- type: 'assign'
  var: 'roundNum'
  expr: 'demoRoundNum'
- type: 'text'
  value: 'Jump into any layout below to see it styled for real. Each demo links back here.'
- type: 'break'
  style: 'paragraph'
# Drives the progress bar shown by every narration/introduction/hub_*-layout demo below — each one
# reads demoRoundNum for its own roundNum assign, so picking a round here carries through to
# whichever demo you open next. Plain standard nodes in a hub-card section, same as any other hub
# content — this is a manual-testing aid, not real content, so no dedicated styling of its own.
- type: 'section'
  style: 'hub-card'
  title: 'Round Selector (testing only)'
  content:
  - type: 'text'
    value: 'Currently previewing round {demoRoundNum}. Pick a different one:'
  - type: 'break'
  - type: 'link'
    label: 'I-1'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '1'
  - type: 'link'
    label: 'I-2'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '2'
  - type: 'link'
    label: 'I-3'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '3'
  - type: 'link'
    label: 'II-1'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '4'
  - type: 'link'
    label: 'II-2'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '5'
  - type: 'link'
    label: 'II-3'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '6'
  - type: 'link'
    label: 'III-1'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '7'
  - type: 'link'
    label: 'III-2'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '8'
  - type: 'link'
    label: 'III-3'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '9'
- type: 'break'
  style: 'paragraph'
- type: 'section'
  style: 'hub-card'
  title: 'Story Passages'
  content:
  - type: 'text'
    value: 'Full-frame narration, introduction, and special-event content.'
  - type: 'break'
  - type: 'link'
    label: 'Narration — short'
    target: 'Showcase_Narration_Short'
  - type: 'break'
  - type: 'link'
    label: 'Narration — long (scroll test)'
    target: 'Showcase_Narration_Long'
  - type: 'break'
  - type: 'link'
    label: 'Introduction'
    target: 'Showcase_Introduction'
  - type: 'break'
  - type: 'link'
    label: 'Event'
    target: 'Showcase_Event'
- type: 'section'
  style: 'hub-card'
  title: 'Hub Passages'
  content:
  - type: 'text'
    value: 'The per-generation location hub — card stack, blue links, real progress bar.'
  - type: 'break'
  - type: 'link'
    label: 'Hub — early years'
    target: 'Showcase_Hub_Early'
  - type: 'break'
  - type: 'link'
    label: 'Hub — middle years'
    target: 'Showcase_Hub_Middle'
  - type: 'break'
  - type: 'link'
    label: 'Hub — late years (scroll test)'
    target: 'Showcase_Hub_Late'
- type: 'section'
  style: 'hub-card'
  title: 'Popups'
  content:
  - type: 'text'
    value: 'Triggered right here on the hub — Okay just closes and you stay put (target: Example_Entry, snapshot: false), so there''s nothing to navigate back from. Okay-only and Okay+Cancel variants sit side by side so both button counts can be checked against the same layout.'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'Setup (instructional popup):'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'setup'
    label: 'Okay only'
    header:
    - type: 'image'
      asset: 'image://_demo/setup_dubious_bartering'
      style: 'setup-image'
      title: 'Dubious Bartering card'
    content:
    - type: 'text'
      value: 'Retrieve the Dubious Bartering cards from the scenario box. Shuffle them and give each player a card. This card is placed face-up near their Estate and is activated each time the listed action is taken.'
    okay: 'Accept'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'setup'
    label: 'Okay + Cancel'
    header:
    - type: 'image'
      asset: 'image://_demo/setup_dubious_bartering'
      style: 'setup-image'
      title: 'Dubious Bartering card'
    content:
    - type: 'text'
      value: 'Retrieve the Dubious Bartering cards from the scenario box. Shuffle them and give each player a card. This card is placed face-up near their Estate and is activated each time the listed action is taken.'
    okay: 'Accept'
    cancel: 'Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'End of round:'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'end_of_round'
    label: 'Okay only'
    content:
    - type: 'text'
      value: 'End of Round'
      style: 'popup-title'
    - type: 'text'
      value: 'The Early Years of the First Generation has ended. Perform all End of Round actions. Then, perform all Start of Round actions for the Middle Years before continuing.'
    okay: 'Confirm'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'end_of_round'
    label: 'Okay + Cancel'
    content:
    - type: 'text'
      value: 'End of Round'
      style: 'popup-title'
    - type: 'text'
      value: 'The Early Years of the First Generation has ended. Perform all End of Round actions. Then, perform all Start of Round actions for the Middle Years before continuing.'
    okay: 'Confirm'
    cancel: 'Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'End of generation:'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'end_of_generation'
    label: 'Okay only'
    content:
    - type: 'text'
      value: 'End of Generation'
      style: 'popup-title'
    - type: 'text'
      value: 'The First Generation has drawn to a close. Remove all player pieces from the board and perform the End of a Generation. Return any remaining tokens to the supply.'
    okay: 'Confirm'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'end_of_generation'
    label: 'Okay + Cancel'
    content:
    - type: 'text'
      value: 'End of Generation'
      style: 'popup-title'
    - type: 'text'
      value: 'The First Generation has drawn to a close. Remove all player pieces from the board and perform the End of a Generation. Return any remaining tokens to the supply.'
    okay: 'Confirm'
    cancel: 'Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'Input prompt (fixed-size field):'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'prompt'
    label: 'Okay only'
    content:
    - type: 'text'
      value: 'Count up all the heart tokens collected by ALL players. Please enter the total number here.'
    - type: 'input'
      var: 'demoInputValue'
      min: 0
    okay: 'Continue'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'prompt'
    label: 'Okay + Cancel'
    content:
    - type: 'text'
      value: 'Count up all the heart tokens collected by ALL players. Please enter the total number here.'
    - type: 'input'
      var: 'demoInputValue'
      min: 0
    okay: 'Continue'
    cancel: 'Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'Choice (generic bordered popup — not a real requirement on its own; exercises the checkbox input style scoring needs):'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'choice'
    label: 'Choose Audio Voice'
    content:
    - type: 'text'
      value: 'Choose Audio Voice'
      style: 'popup-title'
    - type: 'text'
      value: 'Feminine'
      style: 'choice-label'
    - type: 'input'
      var: 'demoVoiceFeminine'
      style: 'choice-checkbox'
    okay: 'Continue'
    cancel: 'Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'Reveal countdown needs its own passage (a nested popup inside a popup), so it stays a separate demo:'
    style: 'text-sm'
  - type: 'break'
  - type: 'link'
    label: 'Popup — reveal countdown'
    target: 'Showcase_Popup_RevealCountdown'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'Continue →'
  target: 'ScoreEntry'
  snapshot: true
  style: 'btn-green'
