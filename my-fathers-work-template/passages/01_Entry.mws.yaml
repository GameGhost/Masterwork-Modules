# Was a one-link stub ("click here to start scoring"). Now the layout showcase index — the "main
# play passages between setup and scoring" bridge. Every demo below links back here (either via its
# own explicit "Back to Showcase" link, or — for the hub demos — the "Click here..." link that's
# itself part of what's being demoed); the final link continues into the existing scoring flow
# (Scoring_01_ScoreEntry.mws.yaml etc.), unchanged. Demo links deliberately have no `style:` — the
# bracket-link look (inherited from the hub_early layout this passage itself uses) already reads
# fine for a plain list of choices, and matches every other hub-card link on this page instead of
# introducing a second, mismatched button look.
---
format: 'mws/0.4'
passage_id: 'Example_Entry'
title: 'restext://Showcase_Entry_Title'
layout: 'hub_early'
nodes:
- type: 'conditional'
  if: 'demoRoundNum == 0'
  then:
  - type: 'assign'
    var: 'demoRoundNum'
    expr: '1'
# This passage's own layout (hub_early) switches its footer's progress bar on `roundNum`, which
# mwf-common-assets' shared chrome derives from `_ProgressRound` (min(_ProgressRound + 1, 9) —
# same as every real module) — without this assign, `_ProgressRound` keeps whatever stale value a
# previous demo passage last set it to, so the round-selector's onclick links (below) visibly
# update `demoRoundNum`/the "Currently previewing round N" text but the progress bar looked stuck
# (it wasn't a stale-render bug — RenderInPlace re-evaluates chrome fresh on every navigation — the
# chrome was just switching on a variable this passage never re-derived).
- type: 'assign'
  var: '_ProgressRound'
  expr: 'demoRoundNum - 1'
- type: 'text'
  value: 'restext://Showcase_Entry_Intro'
- type: 'break'
  style: 'paragraph'
# Drives the progress bar shown by every narration/introduction/hub_*-layout demo below — each one
# reads demoRoundNum for its own _ProgressRound assign, so picking a round here carries through to
# whichever demo you open next. Plain standard nodes in a hub-card section, same as any other hub
# content — this is a manual-testing aid, not real content, so no dedicated styling of its own.
- type: 'section'
  style: 'hub-card'
  title: 'restext://Showcase_RoundSelector_Title'
  content:
  - type: 'text'
    value: 'restext://Showcase_RoundSelector_Current'
  - type: 'break'
  - type: 'link'
    label: 'I-1'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '1'
  - type: 'link'
    label: 'I-2'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '2'
  - type: 'link'
    label: 'I-3'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '3'
  - type: 'link'
    label: 'II-1'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '4'
  - type: 'link'
    label: 'II-2'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '5'
  - type: 'link'
    label: 'II-3'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '6'
  - type: 'link'
    label: 'III-1'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '7'
  - type: 'link'
    label: 'III-2'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '8'
  - type: 'link'
    label: 'III-3'
    target: 'Example_Entry'
    snapshot: false
    onclick:
    - type: 'assign'
      var: 'demoRoundNum'
      expr: '9'
- type: 'break'
  style: 'paragraph'
- type: 'section'
  style: 'hub-card'
  title: 'restext://Showcase_Story_Title'
  content:
  - type: 'text'
    value: 'restext://Showcase_Story_Body'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Story_NarrationShort'
    target: 'Showcase_Narration_Short'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Story_NarrationLong'
    target: 'Showcase_Narration_Long'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Story_Introduction'
    target: 'Showcase_Introduction'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Story_Event'
    target: 'Showcase_Event'
- type: 'section'
  style: 'hub-card'
  title: 'restext://Showcase_Hubs_Title'
  content:
  - type: 'text'
    value: 'restext://Showcase_Hubs_Body'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Hubs_Early'
    target: 'Showcase_Hub_Early'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Hubs_Middle'
    target: 'Showcase_Hub_Middle'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Hubs_Late'
    target: 'Showcase_Hub_Late'
- type: 'section'
  style: 'hub-card'
  title: 'restext://Showcase_Popups_Title'
  content:
  - type: 'text'
    value: 'restext://Showcase_Popups_Body'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Popups_SetupHeading'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'setup'
    label: 'restext://Showcase_Popups_OkayOnly'
    header:
    - type: 'image'
      asset: 'image://_demo/setup_dubious_bartering'
      style: 'setup-image'
      title: 'restext://Showcase_Popups_SetupImage'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_SetupBody'
    okay: 'restext://Common_Accept'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'setup'
    label: 'restext://Showcase_Popups_OkayCancel'
    header:
    - type: 'image'
      asset: 'image://_demo/setup_dubious_bartering'
      style: 'setup-image'
      title: 'restext://Showcase_Popups_SetupImage'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_SetupBody'
    okay: 'restext://Common_Accept'
    cancel: 'restext://Common_Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Popups_EndOfRoundHeading'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'end_of_round'
    label: 'restext://Showcase_Popups_OkayOnly'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfRoundTitle'
      style: 'popup-title'
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfRoundBody'
    okay: 'restext://Common_Confirm'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'end_of_round'
    label: 'restext://Showcase_Popups_OkayCancel'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfRoundTitle'
      style: 'popup-title'
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfRoundBody'
    okay: 'restext://Common_Confirm'
    cancel: 'restext://Common_Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Popups_EndOfGenerationHeading'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'end_of_generation'
    label: 'restext://Showcase_Popups_OkayOnly'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfGenerationTitle'
      style: 'popup-title'
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfGenerationBody'
    okay: 'restext://Common_Confirm'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'end_of_generation'
    label: 'restext://Showcase_Popups_OkayCancel'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfGenerationTitle'
      style: 'popup-title'
    - type: 'text'
      value: 'restext://Showcase_Popups_EndOfGenerationBody'
    okay: 'restext://Common_Confirm'
    cancel: 'restext://Common_Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Popups_PromptHeading'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'prompt'
    label: 'restext://Showcase_Popups_OkayOnly'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_PromptBody'
    - type: 'input'
      var: 'demoInputValue'
      min: 0
    okay: 'restext://Common_Continue'
    target: 'Example_Entry'
    snapshot: false
  - type: 'popup'
    layout: 'prompt'
    label: 'restext://Showcase_Popups_OkayCancel'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_PromptBody'
    - type: 'input'
      var: 'demoInputValue'
      min: 0
    okay: 'restext://Common_Continue'
    cancel: 'restext://Common_Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Popups_ChoiceHeading'
    style: 'text-sm'
  - type: 'break'
  - type: 'popup'
    layout: 'choice'
    label: 'restext://Showcase_Popups_ChoiceTitle'
    content:
    - type: 'text'
      value: 'restext://Showcase_Popups_ChoiceTitle'
      style: 'popup-title'
    - type: 'text'
      value: 'restext://Showcase_Popups_ChoiceFeminine'
      style: 'choice-label'
    - type: 'input'
      var: 'demoVoiceFeminine'
      style: 'choice-checkbox'
    okay: 'restext://Common_Continue'
    cancel: 'restext://Common_Cancel'
    target: 'Example_Entry'
    snapshot: false
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Showcase_Popups_CountdownHeading'
    style: 'text-sm'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Popups_CountdownLink'
    target: 'Showcase_Popup_RevealCountdown'
  - type: 'break'
  - type: 'text'
    value: 'restext://Showcase_Popups_RevealHeading'
    style: 'text-sm'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_Popups_RevealLink'
    target: 'Showcase_Popup_Reveal'
- type: 'section'
  style: 'hub-card'
  title: 'restext://Showcase_DemoModule_Title'
  content:
  - type: 'text'
    value: 'restext://Showcase_DemoModule_Body'
  - type: 'break'
  - type: 'link'
    label: 'restext://Showcase_DemoModule_Link'
    target: 'Demo_Hub'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'restext://Showcase_Entry_Continue'
  target: 'ScoreEntry'
  snapshot: true
  style: 'btn-green'
