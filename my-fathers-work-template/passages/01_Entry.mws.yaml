# Was a one-link stub ("click here to start scoring"). Now the layout showcase index — the "main
# play passages between setup and scoring" bridge. Every demo below links back here; the last link
# continues into the existing scoring flow (Scoring_01_ScoreEntry.mws.yaml etc.), unchanged.
---
format: 'mws/0.4'
passage_id: 'Example_Entry'
title: 'Layout Showcase'
layout: 'hub_early'
nodes:
- type: 'assign'
  var: 'roundLabel'
  expr: '"I-1"'
- type: 'text'
  value: 'Jump into any layout below to see it styled for real. Each demo links back here.'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'Narration — short'
  target: 'Showcase_Narration_Short'
  style: 'button'
- type: 'link'
  label: 'Narration — long (scroll test)'
  target: 'Showcase_Narration_Long'
  style: 'button'
- type: 'link'
  label: 'Introduction'
  target: 'Showcase_Introduction'
  style: 'button'
- type: 'link'
  label: 'Event'
  target: 'Showcase_Event'
  style: 'button'
- type: 'link'
  label: 'Hub — early years'
  target: 'Showcase_Hub_Early'
  style: 'button'
- type: 'link'
  label: 'Hub — middle years'
  target: 'Showcase_Hub_Middle'
  style: 'button'
- type: 'link'
  label: 'Hub — late years (scroll test)'
  target: 'Showcase_Hub_Late'
  style: 'button'
- type: 'link'
  label: 'Popups — end of round / end of generation'
  target: 'Showcase_Popup_Rounds'
  style: 'button'
- type: 'link'
  label: 'Popup — choice'
  target: 'Showcase_Popup_Choice'
  style: 'button'
- type: 'link'
  label: 'Popup — reveal countdown'
  target: 'Showcase_Popup_RevealCountdown'
  style: 'button'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'Continue to scoring →'
  target: 'ScoreEntry'
  snapshot: true
