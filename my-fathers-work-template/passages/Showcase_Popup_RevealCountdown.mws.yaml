# Replaces the reference app's bespoke ViewBiddingSystem (voting/bidding) component — see
# README.md "Voting/bidding" for the full writeup. Modeled directly on Module-09-Bidding-Preamble-
# popup.png / Module-10A/10B-Bidding-Popup-countdown/reveal.png: ONE continuous-looking parchment
# note stays on screen throughout — the instructions text never disappears or changes. What the
# reference app does with internal view state, this does with a genuinely NESTED popup node
# (a `type: popup` inside another popup's own `content:` — confirmed to work end-to-end already:
# PassageYamlParser recurses on any node list, PassageRenderer.RenderPopup recurses on its own
# content the same way it renders passage-level nodes, GameSession.FindAction resolves one level
# into a top-level popup's own Actions [which includes a nested popup as a direct member, since
# nested rendering folds its own ctx.Actions into the parent popup's Actions], and
# ClosePopupAsync's full-snapshot restore composes correctly regardless of nesting depth since each
# level's sandbox is cloned from its parent's). No engine change needed.
#
# Structure: the OUTER popup (`countdown_instructions`) is click-triggered off this passage's own
# link, holds the instructions text, and has no okay/cancel of its own — it's a pure container.
# Its content ends with the INNER popup (`countdown_action`), whose own `label` ("Start Bidding")
# renders as an ordinary trigger button inline within the outer's content — exactly where the
# reference's "START BIDDING" button sits, below the instructions. Clicking it opens the inner
# popup, whose Okay button covers the full viewport, invisibly, until a CSS countdown animation
# finishes (style.css's .layout-countdown_action) — nothing to keep in sync with JavaScript or an
# engine timer, since both the visible countdown and the button's enable run off the same duration.
format: 'mws/0.4'
passage_id: 'Showcase_Popup_RevealCountdown'
title: 'Reveal Countdown Popup'
layout: 'narration'
nodes:
- type: 'text'
  value: 'A genuinely nested popup: the outer note holds the instructions and never closes on its own — the inner popup''s own trigger button sits inline in its content, and its Okay button is invisible and full-screen until a CSS countdown finishes.'
- type: 'break'
  style: 'paragraph'
- type: 'popup'
  layout: 'countdown_instructions'
  label: 'click to start the bid...'
  content:
  - type: 'text'
    value: "Click on the 'Start Bidding' button to start the bid. This will start a 3-second countdown."
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: "When you see the word 'REVEAL' on the screen, simultaneously show everyone your bid."
  - type: 'break'
    style: 'paragraph'
  - type: 'popup'
    layout: 'countdown_action'
    label: 'Start Bidding'
    style: 'countdown-trigger'
    # Four stacked text nodes, not a single CSS `content`-cycling pseudo-element (the earlier cut)
    # — REVEAL (and the digits, for the same reason a real Cradle extraction would restext them
    # uniformly regardless of content) must be real, localizable text, not a literal baked into
    # style.css. style.css times each node's own visibility via steps() opacity keyframes on its
    # own style-countdown-* class instead.
    content:
    - type: 'text'
      value: 'restext://Countdown_Three'
      style: 'countdown-3'
    - type: 'text'
      value: 'restext://Countdown_Two'
      style: 'countdown-2'
    - type: 'text'
      value: 'restext://Countdown_One'
      style: 'countdown-1'
    - type: 'text'
      value: 'restext://Countdown_Reveal'
      style: 'countdown-reveal'
    okay: 'Reveal'
    target: 'Example_Entry'
- type: 'link'
  label: '← Back to Showcase'
  target: 'Example_Entry'
