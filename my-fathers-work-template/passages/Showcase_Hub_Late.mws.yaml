format: 'mws/0.4'
passage_id: 'Showcase_Hub_Late'
title: 'Laurelton'
subtitle: 'Late Years'
layout: 'hub_late'
nodes:
- type: 'assign'
  var: 'roundNum'
  expr: 'demoRoundNum'
- type: 'section'
  title: 'The Library'
  style: 'hub-card'
  content:
  - type: 'text'
    value: 'A new Library has been built in town. For each visit, gain one Knowledge of your choice.'
- type: 'section'
  title: 'Build a Hospital'
  style: 'hub-card'
  content:
  - type: 'text'
    value: 'The church can no longer handle the influx of the diseased and needs to expand its facilities.'
- type: 'section'
  title: 'The Angry Mob'
  style: 'hub-card'
  content:
  - type: 'text'
    value: 'Clandestine meetings continue in the old mill. When a player reveals their Sealed Envelope card, click here for a special secret message.'
- type: 'section'
  title: 'Relief from Disease'
  style: 'hub-card'
  content:
  - type: 'text'
    value: 'A completed Experiment can be used to ignore all ill effects from Disease between rounds.'
- type: 'section'
  title: 'The Mayor''s Office'
  style: 'hub-card'
  content:
  - type: 'text'
    value: 'The election looms. Whoever bids the most will hold the office until the family''s work is done — or undone.'
- type: 'link'
  label: 'Click here at the end of the round to continue...'
  target: 'Example_Entry'
  style: 'hub-continue'
- type: 'break'
- type: 'link'
  label: '← Back to Showcase'
  target: 'Example_Entry'
