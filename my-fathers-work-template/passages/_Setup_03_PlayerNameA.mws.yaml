# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Self-navigating link (target is this same passage_id — precedented by the extracted EnvPasscode
# passage) re-renders once nameA is set, switching from the input branch to the greeting branch.
# The input's "required" behavior is implicit: the link stays disabled until nameA has a value.
---
format: 'mws/0.4'
passage_id: 'Setup_03_PlayerNameA'
layout: 'setup'
nodes:
- type: 'conditional'
  if: 'nameA == ""'
  then:
  - type: 'text'
    value: '{icon:alert} **Carefully pass the storybook to Player A**'
    style: 'setup-alert'
  - type: 'break'
    style: 'paragraph'
  - type: 'input'
    label: 'Player A - Please enter your given name:'
    var: 'nameA'
    style: 'setup-input'
  - type: 'link'
    label: 'Continue'
    target: 'Setup_03_PlayerNameA'
    snapshot: false
  # Torn-parchment note popup (screenshot: Setup-04) — auto-displays once nameA is set, replacing
  # this passage's own re-render of the input branch above.
  else:
  - type: 'popup'
    layout: 'note'
    content:
    - type: 'let'
      var: 'nameGreeting'
      expr: '["Welcome to My Father''s Work,", "Greetings and welcome to My Father''s Work,", "We are delighted to receive you,", "Welcome, dear sibling,"].shuffled("Setup03Greeting")[0]'
    - type: 'text'
      value: '{nameGreeting}'
    - type: 'break'
    - type: 'text'
      value: '{nameA}'
      style: 'text-xl'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      value: 'Our warmest regards.'
    okay: 'Continue'
    target: 'Setup_04_PlayerNameB'
    snapshot: false