# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Strings live in this module's own en-US.restext (Setup_* keys) — no longer borrowed from
# cost-of-disease's extracted restext.
---
format: 'mws/0.4'
passage_id: 'Setup_02_PlayerNameIntro'
layout: 'setup'
nodes:
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    - type: 'assign'
      var: 'playtxt'
      expr: '"restext://Setup_Number_Two"'
  - match: 3
    nodes:
    - type: 'assign'
      var: 'playtxt'
      expr: '"restext://Setup_Number_Three"'
  - match: 4
    nodes:
    - type: 'assign'
      var: 'playtxt'
      expr: '"restext://Setup_Number_Four"'
# Torn-parchment note popup (screenshot: Setup-02) — auto-displays (no `label`) over the empty
# `setup`-layout passage beneath it, matching Module-04B's "auto-show over empty passage" pattern.
- type: 'popup'
  layout: 'note_clear'
  content:
  - type: 'text'
    value: 'restext://Setup_PlayerIntro_Body1'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Setup_PlayerIntro_Body2'
  okay: 'restext://Common_Continue'
  target: 'Setup_03_PlayerNameA'
  snapshot: false