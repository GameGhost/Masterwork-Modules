# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Same self-navigating input pattern as Setup_03_PlayerNameA. D is always the last player slot this
# module supports (manifest.yaml info.players-max: 4), so this always continues to town naming.
---
format: 'mws/0.4'
passage_id: 'Setup_06_PlayerNameD'
layout: 'setup'
nodes:
- type: 'conditional'
  if: 'nameD == ""'
  then:
  - type: 'text'
    value: '{icon:alert} **Carefully pass the storybook to Player D**'
    style: 'setup-alert'
  - type: 'break'
    style: 'paragraph'
  - type: 'input'
    label: 'Player D - Please enter your given name:'
    var: 'nameD'
    style: 'setup-input'
  - type: 'link'
    label: 'Continue'
    target: 'Setup_06_PlayerNameD'
    snapshot: false
  else:
  - type: 'popup'
    layout: 'note'
    content:
    - type: 'let'
      var: 'nameGreeting'
      expr: '["Welcome to My Father''s Work,", "Greetings and welcome to My Father''s Work,", "We are delighted to receive you,", "Welcome, dear sibling,"].shuffled("Setup06Greeting")[0]'
    - type: 'text'
      value: '{nameGreeting}'
    - type: 'break'
    - type: 'text'
      value: '{nameD}'
      style: 'text-xl'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      value: 'Our warmest regards.'
    okay: 'Continue'
    target: 'Setup_07_TownNameEntry'
    snapshot: false