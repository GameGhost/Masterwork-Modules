# Special event — no longer a distinct layout (the old `event` layout is retired). A "ck2"-tagged
# Cradle passage is `narration` now, same as any other; the extractor prepends a single synthesized
# `text` node (style: 'special-event') to the passage's own content instead — see
# PassageBodyVisitor.IsShowEventPopupCall (code repo) and style.css's own comment for the full
# mechanism. This demo hand-authors that same node shape directly, matching what extraction would
# now produce for a real "ck2" passage.
#
# Phase 5 addendum: the extractor also now synthesizes the passage-level audio.on_display override
# below whenever it detects this marker node (V2Serializer.HasSpecialEventMarker) — the real Unity
# app fires an SFX (ViewSpecialEvent.clip, via SoundManager.Instance.OnOpenPopupPlayAudio) the
# instant this overlay appears, a gap the original audio-inventory.md survey missed entirely (see
# audio-survey-new-sfx.md). Hand-authored here to match, same reasoning as the node shape above.
format: 'mws/0.4'
passage_id: 'Showcase_Event'
title: 'A Bid for Mayor'
layout: 'narration'
audio:
  on_display: 'audio://sfx/special_event'
nodes:
- type: 'assign'
  var: 'roundNum'
  expr: 'demoRoundNum'
- type: 'text'
  value: 'Special Event'
  style: 'special-event'
- type: 'text'
  value: 'All players take all their money into their hands. They then secretly choose any amount to place into their right hand to bid on becoming Mayor.'
- type: 'break'
  style: 'paragraph'
- type: 'text'
  value: 'Once all players are ready, reveal the amounts simultaneously. The player that bid the most wins the election. (In the event of a tie, the tied player who went last in turn order the previous round wins the bid.)'
- type: 'break'
  style: 'paragraph'
- type: 'text'
  value: 'Only the player that wins the election must pay their bid to supply. All others return their money to their Estates.'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: '← Back to Showcase'
  target: 'Example_Entry'
