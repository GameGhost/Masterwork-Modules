# Special event — no longer a distinct layout (the old `event` layout is retired). A "ck2"-tagged
# Cradle passage is `narration` now, same as any other; the extractor prepends a single synthesized
# `text` node (style: 'special-event') to the passage's own content instead — see
# PassageBodyVisitor.IsShowEventPopupCall (code repo) and style.css's own comment for the full
# mechanism. This demo hand-authors that same node shape directly, matching what extraction would
# now produce for a real "ck2" passage.
#
# The extractor also now synthesizes the passage-level audio.on_display override below whenever it
# detects this marker node (V2Serializer.HasSpecialEventMarker) — the real Unity app fires an SFX
# (ViewSpecialEvent.clip, via SoundManager.Instance.OnOpenPopupPlayAudio) the instant this overlay
# appears. Hand-authored here to match, same reasoning as the node shape above.
format: 'mws/0.4'
passage_id: 'Showcase_Event'
title: 'restext://Showcase_Event_Title'
layout: 'narration'
audio:
  on_display: 'audio://sfx/special_event'
nodes:
- type: 'assign'
  var: '_ProgressRound'
  expr: 'demoRoundNum - 1'
- type: 'text'
  value: 'restext://SpecialEvent_Title'
  style: 'special-event'
- type: 'text'
  value: 'restext://Showcase_Event_Body1'
- type: 'break'
  style: 'paragraph'
- type: 'text'
  value: 'restext://Showcase_Event_Body2'
- type: 'break'
  style: 'paragraph'
- type: 'text'
  value: 'restext://Showcase_Event_Body3'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'restext://Showcase_Back'
  target: 'Example_Entry'
