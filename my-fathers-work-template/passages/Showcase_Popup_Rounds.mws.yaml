format: 'mws/0.4'
passage_id: 'Showcase_Popup_Rounds'
title: 'Round & Generation Popups'
layout: 'narration'
nodes:
- type: 'assign'
  var: 'roundLabel'
  expr: '"I-3"'
- type: 'text'
  value: 'These acknowledgement popups appear automatically at round/generation boundaries in a real scenario — click to preview each.'
- type: 'break'
  style: 'paragraph'
- type: 'popup'
  layout: 'end_of_round'
  label: 'Preview: End of Round'
  header:
  - type: 'image'
    asset: 'image://popup/generation_time'
  content:
  - type: 'text'
    value: 'End of Round'
    style: 'popup-title'
  - type: 'text'
    value: 'The Early Years of the First Generation has ended. Perform all End of Round actions.'
  - type: 'text'
    value: 'Then, perform all Start of Round actions for the Middle Years before continuing.'
  okay: 'Confirm'
- type: 'break'
- type: 'popup'
  layout: 'end_of_generation'
  label: 'Preview: End of Generation'
  content:
  - type: 'text'
    value: 'End of Generation'
    style: 'popup-title'
  - type: 'text'
    value: 'The First Generation has drawn to a close. Tally the estate before the Second Generation begins.'
  okay: 'Confirm'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: '← Back to Showcase'
  target: 'Example_Entry'
