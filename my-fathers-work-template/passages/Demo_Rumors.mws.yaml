# Exercises let+.shuffled() combined with foreach — a shuffled array iterated in full, rather than
# just indexed once (compare Demo_Well's `.shuffled(...)[0]`). Part of the Demo Module
# logic/expression showcase — see Demo_Hub.mws.yaml.
format: 'mws/0.4'
passage_id: 'Demo_Rumors'
title: 'restext://Demo_Rumors_Title'
layout: 'narration'
nodes:
- type: 'assign'
  var: '_ProgressRound'
  expr: 'demoRoundNum - 1'
- type: 'let'
  var: 'demoRumorList'
  expr: '["restext://Demo_Rumor1", "restext://Demo_Rumor2", "restext://Demo_Rumor3"].shuffled("demo_rumor_order")'
- type: 'foreach'
  var: 'rumor'
  in: 'demoRumorList'
  do:
  - type: 'text'
    value: '{rumor}'
  - type: 'break'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'restext://Demo_BackToSquare'
  target: 'Demo_Hub'
  snapshot: true
