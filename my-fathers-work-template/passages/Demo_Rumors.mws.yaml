# Exercises let+.shuffled() combined with foreach — a shuffled array iterated in full, rather than
# just indexed once (compare Demo_Well's `.shuffled(...)[0]`). Part of the Demo Module
# logic/expression showcase — see Demo_Hub.mws.yaml.
format: 'mws/0.4'
passage_id: 'Demo_Rumors'
title: 'Whispers in Town'
layout: 'narration'
nodes:
- type: 'assign'
  var: 'roundNum'
  expr: 'demoRoundNum'
- type: 'let'
  var: 'demoRumorList'
  expr: '["They say the mayor never sleeps.", "Someone heard laughter from the empty chapel.", "The miller swears his flour has gone missing again."].shuffled("demo_rumor_order")'
- type: 'foreach'
  var: 'rumor'
  in: 'demoRumorList'
  do:
  - type: 'text'
    value: '{rumor}'
  - type: 'break'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: '← Back to the square'
  target: 'Demo_Hub'
  snapshot: true
