# Logic/expression showcase — evolving hub whose text changes with demoWellVisits (gated
# conditionals), reached only from the Layout Showcase hub's own "Demo Module" section (see
# 01_Entry.mws.yaml). This whole Demo_* passage set mirrors what the app's own former built-in demo
# module (retired — see Masterwork/CLAUDE.md) exercised end-to-end: an evolving hub, random/shuffled
# events, checkpoints, both popup variants, foreach over a shuffled array, and a terminal passage.
# Ported into this template so that coverage survives as real, playable module content instead of
# depending on an app-level concept.
format: 'mws/0.4'
passage_id: 'Demo_Hub'
title: 'restext://Demo_Hub_Title'
layout: 'narration'
nodes:
- type: 'assign'
  var: '_ProgressRound'
  expr: 'demoRoundNum - 1'
- type: 'text'
  value: 'restext://Demo_Hub_Welcome'
- type: 'break'
  style: 'paragraph'
- type: 'image'
  asset: 'icon://hospital1'
  size: '300'
  align: 'center'
- type: 'break'
  style: 'paragraph'
- type: 'text'
  value: 'restext://Demo_Hub_Crest'
- type: 'break'
  style: 'paragraph'
- type: 'conditional'
  conditions:
  - if: 'demoWellVisits == 0'
    then:
    - type: 'text'
      value: 'restext://Demo_Hub_Well0'
  - if: 'demoWellVisits == 1'
    then:
    - type: 'text'
      value: 'restext://Demo_Hub_Well1'
  - if: 'demoWellVisits == 2'
    then:
    - type: 'text'
      value: 'restext://Demo_Hub_Well2'
  else:
  - type: 'text'
    value: 'restext://Demo_Hub_Well3'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'restext://Demo_Hub_VisitWell'
  target: 'Demo_Well'
  snapshot: true
- type: 'break'
- type: 'link'
  label: 'restext://Demo_TakeSurvey'
  target: 'Demo_Survey'
  snapshot: true
- type: 'break'
- type: 'link'
  label: 'restext://Demo_Hub_Rumors'
  target: 'Demo_Rumors'
  snapshot: true
- type: 'conditional'
  if: 'demoWellVisits >= 3'
  then:
  - type: 'break'
  - type: 'link'
    label: 'restext://Demo_Hub_Confront'
    target: 'Demo_Ending'
    snapshot: true
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'restext://Showcase_Back'
  target: 'Example_Entry'
