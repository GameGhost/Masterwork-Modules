# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Same self-navigating input pattern as Setup_03_PlayerNameA; routing mirrors the extracted
# NameEntryC passage's own players>3 branch.
---
format: 'mws/0.4'
passage_id: 'Setup_05_PlayerNameC'
layout: 'setup_player_names'
nodes:
- type: 'conditional'
  if: 'nameC == ""'
  then:
  - type: 'text'
    value: '{icon:ExclamationPointIcon} **Carefully pass the storybook to Player C**'
    style: 'info-block'
  - type: 'break'
    style: 'paragraph'
  - type: 'input'
    label: 'Player C - Please enter your given name:'
    var: 'nameC'
  - type: 'link'
    label: 'Continue'
    target: 'Setup_05_PlayerNameC'
    snapshot: false
  else:
  - type: 'let'
    var: 'nameGreeting'
    expr: '["Welcome to My Father''s Work,", "Greetings and welcome to My Father''s Work,", "We are delighted to receive you,", "Welcome, dear sibling,"].shuffled("Setup05Greeting")[0]'
  - type: 'text'
    value: '{nameGreeting}'
  - type: 'break'
  - type: 'text'
    value: '{nameC}'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'Our warmest regards.'
  - type: 'break'
    style: 'paragraph'
  - type: 'conditional'
    if: 'players > 3'
    then:
    - type: 'link'
      label: 'Continue'
      target: 'Setup_06_PlayerNameD'
      snapshot: false
    else:
    - type: 'link'
      label: 'Continue'
      target: 'Setup_07_TownNameEntry'
      snapshot: false