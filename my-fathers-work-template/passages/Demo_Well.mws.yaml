# Exercises let+.shuffled() (a flavor line drawn from a shuffled array), rand_between()+switch (a
# random encounter), assign (accumulating demoWellVisits, which Demo_Hub gates its own text and its
# ending link on), and checkpoint. Part of the Demo Module logic/expression showcase — see
# Demo_Hub.mws.yaml.
format: 'mws/0.4'
passage_id: 'Demo_Well'
title: 'restext://Demo_Well_Title'
layout: 'narration'
nodes:
- type: 'assign'
  var: '_ProgressRound'
  expr: 'demoRoundNum - 1'
- type: 'let'
  var: 'demoWellFlavor'
  expr: '["restext://Demo_Well_Flavor1", "restext://Demo_Well_Flavor2", "restext://Demo_Well_Flavor3"].shuffled("demo_well_flavor")[0]'
- type: 'text'
  value: '{demoWellFlavor}'
- type: 'let'
  var: 'demoEncounterRoll'
  expr: 'rand_between(1, 3, "demo_well_encounter")'
- type: 'switch'
  on: 'demoEncounterRoll'
  cases:
  - match: 1
    nodes:
    - type: 'text'
      value: 'restext://Demo_Well_Encounter1'
  - match: 2
    nodes:
    - type: 'text'
      value: 'restext://Demo_Well_Encounter2'
  - match: 3
    nodes:
    - type: 'text'
      value: 'restext://Demo_Well_Encounter3'
  default:
  - type: 'text'
    value: 'restext://Demo_Well_Silent'
- type: 'assign'
  var: 'demoWellVisits'
  expr: 'demoWellVisits + 1'
- type: 'checkpoint'
  id: 'demo_visited_well'
  display: 'restext://Demo_Well_Checkpoint'
  diagnostic: 'checkpoint:demo_well'
- type: 'break'
  style: 'paragraph'
- type: 'link'
  label: 'restext://Demo_BackToSquare'
  target: 'Demo_Hub'
  snapshot: true
