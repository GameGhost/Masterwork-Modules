# No chrome regions needed — the parchment/icon-pin visual treatment (screenshot: Module-04,
# "Dubious Bartering" popup) lives entirely in style.css against .mws-popup-overlay.layout-
# setup_info. Named `setup_info`, not `setup` — the passage-level `setup` layout (layouts/
# setup.mws.yaml, player-count/name/town entry chrome) already owns that layout_id; since layout
# chrome is looked up purely by string regardless of whether a passage or a popup uses it (format
# spec §8), reusing `setup` here would have spliced the passage layout's own leather-background
# header image node into this popup's rendering too. Empty chrome file kept for discoverability,
# matching the convention already established by layouts/choice.mws.yaml.
format: 'mws/0.4'
layout_id: 'setup_info'
