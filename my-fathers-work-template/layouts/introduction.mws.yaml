# Same round-tracker footer as narration.mws.yaml — introduction is visually distinct only via
# CSS (a different border treatment), not different chrome content.
format: 'mws/0.4'
layout_id: 'introduction'
footer:
- type: 'let'
  var: 'roundLabels'
  expr: '["I-1", "I-2", "I-3", "II-1", "II-2", "II-3", "III-1", "III-2", "III-3"]'
- type: 'foreach'
  var: 'label'
  in: 'roundLabels'
  do:
  - type: 'conditional'
    if: 'label == roundLabel'
    then:
    - type: 'text'
      value: '{label}'
      style: 'progress-pip-current'
    else:
    - type: 'text'
      value: '{label}'
      style: 'progress-pip'
