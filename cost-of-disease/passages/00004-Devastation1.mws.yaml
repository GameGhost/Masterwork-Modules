# ../.source/TheCostofDisease_Eng_v10.cs:2093
---
format: 'mws/0.4'
passage_id: 'Devastation1'
# ../en-US.restext:326 | "Devastation"
title: 'restext://Title_Devastation'
# ../en-US.restext:327 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:2101
- type: 'assign'
  var: 'round'
  expr: '4'
# ../.source/TheCostofDisease_Eng_v10.cs:2103
- type: 'conditional'
  if: '!devpage'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:2107
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:356 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    - type: 'conditional'
      if: 'seedy == "yes"'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:2113
      - type: 'image'
        asset: 'image://setup/AngryMobSetup2'
        style: 'setup-image'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:2118
      - type: 'image'
        asset: 'image://setup/AngryMobSetup1'
        style: 'setup-image'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:2121
    - type: 'text'
      # ../en-US.restext:107 | "Turn to page "
      value: 'restext://Directive_TurnToPage'
    # ../.source/TheCostofDisease_Eng_v10.cs:2122
    - type: 'conditional'
      # ../en-US.restext:197 | "bank"
      if: 'building == "restext://Location_Bank_Lower"'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:2126
      - type: 'text'
        # ../en-US.restext:415 | "**12**"
        value: 'restext://Devastation1_004'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:2134
      - type: 'text'
        # ../en-US.restext:414 | "**13**"
        value: 'restext://Devastation1_003'
    # ../.source/TheCostofDisease_Eng_v10.cs:2137
    - type: 'text'
      # ../en-US.restext:416 | " of the Village Chronicle..."
      value: 'restext://Devastation1_005'
    # ../.source/TheCostofDisease_Eng_v10.cs:2140
    - type: 'conditional'
      if: '!Devastation1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:2142
      - type: 'assign'
        var: 'Devastation1'
        expr: '1'
      # ../.source/TheCostofDisease_Eng_v10.cs:2143
      - type: 'assign'
        var: 'tracker'
        expr: 'tracker + 2'
      # ../.source/TheCostofDisease_Eng_v10.cs:2144
      - type: 'switch'
        on: 'players'
        cases:
        - match: 4
          nodes:
          # ../.source/TheCostofDisease_Eng_v10.cs:2146
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 3'
        - match: 5
          nodes:
          # ../.source/TheCostofDisease_Eng_v10.cs:2150
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 3'
    # ../.source/TheCostofDisease_Eng_v10.cs:2153
    - type: 'text'
      # ../en-US.restext:417 | "**{tracker}** and the {ic..."
      value: 'restext://Devastation1_006'
    # ../.source/TheCostofDisease_Eng_v10.cs:2158
    - type: 'conditional'
      # ../en-US.restext:34 | "yes"
      if: 'seedy == "restext://Choice_Yes_Lower"'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:2162
      - type: 'text'
        # ../en-US.restext:96 | "**two** spaces to the lef..."
        value: 'restext://Directive_MoveTwoSpacesLeft_Seedy'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:2168
      - type: 'text'
        # ../en-US.restext:95 | "one space to the left."
        value: 'restext://Directive_MoveOneSpaceLeft'
    # ../.source/TheCostofDisease_Eng_v10.cs:2170
    - type: 'text'
      # ../en-US.restext:418 | " Pass the Start Player to..."
      value: 'restext://Devastation1_007'
# ../.source/TheCostofDisease_Eng_v10.cs:2179
- type: 'section'
  # ../en-US.restext:419 | "{icon:storybook} **Clande..."
  title: 'restext://Devastation1_008'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:2188
  - type: 'text'
    # ../en-US.restext:420 | "When a player reveals the..."
    value: 'restext://Devastation1_009'
  # ../.source/TheCostofDisease_Eng_v10.cs:2190
  - type: 'link'
    # ../en-US.restext:421 | "click here for a special ..."
    label: 'restext://Devastation1_010'
    target: 'Envelopes' # ./00073-Envelopes.mws.yaml
    snapshot: true
# ../.source/TheCostofDisease_Eng_v10.cs:2192
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:2196
- type: 'section'
  # ../en-US.restext:170 | "{icon:storybook} **Relief..."
  title: 'restext://Heading_ReliefFromDisease'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:2205
  - type: 'text'
    # ../en-US.restext:112 | "A \"Hereditary Disease\" ..."
    value: 'restext://Disease_HereditaryExperiment_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:2213
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:2215
  - type: 'text'
    # ../en-US.restext:111 | "When a player completes t..."
    value: 'restext://Disease_HereditaryExperiment_Lead'
  # ../.source/TheCostofDisease_Eng_v10.cs:2216
  - type: 'link'
    # ../en-US.restext:58 | "click here for a special ..."
    label: 'restext://Click_SpecialMessage_Generic1'
    target: 'HereditaryDiseaseComplete' # ./00341-HereditaryDiseaseComplete.mws.yaml
    snapshot: true
  # ../.source/TheCostofDisease_Eng_v10.cs:2217
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:2221
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:49 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'Changes' # ./00031-Changes.mws.yaml
    # ../en-US.restext:361 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '4'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:305 | "The Early Years of the Se..."
      value: 'restext://Round_GenerationII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:309 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
