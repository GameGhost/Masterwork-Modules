# ../.source/TheCostofDisease_Eng_v10.cs:12890
---
format: 'mws/0.4'
passage_id: 'MostInvestigated'
# ../en-US.restext:1223 | "Most Investigations"
title: 'restext://MostInvestigated_001'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:12892
- type: 'let'
  var: 'play'
  expr: '[playA, playB, playC, playD, playE]'
# ../.source/TheCostofDisease_Eng_v10.cs:12893
- type: 'let'
  var: 'max_play'
  expr: 'max(playA, playB, playC, playD, playE)'
# ../.source/TheCostofDisease_Eng_v10.cs:12902
- type: 'conditional'
  if: 'play.countif("=" + max_play) > 1'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:12904
  - type: 'assign'
    var: 'most'
    expr: '0'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:12908
  - type: 'conditional'
    conditions:
    - if: 'playA > max(playB, playC, playD, playE)'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:12910
      - type: 'assign'
        var: 'most'
        expr: 'nameA'
    - if: 'playB > max(playC, playD, playE)'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:12914
      - type: 'assign'
        var: 'most'
        expr: 'nameB'
    - if: 'playC > max(playD, playE)'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:12918
      - type: 'assign'
        var: 'most'
        expr: 'nameC'
    - if: 'playD > max(playE)'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:12922
      - type: 'assign'
        var: 'most'
        expr: 'nameD'
    else:
    # ../.source/TheCostofDisease_Eng_v10.cs:12926
    - type: 'assign'
      var: 'most'
      expr: 'nameE'
# ../.source/TheCostofDisease_Eng_v10.cs:12933
- type: 'switch'
  on: 'hunters'
  cases:
  # ../en-US.restext:28 | "evil"
  - match: 'restext://Choice_Evil_Lower'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:12935
    - type: 'conditional'
      if: 'goodcount < 2'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:12937
      - type: 'assign'
        var: 'society'
        # ../en-US.restext:123 | "Fraternity of Hunters"
        expr: '"restext://Faction_FraternityOfHunters_Plain"'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:12941
      - type: 'assign'
        var: 'society'
        # ../en-US.restext:127 | "Order of St. Hubertus"
        expr: '"restext://Faction_OrderOfStHubertus_Plain"'
  # ../en-US.restext:29 | "good"
  - match: 'restext://Choice_Good_Lower'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:12946
    - type: 'conditional'
      if: 'goodcount > 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:12948
      - type: 'assign'
        var: 'society'
        # ../en-US.restext:123 | "Fraternity of Hunters"
        expr: '"restext://Faction_FraternityOfHunters_Plain"'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:12952
      - type: 'assign'
        var: 'society'
        # ../en-US.restext:127 | "Order of St. Hubertus"
        expr: '"restext://Faction_OrderOfStHubertus_Plain"'
# ../.source/TheCostofDisease_Eng_v10.cs:12955
- type: 'conditional'
  if: '!most'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:12957
  - type: 'goto'
    target: 'DiseaseEnd' # ./00226-DiseaseEnd.mws.yaml
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:12967
  - type: 'text'
    # ../en-US.restext:1224 | "{most} performed the most..."
    value: 'restext://MostInvestigated_004'
  # ../.source/TheCostofDisease_Eng_v10.cs:12973
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:12977
  - type: 'text'
    # ../en-US.restext:1225 | "**{most} immediately gain..."
    value: 'restext://MostInvestigated_005'
# ../.source/TheCostofDisease_Eng_v10.cs:12982
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:12984
- type: 'link'
  # ../en-US.restext:38 | "Click here to continue..."
  label: 'restext://Click_ContinueEllipsis_B'
  target: 'DiseaseEnd' # ./00226-DiseaseEnd.mws.yaml
  snapshot: true
