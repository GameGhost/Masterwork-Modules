# ../.source/TheCostofDisease_Eng_v10.cs:33577
---
format: 'mws/0.4'
passage_id: 'ScoreEntryP3'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:33585
- type: 'conditional'
  if: '!scoreC_submitted'
  then:
  - type: 'popup'
    layout: 'input-popup'
    content:
    - type: 'text'
      # ../en-US.restext:2655 | "Please enter the final sc..."
      value: 'restext://ScoreEntryP3_001'
    - type: 'input'
      label: ''
      var: 'scoreC'
    # ../en-US.restext:346 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'scoreC_submitted'
      expr: 'true'
    snapshot: true
    target: 'ScoreEntryP3' # ./00329-ScoreEntryP3.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:33597
- type: 'text'
  # ../en-US.restext:2656 | "Thank you for recording t..."
  value: 'restext://ScoreEntryP3_002'
# ../.source/TheCostofDisease_Eng_v10.cs:33600
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:33602
- type: 'conditional'
  if: 'players < 4'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:33604
  - type: 'link'
    # ../en-US.restext:36 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'WinnerHUB' # ./00327-WinnerHUB.mws.yaml
    snapshot: true
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:33608
  - type: 'link'
    # ../en-US.restext:36 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'ScoreEntryP4' # ./00330-ScoreEntryP4.mws.yaml
    snapshot: true
