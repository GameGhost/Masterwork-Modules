---
format: 'mws/0.4'
passage_id: 'NewMaster3B'
# ../en-US.restext:1357 | "The {_rnd_NewMaster3B_0} ..."
title: 'restext://NewMaster3B_001'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:16939
- type: 'switch'
  on: 'costB'
  cases:
  # ../en-US.restext:129 | "Biology"
  - match: 'restext://Focus_Biology'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:16941
    - type: 'assign'
      var: 'cost2B'
      # ../en-US.restext:223 | "Animal"
      expr: '"restext://Masterwork_Type_Animal"'
  # ../en-US.restext:135 | "Engineering"
  - match: 'restext://Focus_Engineering'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:16945
    - type: 'assign'
      var: 'cost2B'
      # ../en-US.restext:228 | "Gear"
      expr: '"restext://Masterwork_Type_Gear"'
  # ../en-US.restext:132 | "Chemistry"
  - match: 'restext://Focus_Chemistry'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:16949
    - type: 'assign'
      var: 'cost2B'
      # ../en-US.restext:224 | "Bottle"
      expr: '"restext://Masterwork_Type_Bottle"'
# ../.source/TheCostofDisease_Eng_v10.cs:16953
- type: 'conditional'
  if: '!creationB_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:221 | "Give your creation a new,..."
      value: 'restext://Masterwork_NamePrompt'
    - type: 'input'
      label: ''
      var: 'creationB'
    # ../en-US.restext:358 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'creationB_submitted'
      expr: 'true'
    snapshot: true
    target: 'NewMaster3B' # ./00146-NewMaster3B.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:16969
- type: 'let'
  var: '_rnd_NewMaster3B_0'
  # ../en-US.restext:203 | Masterwork_Adjective_Infamous | "Infamous"
  # ../en-US.restext:212 | Masterwork_Adjective_Transcendent | "Transcendent"
  # ../en-US.restext:207 | Masterwork_Adjective_Monumental | "Monumental"
  # ../en-US.restext:208 | Masterwork_Adjective_Nefarious | "Nefarious"
  # ../en-US.restext:213 | Masterwork_Adjective_Unspeakable | "Unspeakable"
  # ../en-US.restext:205 | Masterwork_Adjective_Legendary | "Legendary"
  # ../en-US.restext:209 | Masterwork_Adjective_Noble | "Noble"
  # ../en-US.restext:210 | Masterwork_Adjective_Phenomenal | "Phenomenal"
  # ../en-US.restext:211 | Masterwork_Adjective_Stunning | "Stunning"
  # ../en-US.restext:206 | Masterwork_Adjective_Masterful | "Masterful"
  # ../en-US.restext:204 | Masterwork_Adjective_Insidious | "Insidious"
  expr: '["restext://Masterwork_Adjective_Infamous", "restext://Masterwork_Adjective_Transcendent", "restext://Masterwork_Adjective_Monumental", "restext://Masterwork_Adjective_Nefarious", "restext://Masterwork_Adjective_Unspeakable", "restext://Masterwork_Adjective_Legendary", "restext://Masterwork_Adjective_Noble", "restext://Masterwork_Adjective_Phenomenal", "restext://Masterwork_Adjective_Stunning", "restext://Masterwork_Adjective_Masterful", "restext://Masterwork_Adjective_Insidious"].shuffled("NewMaster3B_0")[0]'
# ../.source/TheCostofDisease_Eng_v10.cs:16975
- type: 'include_passage'
  target: 'MWCreationHubB' # ./00147-MWCreationHubB.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:16976
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:16978
- type: 'text'
  # ../en-US.restext:246 | "With my own destiny deter..."
  value: 'restext://Narrative_ForgeNewPath'
# ../.source/TheCostofDisease_Eng_v10.cs:16980
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:16984
- type: 'text'
  # ../en-US.restext:214 | "**You may check the cost ..."
  value: 'restext://Masterwork_CheckCostHint'
# ../.source/TheCostofDisease_Eng_v10.cs:16987
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:16989
- type: 'link'
  # ../en-US.restext:39 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
