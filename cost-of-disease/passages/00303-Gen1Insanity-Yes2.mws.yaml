# ../.source/TheCostofDisease_Eng_v10.cs:31366
---
format: 'mws/0.4'
passage_id: 'Gen1Insanity-Yes2'
# ../en-US.restext:69 | "Absent Parent"
title: 'restext://Common_002'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:31368
- type: 'conditional'
  # ../en-US.restext:34 | "yes"
  if: 'vacation == "restext://Choice_Yes_Lower"'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:31377
  - type: 'text'
    # ../en-US.restext:321 | "**Carefully hand this sto..."
    value: 'restext://Storybook_HandToGen1Sane'
  # ../.source/TheCostofDisease_Eng_v10.cs:31391
  - type: 'conditional'
    if: 'Gen1Insanity_Yes2nextPsg == "" || Gen1Insanity_Yes2nextPsg == 0'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:31393
    - type: 'assign'
      var: 'Gen1Insanity_Yes2nextPsg'
      expr: 'rand_between(1, 2, "Gen1Insanity-Yes2_0")'
  # ../.source/TheCostofDisease_Eng_v10.cs:31381
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:31383
  - type: 'text'
    # ../en-US.restext:2499 | "An investment in a summer..."
    value: 'restext://Gen1Insanity_Yes2_001'
  # ../.source/TheCostofDisease_Eng_v10.cs:31395
  - type: 'assign'
    var: 'instemp'
    expr: 'Gen1Insanity_Yes2nextPsg'
  # ../.source/TheCostofDisease_Eng_v10.cs:31396
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:31400
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'Hospital1' # ./00003-Hospital1.mws.yaml
    # ../en-US.restext:357 | "Close"
    okay: 'restext://UIButton_Close'
    snapshot: true
    header:
    - type: 'conditional'
      if: 'instemp == 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:31421
      - type: 'image'
        asset: 'image://setup/MaladjustmentBack'
        style: 'setup-image'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:31429
      - type: 'image'
        asset: 'image://setup/ScoreTrackMarker'
        style: 'setup-image'
    content:
    - type: 'conditional'
      if: 'instemp == 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:31422
      - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:31423
      - type: 'text'
        # ../en-US.restext:96 | "Gain a Maladjustment card..."
        value: 'restext://Directive_GainMaladjustmentCard'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:31430
      - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:31431
      - type: 'text'
        # ../en-US.restext:371 | "Lose 3VP."
        value: 'restext://VP_Lose3'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:31404
  - type: 'goto'
    target: 'Hospital1' # ./00003-Hospital1.mws.yaml
