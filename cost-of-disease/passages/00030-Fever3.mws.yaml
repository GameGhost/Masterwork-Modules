# ../.source/TheCostofDisease_Eng_v10.cs:4090
---
format: 'mws/0.4'
passage_id: 'Fever3'
# ../en-US.restext:342 | "YELLOW FEVER"
title: 'restext://Title_YellowFever'
# ../en-US.restext:325 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:4097
- type: 'assign'
  var: 'round'
  expr: '3'
# ../.source/TheCostofDisease_Eng_v10.cs:4099
- type: 'conditional'
  if: '!tcodgen1'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:4103
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:343 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/TheCostofDisease_Eng_v10.cs:4107
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:4109
    - type: 'text'
      # ../en-US.restext:100 | "Turn to page "
      value: 'restext://Directive_TurnToPage'
    # ../.source/TheCostofDisease_Eng_v10.cs:4110
    - type: 'conditional'
      # ../en-US.restext:194 | "bank"
      if: 'building == "restext://Location_Bank_Lower"'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:4114
      - type: 'text'
        # ../en-US.restext:585 | "**2**"
        value: 'restext://Fever3_003'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:4122
      - type: 'text'
        # ../en-US.restext:584 | "**3**"
        value: 'restext://Fever3_002'
    # ../.source/TheCostofDisease_Eng_v10.cs:4125
    - type: 'text'
      # ../en-US.restext:586 | " of the Village Chronicle."
      value: 'restext://Fever3_004'
    # ../.source/TheCostofDisease_Eng_v10.cs:4127
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:4129
    - type: 'conditional'
      # ../en-US.restext:194 | "bank"
      if: 'building == "restext://Location_Bank_Lower"'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:4131
      - type: 'text'
        # ../en-US.restext:587 | "{mayor} gains 1VP."
        value: 'restext://Fever3_005'
# ../.source/TheCostofDisease_Eng_v10.cs:4136
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:4138
- type: 'conditional'
  # ../en-US.restext:194 | "bank"
  if: 'building == "restext://Location_Bank_Lower"'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:4144
  - type: 'section'
    # ../en-US.restext:133 | "**BANK**"
    title: 'restext://Heading_Bank'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:4152
    - type: 'text'
      # ../en-US.restext:589 | "A new Bank has been built..."
      value: 'restext://Fever3_007'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:4165
  - type: 'section'
    # ../en-US.restext:154 | "**LIBRARY**"
    title: 'restext://Heading_Library'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:4173
    - type: 'text'
      # ../en-US.restext:588 | "A new Library has been bu..."
      value: 'restext://Fever3_006'
# ../.source/TheCostofDisease_Eng_v10.cs:4185
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:4189
- type: 'section'
  # ../en-US.restext:135 | "**BUILD A HOSPITAL**"
  title: 'restext://Heading_BuildHospital'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:4197
  - type: 'text'
    # ../en-US.restext:181 | "The church can no longer ..."
    value: 'restext://Hospital_ChurchExpansion_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:4209
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:4211
  - type: 'text'
    # ../en-US.restext:292 | "At the end of the Generat..."
    value: 'restext://Reward_MostHeartTokens_5VP'
# ../.source/TheCostofDisease_Eng_v10.cs:4225
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:4227
- type: 'conditional'
  if: 'creepy4 == 0'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:4231
  - type: 'section'
    # ../en-US.restext:132 | "{icon:storybook} **Attrac..."
    title: 'restext://Heading_AttractingAttention'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:4240
    - type: 'text'
      # ../en-US.restext:280 | "If a player reaches the *..."
      value: 'restext://Resource_CreepyTrack_4thSpace_Lead'
    # ../.source/TheCostofDisease_Eng_v10.cs:4248
    - type: 'link'
      # ../en-US.restext:49 | "click here"
      label: 'restext://Click_Here_Plain'
      target: 'Gen1-CreepyTrack' # ./00177-Gen1-CreepyTrack.mws.yaml
      snapshot: true
  # ../.source/TheCostofDisease_Eng_v10.cs:4250
  - type: 'break'
    style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:4253
- type: 'conditional'
  if: 'sane3 == 0'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:4257
  - type: 'section'
    # ../en-US.restext:155 | "{icon:storybook} **The Ma..."
    title: 'restext://Heading_MarkOfGenius'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:4266
    - type: 'text'
      # ../en-US.restext:288 | "If a player reaches the *..."
      value: 'restext://Resource_InsanityTrack_3rdSpace_Lead'
    # ../.source/TheCostofDisease_Eng_v10.cs:4274
    - type: 'link'
      # ../en-US.restext:48 | "click here."
      label: 'restext://Click_Here_Period'
      target: 'Gen1-SanityTrack' # ./00178-Gen1-SanityTrack.mws.yaml
      snapshot: true
# ../.source/TheCostofDisease_Eng_v10.cs:4277
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:4281
- type: 'section'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:4290
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:42 | "Click here at the end of ..."
    label: 'restext://Click_EndGeneration_Continue'
    target: 'Feverheart'
    # ../en-US.restext:348 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '3' # ./00028-Feverheart.mws.yaml
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:590 | "The Late Years of the Fir..."
      value: 'restext://Fever3_009'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:294 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
