# ../.source/TheCostofDisease_Eng_v10.cs:11335
---
format: 'mws/0.4'
passage_id: 'Diseases1'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:11337
- type: 'assign'
  var: 'disease1'
  expr: 'rand_between(1, 2, "Diseases1_0")'
# ../.source/TheCostofDisease_Eng_v10.cs:11338
- type: 'switch'
  on: 'disease1'
  cases:
  - match: 1
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:11342
    - type: 'text'
      # ../en-US.restext:1157 | "**A Year of Sickness**"
      value: 'restext://Diseases1_001'
    # ../.source/TheCostofDisease_Eng_v10.cs:11344
    - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:11345
    - type: 'text'
      # ../en-US.restext:1158 | "Even the most agile mind ..."
      value: 'restext://Diseases1_002'
    # ../.source/TheCostofDisease_Eng_v10.cs:11348
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:11352
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:39 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: '${seedy == "no" ? "Gen1Creepy-RefusalBuild" : "Devastation2"}' # ./00295-Gen1Creepy-RefusalBuild.mws.yaml, ./00033-Devastation2.mws.yaml
      # ../en-US.restext:357 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      header:
      # ../.source/TheCostofDisease_Eng_v10.cs:11385
      - type: 'image'
        asset: 'image://setup/S1_DiseaseExperiment'
        style: 'setup-image'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:11387
      - type: 'text'
        # ../en-US.restext:1159 | "All players that have not..."
        value: 'restext://Diseases1_003'
  - match: 2
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:11358
    - type: 'text'
      # ../en-US.restext:1160 | "**Rest and Time**"
      value: 'restext://Diseases1_004'
    # ../.source/TheCostofDisease_Eng_v10.cs:11360
    - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:11361
    - type: 'text'
      # ../en-US.restext:1161 | "It seemed that the cousin..."
      value: 'restext://Diseases1_005'
    # ../.source/TheCostofDisease_Eng_v10.cs:11365
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:11369
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:39 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: '${seedy == "no" ? "Gen1Creepy-RefusalBuild" : "Devastation2"}' # ./00295-Gen1Creepy-RefusalBuild.mws.yaml, ./00033-Devastation2.mws.yaml
      # ../en-US.restext:357 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      header:
      # ../.source/TheCostofDisease_Eng_v10.cs:11423
      - type: 'image'
        asset: 'image://setup/S1_DiseaseExperiment'
        style: 'setup-image'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:11425
      - type: 'text'
        # ../en-US.restext:1162 | "The Hereditary disease ha..."
        value: 'restext://Diseases1_006'
