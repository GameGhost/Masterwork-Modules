# ../.source/TheCostofDisease_Eng_v10.cs:5353
---
format: 'mws/0.4'
passage_id: 'NoUni3'
# ../en-US.restext:346 | "THE CRAWL"
title: 'restext://Title_TheCrawl'
# ../en-US.restext:336 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:5360
- type: 'assign'
  var: 'round'
  expr: '18'
# ../.source/TheCostofDisease_Eng_v10.cs:5362
- type: 'conditional'
  if: '!gen3pg'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:5366
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:355 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/TheCostofDisease_Eng_v10.cs:5370
    - type: 'image'
      asset: 'image://setup/Creepy_Icon'
      style: 'setup-image'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:5372
    - type: 'text'
      # ../en-US.restext:647 | "Remove all {icon:creepy_i..."
      value: 'restext://NoUni3_001'
# ../.source/TheCostofDisease_Eng_v10.cs:5386
- type: 'switch'
  on: 'peeps'
  cases:
  - match: 1
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:5390
    - type: 'section'
      # ../en-US.restext:648 | "**Like Us**"
      title: 'restext://NoUni3_002'
      style: 'hub-card'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:5398
      - type: 'text'
        # ../en-US.restext:649 | "The townspeople express r..."
        value: 'restext://NoUni3_003'
      # ../.source/TheCostofDisease_Eng_v10.cs:5402
      - type: 'assign'
        var: 'ending'
        expr: '"END-NoUniGood"' # ./00020-END-NoUniGood.mws.yaml
      # ../.source/TheCostofDisease_Eng_v10.cs:5400
      - type: 'break'
        style: 'paragraph'
      # ../.source/TheCostofDisease_Eng_v10.cs:5403
      - type: 'text'
        # ../en-US.restext:650 | "Any player with a token t..."
        value: 'restext://NoUni3_004'
  - match: 0
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:5417
    - type: 'section'
      # ../en-US.restext:651 | "**A Step Forward**"
      title: 'restext://NoUni3_005'
      style: 'hub-card'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:5425
      - type: 'text'
        # ../en-US.restext:652 | "The townspeople begrudgin..."
        value: 'restext://NoUni3_006'
    # ../.source/TheCostofDisease_Eng_v10.cs:5431
    - type: 'assign'
      var: 'ending'
      expr: '"END-NoUniGood"' # ./00020-END-NoUniGood.mws.yaml
    # ../.source/TheCostofDisease_Eng_v10.cs:5429
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:5434
    - type: 'section'
      # ../en-US.restext:653 | "**The Power of Electricity**"
      title: 'restext://NoUni3_007'
      style: 'hub-card'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:5442
      - type: 'text'
        # ../en-US.restext:654 | "During a **Perform Experi..."
        value: 'restext://NoUni3_008'
# ../.source/TheCostofDisease_Eng_v10.cs:5459
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:5463
- type: 'section'
  # ../en-US.restext:173 | "{icon:storybook} **PUB**"
  title: 'restext://Heading_Pub'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:5473
  - type: 'text'
    # ../en-US.restext:286 | "If your token is overtake..."
    value: 'restext://Pub_ResetCreepy_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:5489
  - type: 'link'
    # ../en-US.restext:36 | "click here for a Bar-venture."
    label: 'restext://Click_BarVenture'
    target: 'Barventures' # ./00027-Barventures.mws.yaml
    snapshot: true
# ../.source/TheCostofDisease_Eng_v10.cs:5491
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:5495
- type: 'section'
  # ../en-US.restext:165 | "**MASTERWORK**"
  title: 'restext://Heading_Masterwork'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:5503
  - type: 'text'
    # ../en-US.restext:219 | "A Masterwork can be compl..."
    value: 'restext://Masterwork_CompleteRule'
# ../.source/TheCostofDisease_Eng_v10.cs:5506
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:5510
- type: 'section'
  # ../en-US.restext:167 | "{icon:storybook} **Master..."
  title: 'restext://Heading_MasterworkRecipe'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:5520
  - type: 'text'
    # ../en-US.restext:215 | "To check your Masterwork ..."
    value: 'restext://Masterwork_CheckCost_Lead'
  # ../.source/TheCostofDisease_Eng_v10.cs:5521
  - type: 'link'
    # ../en-US.restext:51 | "click here."
    label: 'restext://Click_Here_Period'
    target: 'MWTemp' # ./00142-MWTemp.mws.yaml
    snapshot: true
# ../.source/TheCostofDisease_Eng_v10.cs:5523
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:5527
- type: 'section'
  # ../en-US.restext:150 | "{icon:storybook} **Comple..."
  title: 'restext://Heading_CompletedMasterwork'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:5537
  - type: 'text'
    # ../en-US.restext:220 | "If you are completing a M..."
    value: 'restext://Masterwork_Completing_Lead'
  # ../.source/TheCostofDisease_Eng_v10.cs:5538
  - type: 'link'
    # ../en-US.restext:54 | "click here to receive you..."
    label: 'restext://Click_ReceiveRewards'
    target: 'MWCompleteName' # ./00143-MWCompleteName.mws.yaml
    snapshot: true
  # ../.source/TheCostofDisease_Eng_v10.cs:5539
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:5542
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:47 | "Click here at the end of ..."
    label: 'restext://Click_EndGeneration_FinalScoringFateOfTown'
    target: '${peeps == 1 ? "NoUni3b" : "Scoring"}' # ./00072-NoUni3b.mws.yaml, ./00013-Scoring.mws.yaml
    # ../en-US.restext:360 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:307 | "The Late Years of the Thi..."
      value: 'restext://Round_GenerationIII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:305 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
