# ../.source/TheCostofDisease_Eng_v10.cs:20185
---
format: 'mws/0.4'
passage_id: 'GloomyGothic3'
# ../en-US.restext:345 | "A Taste of Evil"
title: 'restext://Title_TasteOfEvil'
# ../en-US.restext:336 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:20192
- type: 'assign'
  var: 'round'
  expr: '12'
# ../.source/TheCostofDisease_Eng_v10.cs:20194
- type: 'conditional'
  # ../en-US.restext:121 | "Fraternity of Hunters"
  if: 'society == "restext://Faction_FraternityOfHunters_Plain"'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:20196
  - type: 'conditional'
    # ../en-US.restext:30 | "no"
    if: 'taxes == "restext://Choice_No_Lower"'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:20200
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:355 | "Accept"
      okay: 'restext://UIButton_Accept'
      header:
      # ../.source/TheCostofDisease_Eng_v10.cs:20204
      - type: 'image'
        asset: 'image://setup/S1_Suspicious_Building'
        style: 'setup-image'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:20206
      - type: 'text'
        # ../en-US.restext:1546 | "Temporarily remove all Bu..."
        value: 'restext://GloomyGothic3_010'
      # ../.source/TheCostofDisease_Eng_v10.cs:20213
      - type: 'break'
        style: 'paragraph'
      # ../.source/TheCostofDisease_Eng_v10.cs:20215
      - type: 'conditional'
        if: 'exposeA <= 1'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:20219
        - type: 'text'
          # ../en-US.restext:1539 | "_Place the {ba} tile over..."
          value: 'restext://GloomyGothic3_003'
        # ../.source/TheCostofDisease_Eng_v10.cs:20223
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:20225
      - type: 'conditional'
        if: 'exposeB <= 1'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:20229
        - type: 'text'
          # ../en-US.restext:1540 | "_Place the {bb} tile over..."
          value: 'restext://GloomyGothic3_004'
        # ../.source/TheCostofDisease_Eng_v10.cs:20233
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:20235
      - type: 'conditional'
        if: 'exposeC <= 1'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:20239
        - type: 'text'
          # ../en-US.restext:1541 | "_Place the {bc} tile over..."
          value: 'restext://GloomyGothic3_005'
        # ../.source/TheCostofDisease_Eng_v10.cs:20243
        - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:20250
    - type: 'section'
      # ../en-US.restext:1547 | "**The Hunter's Haven**"
      title: 'restext://GloomyGothic3_011'
      style: 'hub-card'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:20257
      - type: 'text'
        # ../en-US.restext:1548 | "Visiting the remodeled Hu..."
        value: 'restext://GloomyGothic3_012'
      # ../.source/TheCostofDisease_Eng_v10.cs:20266
      - type: 'assign'
        var: 'ending'
        expr: '"END-HuntersEvil1"' # ./00017-END-HuntersEvil1.mws.yaml
      # ../.source/TheCostofDisease_Eng_v10.cs:20264
      - type: 'break'
        style: 'paragraph'
      # ../.source/TheCostofDisease_Eng_v10.cs:20269
      - type: 'popup'
        layout: 'end_of_round'
        # ../en-US.restext:1537 | "Click at the end of the G..."
        label: 'restext://GloomyGothic3_001'
        target: 'Scoring' # ./00013-Scoring.mws.yaml
        # ../en-US.restext:360 | "End of Round"
        okay: 'restext://UIButton_EndOfRound'
        onclose:
        - type: 'assign'
          var: '_ProgressRound'
          expr: '9'
        snapshot: true
        content:
        - type: 'text'
          # ../en-US.restext:307 | "The Late Years of the Thi..."
          value: 'restext://Round_GenerationIII_LateEnded'
        - type: 'break'
          style: 'paragraph'
        - type: 'text'
          # ../en-US.restext:305 | "Perform any End of Round ..."
          value: 'restext://Round_EndOfRoundActions_Rule'
    else:
    # ../.source/TheCostofDisease_Eng_v10.cs:20277
    - type: 'section'
      # ../en-US.restext:176 | "**Safe and Protected**"
      title: 'restext://Heading_SafeAndProtected'
      style: 'hub-card'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:20285
      - type: 'text'
        # ../en-US.restext:1543 | "We have decided to believ..."
        value: 'restext://GloomyGothic3_007'
