          value: 'restext://GloomyGothic3_004'
        # ../.source/TheCostofDisease_Eng_v10.cs:20371
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:20373
      - type: 'conditional'
        if: 'exposeC <= 1'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:20377
        - type: 'text'
          # ../en-US.restext:1541 | "_Place the {bc} tile over..."
          value: 'restext://GloomyGothic3_005'
    # ../.source/TheCostofDisease_Eng_v10.cs:20387
    - type: 'section'
      # ../en-US.restext:177 | "**School for Hybridized I..."
      title: 'restext://Heading_SchoolForHybridizedIndividuals'
      style: 'hub-card'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:20395
      - type: 'text'
        # ../en-US.restext:1542 | "When visiting this buildi..."
        value: 'restext://GloomyGothic3_006'
