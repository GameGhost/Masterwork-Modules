    # ../.source/TheCostofDisease_Eng_v10.cs:20306
    - type: 'section'
      # ../en-US.restext:1544 | "**Final Taxation**"
      title: 'restext://GloomyGothic3_008'
      style: 'hub-card'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:20314
      - type: 'text'
        # ../en-US.restext:1545 | "At the end of this round,..."
        value: 'restext://GloomyGothic3_009'
      # ../.source/TheCostofDisease_Eng_v10.cs:20323
      - type: 'assign'
        var: 'ending'
        expr: '"END-HuntersEvil2"' # ./00332-END-HuntersEvil2.mws.yaml
      # ../.source/TheCostofDisease_Eng_v10.cs:20321
