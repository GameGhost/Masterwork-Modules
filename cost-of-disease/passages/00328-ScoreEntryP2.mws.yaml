# ../.source/TheCostofDisease_Eng_v10.cs:33532
---
format: 'mws/0.4'
passage_id: 'ScoreEntryP2'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:33534
- type: 'conditional'
  if: '!scoreB_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:2674 | "Please enter the final sc..."
      value: 'restext://ScoreEntryP2_001'
    - type: 'input'
      label: ''
      var: 'scoreB'
    # ../en-US.restext:359 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'scoreB_submitted'
      expr: 'true'
    snapshot: true
    target: 'ScoreEntryP2' # ./00328-ScoreEntryP2.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:33552
- type: 'text'
  # ../en-US.restext:2675 | "Thank you for recording t..."
  value: 'restext://ScoreEntryP2_002'
# ../.source/TheCostofDisease_Eng_v10.cs:33555
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:33557
- type: 'conditional'
  if: 'players < 3'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:33559
  - type: 'link'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'WinnerHUB' # ./00327-WinnerHUB.mws.yaml
    snapshot: true
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:33563
  - type: 'link'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'ScoreEntryP3' # ./00329-ScoreEntryP3.mws.yaml
    snapshot: true
