  - '_rnd_bar3_1'
# ../.source/TheCostofDisease_Eng_v10.cs:6418
- type: 'assign'
  var: 'bar3'
  expr: 'rand_between(1, 2, "bar3_2")'
# ../.source/TheCostofDisease_Eng_v10.cs:6417
- type: 'break'
