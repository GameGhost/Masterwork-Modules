# ../.source/TheCostofDisease_Eng_v10.cs:6420
- type: 'conditional'
  if: 'bar3 == 1'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:6422
  - type: 'text'
    # ../en-US.restext:719 | "It was very much in poor ..."
    value: 'restext://bar3_004'
  # ../.source/TheCostofDisease_Eng_v10.cs:6428
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:6430
  - type: 'text'
    # ../en-US.restext:720 | "I have since reimbursed t..."
    value: 'restext://bar3_005'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:6438
  - type: 'text'
    # ../en-US.restext:717 | "During a spirited convers..."
    value: 'restext://bar3_002'
  # ../.source/TheCostofDisease_Eng_v10.cs:6439
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:6441
  - type: 'text'
    # ../en-US.restext:718 | "An exchange of bitter wor..."
    value: 'restext://bar3_003'
# ../.source/TheCostofDisease_Eng_v10.cs:6452
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:355 | "Accept"
  okay: 'restext://UIButton_Accept'
  header:
  # ../.source/TheCostofDisease_Eng_v10.cs:6456
  - type: 'image'
    asset: 'image://setup/Creepy_Icon'
