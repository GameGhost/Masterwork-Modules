      # ../en-US.restext:192 | "At the end of the round, ..."
      value: 'restext://Hunt_NightOfTheHunt_Selection'
    # ../.source/TheCostofDisease_Eng_v10.cs:13307
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:13311
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:48 | "Click at the end of the r..."
      label: 'restext://Click_EndRound_Continue'
      target: 'CharityAwardGood' # ./00207-CharityAwardGood.mws.yaml
      # ../en-US.restext:361 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '7'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:307 | "The Early Years of the Th..."
        value: 'restext://Round_GenerationIII_EarlyEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:314 | "Then, perform all Start o..."
        value: 'restext://Round_StartMiddleYears_Rule'
