  # ../.source/TheCostofDisease_Eng_v10.cs:13188
  - type: 'conditional'
    if: '!gen3pg'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:13192
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:356 | "Accept"
      okay: 'restext://UIButton_Accept'
      header:
      # ../.source/TheCostofDisease_Eng_v10.cs:13196
      - type: 'image'
        asset: 'image://setup/AngryMobSetup1'
        style: 'setup-image'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:13197
      - type: 'text'
        # ../en-US.restext:2794 | "Turn to page **15** of th..."
        value: 'restext://Prosperity1_002'
      # ../.source/TheCostofDisease_Eng_v10.cs:13216
      - type: 'conditional'
        if: 'players == 3'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13218
        - type: 'text'
          # ../en-US.restext:82 | "Then, since this is a 3-p..."
          value: 'restext://Directive_3Player_PassMarker_B'
      # ../.source/TheCostofDisease_Eng_v10.cs:13221
      - type: 'break'
        style: 'paragraph'
      # ../.source/TheCostofDisease_Eng_v10.cs:13223
      - type: 'conditional'
        if: 'exposeA > 0'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13225
        - type: 'text'
          # ../en-US.restext:104 | "Place the {ba} tile over ..."
          value: 'restext://Directive_PlaceTile_A'
        # ../.source/TheCostofDisease_Eng_v10.cs:13228
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13230
      - type: 'conditional'
        if: 'exposeB > 0'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13232
        - type: 'text'
          # ../en-US.restext:105 | "Place the {bb} tile over ..."
          value: 'restext://Directive_PlaceTile_B'
        # ../.source/TheCostofDisease_Eng_v10.cs:13235
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13237
      - type: 'conditional'
        if: 'exposeC > 0'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13239
        - type: 'text'
          # ../en-US.restext:2795 | "Place the {bc} tile over ..."
          value: 'restext://Prosperity1_003'
        # ../.source/TheCostofDisease_Eng_v10.cs:13242
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13244
      - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13245
      - type: 'text'
        # ../en-US.restext:108 | "Return all other Exposed ..."
        value: 'restext://Directive_ReturnExposedBuildingTiles'
  # ../.source/TheCostofDisease_Eng_v10.cs:13248
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13252
  - type: 'section'
    # ../en-US.restext:160 | "**Hunter's Haven**"
    title: 'restext://Heading_HuntersHaven'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13260
    - type: 'text'
      # ../en-US.restext:193 | "For each visit to the Hun..."
      value: 'restext://HuntersHaven_PayKnowledgeLoseInsanity_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:13268
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13272
  - type: 'section'
    # ../en-US.restext:155 | "**Engineering Achievement**"
    title: 'restext://Heading_EngineeringAchievement'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13280
    - type: 'text'
      # ../en-US.restext:95 | "When you gain a Vanity Es..."
      value: 'restext://Directive_EngineeringMastersStudy_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:13288
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13292
  - type: 'section'
    # ../en-US.restext:154 | "**Endless Hunt**"
