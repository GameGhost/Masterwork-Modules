# ../.source/TheCostofDisease_Eng_v10.cs:12996
---
format: 'mws/0.4'
passage_id: 'Prosperity1'
# ../en-US.restext:2793 | "The Good Fight"
title: 'restext://Prosperity1_001'
# ../en-US.restext:332 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
layout: 'hub_early'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:13003
- type: 'assign'
  var: 'round'
  expr: '13'
# ../.source/TheCostofDisease_Eng_v10.cs:13007
- type: 'conditional'
  # ../en-US.restext:126 | "Order of St. Hubertus"
  if: 'society == "restext://Faction_OrderOfStHubertus_Plain"'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:13009
  - type: 'conditional'
    if: '!gen3pg'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:13013
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:356 | "Accept"
      okay: 'restext://UIButton_Accept'
      header:
      # ../.source/TheCostofDisease_Eng_v10.cs:13017
      - type: 'image'
        asset: 'image://setup/AngryMobSetup1'
        style: 'setup-image'
      # ../.source/TheCostofDisease_Eng_v10.cs:13068
      - type: 'image'
        asset: 'image://setup/S1_Suspicious_Building'
        style: 'setup-image'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:13018
      - type: 'text'
        # ../en-US.restext:2796 | "Turn to page **17** of th..."
        value: 'restext://Prosperity1_004'
      # ../.source/TheCostofDisease_Eng_v10.cs:13027
      - type: 'conditional'
        if: '!Prosperity1'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13029
        - type: 'assign'
          var: 'Prosperity1'
          expr: '1'
        # ../.source/TheCostofDisease_Eng_v10.cs:13030
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker - 2'
        # ../.source/TheCostofDisease_Eng_v10.cs:13031
        - type: 'switch'
          on: 'players'
          cases:
          - match: 4
            nodes:
            # ../.source/TheCostofDisease_Eng_v10.cs:13033
            - type: 'assign'
              var: 'tracker'
              expr: 'tracker - 1'
          - match: 5
            nodes:
            # ../.source/TheCostofDisease_Eng_v10.cs:13037
            - type: 'assign'
              var: 'tracker'
              expr: 'tracker - 1'
      # ../.source/TheCostofDisease_Eng_v10.cs:13040
      - type: 'text'
        # ../en-US.restext:2797 | "**{tracker}** and the {ic..."
        value: 'restext://Prosperity1_005'
      # ../.source/TheCostofDisease_Eng_v10.cs:13050
      - type: 'conditional'
        if: 'players == 3'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13052
        - type: 'text'
          # ../en-US.restext:81 | "Then, since this is a 3 p..."
          value: 'restext://Directive_3Player_PassMarker_A'
      # ../.source/TheCostofDisease_Eng_v10.cs:13055
      - type: 'break'
        style: 'paragraph'
      # ../.source/TheCostofDisease_Eng_v10.cs:13057
      - type: 'text'
        # ../en-US.restext:2798 | "Place a {icon:storybook} ..."
        value: 'restext://Prosperity1_006'
      # ../.source/TheCostofDisease_Eng_v10.cs:13062
      - type: 'break'
        style: 'paragraph'
      # ../.source/TheCostofDisease_Eng_v10.cs:13071
      - type: 'conditional'
        if: 'exposeA > 0'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13073
        - type: 'text'
          # ../en-US.restext:104 | "Place the {ba} tile over ..."
          value: 'restext://Directive_PlaceTile_A'
        # ../.source/TheCostofDisease_Eng_v10.cs:13076
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13078
      - type: 'conditional'
        if: 'exposeB > 0'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13080
        - type: 'text'
          # ../en-US.restext:105 | "Place the {bb} tile over ..."
          value: 'restext://Directive_PlaceTile_B'
        # ../.source/TheCostofDisease_Eng_v10.cs:13083
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13085
      - type: 'conditional'
        if: 'exposeC > 0'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:13087
        - type: 'text'
          # ../en-US.restext:2795 | "Place the {bc} tile over ..."
          value: 'restext://Prosperity1_003'
        # ../.source/TheCostofDisease_Eng_v10.cs:13090
        - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13092
      - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:13093
      - type: 'text'
        # ../en-US.restext:108 | "Return all other Exposed ..."
        value: 'restext://Directive_ReturnExposedBuildingTiles'
  # ../.source/TheCostofDisease_Eng_v10.cs:13096
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13100
  - type: 'section'
    # ../en-US.restext:141 | "**Acceptance**"
    title: 'restext://Heading_Acceptance'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13108
    - type: 'text'
      # ../en-US.restext:84 | "Caretaker pieces can now ..."
      value: 'restext://Directive_CaretakerTownActions_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:13114
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13118
  - type: 'section'
    # ../en-US.restext:178 | "**School for Hybridized I..."
    title: 'restext://Heading_SchoolForHybridizedIndividuals'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13126
    - type: 'text'
      # ../en-US.restext:315 | "When a player visits the ..."
      value: 'restext://SchoolForHybridizedIndividuals_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:13143
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13147
  - type: 'section'
    # ../en-US.restext:156 | "**Experiments are Feared**"
    title: 'restext://Heading_ExperimentsAreFeared'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13154
    - type: 'text'
      # ../en-US.restext:289 | "Anytime a player takes th..."
      value: 'restext://Resource_ExperimentGainsCreepy_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:13160
  - type: 'section'
    # ../en-US.restext:142 | "{icon:storybook} **Angry Mob**"
    title: 'restext://Heading_AngryMob'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13170
    - type: 'text'
      # ../en-US.restext:2799 | "Any time the {icon:angrym..."
      value: 'restext://Prosperity1_007'
    # ../.source/TheCostofDisease_Eng_v10.cs:13175
    - type: 'link'
      # ../en-US.restext:64 | "click here for a Storyboo..."
      label: 'restext://Click_StorybookMessage'
      target: 'AngryMobStorybook' # ./00215-AngryMobStorybook.mws.yaml
      snapshot: true
    # ../.source/TheCostofDisease_Eng_v10.cs:13177
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:13181
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:48 | "Click at the end of the r..."
      label: 'restext://Click_EndRound_Continue'
      target: 'WolvesEco-Friendly' # ./00214-WolvesEco-Friendly.mws.yaml
      # ../en-US.restext:361 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '7'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:307 | "The Early Years of the Th..."
        value: 'restext://Round_GenerationIII_EarlyEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:314 | "Then, perform all Start o..."
        value: 'restext://Round_StartMiddleYears_Rule'
