# ../.source/TheCostofDisease_Eng_v10.cs:33622
---
format: 'mws/0.4'
passage_id: 'ScoreEntryP4'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:33630
- type: 'conditional'
  if: '!scoreD_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:2678 | "Please enter the final sc..."
      value: 'restext://ScoreEntryP4_001'
    - type: 'input'
      label: ''
      var: 'scoreD'
    # ../en-US.restext:358 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'scoreD_submitted'
      expr: 'true'
    snapshot: true
    target: 'ScoreEntryP4' # ./00330-ScoreEntryP4.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:33642
- type: 'text'
  # ../en-US.restext:2679 | "Thank you for recording t..."
  value: 'restext://ScoreEntryP4_002'
# ../.source/TheCostofDisease_Eng_v10.cs:33645
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:33647
- type: 'conditional'
  if: 'players < 5'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:33649
  - type: 'link'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'WinnerHUB' # ./00327-WinnerHUB.mws.yaml
    snapshot: true
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:33653
  - type: 'link'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'ScoreEntryP5' # ./00331-ScoreEntryP5.mws.yaml
    snapshot: true
