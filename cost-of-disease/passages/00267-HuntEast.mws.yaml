# ../.source/TheCostofDisease_Eng_v10.cs:28427
# include_passage target — spliced into other passages' bodies at render time; never displays its own title
---
format: 'mws/0.4'
passage_id: 'HuntEast'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:28429
- type: 'text'
  # ../en-US.restext:2283 | "The Hunting party explore..."
  value: 'restext://HuntEast_001'
# ../.source/TheCostofDisease_Eng_v10.cs:28432
- type: 'conditional'
  if: 'HuntEastnextPsg == "" || HuntEastnextPsg == 0'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:28434
  - type: 'assign'
    var: 'HuntEastnextPsg'
    expr: '["Pricolici", "Troll"].shuffled("HuntEast_0")[0]'
# ../.source/TheCostofDisease_Eng_v10.cs:28430
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:28436
- type: 'include_passage'
  target: '${HuntEastnextPsg}'
