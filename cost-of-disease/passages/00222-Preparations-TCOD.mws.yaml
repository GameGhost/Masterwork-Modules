# ../.source/TheCostofDisease_Eng_v10.cs:24572
---
format: 'mws/0.4'
passage_id: 'Preparations-TCOD'
# ../en-US.restext:1952 | "Preparations"
title: 'restext://Preparations_TCOD_001'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:24579
- type: 'assign'
  var: 'players'
  expr: 'global:playerCount'
# ../.source/TheCostofDisease_Eng_v10.cs:24580
- type: 'assign'
  var: 'nameA'
  expr: 'global:nameA'
# ../.source/TheCostofDisease_Eng_v10.cs:24581
- type: 'assign'
  var: 'nameB'
  expr: 'global:nameB'
# ../.source/TheCostofDisease_Eng_v10.cs:24582
- type: 'conditional'
  if: 'players > 2'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:24582
  - type: 'assign'
    var: 'nameC'
    expr: 'global:nameC'
# ../.source/TheCostofDisease_Eng_v10.cs:24583
- type: 'conditional'
  if: 'players > 3'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:24583
  - type: 'assign'
    var: 'nameD'
    expr: 'global:nameD'
# ../.source/TheCostofDisease_Eng_v10.cs:24584
- type: 'conditional'
  if: 'players > 4'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:24584
  - type: 'assign'
    var: 'nameE'
    expr: 'global:nameE'
# ../.source/TheCostofDisease_Eng_v10.cs:24585
- type: 'assign'
  var: 'townname'
  expr: 'global:townName'
# ../.source/TheCostofDisease_Eng_v10.cs:24586
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:278 | "two"
      expr: '"restext://Number_Two_Lower"'
  - match: 3
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:277 | "three"
      expr: '"restext://Number_Three_Lower"'
  - match: 4
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:276 | "four"
      expr: '"restext://Number_Four_Lower"'
  - match: 5
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:275 | "five"
      expr: '"restext://Number_Five_Lower"'
  default:
  - type: 'assign'
    var: 'playtxt'
    # ../en-US.restext:278 | "two"
    expr: '"restext://Number_Two_Lower"'
# ../.source/TheCostofDisease_Eng_v10.cs:24589
- type: 'text'
  # ../en-US.restext:1953 | "Complete the standard set..."
  value: 'restext://Preparations_TCOD_002'
# ../.source/TheCostofDisease_Eng_v10.cs:24600
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:24605
- type: 'image'
  asset: 'icon://scenariobox3d_disease'
  size: '200'
  align: 'center'
# ../.source/TheCostofDisease_Eng_v10.cs:24609
- type: 'break'
# ../.source/TheCostofDisease_Eng_v10.cs:24610
- type: 'text'
  # ../en-US.restext:1954 | "Then, retrieve **The Cost..."
  value: 'restext://Preparations_TCOD_003'
# ../.source/TheCostofDisease_Eng_v10.cs:24619
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:24621
- type: 'link'
  # ../en-US.restext:35 | "Click here to continue..."
  label: 'restext://Click_ContinueEllipsis_B'
  target: 'Preface-TCOD' # ./00223-Preface-TCOD.mws.yaml
  snapshot: true
