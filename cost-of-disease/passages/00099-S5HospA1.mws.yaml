# ../.source/TheCostofDisease_Eng_v10.cs:10950
---
format: 'mws/0.4'
passage_id: 'S5HospA1'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:10952
- type: 'conditional'
  if: 'S5HospA1nextPsg == "" || S5HospA1nextPsg == 0'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:10954
  - type: 'switch'
    on: 'players'
    cases:
    - match: 2
      nodes:
      # ../.source/TheCostofDisease_Eng_v10.cs:10956
      - type: 'let'
        var: '_rnd_S5HospA1_0'
        expr: 'rand_between(1, 2, "S5HospA1_0")'
      # ../.source/TheCostofDisease_Eng_v10.cs:10956
      - type: 'conditional'
        if: 'life >= _rnd_S5HospA1_0'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:10959
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1Yes"' # ./00024-S5HospA1Yes.mws.yaml
        else:
        # ../.source/TheCostofDisease_Eng_v10.cs:10964
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1No"' # ./00100-S5HospA1No.mws.yaml
    - match: 3
      nodes:
      # ../.source/TheCostofDisease_Eng_v10.cs:10969
      - type: 'conditional'
        if: 'life >= 2'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:10972
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1Yes"' # ./00024-S5HospA1Yes.mws.yaml
        else:
        # ../.source/TheCostofDisease_Eng_v10.cs:10977
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1No"' # ./00100-S5HospA1No.mws.yaml
    - match: 4
      nodes:
      # ../.source/TheCostofDisease_Eng_v10.cs:10982
      - type: 'let'
        var: '_rnd_S5HospA1_1'
        expr: 'rand_between(2, 3, "S5HospA1_1")'
      # ../.source/TheCostofDisease_Eng_v10.cs:10982
      - type: 'conditional'
        if: 'life >= _rnd_S5HospA1_1'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:10985
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1Yes"' # ./00024-S5HospA1Yes.mws.yaml
        else:
        # ../.source/TheCostofDisease_Eng_v10.cs:10990
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1No"' # ./00100-S5HospA1No.mws.yaml
    - match: 5
      nodes:
      # ../.source/TheCostofDisease_Eng_v10.cs:10995
      - type: 'let'
        var: '_rnd_S5HospA1_2'
        expr: 'rand_between(2, 4, "S5HospA1_2")'
      # ../.source/TheCostofDisease_Eng_v10.cs:10995
      - type: 'conditional'
        if: 'life >= _rnd_S5HospA1_2'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:10998
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1Yes"' # ./00024-S5HospA1Yes.mws.yaml
        else:
        # ../.source/TheCostofDisease_Eng_v10.cs:11003
        - type: 'assign'
          var: 'S5HospA1nextPsg'
          expr: '"S5HospA1No"' # ./00100-S5HospA1No.mws.yaml
    default:
    # ../.source/TheCostofDisease_Eng_v10.cs:11009
    - type: 'assign'
      var: 'S5HospA1nextPsg'
      expr: '"S5HospA1No"' # ./00100-S5HospA1No.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:11012
- type: 'goto'
  target: '${S5HospA1nextPsg}'
