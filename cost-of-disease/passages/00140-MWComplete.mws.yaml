format: 'mws/0.4'
passage_id: 'MWComplete'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:15851
- type: 'switch'
  on: 'tempcomp'
  cases:
  - match: 'nameA'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15853
    - type: 'include_passage'
      target: 'MWCompleteHubA' # ./00138-MWCompleteHubA.mws.yaml
  - match: 'nameB'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15857
    - type: 'include_passage'
      target: 'MWCompleteHubB' # ./00148-MWCompleteHubB.mws.yaml
  - match: 'nameC'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15861
    - type: 'include_passage'
      target: 'MWCompleteHubC' # ./00155-MWCompleteHubC.mws.yaml
  - match: 'nameD'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15865
    - type: 'include_passage'
      target: 'MWCompleteHubD' # ./00162-MWCompleteHubD.mws.yaml
  - match: 'nameE'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15869
    - type: 'include_passage'
      target: 'MWCompleteHubE' # ./00239-MWCompleteHubE.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:15871
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:15873
- type: 'text'
  # ../en-US.restext:1331 | "Then, collect your "
  value: 'restext://MWComplete_001'
# ../.source/TheCostofDisease_Eng_v10.cs:15874
- type: 'include_passage'
  target: 'AllMWRewards' # ./00144-AllMWRewards.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:15875
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:15877
- type: 'switch'
  on: 'round'
  cases:
  - match: 16
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15879
    - type: 'link'
      # ../en-US.restext:52 | "Click to return..."
      label: 'restext://Click_Return'
      target: 'NoUni1' # ./00011-NoUni1.mws.yaml
      snapshot: true
  - match: 17
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15883
    - type: 'link'
      # ../en-US.restext:52 | "Click to return..."
      label: 'restext://Click_Return'
      target: 'NoUni2' # ./00036-NoUni2.mws.yaml
      snapshot: true
  default:
  # ../.source/TheCostofDisease_Eng_v10.cs:15888
  - type: 'link'
