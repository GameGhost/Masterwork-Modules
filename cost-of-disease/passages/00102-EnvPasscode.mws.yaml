# ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:11180
---
format: 'mws/0.4'
passage_id: 'EnvPasscode'
layout: 'narration'
nodes:
# ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:11182
- type: 'conditional'
  if: '!password_submitted'
  then:
  - type: 'popup'
    content:
    - type: 'text'
      # ../en-US.restext:1136 | "Enter the secret password..."
      value: 'restext://EnvPasscode_001'
    - type: 'input'
      # ../en-US.restext:1137 | "EnvPasscode"
      label: 'restext://EnvPasscode_002'
      var: 'password'
    # ../en-US.restext:346 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'password_submitted'
      expr: 'true'
    snapshot: true
    target: 'EnvPasscode' # ./00102-EnvPasscode.mws.yaml
