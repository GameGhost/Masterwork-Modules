# ../.source/TheCostofDisease_Eng_v10.cs:11180
---
format: 'mws/0.4'
passage_id: 'EnvPasscode'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:11182
- type: 'conditional'
  if: '!password_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:1153 | "Enter the secret password..."
      value: 'restext://EnvPasscode_001'
    - type: 'input'
      label: ''
      var: 'password'
    # ../en-US.restext:358 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'password_submitted'
      expr: 'true'
    snapshot: true
    target: 'EnvPasscode' # ./00102-EnvPasscode.mws.yaml
