    - type: 'include_passage'
      target: '${_rnd_Barventures_2}'
  default:
  # ../.source/TheCostofDisease_Eng_v10.cs:3720
  - type: 'let'
    var: '_rnd_Barventures_3'
    expr: '["bar1", "bar2", "bar3", "bar4", "bar6", "bar7"].shuffled("Barventures_4")[0]'
