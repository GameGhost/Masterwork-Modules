    - type: 'let'
      var: '_rnd_Barventures_1'
      expr: '["bar1", "bar2", "bar3", "bar4", "bar5", "bar6", "bar7"].shuffled("Barventures_2")[0]'
    # ../.source/TheCostofDisease_Eng_v10.cs:3711
    - type: 'include_passage'
      target: '${_rnd_Barventures_1}'
  - match: 17
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:3715
    - type: 'let'
      var: '_rnd_Barventures_2'
