      value: 'restext://Barventures_006'
  - match: 2
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:3689
    - type: 'text'
      # ../en-US.restext:592 | "_As your historical curat..."
      value: 'restext://Barventures_007'
  default:
  # ../.source/TheCostofDisease_Eng_v10.cs:3701
  - type: 'let'
    var: '_rnd_Barventures_0'
