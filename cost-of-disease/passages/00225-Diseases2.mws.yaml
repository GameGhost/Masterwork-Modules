# ../.source/TheCostofDisease_Eng_v10.cs:24766
---
format: 'mws/0.4'
passage_id: 'Diseases2'
# ../en-US.restext:1985 | Diseases2_001 | "A Cleansing"
# ../en-US.restext:1986 | Diseases2_002 | "Wasted Potential"
title: '{disease2 == 1 ? "restext://Diseases2_001" : "restext://Diseases2_002"}'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:24768
- type: 'conditional'
  if: 'Diseases2nextPsg == "" || Diseases2nextPsg == 0'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:24769
  - type: 'assign'
    var: 'Diseases2nextPsg'
    expr: 'rand_between(1, 2, "Diseases2_0")'
# ../.source/TheCostofDisease_Eng_v10.cs:24770
- type: 'assign'
  var: 'disease2'
  expr: 'Diseases2nextPsg'
# ../.source/TheCostofDisease_Eng_v10.cs:24771
- type: 'assign'
  var: 'devpage'
  expr: '0'
# ../.source/TheCostofDisease_Eng_v10.cs:24772
- type: 'conditional'
  if: 'disease2 == 1'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:24779
  - type: 'text'
    # ../en-US.restext:1989 | "When the symptoms grew to..."
    value: 'restext://Diseases2_005'
  # ../.source/TheCostofDisease_Eng_v10.cs:24780
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:24784
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: '${seedy == "yes" ? "Gen1Creepy-ConcealExpose" : "Devastation3"}' # ./00294-Gen1Creepy-ConcealExpose.mws.yaml, ./00032-Devastation3.mws.yaml
    # ../en-US.restext:356 | "Close"
    okay: 'restext://UIButton_Close'
    snapshot: true
    header:
    # ../.source/TheCostofDisease_Eng_v10.cs:24817
    - type: 'image'
      asset: 'image://setup/DiscardEstateUpgrade_Icon'
      style: 'setup-image'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:24819
    - type: 'text'
      # ../en-US.restext:1990 | "All players that have not..."
      value: 'restext://Diseases2_006'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:24794
  - type: 'text'
    # ../en-US.restext:1987 | "While the disease that pl..."
    value: 'restext://Diseases2_003'
  # ../.source/TheCostofDisease_Eng_v10.cs:24798
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:24802
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: '${seedy == "yes" ? "Gen1Creepy-ConcealExpose" : "Devastation3"}' # ./00294-Gen1Creepy-ConcealExpose.mws.yaml, ./00032-Devastation3.mws.yaml
    # ../en-US.restext:356 | "Close"
    okay: 'restext://UIButton_Close'
    snapshot: true
    header:
    # ../.source/TheCostofDisease_Eng_v10.cs:24855
    - type: 'image'
      asset: 'image://setup/S1_DiseaseExperiment'
      style: 'setup-image'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:24857
    - type: 'text'
      # ../en-US.restext:1988 | "All players that have not..."
      value: 'restext://Diseases2_004'
