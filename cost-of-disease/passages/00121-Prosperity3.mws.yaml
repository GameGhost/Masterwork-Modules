- type: 'assign'
  var: 'round'
  expr: '15'
# ../.source/TheCostofDisease_Eng_v10.cs:13557
- type: 'conditional'
  # ../en-US.restext:114 | "Order of St. Hubertus"
  if: 'society == "restext://Faction_OrderOfStHubertus_Plain"'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:13561
  - type: 'section'
    # ../en-US.restext:130 | "**Acceptance**"
    title: 'restext://Heading_Acceptance'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13569
    - type: 'text'
      # ../en-US.restext:72 | "Caretaker pieces can now ..."
      value: 'restext://Directive_CaretakerTownActions_Rule'
