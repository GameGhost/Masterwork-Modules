      target: 'Scoring' # ./00013-Scoring.mws.yaml
      # ../en-US.restext:348 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '9'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:296 | "The Late Years of the Thi..."
        value: 'restext://Round_GenerationIII_LateEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:294 | "Perform any End of Round ..."
        value: 'restext://Round_EndOfRoundActions_Rule'
