  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13704
  - type: 'section'
    # ../en-US.restext:1208 | "**Scientific Achievement**"
    title: 'restext://Prosperity3_001'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13712
    - type: 'text'
      # ../en-US.restext:1209 | "When you gain a Vanity Es..."
      value: 'restext://Prosperity3_002'
    # ../.source/TheCostofDisease_Eng_v10.cs:13716
    - type: 'assign'
      var: 'ending'
      expr: '"END-HunterGood1"' # ./00019-END-HunterGood1.mws.yaml
    # ../.source/TheCostofDisease_Eng_v10.cs:13714
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:13719
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:43 | "Click at the end of the G..."
      label: 'restext://Click_EndGeneration_FinalScoring'
      target: 'Scoring' # ./00013-Scoring.mws.yaml
      # ../en-US.restext:348 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '9'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:296 | "The Late Years of the Thi..."
