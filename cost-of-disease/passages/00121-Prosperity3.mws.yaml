  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13579
  - type: 'section'
    # ../en-US.restext:169 | "**School for Hybridized I..."
    title: 'restext://Heading_SchoolForHybridizedIndividuals'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13587
    - type: 'text'
      # ../en-US.restext:303 | "When a player visits the ..."
      value: 'restext://SchoolForHybridizedIndividuals_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:13604
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:13608
  - type: 'section'
    # ../en-US.restext:145 | "**Experiments are Feared**"
    title: 'restext://Heading_ExperimentsAreFeared'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13615
    - type: 'text'
      # ../en-US.restext:281 | "Anytime a player takes th..."
      value: 'restext://Resource_ExperimentGainsCreepy_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:13621
  - type: 'section'
    # ../en-US.restext:146 | "**Farmer's Market**"
    title: 'restext://Heading_FarmersMarket'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13628
    - type: 'text'
      # ../en-US.restext:117 | "Due to the associated soc..."
      value: 'restext://FarmersMarket_CreepyRule'
