    title: 'restext://Heading_HuntersHaven'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13692
    - type: 'text'
      # ../en-US.restext:185 | "For each visit to the Hun..."
      value: 'restext://HuntersHaven_PayKnowledgeLoseInsanity_Rule'
