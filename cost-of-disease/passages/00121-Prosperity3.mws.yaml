  - type: 'section'
    # ../en-US.restext:131 | "{icon:storybook} **Angry Mob**"
    title: 'restext://Heading_AngryMob'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:13648
    - type: 'text'
      # ../en-US.restext:5 | "Any time the {icon:angrym..."
      value: 'restext://AngryMob_MoveRule_Lead'
