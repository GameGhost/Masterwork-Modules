# ../.source/TheCostofDisease_Eng_v10.cs:17624
---
format: 'mws/0.4'
passage_id: 'NewMaster3C'
# ../en-US.restext:1391 | "The {_rnd_NewMaster3C_0} ..."
title: 'restext://NewMaster3C_001'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:17626
- type: 'switch'
  on: 'costC'
  cases:
  # ../en-US.restext:131 | "Biology"
  - match: 'restext://Focus_Biology'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:17628
    - type: 'assign'
      var: 'cost2C'
      # ../en-US.restext:225 | "Animal"
      expr: '"restext://Masterwork_Type_Animal"'
  # ../en-US.restext:137 | "Engineering"
  - match: 'restext://Focus_Engineering'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:17632
    - type: 'assign'
      var: 'cost2C'
      # ../en-US.restext:230 | "Gear"
      expr: '"restext://Masterwork_Type_Gear"'
  # ../en-US.restext:134 | "Chemistry"
  - match: 'restext://Focus_Chemistry'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:17636
    - type: 'assign'
      var: 'cost2C'
      # ../en-US.restext:226 | "Bottle"
      expr: '"restext://Masterwork_Type_Bottle"'
# ../.source/TheCostofDisease_Eng_v10.cs:17640
- type: 'conditional'
  if: '!creationC_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:223 | "Give your creation a new,..."
      value: 'restext://Masterwork_NamePrompt'
    - type: 'input'
      label: ''
      var: 'creationC'
    # ../en-US.restext:359 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'creationC_submitted'
      expr: 'true'
    snapshot: true
    target: 'NewMaster3C' # ./00152-NewMaster3C.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:17656
- type: 'let'
  var: '_rnd_NewMaster3C_0'
  # ../en-US.restext:205 | Masterwork_Adjective_Infamous | "Infamous"
  # ../en-US.restext:214 | Masterwork_Adjective_Transcendent | "Transcendent"
  # ../en-US.restext:209 | Masterwork_Adjective_Monumental | "Monumental"
  # ../en-US.restext:210 | Masterwork_Adjective_Nefarious | "Nefarious"
  # ../en-US.restext:215 | Masterwork_Adjective_Unspeakable | "Unspeakable"
  # ../en-US.restext:207 | Masterwork_Adjective_Legendary | "Legendary"
  # ../en-US.restext:211 | Masterwork_Adjective_Noble | "Noble"
  # ../en-US.restext:212 | Masterwork_Adjective_Phenomenal | "Phenomenal"
  # ../en-US.restext:213 | Masterwork_Adjective_Stunning | "Stunning"
  # ../en-US.restext:208 | Masterwork_Adjective_Masterful | "Masterful"
  # ../en-US.restext:206 | Masterwork_Adjective_Insidious | "Insidious"
  expr: '["restext://Masterwork_Adjective_Infamous", "restext://Masterwork_Adjective_Transcendent", "restext://Masterwork_Adjective_Monumental", "restext://Masterwork_Adjective_Nefarious", "restext://Masterwork_Adjective_Unspeakable", "restext://Masterwork_Adjective_Legendary", "restext://Masterwork_Adjective_Noble", "restext://Masterwork_Adjective_Phenomenal", "restext://Masterwork_Adjective_Stunning", "restext://Masterwork_Adjective_Masterful", "restext://Masterwork_Adjective_Insidious"].shuffled("NewMaster3C_0")[0]'
# ../.source/TheCostofDisease_Eng_v10.cs:17662
- type: 'include_passage'
  target: 'MWCreationHubC' # ./00154-MWCreationHubC.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:17663
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:17665
- type: 'text'
  # ../en-US.restext:248 | "With my own destiny deter..."
  value: 'restext://Narrative_ForgeNewPath'
# ../.source/TheCostofDisease_Eng_v10.cs:17667
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:17671
- type: 'text'
  # ../en-US.restext:216 | "**You may check the cost ..."
  value: 'restext://Masterwork_CheckCostHint'
# ../.source/TheCostofDisease_Eng_v10.cs:17674
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:17676
- type: 'link'
  # ../en-US.restext:39 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: 'NewMHub' # ./00149-NewMHub.mws.yaml
  snapshot: true
