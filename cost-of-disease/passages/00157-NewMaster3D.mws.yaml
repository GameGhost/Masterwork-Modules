# ../.source/TheCostofDisease_Eng_v10.cs:18273
---
format: 'mws/0.4'
passage_id: 'NewMaster3D'
# ../en-US.restext:1418 | "The {_rnd_NewMaster3D_0} ..."
title: 'restext://NewMaster3D_001'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:18275
- type: 'switch'
  on: 'costD'
  cases:
  # ../en-US.restext:125 | "Biology"
  - match: 'restext://Focus_Biology'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:18277
    - type: 'assign'
      var: 'cost2D'
      # ../en-US.restext:219 | "Animal"
      expr: '"restext://Masterwork_Type_Animal"'
  # ../en-US.restext:131 | "Engineering"
  - match: 'restext://Focus_Engineering'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:18281
    - type: 'assign'
      var: 'cost2D'
      # ../en-US.restext:224 | "Gear"
      expr: '"restext://Masterwork_Type_Gear"'
  # ../en-US.restext:128 | "Chemistry"
  - match: 'restext://Focus_Chemistry'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:18285
    - type: 'assign'
      var: 'cost2D'
      # ../en-US.restext:220 | "Bottle"
      expr: '"restext://Masterwork_Type_Bottle"'
# ../.source/TheCostofDisease_Eng_v10.cs:18289
- type: 'conditional'
  if: '!creationD_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:217 | "Give your creation a new,..."
      value: 'restext://Masterwork_NamePrompt'
    - type: 'input'
      label: ''
      var: 'creationD'
    # ../en-US.restext:359 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'creationD_submitted'
      expr: 'true'
    snapshot: true
    target: 'NewMaster3D' # ./00157-NewMaster3D.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:18305
- type: 'let'
  var: '_rnd_NewMaster3D_0'
  # ../en-US.restext:199 | Masterwork_Adjective_Infamous | "Infamous"
  # ../en-US.restext:208 | Masterwork_Adjective_Transcendent | "Transcendent"
  # ../en-US.restext:203 | Masterwork_Adjective_Monumental | "Monumental"
  # ../en-US.restext:204 | Masterwork_Adjective_Nefarious | "Nefarious"
  # ../en-US.restext:209 | Masterwork_Adjective_Unspeakable | "Unspeakable"
  # ../en-US.restext:201 | Masterwork_Adjective_Legendary | "Legendary"
  # ../en-US.restext:205 | Masterwork_Adjective_Noble | "Noble"
  # ../en-US.restext:206 | Masterwork_Adjective_Phenomenal | "Phenomenal"
  # ../en-US.restext:207 | Masterwork_Adjective_Stunning | "Stunning"
  # ../en-US.restext:202 | Masterwork_Adjective_Masterful | "Masterful"
  # ../en-US.restext:200 | Masterwork_Adjective_Insidious | "Insidious"
  expr: '["restext://Masterwork_Adjective_Infamous", "restext://Masterwork_Adjective_Transcendent", "restext://Masterwork_Adjective_Monumental", "restext://Masterwork_Adjective_Nefarious", "restext://Masterwork_Adjective_Unspeakable", "restext://Masterwork_Adjective_Legendary", "restext://Masterwork_Adjective_Noble", "restext://Masterwork_Adjective_Phenomenal", "restext://Masterwork_Adjective_Stunning", "restext://Masterwork_Adjective_Masterful", "restext://Masterwork_Adjective_Insidious"].shuffled("NewMaster3D_0")[0]'
# ../.source/TheCostofDisease_Eng_v10.cs:18311
- type: 'include_passage'
  target: 'MWCreationHubD' # ./00161-MWCreationHubD.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:18312
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:18314
- type: 'text'
  # ../en-US.restext:242 | "With my own destiny deter..."
  value: 'restext://Narrative_ForgeNewPath'
# ../.source/TheCostofDisease_Eng_v10.cs:18316
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:18320
- type: 'text'
  # ../en-US.restext:210 | "**You may check the cost ..."
  value: 'restext://Masterwork_CheckCostHint'
# ../.source/TheCostofDisease_Eng_v10.cs:18323
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:18325
- type: 'link'
  # ../en-US.restext:39 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: 'NewMHub' # ./00149-NewMHub.mws.yaml
  snapshot: true
