# ../.source/TheCostofDisease_Eng_v10.cs:2545
---
format: 'mws/0.4'
passage_id: 'S5Fate2'
# ../en-US.restext:453 | "FATE of the Infected"
title: 'restext://S5Fate2_001'
tags:
- 'END'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:2560
- type: 'popup'
  layout: 'end_of_generation'
  # ../en-US.restext:358 | "Confirm"
  okay: 'restext://UIButton_Confirm'
  content:
  - type: 'text'
    # ../en-US.restext:93 | "Remove all player pieces ..."
    value: 'restext://Directive_EndGeneration_DubiousBartering'
  - type: 'let'
    var: 'generation'
    expr: '3'
# ../.source/TheCostofDisease_Eng_v10.cs:2563
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:2565
    - type: 'assign'
      var: 'heart'
      expr: '3'
  - match: 3
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:2569
    - type: 'assign'
      var: 'heart'
      expr: '6'
  - match: 4
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:2573
    - type: 'assign'
      var: 'heart'
      expr: '8'
  - match: 5
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:2577
    - type: 'assign'
      var: 'heart'
      expr: '10'
  default:
  # ../.source/TheCostofDisease_Eng_v10.cs:2581
  - type: 'assign'
    var: 'heart'
    expr: '3'
# ../.source/TheCostofDisease_Eng_v10.cs:2583
- type: 'let'
  var: '_rnd_S5Fate2_0'
  expr: 'rand_between(1, 6, "S5Fate2_0")'
# ../.source/TheCostofDisease_Eng_v10.cs:2583
- type: 'assign'
  var: 'hearttotal'
  expr: 'heart + _rnd_S5Fate2_0'
# ../.source/TheCostofDisease_Eng_v10.cs:2585
- type: 'text'
  # ../en-US.restext:454 | "The congregation and citi..."
  value: 'restext://S5Fate2_002'
# ../.source/TheCostofDisease_Eng_v10.cs:2588
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:2590
- type: 'conditional'
  if: 'charitytotal > hearttotal'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:2594
  - type: 'text'
    # ../en-US.restext:458 | "**SUCCESS!**"
    value: 'restext://S5Fate2_006'
  # ../.source/TheCostofDisease_Eng_v10.cs:2596
  - type: 'break'
  # ../.source/TheCostofDisease_Eng_v10.cs:2597
  - type: 'text'
    # ../en-US.restext:459 | "With charitable contribut..."
    value: 'restext://S5Fate2_007'
  # ../.source/TheCostofDisease_Eng_v10.cs:2605
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:2607
  - type: 'link'
    # ../en-US.restext:460 | "Succeeded in Building the..."
    label: 'restext://S5Fate2_008'
    target: 'Hospitalintro' # ./00012-Hospitalintro.mws.yaml
    snapshot: true
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:2614
  - type: 'text'
    # ../en-US.restext:455 | "**FAILURE!**"
    value: 'restext://S5Fate2_003'
  # ../.source/TheCostofDisease_Eng_v10.cs:2616
  - type: 'break'
  # ../.source/TheCostofDisease_Eng_v10.cs:2617
  - type: 'text'
    # ../en-US.restext:456 | "With charitable contribut..."
    value: 'restext://S5Fate2_004'
  # ../.source/TheCostofDisease_Eng_v10.cs:2626
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:2628
  - type: 'link'
    # ../en-US.restext:457 | "Failed to Build the Hospital"
    label: 'restext://S5Fate2_005'
    target: 'DevastationIntro' # ./00086-DevastationIntro.mws.yaml
    snapshot: true
