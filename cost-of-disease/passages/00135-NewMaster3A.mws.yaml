# ../.source/TheCostofDisease_Eng_v10.cs:15297
---
format: 'mws/0.4'
passage_id: 'NewMaster3A'
# ../en-US.restext:1311 | "The {_rnd_NewMaster3A_0} ..."
title: 'restext://NewMaster3A_001'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:15299
- type: 'switch'
  on: 'costA'
  cases:
  # ../en-US.restext:129 | "Biology"
  - match: 'restext://Focus_Biology'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15301
    - type: 'assign'
      var: 'cost2A'
      # ../en-US.restext:223 | "Animal"
      expr: '"restext://Masterwork_Type_Animal"'
  # ../en-US.restext:135 | "Engineering"
  - match: 'restext://Focus_Engineering'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15305
    - type: 'assign'
      var: 'cost2A'
      # ../en-US.restext:228 | "Gear"
      expr: '"restext://Masterwork_Type_Gear"'
  # ../en-US.restext:132 | "Chemistry"
  - match: 'restext://Focus_Chemistry'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:15309
    - type: 'assign'
      var: 'cost2A'
      # ../en-US.restext:224 | "Bottle"
      expr: '"restext://Masterwork_Type_Bottle"'
# ../.source/TheCostofDisease_Eng_v10.cs:15313
- type: 'conditional'
  if: '!creationA_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:221 | "Give your creation a new,..."
      value: 'restext://Masterwork_NamePrompt'
    - type: 'input'
      label: ''
      var: 'creationA'
    # ../en-US.restext:358 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'creationA_submitted'
      expr: 'true'
    snapshot: true
    target: 'NewMaster3A' # ./00135-NewMaster3A.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:15330
- type: 'let'
  var: '_rnd_NewMaster3A_0'
  # ../en-US.restext:203 | Masterwork_Adjective_Infamous | "Infamous"
  # ../en-US.restext:212 | Masterwork_Adjective_Transcendent | "Transcendent"
  # ../en-US.restext:207 | Masterwork_Adjective_Monumental | "Monumental"
  # ../en-US.restext:208 | Masterwork_Adjective_Nefarious | "Nefarious"
  # ../en-US.restext:213 | Masterwork_Adjective_Unspeakable | "Unspeakable"
  # ../en-US.restext:205 | Masterwork_Adjective_Legendary | "Legendary"
  # ../en-US.restext:209 | Masterwork_Adjective_Noble | "Noble"
  # ../en-US.restext:210 | Masterwork_Adjective_Phenomenal | "Phenomenal"
  # ../en-US.restext:211 | Masterwork_Adjective_Stunning | "Stunning"
  # ../en-US.restext:206 | Masterwork_Adjective_Masterful | "Masterful"
  # ../en-US.restext:204 | Masterwork_Adjective_Insidious | "Insidious"
  expr: '["restext://Masterwork_Adjective_Infamous", "restext://Masterwork_Adjective_Transcendent", "restext://Masterwork_Adjective_Monumental", "restext://Masterwork_Adjective_Nefarious", "restext://Masterwork_Adjective_Unspeakable", "restext://Masterwork_Adjective_Legendary", "restext://Masterwork_Adjective_Noble", "restext://Masterwork_Adjective_Phenomenal", "restext://Masterwork_Adjective_Stunning", "restext://Masterwork_Adjective_Masterful", "restext://Masterwork_Adjective_Insidious"].shuffled("NewMaster3A_0")[0]'
# ../.source/TheCostofDisease_Eng_v10.cs:15336
- type: 'include_passage'
  target: 'MWCreationHubA' # ./00137-MWCreationHubA.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:15337
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:15339
- type: 'text'
  # ../en-US.restext:246 | "With my own destiny deter..."
  value: 'restext://Narrative_ForgeNewPath'
# ../.source/TheCostofDisease_Eng_v10.cs:15341
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:15345
- type: 'text'
  # ../en-US.restext:214 | "**You may check the cost ..."
  value: 'restext://Masterwork_CheckCostHint'
# ../.source/TheCostofDisease_Eng_v10.cs:15348
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:15350
- type: 'link'
  # ../en-US.restext:39 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
