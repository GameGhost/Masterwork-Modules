# ../.source/TheCostofDisease_Eng_v10.cs:6249
- type: 'conditional'
  if: 'bar1 == 1'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:6251
  - type: 'text'
    # ../en-US.restext:700 | "After a brief excursion t..."
    value: 'restext://bar1_004'
  # ../.source/TheCostofDisease_Eng_v10.cs:6258
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:6260
  - type: 'text'
    # ../en-US.restext:701 | "We both decided to disrob..."
    value: 'restext://bar1_005'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:6265
  - type: 'text'
    # ../en-US.restext:698 | "After a brief excursion t..."
    value: 'restext://bar1_002'
  # ../.source/TheCostofDisease_Eng_v10.cs:6272
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:6274
  - type: 'text'
    # ../en-US.restext:699 | "It was around midnight th..."
    value: 'restext://bar1_003'
# ../.source/TheCostofDisease_Eng_v10.cs:6276
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:6280
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:354 | "Accept"
  okay: 'restext://UIButton_Accept'
  header:
  # ../.source/TheCostofDisease_Eng_v10.cs:6284
  - type: 'image'
    asset: 'image://setup/Creepy_Icon'
    style: 'setup-image'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:6286
  - type: 'text'
    # ../en-US.restext:702 | "Place a {icon:creepy_icon..."
    value: 'restext://bar1_006'
