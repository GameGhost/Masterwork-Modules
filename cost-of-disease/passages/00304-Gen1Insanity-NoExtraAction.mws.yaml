# ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31455
---
format: 'mws/0.4'
passage_id: 'Gen1Insanity-NoExtraAction'
layout: 'narration'
nodes:
# ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31457
- type: 'conditional'
  conditions:
  - if: 'hospsign == gen1sane'
    then:
    # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31460
    - type: 'conditional'
      conditions:
      # ../en-US.restext:27 | "no"
      - if: 'vacation == "restext://Choice_No_Lower"'
        then:
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31464
        - type: 'text'
          # ../en-US.restext:161 | "**More Time Than Ever**"
          value: 'restext://Heading_MoreTimeThanEver'
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31466
        - type: 'break'
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31467
        - type: 'text'
          # ../en-US.restext:245 | "{gen1sane} II's parent ha..."
          value: 'restext://Narrative_Gen1Sane_WorkEthic'
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31472
        - type: 'break'
          style: 'paragraph'
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31474
        - type: 'text'
          # ../en-US.restext:2500 | "And so this matter of adm..."
          value: 'restext://Gen1Insanity_NoExtraAction_003'
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31476
        - type: 'break'
          style: 'paragraph'
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31480
        - type: 'popup'
          layout: 'setup'
          # ../en-US.restext:36 | "Click to continue..."
          label: 'restext://Click_ContinueEllipsis_C'
          target: '${round == 7 ? "Hospital1" : round == 8 ? "Hospital2" : "Hospital3"}'
          # ../en-US.restext:344 | "Close"
          okay: 'restext://UIButton_Close'
          snapshot: true
          header:
          # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31539
          - type: 'image'
            asset: 'image://setup/Self'
            style: 'setup-image'
          content:
          # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31540
          - type: 'break'
          # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31541
          - type: 'text'
            # ../en-US.restext:2501 | "You may immediately retur..."
            value: 'restext://Gen1Insanity_NoExtraAction_004'
      else:
      # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31485
      - type: 'switch'
        on: 'round'
        cases:
        - match: 7
          nodes:
          # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31487
          - type: 'goto'
            target: 'Hospital1' # ./00003-Hospital1.mws.yaml
        - match: 8
          nodes:
          # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31492
          - type: 'goto'
            target: 'Hospital2' # ./00034-Hospital2.mws.yaml
        default:
        # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31498
        - type: 'goto'
          target: 'Hospital3' # ./00035-Hospital3.mws.yaml
  else:
  # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31507
  - type: 'switch'
    on: 'round'
    cases:
    - match: 7
      nodes:
      # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31509
      - type: 'goto'
        target: 'Hospital1' # ./00003-Hospital1.mws.yaml
    - match: 8
      nodes:
      # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31514
      - type: 'goto'
        target: 'Hospital2' # ./00034-Hospital2.mws.yaml
    default:
    # ../../../Reference/ScriptsComplete/TheCostofDisease_Eng_v10.cs:31520
    - type: 'goto'
      target: 'Hospital3' # ./00035-Hospital3.mws.yaml
