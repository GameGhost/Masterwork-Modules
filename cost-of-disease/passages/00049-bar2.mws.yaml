# ../.source/TheCostofDisease_Eng_v10.cs:6319
---
format: 'mws/0.4'
passage_id: 'bar2'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:6324
- type: 'let'
  var: '_rnd_bar2_0'
  expr: 'rand_between(1, 999, "bar2_0")'
# ../.source/TheCostofDisease_Eng_v10.cs:6326
- type: 'let'
  var: '_rnd_bar2_1'
  expr: 'rand_between(1, 999, "bar2_1")'
# ../.source/TheCostofDisease_Eng_v10.cs:6323
- type: 'text'
  # ../en-US.restext:689 | "**SWORN STATEMENT - Case ..."
  value: 'restext://bar2_001'
  lets:
  - '_rnd_bar2_0'
  - '_rnd_bar2_1'
# ../.source/TheCostofDisease_Eng_v10.cs:6329
- type: 'assign'
  var: 'bar2'
  expr: 'rand_between(1, 2, "bar2_2")'
# ../.source/TheCostofDisease_Eng_v10.cs:6331
- type: 'conditional'
  conditions:
  - if: 'bar2 == 1'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:6333
    - type: 'text'
      # ../en-US.restext:693 | "While many first-hand acc..."
      value: 'restext://bar2_005'
    # ../.source/TheCostofDisease_Eng_v10.cs:6334
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:6336
    - type: 'text'
      # ../en-US.restext:694 | "I awoke in the stables be..."
      value: 'restext://bar2_006'
    # ../.source/TheCostofDisease_Eng_v10.cs:6339
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:6341
    - type: 'text'
      # ../en-US.restext:695 | "I would also like to note..."
      value: 'restext://bar2_007'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:6351
  - type: 'text'
    # ../en-US.restext:690 | "I find the accusations to..."
    value: 'restext://bar2_002'
  # ../.source/TheCostofDisease_Eng_v10.cs:6352
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:6354
  - type: 'text'
    # ../en-US.restext:691 | "While I admit to having a..."
    value: 'restext://bar2_003'
  # ../.source/TheCostofDisease_Eng_v10.cs:6355
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:6357
  - type: 'text'
    # ../en-US.restext:692 | "Despite my personal objec..."
    value: 'restext://bar2_004'
# ../.source/TheCostofDisease_Eng_v10.cs:6366
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:6370
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:343 | "Accept"
  okay: 'restext://UIButton_Accept'
  header:
  # ../.source/TheCostofDisease_Eng_v10.cs:6374
  - type: 'image'
    asset: 'image://setup/Creepy_Icon'
    style: 'setup-image'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:6375
  - type: 'break'
  # ../.source/TheCostofDisease_Eng_v10.cs:6376
  - type: 'text'
    # ../en-US.restext:696 | "Place a {icon:creepy_icon..."
    value: 'restext://bar2_008'
