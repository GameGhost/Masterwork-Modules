# ../.source/TheCostofDisease_Eng_v10.cs:19218
---
format: 'mws/0.4'
passage_id: 'DetEffectRandom'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:19220
- type: 'conditional'
  conditions:
  # ../en-US.restext:31 | "yes"
  - if: 'killed == "restext://Choice_Yes_Lower"'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:19222
    - type: 'goto'
      target: 'DeteriorationHub' # ./00090-DeteriorationHub.mws.yaml
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:19228
  - type: 'text'
    # ../en-US.restext:1473 | "**The Effects of Immortal..."
    value: 'restext://DetEffectRandom_001'
  # ../.source/TheCostofDisease_Eng_v10.cs:19229
  - type: 'switch'
    on: 'round'
    cases:
    - match: 16
      nodes:
      # ../.source/TheCostofDisease_Eng_v10.cs:19231
      - type: 'text'
        # ../en-US.restext:1474 | "**- Early Years**"
        value: 'restext://DetEffectRandom_002'
    - match: 17
      nodes:
      # ../.source/TheCostofDisease_Eng_v10.cs:19236
      - type: 'text'
        # ../en-US.restext:1475 | "**- Middle Years**"
        value: 'restext://DetEffectRandom_003'
  # ../.source/TheCostofDisease_Eng_v10.cs:19248
  - type: 'let'
    var: '_rnd_DetEffectRandom_0'
    # ../en-US.restext:1476 | DetEffectRandom_004 | "as a spider held by a thr..."
    # ../en-US.restext:1477 | DetEffectRandom_005 | "as a candle flame amongst..."
    # ../en-US.restext:1478 | DetEffectRandom_006 | "as a pendulous dagger per..."
    expr: '["restext://DetEffectRandom_004", "restext://DetEffectRandom_005", "restext://DetEffectRandom_006"].shuffled("DetEffectRandom_0")[0]'
  # ../.source/TheCostofDisease_Eng_v10.cs:19247
  - type: 'text'
    # ../en-US.restext:1479 | "It cannot be overstated: ..."
    value: 'restext://DetEffectRandom_007'
    lets:
    - '_rnd_DetEffectRandom_0'
  # ../.source/TheCostofDisease_Eng_v10.cs:19249
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:19251
  - type: 'link'
    # ../en-US.restext:1480 | "Click to see the effects..."
    label: 'restext://DetEffectRandom_008'
    target: 'EffectRandomizer' # ./00279-EffectRandomizer.mws.yaml
    snapshot: true
