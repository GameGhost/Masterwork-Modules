# ../en-US.restext:332 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:27579
- type: 'assign'
  var: 'round'
  expr: '19'
# ../.source/TheCostofDisease_Eng_v10.cs:27583
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:356 | "Accept"
  okay: 'restext://UIButton_Accept'
  header:
  # ../.source/TheCostofDisease_Eng_v10.cs:27587
  - type: 'image'
    asset: 'image://setup/AngryMobSetup1'
    style: 'setup-image'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:27589
  - type: 'text'
    # ../en-US.restext:2183 | "Turn to page **10** of th..."
    value: 'restext://University1_001'
  # ../.source/TheCostofDisease_Eng_v10.cs:27596
  - type: 'break'
  # ../.source/TheCostofDisease_Eng_v10.cs:27597
  - type: 'text'
    # ../en-US.restext:103 | "Place the Suspicion Marke..."
    value: 'restext://Directive_PlaceSuspicionMarker_Lead'
  # ../.source/TheCostofDisease_Eng_v10.cs:27600
  - type: 'conditional'
    if: '!University1'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:27602
    - type: 'assign'
      var: 'University1'
      expr: '1'
    # ../.source/TheCostofDisease_Eng_v10.cs:27603
    - type: 'assign'
      var: 'tracker'
      expr: 'tracker + 2'
    # ../.source/TheCostofDisease_Eng_v10.cs:27604
    - type: 'switch'
      on: 'players'
      cases:
      - match: 4
        nodes:
        # ../.source/TheCostofDisease_Eng_v10.cs:27606
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker + 1'
      - match: 5
        nodes:
        # ../.source/TheCostofDisease_Eng_v10.cs:27610
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker + 1'
  # ../.source/TheCostofDisease_Eng_v10.cs:27613
  - type: 'text'
    # ../en-US.restext:2184 | "**{tracker}** and the {ic..."
    value: 'restext://University1_002'
  # ../.source/TheCostofDisease_Eng_v10.cs:27620
  - type: 'conditional'
    if: 'players == 3'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:27622
    - type: 'text'
      # ../en-US.restext:82 | "Then, since this is a 3-p..."
      value: 'restext://Directive_3Player_PassMarker_B'
# ../.source/TheCostofDisease_Eng_v10.cs:27626
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:27630
- type: 'section'
  # ../en-US.restext:171 | "**Nobel Prize in Medicine**"
  title: 'restext://Heading_NobelPrizeInMedicine'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:27638
  - type: 'text'
    # ../en-US.restext:280 | "The scientific world has ..."
    value: 'restext://Narrative_ScientificWorldNotices'
  # ../.source/TheCostofDisease_Eng_v10.cs:27647
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:27649
  - type: 'text'
    # ../en-US.restext:302 | "At the End of the Generat..."
    value: 'restext://Reward_LeastCreepy_NobelPrize_Lose7VP'
# ../.source/TheCostofDisease_Eng_v10.cs:27662
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:27666
- type: 'section'
  # ../en-US.restext:173 | "**Perfect Mental Balance**"
  title: 'restext://Heading_PerfectMentalBalance'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:27674
  - type: 'text'
    # ../en-US.restext:301 | "At the end of the Generat..."
    value: 'restext://Reward_InsanityTrackSpace_5VP'
  # ../.source/TheCostofDisease_Eng_v10.cs:27686
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:27690
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:49 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'UniEquity1' # ./00202-UniEquity1.mws.yaml
    # ../en-US.restext:361 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:307 | "The Early Years of the Th..."
