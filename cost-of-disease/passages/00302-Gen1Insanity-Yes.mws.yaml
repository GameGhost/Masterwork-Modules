# ../.source/TheCostofDisease_Eng_v10.cs:31277
---
format: 'mws/0.4'
passage_id: 'Gen1Insanity-Yes'
# ../en-US.restext:322 | "Absent Parent"
title: 'restext://Title_AbsentParent'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:31279
- type: 'assign'
  var: 'letterSetRandomize'
  expr: '1'
# ../.source/TheCostofDisease_Eng_v10.cs:31280
- type: 'conditional'
  # ../en-US.restext:34 | "yes"
  if: 'vacation == "restext://Choice_Yes_Lower"'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:31289
  - type: 'text'
    # ../en-US.restext:316 | "**Carefully hand this sto..."
    value: 'restext://Storybook_HandToGen1Sane'
  # ../.source/TheCostofDisease_Eng_v10.cs:31302
  - type: 'conditional'
    if: 'Gen1Insanity_YesnextPsg == "" || Gen1Insanity_YesnextPsg == 0'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:31304
    - type: 'assign'
      var: 'Gen1Insanity_YesnextPsg'
      expr: 'rand_between(1, 2, "Gen1Insanity-Yes_0")'
  # ../.source/TheCostofDisease_Eng_v10.cs:31293
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:31295
  - type: 'text'
    # ../en-US.restext:2506 | "An investment in a summer..."
    value: 'restext://Gen1Insanity_Yes_003'
  # ../.source/TheCostofDisease_Eng_v10.cs:31306
  - type: 'assign'
    var: 'instemp'
    expr: 'Gen1Insanity_YesnextPsg'
  # ../.source/TheCostofDisease_Eng_v10.cs:31307
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:31311
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:39 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'Devastation1' # ./00004-Devastation1.mws.yaml
    # ../en-US.restext:357 | "Close"
    okay: 'restext://UIButton_Close'
    snapshot: true
    header:
    - type: 'conditional'
      if: 'instemp == 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:31332
      - type: 'image'
        asset: 'image://setup/MaladjustmentBack'
        style: 'setup-image'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:31340
      - type: 'image'
        asset: 'image://setup/ScoreTrackMarker'
        style: 'setup-image'
    content:
    - type: 'conditional'
      if: 'instemp == 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:31333
      - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:31334
      - type: 'text'
        # ../en-US.restext:91 | "Gain a Maladjustment card..."
        value: 'restext://Directive_GainMaladjustmentCard'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:31341
      - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:31342
      - type: 'text'
        # ../en-US.restext:371 | "Lose 3VP."
        value: 'restext://VP_Lose3'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:31315
  - type: 'goto'
    target: 'Devastation1' # ./00004-Devastation1.mws.yaml
