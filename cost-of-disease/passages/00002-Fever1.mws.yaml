  title: 'restext://Heading_BuildHospital'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:1704
  - type: 'text'
    # ../en-US.restext:188 | "The church can no longer ..."
    value: 'restext://Hospital_ChurchExpansion_Rule'
  # ../.source/TheCostofDisease_Eng_v10.cs:1714
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:1716
  - type: 'text'
    # ../en-US.restext:396 | "At the end of the Generat..."
    value: 'restext://Fever1_009'
# ../.source/TheCostofDisease_Eng_v10.cs:1730
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:1732
- type: 'conditional'
