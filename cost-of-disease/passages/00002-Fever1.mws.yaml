    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:1745
    - type: 'text'
      # ../en-US.restext:287 | "If a player reaches the *..."
      value: 'restext://Resource_CreepyTrack_4thSpace_Lead'
    # ../.source/TheCostofDisease_Eng_v10.cs:1753
    - type: 'link'
      # ../en-US.restext:52 | "click here"
      label: 'restext://Click_Here_Plain'
      target: 'Gen1-CreepyTrack' # ./00177-Gen1-CreepyTrack.mws.yaml
      snapshot: true
  # ../.source/TheCostofDisease_Eng_v10.cs:1755
  - type: 'break'
    style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:1758
- type: 'conditional'
  if: 'sane3 == 0'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:1762
  - type: 'section'
    # ../en-US.restext:162 | "{icon:storybook} **The Ma..."
