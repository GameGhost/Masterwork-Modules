    - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:1658
    - type: 'text'
      # ../en-US.restext:394 | "Retrieve the {icon:s1_hea..."
      value: 'restext://Fever1_005'
    # ../.source/TheCostofDisease_Eng_v10.cs:1672
    - type: 'switch'
      on: 'players'
      cases:
      - match: 2
        nodes:
        # ../.source/TheCostofDisease_Eng_v10.cs:1674
        - type: 'let'
          var: '_rnd_Fever1_0'
          expr: '[nameA, nameB].shuffled("Fever1_0")[0]'
      - match: 3
        nodes:
        # ../.source/TheCostofDisease_Eng_v10.cs:1678
        - type: 'let'
          var: '_rnd_Fever1_0'
          expr: '[nameA, nameB, nameC].shuffled("Fever1_1")[0]'
      - match: 4
        nodes:
        # ../.source/TheCostofDisease_Eng_v10.cs:1682
        - type: 'let'
          var: '_rnd_Fever1_0'
          expr: '[nameA, nameB, nameC, nameD].shuffled("Fever1_2")[0]'
      - match: 5
        nodes:
        # ../.source/TheCostofDisease_Eng_v10.cs:1686
        - type: 'let'
          var: '_rnd_Fever1_0'
          expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("Fever1_3")[0]'
    # ../.source/TheCostofDisease_Eng_v10.cs:1662
    - type: 'break'
    - type: 'text'
      # ../en-US.restext:395 | "Give the **Start Player**..."
      value: 'restext://Fever1_006'
      lets:
      - '_rnd_Fever1_0'
# ../.source/TheCostofDisease_Eng_v10.cs:1692
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:1696
- type: 'section'
