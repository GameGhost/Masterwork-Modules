    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/TheCostofDisease_Eng_v10.cs:1635
    - type: 'image'
      asset: 'image://setup/StartPlayerToken'
      style: 'setup-image'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:1638
    - type: 'text'
      # ../en-US.restext:393 | "Turn to **The Cost of Dis..."
      value: 'restext://Fever1_004'
