    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:1771
    - type: 'text'
      # ../en-US.restext:298 | "If a player reaches the *..."
      value: 'restext://Resource_InsanityTrack_3rdSpace_Lead'
    # ../.source/TheCostofDisease_Eng_v10.cs:1779
    - type: 'link'
      # ../en-US.restext:51 | "click here."
      label: 'restext://Click_Here_Period'
      target: 'Gen1-SanityTrack' # ./00178-Gen1-SanityTrack.mws.yaml
      snapshot: true
# ../.source/TheCostofDisease_Eng_v10.cs:1782
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:1786
- type: 'section'
  # ../en-US.restext:149 | "**Second round Event - El..."
  title: 'restext://Heading_ElectionSeason'
  style: 'hub-card'
  content:
  # ../.source/TheCostofDisease_Eng_v10.cs:1794
  - type: 'text'
    # ../en-US.restext:115 | "Political pandering may r..."
    value: 'restext://Election_PanderingFlavor'
  # ../.source/TheCostofDisease_Eng_v10.cs:1797
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:1801
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:397 | "Click here to continue to..."
    label: 'restext://Fever1_017'
    target: 'FeverServe1' # ./00066-FeverServe1.mws.yaml
    # ../en-US.restext:360 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '1'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:398 | "The Early Years of the Fi..."
      value: 'restext://Fever1_019'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:313 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
