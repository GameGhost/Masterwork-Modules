# ../.source/TheCostofDisease_Eng_v10.cs:21858
---
format: 'mws/0.4'
passage_id: 'DiseaseEffect'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:21860
- type: 'assign'
  var: 'tempdisease'
  expr: 'rand_between(1, 2, "DiseaseEffect_0")'
# ../.source/TheCostofDisease_Eng_v10.cs:21863
- type: 'conditional'
  conditions:
  - if: 'tempdisease == 1'
    then:
    # ../.source/TheCostofDisease_Eng_v10.cs:21867
    - type: 'text'
      # ../en-US.restext:1680 | "**A Continuing Malady**"
      value: 'restext://DiseaseEffect_005'
    # ../.source/TheCostofDisease_Eng_v10.cs:21869
    - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:21870
    - type: 'text'
      # ../en-US.restext:1681 | "It appeared that the effe..."
      value: 'restext://DiseaseEffect_006'
    # ../.source/TheCostofDisease_Eng_v10.cs:21873
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:21877
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:36 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: 'DevastationFate1'
      # ../en-US.restext:344 | "Close"
      okay: 'restext://UIButton_Close' # ./00107-DevastationFate1.mws.yaml
      snapshot: true
      header:
      # ../.source/TheCostofDisease_Eng_v10.cs:21911
      - type: 'image'
        asset: 'image://setup/MaladjustmentBack'
        style: 'setup-image'
      content:
      # ../.source/TheCostofDisease_Eng_v10.cs:21912
      - type: 'break'
      # ../.source/TheCostofDisease_Eng_v10.cs:21913
      - type: 'text'
        # ../en-US.restext:1682 | "Any player who did not co..."
        value: 'restext://DiseaseEffect_007'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:21884
  - type: 'text'
    # ../en-US.restext:1676 | "**Not Passed Down**"
    value: 'restext://DiseaseEffect_001'
  # ../.source/TheCostofDisease_Eng_v10.cs:21886
  - type: 'break'
  # ../.source/TheCostofDisease_Eng_v10.cs:21887
  - type: 'text'
    # ../en-US.restext:1677 | "Twenty years passed witho..."
    value: 'restext://DiseaseEffect_002'
  # ../.source/TheCostofDisease_Eng_v10.cs:21888
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:21890
