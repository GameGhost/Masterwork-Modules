# ../.source/TheCostofDisease_Eng_v10.cs:19732
---
format: 'mws/0.4'
passage_id: 'GloomyGothic1'
# ../en-US.restext:347 | "A Taste of Evil"
title: 'restext://Title_TasteOfEvil'
# ../en-US.restext:331 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'checkinfinal'
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:19739
- type: 'assign'
  var: 'round'
  expr: '10'
# ../.source/TheCostofDisease_Eng_v10.cs:19741
- type: 'conditional'
  if: '!gen3pg'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:19745
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:355 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/TheCostofDisease_Eng_v10.cs:19749
    - type: 'image'
      asset: 'image://setup/StartPlayerToken'
      style: 'setup-image'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:19751
    - type: 'conditional'
      # ../en-US.restext:117 | "Fraternity of Hunters"
      if: 'society == "restext://Faction_FraternityOfHunters_Plain"'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:19755
      - type: 'text'
        # ../en-US.restext:1526 | "**Turn to Page 16 of the ..."
        value: 'restext://GloomyGothic1_003'
      # ../.source/TheCostofDisease_Eng_v10.cs:19762
      - type: 'conditional'
        if: 'players == 3'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:19764
        - type: 'text'
          # ../en-US.restext:76 | "Then, since this is a 3 p..."
          value: 'restext://Directive_3Player_PassMarker_A'
      else:
      # ../.source/TheCostofDisease_Eng_v10.cs:19773
      - type: 'text'
        # ../en-US.restext:1525 | "**Turn to Page 18 of the ..."
        value: 'restext://GloomyGothic1_002'
      # ../.source/TheCostofDisease_Eng_v10.cs:19785
      - type: 'conditional'
        if: 'players == 3'
        then:
        # ../.source/TheCostofDisease_Eng_v10.cs:19787
        - type: 'text'
          # ../en-US.restext:76 | "Then, since this is a 3 p..."
          value: 'restext://Directive_3Player_PassMarker_A'
    # ../.source/TheCostofDisease_Eng_v10.cs:19791
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:19793
    - type: 'conditional'
      if: 'exposeA <= 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:19795
      - type: 'text'
        # ../en-US.restext:99 | "Place the {ba} tile over ..."
        value: 'restext://Directive_PlaceTile_A'
      # ../.source/TheCostofDisease_Eng_v10.cs:19798
      - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:19800
    - type: 'conditional'
      if: 'exposeB <= 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:19802
      - type: 'text'
        # ../en-US.restext:100 | "Place the {bb} tile over ..."
        value: 'restext://Directive_PlaceTile_B'
      # ../.source/TheCostofDisease_Eng_v10.cs:19805
      - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:19807
    - type: 'conditional'
      if: 'exposeC <= 1'
      then:
      # ../.source/TheCostofDisease_Eng_v10.cs:19809
      - type: 'text'
        # ../en-US.restext:101 | "Place the {bc} tile over ..."
        value: 'restext://Directive_PlaceTile_C'
      # ../.source/TheCostofDisease_Eng_v10.cs:19812
      - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:19814
    - type: 'break'
    # ../.source/TheCostofDisease_Eng_v10.cs:19815
    - type: 'text'
      # ../en-US.restext:1527 | "Return all other Building..."
      value: 'restext://GloomyGothic1_007'
# ../.source/TheCostofDisease_Eng_v10.cs:19818
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:19820
- type: 'conditional'
  # ../en-US.restext:117 | "Fraternity of Hunters"
  if: 'society == "restext://Faction_FraternityOfHunters_Plain"'
  then:
  # ../.source/TheCostofDisease_Eng_v10.cs:19825
  - type: 'section'
    # ../en-US.restext:157 | "**The Hunter's Rest**"
    title: 'restext://Heading_HuntersRest'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:19833
    - type: 'text'
      # ../en-US.restext:1528 | "You may only place a Serv..."
      value: 'restext://GloomyGothic1_016'
  # ../.source/TheCostofDisease_Eng_v10.cs:19841
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:19846
  - type: 'section'
    # ../en-US.restext:180 | "**Taxation**"
    title: 'restext://Heading_Taxation'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:19854
    - type: 'text'
      # ../en-US.restext:194 | "At the end of each round,..."
      value: 'restext://HuntersRest_PenaltyRule'
    # ../.source/TheCostofDisease_Eng_v10.cs:19861
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:19865
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:48 | "Click at the end of the r..."
      label: 'restext://Click_EndRound_Continue'
      target: 'GloomyPenalty1' # ./00306-GloomyPenalty1.mws.yaml
      # ../en-US.restext:360 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '7'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:306 | "The Early Years of the Th..."
        value: 'restext://Round_GenerationIII_EarlyEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:313 | "Then, perform all Start o..."
        value: 'restext://Round_StartMiddleYears_Rule'
  else:
  # ../.source/TheCostofDisease_Eng_v10.cs:19888
  - type: 'section'
    # ../en-US.restext:164 | "{icon:storybook} **Master..."
    title: 'restext://Heading_MasterworkCompletion'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:19897
    - type: 'text'
      # ../en-US.restext:218 | "When a player completes t..."
      value: 'restext://Masterwork_CompleteLead'
    # ../.source/TheCostofDisease_Eng_v10.cs:19898
    - type: 'link'
      # ../en-US.restext:61 | "click here for a special ..."
      label: 'restext://Click_SpecialMessage_Order'
      target: 'MWTokenResolve' # ./00229-MWTokenResolve.mws.yaml
      snapshot: true
  # ../.source/TheCostofDisease_Eng_v10.cs:19900
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:19904
  - type: 'section'
    # ../en-US.restext:167 | "**MONSTER SPAWN**"
    title: 'restext://Heading_MonsterSpawn'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:19912
    - type: 'text'
      # ../en-US.restext:276 | "The Town Hall of the vill..."
      value: 'restext://Narrative_MonsterSpawn_Flavor'
  # ../.source/TheCostofDisease_Eng_v10.cs:19920
  - type: 'break'
    style: 'paragraph'
  # ../.source/TheCostofDisease_Eng_v10.cs:19924
  - type: 'section'
    # ../en-US.restext:155 | "**A Gift of Spawning**"
    title: 'restext://Heading_GiftOfSpawning'
    style: 'hub-card'
    content:
    # ../.source/TheCostofDisease_Eng_v10.cs:19932
    - type: 'text'
      # ../en-US.restext:303 | "At the end of the Generat..."
      value: 'restext://Reward_MostOccultExperiments_SpawningPods'
    # ../.source/TheCostofDisease_Eng_v10.cs:19943
    - type: 'break'
      style: 'paragraph'
    # ../.source/TheCostofDisease_Eng_v10.cs:19947
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:48 | "Click at the end of the r..."
      label: 'restext://Click_EndRound_Continue'
      target: 'WolvesEvil1' # ./00187-WolvesEvil1.mws.yaml
      # ../en-US.restext:360 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '7'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:306 | "The Early Years of the Th..."
        value: 'restext://Round_GenerationIII_EarlyEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:313 | "Then, perform all Start o..."
        value: 'restext://Round_StartMiddleYears_Rule'
