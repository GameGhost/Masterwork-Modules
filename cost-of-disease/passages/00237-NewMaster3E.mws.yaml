# ../.source/TheCostofDisease_Eng_v10.cs:26129
---
format: 'mws/0.4'
passage_id: 'NewMaster3E'
layout: 'narration'
nodes:
# ../.source/TheCostofDisease_Eng_v10.cs:26131
- type: 'switch'
  on: 'costE'
  cases:
  # ../en-US.restext:118 | "Biology"
  - match: 'restext://Focus_Biology'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:26133
    - type: 'assign'
      var: 'cost2E'
      # ../en-US.restext:216 | "Animal"
      expr: '"restext://Masterwork_Type_Animal"'
  # ../en-US.restext:124 | "Engineering"
  - match: 'restext://Focus_Engineering'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:26137
    - type: 'assign'
      var: 'cost2E'
      # ../en-US.restext:221 | "Gear"
      expr: '"restext://Masterwork_Type_Gear"'
  # ../en-US.restext:121 | "Chemistry"
  - match: 'restext://Focus_Chemistry'
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:26141
    - type: 'assign'
      var: 'cost2E'
      # ../en-US.restext:217 | "Bottle"
      expr: '"restext://Masterwork_Type_Bottle"'
# ../.source/TheCostofDisease_Eng_v10.cs:26145
- type: 'conditional'
  if: '!creationE_submitted'
  then:
  - type: 'popup'
    layout: 'input-popup'
    content:
    - type: 'text'
      # ../en-US.restext:214 | "Give your creation a new,..."
      value: 'restext://Masterwork_NamePrompt'
    - type: 'input'
      label: ''
      var: 'creationE'
    # ../en-US.restext:347 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'creationE_submitted'
      expr: 'true'
    snapshot: true
    target: 'NewMaster3E' # ./00237-NewMaster3E.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:26161
- type: 'let'
  var: '_rnd_NewMaster3E_0'
  # ../en-US.restext:196 | Masterwork_Adjective_Infamous | "Infamous"
  # ../en-US.restext:205 | Masterwork_Adjective_Transcendent | "Transcendent"
  # ../en-US.restext:200 | Masterwork_Adjective_Monumental | "Monumental"
  # ../en-US.restext:201 | Masterwork_Adjective_Nefarious | "Nefarious"
  # ../en-US.restext:206 | Masterwork_Adjective_Unspeakable | "Unspeakable"
  # ../en-US.restext:198 | Masterwork_Adjective_Legendary | "Legendary"
  # ../en-US.restext:202 | Masterwork_Adjective_Noble | "Noble"
  # ../en-US.restext:203 | Masterwork_Adjective_Phenomenal | "Phenomenal"
  # ../en-US.restext:204 | Masterwork_Adjective_Stunning | "Stunning"
  # ../en-US.restext:199 | Masterwork_Adjective_Masterful | "Masterful"
  # ../en-US.restext:197 | Masterwork_Adjective_Insidious | "Insidious"
  expr: '["restext://Masterwork_Adjective_Infamous", "restext://Masterwork_Adjective_Transcendent", "restext://Masterwork_Adjective_Monumental", "restext://Masterwork_Adjective_Nefarious", "restext://Masterwork_Adjective_Unspeakable", "restext://Masterwork_Adjective_Legendary", "restext://Masterwork_Adjective_Noble", "restext://Masterwork_Adjective_Phenomenal", "restext://Masterwork_Adjective_Stunning", "restext://Masterwork_Adjective_Masterful", "restext://Masterwork_Adjective_Insidious"].shuffled("NewMaster3E_0")[0]'
# ../.source/TheCostofDisease_Eng_v10.cs:26160
- type: 'text'
  # ../en-US.restext:2062 | "**The {_rnd_NewMaster3E_0..."
  value: 'restext://NewMaster3E_001'
  lets:
  - '_rnd_NewMaster3E_0'
# ../.source/TheCostofDisease_Eng_v10.cs:26165
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:26167
- type: 'include_passage'
  target: 'MWCreationHubE' # ./00238-MWCreationHubE.mws.yaml
# ../.source/TheCostofDisease_Eng_v10.cs:26168
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:26170
- type: 'text'
  # ../en-US.restext:239 | "With my own destiny deter..."
  value: 'restext://Narrative_ForgeNewPath'
# ../.source/TheCostofDisease_Eng_v10.cs:26172
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:26176
- type: 'text'
  # ../en-US.restext:207 | "**You may check the cost ..."
  value: 'restext://Masterwork_CheckCostHint'
# ../.source/TheCostofDisease_Eng_v10.cs:26179
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:26181
- type: 'link'
  # ../en-US.restext:36 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: 'NewMHub' # ./00149-NewMHub.mws.yaml
  snapshot: true
