# No chrome regions needed — the bracket-cornered card + fixed-size input visual treatment
# (screenshot: Module-11) lives entirely in style.css against .mws-popup-overlay.layout-prompt.
# Named `prompt`, not `input` — `input` is already a node type name (format spec §6), and this
# layout's own content always includes an `input` node in its `content:` list; keeping the two
# distinct avoids "input the layout" vs. "input the node" ambiguity in prose/comments elsewhere.
format: 'mws/0.4'
layout_id: 'prompt'
