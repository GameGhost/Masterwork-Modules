# Same shape as narration.mws.yaml — only the border asset differs (narration_intro.png's ornate
# gold Celtic-knot border vs. narration_normal.png). Both the outer frame and the parchment panel
# are CSS border-image pseudo-elements now, not image nodes — see narration.mws.yaml and style.css
# for the full reasoning. See narration.mws.yaml for the progress-bar mechanism's own comment.
format: 'mws/0.4'
layout_id: 'introduction'
header:
# cost-of-disease-specific: see layouts/narration.mws.yaml's own identical comment — roundNum is
# derived from the extractor's _ProgressRound (0-based rounds-completed count) rather than being a
# real module variable, and min(..., 9) clamps post-round-9 narration to a full bar. Reproduced by
# scripts/apply-template.ps1 -ProgressVariable _ProgressRound — re-running it regenerates this
# exact block.
- type: 'let'
  var: 'roundNum'
  expr: 'min(_ProgressRound + 1, 9)'
- type: 'image'
  asset: 'image://backgrounds/leather_large'
  style: 'layer-bg'
footer:
- type: 'switch'
  on: 'roundNum'
  cases:
  - match: 1
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-1'
  - match: 2
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-2'
  - match: 3
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-3'
  - match: 4
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-4'
  - match: 5
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-5'
  - match: 6
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-6'
  - match: 7
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-7'
  - match: 8
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-8'
  - match: 9
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-9'
- type: 'conditional'
  if: 'roundNum == 1'
  then:
  - type: 'image'
    asset: 'image://progress/I1-glow'
    style: 'progress-label-1'
  else:
  - type: 'conditional'
    if: 'roundNum > 1'
    then:
    - type: 'image'
      asset: 'image://progress/I1-diffuse'
      style: 'progress-label-1'
- type: 'conditional'
  if: 'roundNum == 2'
  then:
  - type: 'image'
    asset: 'image://progress/I2-glow'
    style: 'progress-label-2'
  else:
  - type: 'conditional'
    if: 'roundNum > 2'
    then:
    - type: 'image'
      asset: 'image://progress/I2-diffuse'
      style: 'progress-label-2'
- type: 'conditional'
  if: 'roundNum == 3'
  then:
  - type: 'image'
    asset: 'image://progress/I3-glow'
    style: 'progress-label-3'
  else:
  - type: 'conditional'
    if: 'roundNum > 3'
    then:
    - type: 'image'
      asset: 'image://progress/I3-diffuse'
      style: 'progress-label-3'
- type: 'conditional'
  if: 'roundNum == 4'
  then:
  - type: 'image'
    asset: 'image://progress/II1-glow'
    style: 'progress-label-4'
  else:
  - type: 'conditional'
    if: 'roundNum > 4'
    then:
    - type: 'image'
      asset: 'image://progress/II1-diffuse'
      style: 'progress-label-4'
- type: 'conditional'
  if: 'roundNum == 5'
  then:
  - type: 'image'
    asset: 'image://progress/II2-glow'
    style: 'progress-label-5'
  else:
  - type: 'conditional'
    if: 'roundNum > 5'
    then:
    - type: 'image'
      asset: 'image://progress/II2-diffuse'
      style: 'progress-label-5'
- type: 'conditional'
  if: 'roundNum == 6'
  then:
  - type: 'image'
    asset: 'image://progress/II3-glow'
    style: 'progress-label-6'
  else:
  - type: 'conditional'
    if: 'roundNum > 6'
    then:
    - type: 'image'
      asset: 'image://progress/II3-diffuse'
      style: 'progress-label-6'
- type: 'conditional'
  if: 'roundNum == 7'
  then:
  - type: 'image'
    asset: 'image://progress/III1-glow'
    style: 'progress-label-7'
  else:
  - type: 'conditional'
    if: 'roundNum > 7'
    then:
    - type: 'image'
      asset: 'image://progress/III1-diffuse'
      style: 'progress-label-7'
- type: 'conditional'
  if: 'roundNum == 8'
  then:
  - type: 'image'
    asset: 'image://progress/III2-glow'
    style: 'progress-label-8'
  else:
  - type: 'conditional'
    if: 'roundNum > 8'
    then:
    - type: 'image'
      asset: 'image://progress/III2-diffuse'
      style: 'progress-label-8'
- type: 'conditional'
  if: 'roundNum == 9'
  then:
  - type: 'image'
    asset: 'image://progress/III3-glow'
    style: 'progress-label-9'
