id: 'renegade.cost_of_disease'
version: '0.2.4'
languages:
  - 'en-US'
title: 
  - en-US: 'The Cost of Disease'
description: 
  - en-US: 'The Yellow Fever had struck the village, and for several weeks any visit to its somber limits forced the young heirs to keep a cloth handkerchief about their mouth and nostrils to protect from the miasma. While they were remiss to admit it, this seemed the perfect macabre backdrop in which to advance their father''s dreadful business.'
thumbnail:
  image: 'image://scenario_tile_tcod'
info:
  players-min: 2
  players-max: 4
  playtime: 
  - en-US: '180 minutes'
entry: 'Setup_01_PlayerCountSelect'

# Extractor-owned passages vs. hand-maintained ones. Base passages load first; passage_overrides
# load after and win on a matching passage_id (new IDs are simply added). Re-running the extractor
# only touches passages/, so hand-authored content here always survives a re-extraction.
passages: 'passages'
passages_override: 'passages-override'

# This module's own visual styling — the app's chrome only emits structural class hooks
# (layout-{value}, style-{value}); everything those hooks actually look like lives here.
style: 'assets/style.css'

# Standalone module — no dependencies field/mechanism exists yet for a real shared asset pack
# (masterwork-plan Q27). For now, my-fathers-work-template's layouts/style.css/fonts/etc. are
# applied by direct copy (see README.md's Layout table) rather than a runtime dependency.
dependencies: []

