  value: 'restext://END_NoUniGood_002'
# ../.source/TheCostofDisease_Eng_v10.cs:3290
- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:3292
- type: 'text'
  # ../en-US.restext:515 | "The family that commissio..."
