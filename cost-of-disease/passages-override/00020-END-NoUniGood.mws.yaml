- type: 'break'
  style: 'paragraph'
# ../.source/TheCostofDisease_Eng_v10.cs:3302
- type: 'switch'
  on: 'peeps'
  cases:
  - match: 0
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:3304
    - type: 'text'
      # ../en-US.restext:518 | "With the introduction of ..."
      value: 'restext://END_NoUniGood_006'
  - match: 1
    nodes:
    # ../.source/TheCostofDisease_Eng_v10.cs:3310
    - type: 'text'
      # ../en-US.restext:519 | "While we do not have hope..."
      value: 'restext://END_NoUniGood_007'
# ../.source/TheCostofDisease_Eng_v10.cs:3312
- type: 'text'
  # ../en-US.restext:520 | " The eccentric and infamo..."
