# Override — extracted content unchanged, plus an appended "Ending Unlocked" acknowledgement
# popup (matches the reference app's ViewShareEnding.OpenSharePopupMenu, reached via
# ViewGenerationEnding's generation-end flow — Assets/Scripts/UI/ViewShareEnding.cs). The image
# asset is picked directly here per the user's preference (not any shared good/bad/per-module
# selection mechanism the reference app doesn't actually use either — ViewShareEnding just
# indexes photoclipImages by which of the 3 modules is playing, not by ending). record nodes are
# forward-compatible placeholders for the Phase-3 achievement engine (currently a no-op — see
# RecordNode's own doc comment); the "N of M endings" count is deferred until that lands, so this
# popup only shows the ending-specific message.
# ../.source/TheCostofDisease_Eng_v10.cs:3280
---
format: 'mws/0.4'
passage_id: 'END-NoUniGood'
# ../en-US.restext:513 | "A Legacy Will Live On"
title: 'restext://END_NoUniGood_001'
layout: 'narration'
nodes:
