# Masterwork-authored passage (not extractor output) — replaces the reference app's native
# ViewScoreEntry UI (Assets/Scripts/UI/ViewScoreEntry.cs), reached via Scoring's
# ChangeView(ViewController.instance.scoreEntry) link, now extracted as a plain navigation link
# to this fixed passage id (see PassageBodyVisitor's ChangeView handling). Gathers each player's
# final score into the existing (previously dead) scoreA-D session variables, then routes
# straight to Ranking if there's a single top score, or TieBreaker1 if two or more players are
# tied for it — matching ViewScoreEntry.OnContinueButton's own branch. See
# Masterwork-Design/Reference/Screenshots/Score and Ending/ for the reference layout this and
# _TieBreaker1.mws.yaml/_TieBreaker2.mws.yaml (sharing the score_panel layout) are modeled on.
---
format: 'mws/0.4'
passage_id: 'ScoreEntry'
title: 'Score Entry'
layout: 'score_panel'
nodes:
- type: 'text'
  value: 'Player'
  style: 'player-heading'
- type: 'text'
  value: 'Score'
  style: 'score-heading'
- type: 'break'
- type: 'text'
  value: '{nameA}'
  style: 'player-label'
- type: 'input'
  style: 'score-input'
  var: 'scoreA'
  min: 0
- type: 'break'
- type: 'text'
  value: '{nameB}'
  style: 'player-label'
- type: 'input'
  style: 'score-input'
  var: 'scoreB'
  min: 0
- type: 'conditional'
  if: 'players >= 3'
  then:
  - type: 'break'
  - type: 'text'
    value: '{nameC}'
    style: 'player-label'
  - type: 'input'
    style: 'score-input'
    var: 'scoreC'
    min: 0
- type: 'conditional'
  if: 'players >= 4'
  then:
  - type: 'break'
  - type: 'text'
    value: '{nameD}'
    style: 'player-label'
  - type: 'input'
    style: 'score-input'
    var: 'scoreD'
    min: 0
- type: 'break'
- type: 'link'
  label: 'Continue'
  snapshot: true
  target: '${winnerCount == 1 ? "Ranking" : "TieBreaker1"}'
  onclick:
  - type: 'let'
    var: 'max_score'
    expr: 'max(scoreA, scoreB, scoreC, scoreD)'
  - type: 'conditional'
    if: 'scoreA == max_score'
    then:
    - type: 'assign'
      var: 'winnerA'
      expr: 'true'
    - type: 'assign'
      var: 'winnerCount'
      expr: 'winnerCount + 1'
  - type: 'conditional'
    if: 'scoreB == max_score'
    then:
    - type: 'assign'
      var: 'winnerB'
      expr: 'true'
    - type: 'assign'
      var: 'winnerCount'
      expr: 'winnerCount + 1'
  - type: 'conditional'
    if: 'players >= 3 && scoreC == max_score'
    then:
    - type: 'assign'
      var: 'winnerC'
      expr: 'true'
    - type: 'assign'
      var: 'winnerCount'
      expr: 'winnerCount + 1'
  - type: 'conditional'
    if: 'players >= 4 && scoreD == max_score'
    then:
    - type: 'assign'
      var: 'winnerD'
      expr: 'true'
    - type: 'assign'
      var: 'winnerCount'
      expr: 'winnerCount + 1'
