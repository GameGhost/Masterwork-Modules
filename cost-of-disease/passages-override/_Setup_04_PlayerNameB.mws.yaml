# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Same self-navigating input pattern as Setup_03_PlayerNameA; routing after the greeting mirrors the
# extracted NameEntryB passage's own players>2 branch (passages/00077-NameEntryB.mws.yaml).
---
format: 'mws/0.4'
passage_id: 'Setup_04_PlayerNameB'
layout: 'setup_player_names'
nodes:
- type: 'conditional'
  if: 'nameB == ""'
  then:
  - type: 'text'
    value: '{icon:ExclamationPointIcon} **Carefully pass the storybook to Player B**'
    style: 'info-block'
  - type: 'break'
    style: 'paragraph'
  - type: 'input'
    label: 'Player B - Please enter your given name:'
    var: 'nameB'
  - type: 'link'
    label: 'Continue'
    target: 'Setup_04_PlayerNameB'
    snapshot: false
  else:
  - type: 'let'
    var: 'nameGreeting'
    expr: '["Welcome to My Father''s Work,", "Greetings and welcome to My Father''s Work,", "We are delighted to receive you,", "Welcome, dear sibling,"].shuffled("Setup04Greeting")[0]'
  - type: 'text'
    value: '{nameGreeting}'
  - type: 'break'
  - type: 'text'
    value: '{nameB}'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'Our warmest regards.'
  - type: 'break'
    style: 'paragraph'
  - type: 'conditional'
    if: 'players > 2'
    then:
    - type: 'link'
      label: 'Continue'
      target: 'Setup_05_PlayerNameC'
      snapshot: false
    else:
    - type: 'link'
      label: 'Continue'
      target: 'Setup_07_TownNameEntry'
      snapshot: false