# Masterwork-authored passage (not extractor output) — replaces the reference app's native
# ViewTieBreaker UI's first round (Assets/Scripts/UI/ViewTieBreaker.cs, OnTieBreaker1/
# OnContinueButton's isTieBreaker1 branch). Reached from _ScoreEntry.mws.yaml when 2+ players
# share the top score. Shows only the tied players (scoreX == max_score, computed on
# _ScoreEntry.mws.yaml's Continue and still live as a let var), each with a self-reported
# "completed their Masterwork" checkbox. Zero checked -> family win; exactly one checked -> that
# player wins outright (+1 score bump, matching ViewTieBreaker.cs); two or more checked -> a
# second tie-break round (_TieBreaker2.mws.yaml).
---
format: 'mws/0.4'
passage_id: 'TieBreaker1'
title: 'Tie Breaker'
subtitle: 'Masterwork Completed'
layout: 'score_panel'
nodes:
- type: 'text'
  value: 'Player'
  style: 'player-heading'
- type: 'text'
  value: 'Completed Masterwork'
  style: 'score-heading'
- type: 'break'
- type: 'let'
  var: 'needs_break'
  expr: 'false'
- type: 'conditional'
  if: 'winnerA'
  then:
  - type: 'text'
    value: '{nameA}'
    style: 'player-label'
  - type: 'input'
    style: 'check-input'
    var: 'score_mwA'
  - type: 'let'
    var: 'needs_break'
    expr: 'true'
- type: 'conditional'
  if: 'winnerB'
  then:
  - type: 'conditional'
    if: 'needs_break'
    then:
    - type: 'break'
  - type: 'text'
    value: '{nameB}'
    style: 'player-label'
  - type: 'input'
    style: 'check-input'
    var: 'score_mwB'
  - type: 'let'
    var: 'needs_break'
    expr: 'true'
- type: 'conditional'
  if: 'winnerC'
  then:
  - type: 'conditional'
    if: 'needs_break'
    then:
    - type: 'break'
  - type: 'text'
    value: '{nameC}'
    style: 'player-label'
  - type: 'input'
    style: 'check-input'
    var: 'score_mwC'
  - type: 'let'
    var: 'needs_break'
    expr: 'true'
- type: 'conditional'
  if: 'winnerD'
  then:
  - type: 'conditional'
    if: 'needs_break'
    then:
    - type: 'break'
  - type: 'text'
    value: '{nameD}'
    style: 'player-label'
  - type: 'input'
    style: 'check-input'
    var: 'score_mwD'
- type: 'break'
- type: 'link'
  label: 'Continue'
  onclick:
  - type: 'let'
    var: 'checked_count'
    expr: '(score_mwA ? 1 : 0) + (score_mwB ? 1 : 0) + (score_mwC ? 1 : 0) + (score_mwD ? 1 : 0)'
  - type: 'conditional'
    if: 'checked_count > 0'
    then:
    - type: 'conditional'
      if: 'winnerA && !score_mwA'
      then:
      - type: 'assign'
        var: 'winnerA'
        expr: 'false'
      - type: 'assign'
        var: 'winnerCount'
        expr: 'winnerCount - 1'
    - type: 'conditional'
      if: 'winnerB && !score_mwB'
      then:
      - type: 'assign'
        var: 'winnerB'
        expr: 'false'
      - type: 'assign'
        var: 'winnerCount'
        expr: 'winnerCount - 1'
    - type: 'conditional'
      if: 'winnerC && !score_mwC'
      then:
      - type: 'assign'
        var: 'winnerC'
        expr: 'false'
      - type: 'assign'
        var: 'winnerCount'
        expr: 'winnerCount - 1'
    - type: 'conditional'
      if: 'winnerD && !score_mwD'
      then:
      - type: 'assign'
        var: 'winnerD'
        expr: 'false'
      - type: 'assign'
        var: 'winnerCount'
        expr: 'winnerCount - 1'
  - type: 'conditional'
    if: 'winnerCount == 1'
    then:
    - type: 'goto'
      target: 'Ranking'
      snapshot: true
    else:
    - type: 'goto'
      target: 'TieBreaker2'
      snapshot: false