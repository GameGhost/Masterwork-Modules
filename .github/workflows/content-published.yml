name: Redeploy the app sites

# A pushed catalog is a published one: the app sites serve their content from a copy deployed beside
# them, so ask the Masterwork repo to redeploy, which stages this catalog and its packages.
#
# Needs the MASTERWORK_DISPATCH_TOKEN secret: a fine-grained token for GameGhost/Masterwork with
# Contents read and write (which is what a repository dispatch requires).

on:
  push:
    branches: [main, phase6]
    paths:
      - ".catalog/**"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send content-published to Masterwork
        env:
          GH_TOKEN: ${{ secrets.MASTERWORK_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The MASTERWORK_DISPATCH_TOKEN secret isn't set, so the app sites weren't redeployed."
            exit 1
          fi
          gh api repos/GameGhost/Masterwork/dispatches \
            -f event_type=content-published \
            -f "client_payload[ref]=$GITHUB_REF_NAME" \
            -f "client_payload[sha]=$GITHUB_SHA"
          echo "Asked Masterwork to redeploy for $GITHUB_REF_NAME at $GITHUB_SHA." | tee -a "$GITHUB_STEP_SUMMARY"
