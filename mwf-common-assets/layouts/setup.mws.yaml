# No chrome regions needed — the parchment/icon-pin visual treatment (screenshot: Module-04,
# "Dubious Bartering" popup) lives entirely in style.css against .mws-popup-overlay.layout-setup.
# This is the real, widely-used-across-modules instructional popup — copied here from
# cost-of-disease, not template-specific — so this layout_id must stay exactly `setup`, matching
# every other module. The passage-level player-count/name/town-entry chrome is `player_setup`
# instead (layouts/player_setup.mws.yaml) specifically so it doesn't collide with this one — layout
# chrome is looked up purely by string regardless of whether a passage or a popup uses it (format
# spec §8), so the two names must stay distinct even though this template briefly (incorrectly)
# named the popup `setup_info` to work around that collision from the wrong side. Empty chrome file
# kept for discoverability, matching the convention already established by layouts/choice.mws.yaml.
format: 'mws/0.4'
layout_id: 'setup'
