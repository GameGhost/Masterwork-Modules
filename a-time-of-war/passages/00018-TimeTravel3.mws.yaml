# ../.source/ATimeofWar_Eng_v8.cs:3000
---
format: 'mws/0.4'
passage_id: 'TimeTravel3'
# ../en-US.restext:280 | "Tides of War 2"
title: 'restext://Title_TidesOfWar2'
# ../en-US.restext:261 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:3007
- type: 'assign'
  var: 'round'
  expr: '6'
# ../.source/ATimeofWar_Eng_v8.cs:3009
- type: 'conditional'
  if: 'barracks == "no"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3011
  - type: 'conditional'
    if: '!pg14'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:3016
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:285 | "Accept"
      okay: 'restext://UIButton_Accept'
      header:
      # ../.source/ATimeofWar_Eng_v8.cs:3020
      - type: 'image'
        asset: 'image://setup/VillageChronicleCover'
        style: 'setup-image'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:3022
      - type: 'text'
        # ../en-US.restext:438 | "Turn to page **14** of th..."
        value: 'restext://TimeTravel3_001'
    # ../.source/ATimeofWar_Eng_v8.cs:3029
    - type: 'break'
      style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:3034
  - type: 'section'
    # ../en-US.restext:146 | "**Military Demands**"
    title: 'restext://Heading_MilitaryDemands'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3042
    - type: 'text'
      # ../en-US.restext:439 | "Before the end of the Gen..."
      value: 'restext://TimeTravel3_002'
    # ../.source/ATimeofWar_Eng_v8.cs:3050
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:3052
    - type: 'text'
      # ../en-US.restext:440 | "If you do not have a piec..."
      value: 'restext://TimeTravel3_003'
  # ../.source/ATimeofWar_Eng_v8.cs:3060
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3063
- type: 'conditional'
  if: 'tmrepair == "no"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3067
  - type: 'section'
    # ../en-US.restext:166 | "{icon:storybooktoken} **R..."
    title: 'restext://Heading_StorybookToken_RepairTimeMachine'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3077
    - type: 'text'
      # ../en-US.restext:91 | "When taking the **Perform..."
      value: 'restext://Directive_PerformExperimentTimeMachineRepairs'
    # ../.source/ATimeofWar_Eng_v8.cs:3088
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:3090
    - type: 'text'
      # ../en-US.restext:57 | "Once all **three** Repair..."
      value: 'restext://Directive_AllThreeRepairsCompleted_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:3096
    - type: 'link'
      # ../en-US.restext:37 | "click here for a special ..."
      label: 'restext://Click_HereForSpecialMessage_Exclaim'
      target: 'ATimeMachineRepaired' # ./00193-ATimeMachineRepaired.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:3098
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3103
- type: 'section'
  # ../en-US.restext:164 | "{icon:storybooktoken} **P..."
  title: 'restext://Heading_StorybookToken_ParadoxExplanation'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3113
  - type: 'text'
    # ../en-US.restext:90 | "For more detailed rules o..."
    value: 'restext://Directive_ParadoxTokenRulesExplanation_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:3117
  - type: 'link'
    # ../en-US.restext:38 | "click here."
    label: 'restext://Click_Here_Period'
    target: 'ParadoxExReminder' # ./00192-ParadoxExReminder.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:3119
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3121
- type: 'conditional'
  if: 'ttset == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3125
  - type: 'section'
    # ../en-US.restext:165 | "{icon:storybooktoken} **P..."
    title: 'restext://Heading_StorybookToken_ParadoxicalMendingReward'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3134
    - type: 'text'
      # ../en-US.restext:77 | "Fixing the timestream has..."
      value: 'restext://Directive_FixTimestreamZeroParadox_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:3142
    - type: 'link'
      # ../en-US.restext:47 | "click here to receive a s..."
      label: 'restext://Click_ToReceiveSpecialBonus'
      target: 'TriggerParadox' # ./00141-TriggerParadox.mws.yaml
      snapshot: true
    # ../.source/ATimeofWar_Eng_v8.cs:3143
    - type: 'break'
    # ../.source/ATimeofWar_Eng_v8.cs:3146
    - type: 'text'
      # ../en-US.restext:98 | "_You must remove at least..."
      value: 'restext://Directive_RemoveParadoxTokenForBonus'
  # ../.source/ATimeofWar_Eng_v8.cs:3151
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3156
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3159
  - type: 'conditional'
    if: 'late == 2'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:3163
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:44 | "Click here to determine t..."
      label: 'restext://Click_ToDetermineFateOfTown'
      target: 'BlameOut3' # ./00081-BlameOut3.mws.yaml
      # ../en-US.restext:289 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '6'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:235 | "The Late Years of the Sec..."
        value: 'restext://Round_GenerationII_LateEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:231 | "Perform any End of Round ..."
        value: 'restext://Round_EndOfRoundActions_Rule'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:3169
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:44 | "Click here to determine t..."
      label: 'restext://Click_ToDetermineFateOfTown'
      target: 'SecretParadoxBonus' # ./00202-SecretParadoxBonus.mws.yaml
      # ../en-US.restext:289 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '6'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:235 | "The Late Years of the Sec..."
        value: 'restext://Round_GenerationII_LateEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:231 | "Perform any End of Round ..."
        value: 'restext://Round_EndOfRoundActions_Rule'
