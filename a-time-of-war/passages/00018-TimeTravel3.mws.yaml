# ../.source/ATimeofWar_Eng_v8.cs:3000
---
format: 'mws/0.4'
passage_id: 'TimeTravel3'
# ../en-US.restext:237 | "Tides of War 2"
title: 'restext://Common_233'
# ../en-US.restext:211 | "Late Years"
subtitle: 'restext://Common_207'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:3007
- type: 'assign'
  var: 'round'
  expr: '6'
# ../.source/ATimeofWar_Eng_v8.cs:3009
- type: 'conditional'
  if: 'barracks == "no"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3011
  - type: 'conditional'
    if: '!pg14'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:3016
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:215 | "Accept"
      okay: 'restext://Common_211'
      header:
      # ../.source/ATimeofWar_Eng_v8.cs:3020
      - type: 'image'
        asset: 'image://setup/VillageChronicleCover'
        style: 'setup-image'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:3022
      - type: 'text'
        # ../en-US.restext:433 | "Turn to page **14** of th..."
        value: 'restext://TimeTravel3_001'
    # ../.source/ATimeofWar_Eng_v8.cs:3029
    - type: 'break'
      style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:3034
  - type: 'section'
    # ../en-US.restext:212 | "**Military Demands**"
    title: 'restext://Common_208'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3042
    - type: 'text'
      # ../en-US.restext:434 | "Before the end of the Gen..."
      value: 'restext://TimeTravel3_002'
    # ../.source/ATimeofWar_Eng_v8.cs:3050
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:3052
    - type: 'text'
      # ../en-US.restext:435 | "If you do not have a piec..."
      value: 'restext://TimeTravel3_003'
  # ../.source/ATimeofWar_Eng_v8.cs:3060
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3063
- type: 'conditional'
  if: 'tmrepair == "no"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3067
  - type: 'section'
    # ../en-US.restext:227 | "{icon:storybooktoken} **R..."
    title: 'restext://Common_223'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3077
    - type: 'text'
      # ../en-US.restext:228 | "When taking the **Perform..."
      value: 'restext://Common_224'
    # ../.source/ATimeofWar_Eng_v8.cs:3088
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:3090
    - type: 'text'
      # ../en-US.restext:229 | "Once all **three** Repair..."
      value: 'restext://Common_225'
    # ../.source/ATimeofWar_Eng_v8.cs:3096
    - type: 'link'
      # ../en-US.restext:230 | "click here for a special ..."
      label: 'restext://Common_226'
      target: 'ATimeMachineRepaired' # ./00193-ATimeMachineRepaired.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:3098
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3103
- type: 'section'
  # ../en-US.restext:239 | "{icon:storybooktoken} **P..."
  title: 'restext://Common_235'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3113
  - type: 'text'
    # ../en-US.restext:240 | "For more detailed rules o..."
    value: 'restext://Common_236'
  # ../.source/ATimeofWar_Eng_v8.cs:3117
  - type: 'link'
    # ../en-US.restext:195 | "click here."
    label: 'restext://Common_191'
    target: 'ParadoxExReminder' # ./00192-ParadoxExReminder.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:3119
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3121
- type: 'conditional'
  if: 'ttset == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3125
  - type: 'section'
    # ../en-US.restext:241 | "{icon:storybooktoken} **P..."
    title: 'restext://Common_237'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3134
    - type: 'text'
      # ../en-US.restext:242 | "Fixing the timestream has..."
      value: 'restext://Common_238'
    # ../.source/ATimeofWar_Eng_v8.cs:3142
    - type: 'link'
      # ../en-US.restext:243 | "click here to receive a s..."
      label: 'restext://Common_239'
      target: 'TriggerParadox' # ./00141-TriggerParadox.mws.yaml
      snapshot: true
    # ../.source/ATimeofWar_Eng_v8.cs:3143
    - type: 'break'
    # ../.source/ATimeofWar_Eng_v8.cs:3146
    - type: 'text'
      # ../en-US.restext:244 | "_You must remove at least..."
      value: 'restext://Common_240'
  # ../.source/ATimeofWar_Eng_v8.cs:3151
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3156
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3159
  - type: 'conditional'
    if: 'late == 2'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:3163
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:231 | "Click here to determine t..."
      label: 'restext://Common_227'
      target: 'BlameOut3' # ./00081-BlameOut3.mws.yaml
      # ../en-US.restext:222 | "End of Round"
      okay: 'restext://Common_218'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '6'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:232 | "The Late Years of the Sec..."
        value: 'restext://Common_228'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:233 | "Perform any End of Round ..."
        value: 'restext://Common_229'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:3169
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:231 | "Click here to determine t..."
      label: 'restext://Common_227'
      target: 'SecretParadoxBonus' # ./00202-SecretParadoxBonus.mws.yaml
      # ../en-US.restext:222 | "End of Round"
      okay: 'restext://Common_218'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '6'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:232 | "The Late Years of the Sec..."
        value: 'restext://Common_228'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:233 | "Perform any End of Round ..."
        value: 'restext://Common_229'
