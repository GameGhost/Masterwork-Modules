# ../.source/ATimeofWar_Eng_v8.cs:4565
---
format: 'mws/0.4'
passage_id: 'TimeTravel2'
# ../en-US.restext:280 | "Tides of War 2"
title: 'restext://Title_TidesOfWar2'
# ../en-US.restext:262 | "Middle Years"
subtitle: 'restext://Title_MiddleYears'
tags:
- 'HUB'
layout: 'hub_middle'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:4572
- type: 'assign'
  var: 'round'
  expr: '5'
# ../.source/ATimeofWar_Eng_v8.cs:4575
- type: 'conditional'
  if: 'tmrepair == "no"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:4579
  - type: 'section'
    # ../en-US.restext:164 | "{icon:storybooktoken} **R..."
    title: 'restext://Heading_StorybookToken_RepairTimeMachine'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:4588
    - type: 'text'
      # ../en-US.restext:91 | "When taking the **Perform..."
      value: 'restext://Directive_PerformExperimentTimeMachineRepairs'
    # ../.source/ATimeofWar_Eng_v8.cs:4599
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:4601
    - type: 'text'
      # ../en-US.restext:57 | "Once all **three** Repair..."
      value: 'restext://Directive_AllThreeRepairsCompleted_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:4607
    - type: 'link'
      # ../en-US.restext:37 | "click here for a special ..."
      label: 'restext://Click_HereForSpecialMessage_Exclaim'
      target: 'ATimeMachineRepaired' # ./00193-ATimeMachineRepaired.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:4609
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:4614
- type: 'section'
  # ../en-US.restext:162 | "{icon:storybooktoken} **P..."
  title: 'restext://Heading_StorybookToken_ParadoxExplanation'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:4624
  - type: 'text'
    # ../en-US.restext:90 | "For more detailed rules o..."
    value: 'restext://Directive_ParadoxTokenRulesExplanation_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:4628
  - type: 'link'
    # ../en-US.restext:38 | "click here."
    label: 'restext://Click_Here_Period'
    target: 'ParadoxExReminder' # ./00192-ParadoxExReminder.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:4630
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:4632
- type: 'conditional'
  if: 'ttset == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:4636
  - type: 'section'
    # ../en-US.restext:163 | "{icon:storybooktoken} **P..."
    title: 'restext://Heading_StorybookToken_ParadoxicalMendingReward'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:4646
    - type: 'text'
      # ../en-US.restext:77 | "Fixing the timestream has..."
      value: 'restext://Directive_FixTimestreamZeroParadox_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:4654
    - type: 'link'
      # ../en-US.restext:47 | "click here to receive a s..."
      label: 'restext://Click_ToReceiveSpecialBonus'
      target: 'TriggerParadox' # ./00141-TriggerParadox.mws.yaml
      snapshot: true
    # ../.source/ATimeofWar_Eng_v8.cs:4655
    - type: 'break'
    # ../.source/ATimeofWar_Eng_v8.cs:4658
    - type: 'text'
      # ../en-US.restext:98 | "_You must remove at least..."
      value: 'restext://Directive_RemoveParadoxTokenForBonus'
  # ../.source/ATimeofWar_Eng_v8.cs:4663
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:4668
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:4673
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:31 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'TownHallOpposite' # ./00131-TownHallOpposite.mws.yaml
    # ../en-US.restext:290 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '5'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:531 | "The Middle Years of the S..."
      value: 'restext://TimeTravel2_001'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:233 | "Then, perform all Start o..."
      value: 'restext://Round_StartLateYears_Rule'
