# ../.source/ATimeofWar_Eng_v8.cs:14190
---
format: 'mws/0.4'
passage_id: 'SeedGUNS'
# ../en-US.restext:1097 | SeedGUNS_001 | "Knowledge Bonus"
# ../en-US.restext:1098 | SeedGUNS_002 | "Ingredient Bonus"
# ../en-US.restext:1099 | SeedGUNS_003 | "Wealth Bonus"
# ../en-US.restext:1097 | SeedGUNS_001 | "Knowledge Bonus"
title: '{gunsbonus == 1 ? "restext://SeedGUNS_001" : gunsbonus == 2 ? "restext://SeedGUNS_002" : gunsbonus == 3 ? "restext://SeedGUNS_003" : "restext://SeedGUNS_001"}'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:14192
- type: 'switch'
  on: 'townname'
  cases:
  # ../en-US.restext:52 | "Paradox"
  - match: 'restext://Common_004'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:14194
    - type: 'assign'
      var: 'war'
      expr: '1'
  - match: 'Destruction'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:14198
    - type: 'assign'
      var: 'war'
      expr: '2'
# ../.source/ATimeofWar_Eng_v8.cs:14200
- type: 'switch'
  on: 'gunsbonus'
  cases:
  - match: 1
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:14208
    - type: 'text'
      # ../en-US.restext:1100 | "All players count up the ..."
      value: 'restext://SeedGUNS_004'
    # ../.source/ATimeofWar_Eng_v8.cs:14216
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:14220
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:28 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: '${war == 1 ? "Warwarn" : "TowardsWar"}' # ./00112-Warwarn.mws.yaml, ./00014-TowardsWar.mws.yaml
      # ../en-US.restext:287 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      header:
      # ../.source/ATimeofWar_Eng_v8.cs:14303
      - type: 'image'
        asset: 'image://setup/ScoreTrackMarker'
        style: 'setup-image'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:14314
      - type: 'let'
        var: '_rnd_SeedGUNS_0'
        expr: 'rand_between(2, 3, "SeedGUNS_0")'
      # ../.source/ATimeofWar_Eng_v8.cs:14305
      - type: 'text'
        # ../en-US.restext:1101 | "Any player with a {icon:s..."
        value: 'restext://SeedGUNS_005'
        lets:
        - '_rnd_SeedGUNS_0'
  - match: 2
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:14230
    - type: 'text'
      # ../en-US.restext:1102 | "All players count up the ..."
      value: 'restext://SeedGUNS_006'
    # ../.source/ATimeofWar_Eng_v8.cs:14238
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:14242
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:28 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: '${war == 1 ? "Warwarn" : "TowardsWar"}' # ./00112-Warwarn.mws.yaml, ./00014-TowardsWar.mws.yaml
      # ../en-US.restext:287 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      header:
      # ../.source/ATimeofWar_Eng_v8.cs:14337
      - type: 'image'
        asset: 'image://setup/ScoreTrackMarker'
        style: 'setup-image'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:14348
      - type: 'let'
        var: '_rnd_SeedGUNS_0'
        expr: 'rand_between(2, 3, "SeedGUNS_1")'
      # ../.source/ATimeofWar_Eng_v8.cs:14339
      - type: 'text'
        # ../en-US.restext:1101 | "Any player with a {icon:s..."
        value: 'restext://SeedGUNS_005'
        lets:
        - '_rnd_SeedGUNS_0'
  - match: 3
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:14252
    - type: 'text'
      # ../en-US.restext:1103 | "All players count up the ..."
      value: 'restext://SeedGUNS_007'
    # ../.source/ATimeofWar_Eng_v8.cs:14260
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:14264
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:28 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: '${war == 1 ? "Warwarn" : "TowardsWar"}' # ./00112-Warwarn.mws.yaml, ./00014-TowardsWar.mws.yaml
      # ../en-US.restext:287 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      header:
      # ../.source/ATimeofWar_Eng_v8.cs:14371
      - type: 'image'
        asset: 'image://setup/ScoreTrackMarker'
        style: 'setup-image'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:14382
      - type: 'let'
        var: '_rnd_SeedGUNS_0'
        expr: 'rand_between(2, 3, "SeedGUNS_2")'
      # ../.source/ATimeofWar_Eng_v8.cs:14373
      - type: 'text'
        # ../en-US.restext:1101 | "Any player with a {icon:s..."
        value: 'restext://SeedGUNS_005'
        lets:
        - '_rnd_SeedGUNS_0'
  default:
  # ../.source/ATimeofWar_Eng_v8.cs:14274
  - type: 'text'
    # ../en-US.restext:1100 | "All players count up the ..."
    value: 'restext://SeedGUNS_004'
  # ../.source/ATimeofWar_Eng_v8.cs:14282
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:14286
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:28 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: '${war == 1 ? "Warwarn" : "TowardsWar"}' # ./00112-Warwarn.mws.yaml, ./00014-TowardsWar.mws.yaml
    # ../en-US.restext:287 | "Close"
    okay: 'restext://UIButton_Close'
    snapshot: true
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:14303
    - type: 'image'
      asset: 'image://setup/ScoreTrackMarker'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:14314
    - type: 'let'
      var: '_rnd_SeedGUNS_0'
      expr: 'rand_between(2, 3, "SeedGUNS_3")'
    # ../.source/ATimeofWar_Eng_v8.cs:14305
    - type: 'text'
      # ../en-US.restext:1101 | "Any player with a {icon:s..."
      value: 'restext://SeedGUNS_005'
      lets:
      - '_rnd_SeedGUNS_0'
