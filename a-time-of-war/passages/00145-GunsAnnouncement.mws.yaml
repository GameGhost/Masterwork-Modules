# ../.source/ATimeofWar_Eng_v8.cs:15871
---
format: 'mws/0.4'
passage_id: 'GunsAnnouncement'
# ../en-US.restext:1235 | "An Investment in {townname}"
title: 'restext://GunsAnnouncement_001'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:15873
- type: 'conditional'
  if: 'gunsbonus >= 1'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:15882
  - type: 'text'
    # ../en-US.restext:1236 | "Due to the influence of a..."
    value: 'restext://GunsAnnouncement_002'
  # ../.source/ATimeofWar_Eng_v8.cs:15885
  - type: 'switch'
    on: 'gunsbonus'
    cases:
    - match: 1
      nodes:
      # ../.source/ATimeofWar_Eng_v8.cs:15887
      - type: 'text'
        # ../en-US.restext:1237 | "the scholarly **knowledge**"
        value: 'restext://GunsAnnouncement_003'
    - match: 2
      nodes:
      # ../.source/ATimeofWar_Eng_v8.cs:15895
      - type: 'text'
        # ../en-US.restext:1238 | "the bountiful **resources**"
        value: 'restext://GunsAnnouncement_004'
    - match: 3
      nodes:
      # ../.source/ATimeofWar_Eng_v8.cs:15903
      - type: 'text'
        # ../en-US.restext:1239 | "the immense **wealth**"
        value: 'restext://GunsAnnouncement_005'
  # ../.source/ATimeofWar_Eng_v8.cs:15909
  - type: 'text'
    # ../en-US.restext:1240 | " within the region would ..."
    value: 'restext://GunsAnnouncement_006'
  # ../.source/ATimeofWar_Eng_v8.cs:15912
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:15914
  - type: 'text'
    # ../en-US.restext:1241 | "While the squabble was me..."
    value: 'restext://GunsAnnouncement_007'
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:15919
  - type: 'assign'
    var: 'rumor6'
    expr: '"visited"'
  # ../.source/ATimeofWar_Eng_v8.cs:15920
  - type: 'goto'
    target: 'TakeSides2' # ./00007-TakeSides2.mws.yaml
