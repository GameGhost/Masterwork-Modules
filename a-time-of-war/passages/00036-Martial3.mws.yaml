# ../.source/ATimeofWar_Eng_v8.cs:4953
---
format: 'mws/0.4'
passage_id: 'Martial3'
# ../en-US.restext:261 | "Martial Law"
title: 'restext://Title_MartialLaw'
# ../en-US.restext:260 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:4960
- type: 'assign'
  var: 'round'
  expr: '9'
# ../.source/ATimeofWar_Eng_v8.cs:4961
- type: 'assign'
  var: 'sabotagee1'
  # ../en-US.restext:16 | "none"
  expr: '"restext://Choice_None"'
# ../.source/ATimeofWar_Eng_v8.cs:4963
- type: 'conditional'
  if: 'martial <= 2'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:4965
  - type: 'conditional'
    if: 'warpage2 == 1'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:4969
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:284 | "Accept"
      okay: 'restext://UIButton_Accept'
      header:
      # ../.source/ATimeofWar_Eng_v8.cs:4973
      - type: 'image'
        asset: 'image://setup/VillageChronicleCover'
        style: 'setup-image'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:4975
      - type: 'text'
        # ../en-US.restext:61 | "One of the buildings in t..."
        value: 'restext://Directive_BuildingTargetedTurnToSabpage'
    # ../.source/ATimeofWar_Eng_v8.cs:4984
    - type: 'break'
      style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:4990
- type: 'section'
  # ../en-US.restext:183 | "**Turn the Tide**"
  title: 'restext://Heading_TurnTheTide'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:4998
  - type: 'text'
    # ../en-US.restext:115 | "The {warloser} are desper..."
    value: 'restext://Directive_WarloserDesperateAdvancedWeaponry_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:5007
  - type: 'conditional'
    # ../en-US.restext:272 | "Separatists"
    if: 'warloser == "restext://Title_Separatists"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:5011
    - type: 'text'
      # ../en-US.restext:227 | "**gain a Knowledge of you..."
      value: 'restext://Reward_GainKnowledgeChoiceFromSupply'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:5018
    - type: 'text'
      # ../en-US.restext:226 | "**gain $2 from the supply**"
      value: 'restext://Reward_Gain2FromSupply'
  # ../.source/ATimeofWar_Eng_v8.cs:5021
  - type: 'text'
    # ../en-US.restext:59 | " as a gift from the {warl..."
    value: 'restext://Directive_AsGiftFromWarloser_Fragment'
# ../.source/ATimeofWar_Eng_v8.cs:5026
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5028
- type: 'conditional'
  if: 'martweapons == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:5032
  - type: 'section'
    # ../en-US.restext:178 | "{icon:storybooktoken} **W..."
    title: 'restext://Heading_StorybookToken_WeaponsBonus'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:5041
    - type: 'text'
      # ../en-US.restext:76 | "The first player to compl..."
      value: 'restext://Directive_FirstPlayerComplete2AdvancedWeaponry_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:5047
    - type: 'link'
      # ../en-US.restext:26 | "clicks here for a special..."
      label: 'restext://Click_ClicksHereSpecialBonus_Typo'
      target: 'PackingHeat1' # ./00127-PackingHeat1.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:5049
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5052
- type: 'switch'
  on: 'warwinner'
  cases:
  # ../en-US.restext:282 | "Unified Monarchists"
  - match: 'restext://Title_UnifiedMonarchists'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:5054
    - type: 'conditional'
      # ../en-US.restext:249 | "Barracks"
      if: 'bldg1 != "restext://Title_Barracks"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:5058
      - type: 'section'
        # ../en-US.restext:147 | "**Military Demands - Barr..."
        title: 'restext://Heading_MilitaryDemandsBarracks'
        style: 'hub-card'
        content:
        # ../.source/ATimeofWar_Eng_v8.cs:5071
        - type: 'text'
          # ../en-US.restext:81 | "The Monarchy demands a co..."
          value: 'restext://Directive_MonarchyDemandsServiceBarracksPenalty'
        # ../.source/ATimeofWar_Eng_v8.cs:5075
        - type: 'break'
          style: 'paragraph'
        # ../.source/ATimeofWar_Eng_v8.cs:5077
        - type: 'text'
          # ../en-US.restext:550 | "When placing a piece on t..."
          value: 'restext://Martial3_001'
  # ../en-US.restext:272 | "Separatists"
  - match: 'restext://Title_Separatists'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:5087
    - type: 'conditional'
      # ../en-US.restext:249 | "Barracks"
      if: 'bldg1 != "restext://Title_Barracks"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:5091
      - type: 'section'
        # ../en-US.restext:148 | "**Military Incentive - Ba..."
        title: 'restext://Heading_MilitaryIncentiveBarracks'
        style: 'hub-card'
        content:
        # ../.source/ATimeofWar_Eng_v8.cs:5099
        - type: 'text'
          # ../en-US.restext:105 | "The Separatists urge citi..."
          value: 'restext://Directive_SeparatistsUrgeRallyReward'
        # ../.source/ATimeofWar_Eng_v8.cs:5102
        - type: 'break'
          style: 'paragraph'
        # ../.source/ATimeofWar_Eng_v8.cs:5104
        - type: 'text'
          # ../en-US.restext:551 | "When placing a piece on t..."
          value: 'restext://Martial3_002'
    # ../.source/ATimeofWar_Eng_v8.cs:5111
    - type: 'break'
      style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5114
- type: 'conditional'
  if: 'bribe == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:5116
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:5120
  - type: 'section'
    # ../en-US.restext:139 | "**Everything is a Weapon**"
    title: 'restext://Heading_EverythingIsAWeapon'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:5129
    - type: 'text'
      # ../en-US.restext:552 | "When Performing an Experi..."
      value: 'restext://Martial3_004'
  # ../.source/ATimeofWar_Eng_v8.cs:5137
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5140
- type: 'conditional'
  if: 'wardestroy < 2'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:5146
  - type: 'section'
    # ../en-US.restext:152 | "**Outpost**"
    title: 'restext://Heading_OutpostBold'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:5155
    - type: 'text'
      # ../en-US.restext:89 | "An Outpost is open in tow..."
      value: 'restext://Directive_OutpostOpenForTrading_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:5158
    - type: 'link'
      # ../en-US.restext:36 | "Click here for an explana..."
      label: 'restext://Click_HereForOutpostExplanation'
      target: 'OutpostExplain' # ./00221-OutpostExplain.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:5160
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5165
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:5170
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:553 | "Click here at the End of ..."
    label: 'restext://Martial3_005'
    target: 'BarracksSimple3' # ./00159-BarracksSimple3.mws.yaml
    # ../en-US.restext:288 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '6'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:234 | "The Late Years of the Sec..."
      value: 'restext://Round_GenerationII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:230 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
