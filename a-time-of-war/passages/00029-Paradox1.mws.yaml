# ../.source/ATimeofWar_Eng_v8.cs:4309
---
format: 'mws/0.4'
passage_id: 'Paradox1'
# ../en-US.restext:257 | "Forward to Progress"
title: 'restext://Title_ForwardToProgress'
# ../en-US.restext:254 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:4316
- type: 'assign'
  var: 'round'
  expr: '10'
# ../.source/ATimeofWar_Eng_v8.cs:4318
- type: 'conditional'
  if: '!pgGen3'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:4322
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:286 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:4326
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:4328
    - type: 'text'
      # ../en-US.restext:515 | "Turn to page **15** of th..."
      value: 'restext://Paradox1_002'
    # ../.source/ATimeofWar_Eng_v8.cs:4334
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:4336
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:4337
      - type: 'text'
        # ../en-US.restext:58 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
# ../.source/ATimeofWar_Eng_v8.cs:4345
- type: 'section'
  # ../en-US.restext:162 | "**Science At any Cost**"
  title: 'restext://Heading_ScienceAtAnyCost'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:4353
  - type: 'text'
    # ../en-US.restext:83 | "Ignore any {icon:angrymob..."
    value: 'restext://Directive_IgnoreMobIconsFigureTokenStays_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:4369
  - type: 'conditional'
    # ../en-US.restext:284 | "Unified Monarchists"
    if: 'warwinner == "restext://Title_UnifiedMonarchists"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:4371
    - type: 'text'
      # ../en-US.restext:230 | "**they may immediately bu..."
      value: 'restext://Reward_MayBuildVanityEstateUpgrade'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:4376
    - type: 'text'
      # ../en-US.restext:231 | "**they may immediately ta..."
      value: 'restext://Reward_MayTakePerformExperimentAction'
  # ../.source/ATimeofWar_Eng_v8.cs:4379
  - type: 'text'
    value: '.'
# ../.source/ATimeofWar_Eng_v8.cs:4381
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:4385
- type: 'section'
  # ../en-US.restext:181 | "**Technician**"
  title: 'restext://Heading_Technician'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:4393
  - type: 'text'
    # ../en-US.restext:115 | "When visiting the **Techn..."
    value: 'restext://Directive_VisitTechnicianTradeIngredient'
# ../.source/ATimeofWar_Eng_v8.cs:4406
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:4410
- type: 'section'
  # ../en-US.restext:186 | "**Utopian Experiments**"
  title: 'restext://Heading_UtopianExperiments'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:4418
  - type: 'text'
    # ../en-US.restext:88 | "A new set of Experiments ..."
    value: 'restext://Directive_NewExperimentsAvailable_Any'
# ../.source/ATimeofWar_Eng_v8.cs:4421
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:4425
- type: 'section'
  # ../en-US.restext:172 | "{icon:storybooktoken} **U..."
  title: 'restext://Heading_StorybookToken_University'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:4435
  - type: 'text'
    # ../en-US.restext:114 | "When you visit this locat..."
    value: 'restext://Directive_VisitPay1GainCaretaker_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:4436
  - type: 'link'
    # ../en-US.restext:34 | "Click here for a detailed..."
    label: 'restext://Click_HereForDetailedExplanation'
    target: 'UniGen3' # ./00226-UniGen3.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:4437
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:4442
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:31 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'ParadoxFirst' # ./00093-ParadoxFirst.mws.yaml
    # ../en-US.restext:290 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:233 | "The Early Years of the Th..."
      value: 'restext://Round_GenerationIII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:238 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
