  okay: 'restext://UIButton_Close'
  snapshot: true
  header:
  # ../.source/ATimeofWar_Eng_v8.cs:11960
  - type: 'image'
    asset: 'image://setup/S3_GiantMW'
    style: 'setup-image'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:11938
  - type: 'conditional'
    if: 'crazy > 0'
