title: 'restext://ParadoxFirst_001'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:11911
- type: 'text'
  # ../en-US.restext:907 | "When I discovered the jou..."
  value: 'restext://ParadoxFirst_002'
# ../.source/ATimeofWar_Eng_v8.cs:11912
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:11914
- type: 'text'
  # ../en-US.restext:908 | "I decided to improve upon..."
  value: 'restext://ParadoxFirst_003'
# ../.source/ATimeofWar_Eng_v8.cs:11916
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:11921
- type: 'popup'
  # ../en-US.restext:28 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  layout: 'reveal'
  # ../en-US.restext:284 | "Close"
  cancel: 'restext://UIButton_Close'
  snapshot: true
  header:
  # ../.source/ATimeofWar_Eng_v8.cs:11960
  - type: 'image'
    asset: 'image://setup/S3_GiantMW'
    style: 'setup-image'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:11938
  - type: 'conditional'
    if: 'crazy > 0'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:11940
    - type: 'conditional'
      if: 'ParadoxFirstnextPsg == "" || ParadoxFirstnextPsg == 0'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:11942
      - type: 'assign'
        var: 'ParadoxFirstnextPsg'
        expr: '["FutureStick", "CostStick1"].shuffled("ParadoxFirst_0")[0]'
    # ../.source/ATimeofWar_Eng_v8.cs:11944
    - type: 'section'
      style: 'panel'
      content: []
    - type: 'link'
      # ../en-US.restext:286 | "Continue"
      label: 'restext://UIButton_Continue'
      target: '${ParadoxFirstnextPsg}'
      snapshot: true
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:11950
    - type: 'section'
      style: 'panel'
      content: []
    - type: 'link'
      # ../en-US.restext:286 | "Continue"
      label: 'restext://UIButton_Continue'
      target: 'MonumentVote' # ./00200-MonumentVote.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:11961
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:11962
  - type: 'text'
    # ../en-US.restext:909 | "Retrieve the **Giant Mast..."
    value: 'restext://ParadoxFirst_004'
