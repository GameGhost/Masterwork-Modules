# ../.source/ATimeofWar_Eng_v8.cs:7539
---
format: 'mws/0.4'
passage_id: 'Warning2time'
# ../en-US.restext:241 | "Not Again"
title: 'restext://Common_237'
# ../en-US.restext:203 | "Middle Years"
subtitle: 'restext://Common_199'
tags:
- 'HUB'
layout: 'hub'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:7546
- type: 'assign'
  var: 'round'
  expr: '14'
# ../.source/ATimeofWar_Eng_v8.cs:7548
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:7552
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:211 | "Accept"
    okay: 'restext://Common_207'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:7556
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:7558
    - type: 'text'
      # ../en-US.restext:240 | "Turn to page **16** of th..."
      value: 'restext://Common_236'
  # ../.source/ATimeofWar_Eng_v8.cs:7565
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:7568
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:7572
  - type: 'section'
    # ../en-US.restext:268 | "**My Great Grandfather's ..."
    title: 'restext://Common_264'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:7580
    - type: 'text'
      # ../en-US.restext:674 | "When a player completes a..."
      value: 'restext://Warning2time_002'
    # ../.source/ATimeofWar_Eng_v8.cs:7581
    - type: 'link'
      # ../en-US.restext:269 | "click here to pacify the ..."
      label: 'restext://Common_265'
      target: 'Stasis' # ./00061-Stasis.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:7583
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:7588
- type: 'section'
  # ../en-US.restext:270 | "**Reward for Perseverance**"
  title: 'restext://Common_266'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:7596
  - type: 'text'
    # ../en-US.restext:271 | "With the timeline somewha..."
    value: 'restext://Common_267'
  # ../.source/ATimeofWar_Eng_v8.cs:7608
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:7611
  - type: 'link'
    # ../en-US.restext:217 | "Click here at the end of ..."
    label: 'restext://Common_213'
    target: '${rumor2 == "visited" ? "OldManToken" : "Warning3time"}' # ./00099-OldManToken.mws.yaml, ./00060-Warning3time.mws.yaml
    snapshot: true
