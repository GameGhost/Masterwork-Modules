# ../.source/ATimeofWar_Eng_v8.cs:7539
---
format: 'mws/0.4'
passage_id: 'Warning2time'
# ../en-US.restext:249 | "Not Again"
title: 'restext://Common_245'
# ../en-US.restext:206 | "Middle Years"
subtitle: 'restext://Common_202'
tags:
- 'HUB'
layout: 'hub_middle'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:7546
- type: 'assign'
  var: 'round'
  expr: '14'
# ../.source/ATimeofWar_Eng_v8.cs:7548
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:7552
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:215 | "Accept"
    okay: 'restext://Common_211'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:7556
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:7558
    - type: 'text'
      # ../en-US.restext:248 | "Turn to page **16** of th..."
      value: 'restext://Common_244'
  # ../.source/ATimeofWar_Eng_v8.cs:7565
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:7568
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:7572
  - type: 'section'
    # ../en-US.restext:276 | "**My Great Grandfather's ..."
    title: 'restext://Common_272'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:7580
    - type: 'text'
      # ../en-US.restext:688 | "When a player completes a..."
      value: 'restext://Warning2time_002'
    # ../.source/ATimeofWar_Eng_v8.cs:7581
    - type: 'link'
      # ../en-US.restext:277 | "click here to pacify the ..."
      label: 'restext://Common_273'
      target: 'Stasis' # ./00061-Stasis.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:7583
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:7588
- type: 'section'
  # ../en-US.restext:278 | "**Reward for Perseverance**"
  title: 'restext://Common_274'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:7596
  - type: 'text'
    # ../en-US.restext:279 | "With the timeline somewha..."
    value: 'restext://Common_275'
  # ../.source/ATimeofWar_Eng_v8.cs:7608
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:7611
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:221 | "Click here at the end of ..."
    label: 'restext://Common_217'
    target: '${rumor2 == "visited" ? "OldManToken" : "Warning3time"}' # ./00099-OldManToken.mws.yaml, ./00060-Warning3time.mws.yaml
    # ../en-US.restext:222 | "End of Round"
    okay: 'restext://Common_218'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '8'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:152 | "The Middle Years of the T..."
      value: 'restext://Common_148'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:210 | "Then, perform all Start o..."
      value: 'restext://Common_206'
