# ../.source/ATimeofWar_Eng_v8.cs:7539
---
format: 'mws/0.4'
passage_id: 'Warning2time'
# ../en-US.restext:270 | "Not Again"
title: 'restext://Title_NotAgain'
# ../en-US.restext:265 | "Middle Years"
subtitle: 'restext://Title_MiddleYears'
tags:
- 'HUB'
layout: 'hub_middle'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:7546
- type: 'assign'
  var: 'round'
  expr: '14'
# ../.source/ATimeofWar_Eng_v8.cs:7548
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:7552
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:286 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:7556
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:7558
    - type: 'text'
      # ../en-US.restext:113 | "Turn to page **16** of th..."
      value: 'restext://Directive_TurnToPage16'
# ../.source/ATimeofWar_Eng_v8.cs:7568
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:7572
  - type: 'section'
    # ../en-US.restext:154 | "**My Great Grandfather's ..."
    title: 'restext://Heading_MyGreatGrandfathersMasterwork'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:7580
    - type: 'text'
      # ../en-US.restext:692 | "When a player completes a..."
      value: 'restext://Warning2time_002'
    # ../.source/ATimeofWar_Eng_v8.cs:7581
    - type: 'link'
      # ../en-US.restext:46 | "click here to pacify the ..."
      label: 'restext://Click_ToPacifyTimestream'
      target: 'Stasis' # ./00061-Stasis.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:7583
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:7588
- type: 'section'
  # ../en-US.restext:160 | "**Reward for Perseverance**"
  title: 'restext://Heading_RewardForPerseverance'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:7596
  - type: 'text'
    # ../en-US.restext:111 | "With the timeline somewha..."
    value: 'restext://Directive_TimelineStabilizedUtopianBonus'
  # ../.source/ATimeofWar_Eng_v8.cs:7608
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:7611
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:31 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: '${rumor2 == "visited" ? "OldManToken" : "Warning3time"}' # ./00099-OldManToken.mws.yaml, ./00060-Warning3time.mws.yaml
    # ../en-US.restext:290 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '8'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:235 | "The Middle Years of the T..."
      value: 'restext://Round_GenerationIII_MiddleEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:237 | "Then, perform all Start o..."
      value: 'restext://Round_StartLateYears_Rule'
