      - type: 'text'
        # ../en-US.restext:77 | "Remove all player pieces ..."
        value: 'restext://Directive_EndGeneration_PlayersKeepWeaponTokens'
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:5457
