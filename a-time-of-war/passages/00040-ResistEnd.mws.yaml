# ../.source/ATimeofWar_Eng_v8.cs:5402
---
format: 'mws/0.4'
passage_id: 'ResistEnd'
# ../en-US.restext:577 | ResistEnd_001 | "Victory for the Resistance"
# ../en-US.restext:578 | ResistEnd_002 | "Resistance Quashed"
title: '{wardestroy >= wardetermine ? "restext://ResistEnd_001" : "restext://ResistEnd_002"}'
tags:
- 'END'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:5412
- type: 'conditional'
  if: 'wardestroy >= wardetermine'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:5419
  - type: 'text'
    # ../en-US.restext:581 | "With **{wardestroy} build..."
    value: 'restext://ResistEnd_007'
  # ../.source/ATimeofWar_Eng_v8.cs:5428
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:5430
  - type: 'text'
    # ../en-US.restext:580 | "It was just as I had plan..."
    value: 'restext://ResistEnd_004'
  # ../.source/ATimeofWar_Eng_v8.cs:5433
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:5435
  - type: 'conditional'
    # ../en-US.restext:284 | "Unified Monarchists"
    if: 'warwinner == "restext://Title_UnifiedMonarchists"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:5439
    - type: 'popup'
      layout: 'end_of_generation'
      # ../en-US.restext:27 | "Click here to continue..."
      label: 'restext://Click_ContinueEllipsis_B'
      target: 'PeaceIntro' # ./00042-PeaceIntro.mws.yaml
      # ../en-US.restext:287 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      content:
      - type: 'let'
        var: 'title'
        # ../en-US.restext:255 | "End of Generation"
        expr: '"restext://Title_EndOfGeneration"'
      - type: 'let'
        var: 'completedRound'
        expr: '6'
      - type: 'text'
        # ../en-US.restext:77 | "Remove all player pieces ..."
        value: 'restext://Directive_EndGeneration_PlayersKeepWeaponTokens'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:5446
