      layout: 'end_of_generation'
      # ../en-US.restext:27 | "Click here to continue..."
      label: 'restext://Click_ContinueEllipsis_B'
      target: 'MonarchReignIntro' # ./00041-MonarchReignIntro.mws.yaml
      # ../en-US.restext:287 | "Close"
      okay: 'restext://UIButton_Close'
