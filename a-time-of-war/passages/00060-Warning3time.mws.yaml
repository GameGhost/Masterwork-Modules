# ../.source/ATimeofWar_Eng_v8.cs:7995
---
format: 'mws/0.4'
passage_id: 'Warning3time'
# ../en-US.restext:249 | "Not Again"
title: 'restext://Common_245'
# ../en-US.restext:211 | "Late Years"
subtitle: 'restext://Common_207'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:8002
- type: 'assign'
  var: 'round'
  expr: '15'
# ../.source/ATimeofWar_Eng_v8.cs:8005
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:8009
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:215 | "Accept"
    okay: 'restext://Common_211'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:8013
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:8015
    - type: 'text'
      # ../en-US.restext:698 | "Turn to page 16 of the Vi..."
      value: 'restext://Warning3time_001'
  # ../.source/ATimeofWar_Eng_v8.cs:8017
  - type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:8019
- type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:8020
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:8024
  - type: 'section'
    # ../en-US.restext:276 | "**My Great Grandfather's ..."
    title: 'restext://Common_272'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:8033
    - type: 'text'
      # ../en-US.restext:699 | "The next player that comp..."
      value: 'restext://Warning3time_002'
    # ../.source/ATimeofWar_Eng_v8.cs:8034
    - type: 'link'
      # ../en-US.restext:277 | "click here to pacify the ..."
      label: 'restext://Common_273'
      target: 'Stasis' # ./00061-Stasis.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:8036
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:8041
- type: 'section'
  # ../en-US.restext:278 | "**Reward for Perseverance**"
  title: 'restext://Common_274'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:8049
  - type: 'text'
    # ../en-US.restext:279 | "With the timeline somewha..."
    value: 'restext://Common_275'
  # ../.source/ATimeofWar_Eng_v8.cs:8061
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:8065
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:280 | "Click here at the End of ..."
    label: 'restext://Common_276'
    target: 'Scoring' # ./00004-Scoring.mws.yaml
    # ../en-US.restext:222 | "End of Round"
    okay: 'restext://Common_218'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:153 | "The Late Years of the Thi..."
      value: 'restext://Common_149'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:233 | "Perform any End of Round ..."
      value: 'restext://Common_229'
