# ../.source/ATimeofWar_Eng_v8.cs:7995
---
format: 'mws/0.4'
passage_id: 'Warning3time'
# ../en-US.restext:267 | "Not Again"
title: 'restext://Title_NotAgain'
# ../en-US.restext:259 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:8002
- type: 'assign'
  var: 'round'
  expr: '15'
# ../.source/ATimeofWar_Eng_v8.cs:8005
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:8009
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:286 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:8013
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:8015
    - type: 'text'
      # ../en-US.restext:703 | "Turn to page 16 of the Vi..."
      value: 'restext://Warning3time_001'
# ../.source/ATimeofWar_Eng_v8.cs:8020
- type: 'conditional'
  if: '!master'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:8024
  - type: 'section'
    # ../en-US.restext:150 | "**My Great Grandfather's ..."
    title: 'restext://Heading_MyGreatGrandfathersMasterwork'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:8033
    - type: 'text'
      # ../en-US.restext:704 | "The next player that comp..."
      value: 'restext://Warning3time_002'
    # ../.source/ATimeofWar_Eng_v8.cs:8034
    - type: 'link'
      # ../en-US.restext:46 | "click here to pacify the ..."
      label: 'restext://Click_ToPacifyTimestream'
      target: 'Stasis' # ./00061-Stasis.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:8036
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:8041
- type: 'section'
  # ../en-US.restext:156 | "**Reward for Perseverance**"
  title: 'restext://Heading_RewardForPerseverance'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:8049
  - type: 'text'
    # ../en-US.restext:107 | "With the timeline somewha..."
    value: 'restext://Directive_TimelineStabilizedUtopianBonus'
  # ../.source/ATimeofWar_Eng_v8.cs:8061
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:8065
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:30 | "Click here at the End of ..."
    label: 'restext://Click_EndGeneration_FinalScoringDetermineFate'
    target: 'Scoring' # ./00004-Scoring.mws.yaml
    # ../en-US.restext:290 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:230 | "The Late Years of the Thi..."
      value: 'restext://Round_GenerationIII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:228 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
