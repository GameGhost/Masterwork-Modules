# ../.source/ATimeofWar_Eng_v8.cs:2868
---
format: 'mws/0.4'
passage_id: 'TimeTravel'
# ../en-US.restext:278 | "Tides of War 2"
title: 'restext://Title_TidesOfWar2'
# ../en-US.restext:253 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:2875
- type: 'assign'
  var: 'late'
  expr: '0'
# ../.source/ATimeofWar_Eng_v8.cs:2876
- type: 'assign'
  var: 'round'
  expr: '4'
# ../.source/ATimeofWar_Eng_v8.cs:2879
- type: 'conditional'
  if: '!pg13'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:2884
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:283 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:2888
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:2890
    - type: 'text'
      # ../en-US.restext:430 | "Turn to page **13** of th..."
      value: 'restext://TimeTravel_002'
    # ../.source/ATimeofWar_Eng_v8.cs:2897
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:2899
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:2900
      - type: 'text'
        # ../en-US.restext:54 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
    # ../.source/ATimeofWar_Eng_v8.cs:2902
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:2906
    - type: 'text'
      # ../en-US.restext:431 | "**Each player retrieves t..."
      value: 'restext://TimeTravel_004'
# ../.source/ATimeofWar_Eng_v8.cs:2916
- type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:2919
- type: 'section'
  # ../en-US.restext:164 | "{icon:storybooktoken} **P..."
  title: 'restext://Heading_StorybookToken_ParadoxExplanation'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:2929
  - type: 'text'
    # ../en-US.restext:90 | "For more detailed rules o..."
    value: 'restext://Directive_ParadoxTokenRulesExplanation_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:2933
  - type: 'link'
    # ../en-US.restext:38 | "click here."
    label: 'restext://Click_Here_Period'
    target: 'ParadoxExReminder' # ./00192-ParadoxExReminder.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:2935
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:2937
- type: 'conditional'
  if: 'ttset == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:2942
  - type: 'section'
    # ../en-US.restext:165 | "{icon:storybooktoken} **P..."
    title: 'restext://Heading_StorybookToken_ParadoxicalMendingReward'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:2951
    - type: 'text'
      # ../en-US.restext:77 | "Fixing the timestream has..."
      value: 'restext://Directive_FixTimestreamZeroParadox_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:2959
    - type: 'link'
      # ../en-US.restext:47 | "click here to receive a s..."
      label: 'restext://Click_ToReceiveSpecialBonus'
      target: 'TriggerParadox' # ./00141-TriggerParadox.mws.yaml
      snapshot: true
    # ../.source/ATimeofWar_Eng_v8.cs:2960
    - type: 'break'
    # ../.source/ATimeofWar_Eng_v8.cs:2963
    - type: 'text'
      # ../en-US.restext:98 | "_You must remove at least..."
      value: 'restext://Directive_RemoveParadoxTokenForBonus'
  # ../.source/ATimeofWar_Eng_v8.cs:2968
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:2972
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:2978
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:31 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'FixIt' # ./00123-FixIt.mws.yaml
    # ../en-US.restext:287 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '4'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:432 | "The Early Years of the Se..."
      value: 'restext://TimeTravel_011'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:237 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
