    # ../en-US.restext:241 | "{icon:storybooktoken} **P..."
    title: 'restext://Common_237'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:2951
    - type: 'text'
      # ../en-US.restext:242 | "Fixing the timestream has..."
      value: 'restext://Common_238'
    # ../.source/ATimeofWar_Eng_v8.cs:2959
    - type: 'link'
      # ../en-US.restext:243 | "click here to receive a s..."
