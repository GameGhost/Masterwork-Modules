      var: '_ProgressRound'
      expr: '4'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:430 | "The Early Years of the Se..."
      value: 'restext://TimeTravel_011'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:223 | "Then, perform all Start o..."
      value: 'restext://Common_219'
