- 'END'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:3284
- type: 'conditional'
  if: 'tmrepair == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3288
  - type: 'text'
    # ../en-US.restext:443 | "**Fully Repaired**"
    value: 'restext://TimeEnd2_010'
  # ../.source/ATimeofWar_Eng_v8.cs:3290
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:3291
  - type: 'text'
    # ../en-US.restext:444 | "I knew that I had complet..."
    value: 'restext://TimeEnd2_011'
  # ../.source/ATimeofWar_Eng_v8.cs:3298
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:3300
  - type: 'text'
    # ../en-US.restext:445 | "Though my years have adva..."
    value: 'restext://TimeEnd2_012'
  # ../.source/ATimeofWar_Eng_v8.cs:3301
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:3303
