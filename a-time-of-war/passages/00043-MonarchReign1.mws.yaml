# ../.source/ATimeofWar_Eng_v8.cs:5652
---
format: 'mws/0.4'
passage_id: 'MonarchReign1'
# ../en-US.restext:265 | "Monarchy Reigns"
title: 'restext://Title_MonarchyReigns'
# ../en-US.restext:252 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'format'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:5659
- type: 'assign'
  var: 'round'
  expr: '16'
# ../.source/ATimeofWar_Eng_v8.cs:5661
- type: 'conditional'
  if: '!gen3pg'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:5665
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:284 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:5669
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:5671
    - type: 'text'
      # ../en-US.restext:595 | "Turn to page **9** of the..."
      value: 'restext://MonarchReign1_002'
    # ../.source/ATimeofWar_Eng_v8.cs:5678
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:5680
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:5681
      - type: 'text'
        # ../en-US.restext:56 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
# ../.source/ATimeofWar_Eng_v8.cs:5685
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5688
- type: 'conditional'
  conditions:
  - if: '!reignsep'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:5692
    - type: 'section'
      # ../en-US.restext:150 | "**Monarchist Allegiance**"
      title: 'restext://Heading_MonarchistAllegiance'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:5700
      - type: 'text'
        # ../en-US.restext:88 | "If a player does **NOT** ..."
        value: 'restext://Directive_NoMonarchistFlag_OnceAction'
  - if: 'reignsep == "yes"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:5725
    - type: 'section'
      # ../en-US.restext:150 | "**Monarchist Allegiance**"
      title: 'restext://Heading_MonarchistAllegiance'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:5733
      - type: 'text'
        # ../en-US.restext:87 | "If a player does **NOT** ..."
        value: 'restext://Directive_NoMonarchistFlag_CannotVisit'
# ../.source/ATimeofWar_Eng_v8.cs:5746
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5751
- type: 'section'
  # ../en-US.restext:167 | "{icon:storybooktoken} **R..."
  title: 'restext://Heading_StorybookToken_RoyalDecree'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:5761
  - type: 'text'
    # ../en-US.restext:83 | "The Monarchy is likely to..."
    value: 'restext://Directive_MonarchyListensGenerous_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:5769
  - type: 'link'
    # ../en-US.restext:45 | "click here to make a roya..."
    label: 'restext://Click_ToMakeRoyalDecree'
    target: 'ReignIntro' # ./00135-ReignIntro.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:5771
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5776
- type: 'section'
  # ../en-US.restext:151 | "**Most Decrees**"
  title: 'restext://Heading_MostDecrees'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:5784
  - type: 'text'
    # ../en-US.restext:596 | "The player who makes the ..."
    value: 'restext://MonarchReign1_010'
# ../.source/ATimeofWar_Eng_v8.cs:5792
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5797
- type: 'section'
  # ../en-US.restext:146 | "**Like a Whispering Shadow**"
  title: 'restext://Heading_LikeAWhisperingShadow'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:5805
  - type: 'text'
    # ../en-US.restext:223 | "At the End of the Generat..."
    value: 'restext://Reward_ClosestToCrownToken_Gain6VP'
# ../.source/ATimeofWar_Eng_v8.cs:5818
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5823
- type: 'section'
  # ../en-US.restext:168 | "{icon:storybooktoken} **R..."
  title: 'restext://Heading_StorybookToken_RoyalsTakeNotice'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:5833
  - type: 'text'
    # ../en-US.restext:91 | "If a player ever overlaps..."
    value: 'restext://Directive_OverlapsExceedsCrownToken_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:5840
  - type: 'conditional'
    if: 'onestcrown == 0'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:5842
    - type: 'link'
      # ../en-US.restext:35 | "click here for the negati..."
      label: 'restext://Click_HereForNegativeConsequence'
      target: '1stCrownCons' # ./00155-1stCrownCons.mws.yaml
      snapshot: true
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:5846
    - type: 'link'
      # ../en-US.restext:35 | "click here for the negati..."
      label: 'restext://Click_HereForNegativeConsequence'
      target: 'CrownCons' # ./00245-CrownCons.mws.yaml
      snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:5849
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5851
- type: 'conditional'
  if: 'onestcrown == 1'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:5856
  - type: 'section'
    # ../en-US.restext:159 | "**Royal Eye**"
    title: 'restext://Heading_RoyalEye'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:5864
    - type: 'text'
      # ../en-US.restext:597 | "Any player with a {icon:c..."
      value: 'restext://MonarchReign1_017'
  # ../.source/ATimeofWar_Eng_v8.cs:5875
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5879
- type: 'switch'
  on: 'weaponrew'
  cases:
  - match: 'money'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:5883
    - type: 'section'
      # ../en-US.restext:188 | "**Weapon Token Bonus**"
      title: 'restext://Heading_WeaponTokenBonus'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:5891
      - type: 'text'
        # ../en-US.restext:117 | "{icon:s3_weapontoken}toke..."
        value: 'restext://Directive_WeaponTokensSpendLikeMoney'
  - match: 'vp'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:5898
    - type: 'section'
      # ../en-US.restext:188 | "**Weapon Token Bonus**"
      title: 'restext://Heading_WeaponTokenBonus'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:5906
      - type: 'text'
        # ../en-US.restext:190 | "While our attempt to infl..."
        value: 'restext://Narrative_AttemptInfluenceMilitaryUnsuccessful'
# ../.source/ATimeofWar_Eng_v8.cs:5916
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:5920
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:5924
  - type: 'link'
    # ../en-US.restext:31 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: '${psn}'
    snapshot: true
    onclick:
    # ../.source/ATimeofWar_Eng_v8.cs:5933
    - type: 'let'
      var: 'psn'
      expr: 'crazy == 0 ? ("CoWEvent") : ("Stickfun")'
    # ../.source/ATimeofWar_Eng_v8.cs:5934
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
