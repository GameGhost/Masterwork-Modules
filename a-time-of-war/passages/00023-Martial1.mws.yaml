# ../.source/ATimeofWar_Eng_v8.cs:3624
---
format: 'mws/0.4'
passage_id: 'Martial1'
# ../en-US.restext:61 | "Martial Law"
title: 'restext://Common_057'
# ../en-US.restext:214 | "Early Years"
subtitle: 'restext://Common_210'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:3631
- type: 'assign'
  var: 'round'
  expr: '7'
# ../.source/ATimeofWar_Eng_v8.cs:3633
- type: 'conditional'
  if: '!martial'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3638
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:215 | "Accept"
    okay: 'restext://Common_211'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:3642
    - type: 'image'
      asset: 'image://setup/AngryMob_Icon'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3644
    - type: 'text'
      # ../en-US.restext:474 | "Turn to page **4** of the..."
      value: 'restext://Martial1_002'
    # ../.source/ATimeofWar_Eng_v8.cs:3655
    - type: 'break'
    # ../.source/ATimeofWar_Eng_v8.cs:3656
    - type: 'text'
      # ../en-US.restext:62 | "Place the Suspicion Marke..."
      value: 'restext://Common_058'
    # ../.source/ATimeofWar_Eng_v8.cs:3659
    - type: 'conditional'
      if: '!Martial1'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:3661
      - type: 'assign'
        var: 'Martial1'
        expr: '1'
      # ../.source/ATimeofWar_Eng_v8.cs:3662
      - type: 'conditional'
        # ../en-US.restext:26 | "Unified Monarchists"
        if: 'warwinner == "restext://Common_022"'
        then:
        # ../.source/ATimeofWar_Eng_v8.cs:3664
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker + 1'
        else:
        # ../.source/ATimeofWar_Eng_v8.cs:3668
        - type: 'let'
          var: '_rnd_Martial1_0'
          expr: 'rand_between(0, 1, "Martial1_0")'
        # ../.source/ATimeofWar_Eng_v8.cs:3668
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker - _rnd_Martial1_0'
    # ../.source/ATimeofWar_Eng_v8.cs:3671
    - type: 'text'
      # ../en-US.restext:63 | "**{tracker}** and the {ic..."
      value: 'restext://Common_059'
    # ../.source/ATimeofWar_Eng_v8.cs:3676
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:3678
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:3679
      - type: 'text'
        # ../en-US.restext:238 | "Then, since this is a 3 p..."
        value: 'restext://Common_234'
  # ../.source/ATimeofWar_Eng_v8.cs:3683
  - type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:3685
- type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:3688
- type: 'section'
  # ../en-US.restext:64 | "**Turn the Tide**"
  title: 'restext://Common_060'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3696
  - type: 'text'
    # ../en-US.restext:475 | "The {warloser} are desper..."
    value: 'restext://Martial1_006'
  # ../.source/ATimeofWar_Eng_v8.cs:3711
  - type: 'conditional'
    # ../en-US.restext:25 | "Separatists"
    if: 'warloser == "restext://Common_021"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:3715
    - type: 'text'
      # ../en-US.restext:477 | "**gain a Knowledge of you..."
      value: 'restext://Martial1_008'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:3723
    - type: 'text'
      # ../en-US.restext:476 | "**gain $2 from the supply** "
      value: 'restext://Martial1_007'
  # ../.source/ATimeofWar_Eng_v8.cs:3727
  - type: 'text'
    # ../en-US.restext:478 | "as a gift from the {warloser}."
    value: 'restext://Martial1_009'
# ../.source/ATimeofWar_Eng_v8.cs:3731
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3733
- type: 'conditional'
  if: 'martweapons == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3738
  - type: 'section'
    # ../en-US.restext:65 | "{icon:storybooktoken} **W..."
    title: 'restext://Common_061'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3747
    - type: 'text'
      # ../en-US.restext:66 | "The first player to compl..."
      value: 'restext://Common_062'
    # ../.source/ATimeofWar_Eng_v8.cs:3753
    - type: 'link'
      # ../en-US.restext:67 | "clicks here for a special..."
      label: 'restext://Common_063'
      target: 'PackingHeat1' # ./00127-PackingHeat1.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:3755
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3758
- type: 'switch'
  on: 'warwinner'
  cases:
  # ../en-US.restext:26 | "Unified Monarchists"
  - match: 'restext://Common_022'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:3762
    - type: 'section'
      # ../en-US.restext:68 | "**Military Demands - Barr..."
      title: 'restext://Common_064'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:3770
      - type: 'text'
        # ../en-US.restext:69 | "The Monarchy demands a co..."
        value: 'restext://Common_065'
      # ../.source/ATimeofWar_Eng_v8.cs:3774
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:3776
      - type: 'text'
        # ../en-US.restext:70 | "When placing a piece on t..."
        value: 'restext://Common_066'
  # ../en-US.restext:25 | "Separatists"
  - match: 'restext://Common_021'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:3788
    - type: 'section'
      # ../en-US.restext:71 | "**Military Incentive - Ba..."
      title: 'restext://Common_067'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:3796
      - type: 'text'
        # ../en-US.restext:72 | "The Separatists urge citi..."
        value: 'restext://Common_068'
      # ../.source/ATimeofWar_Eng_v8.cs:3799
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:3801
      - type: 'text'
        # ../en-US.restext:479 | "When placing a piece on t..."
        value: 'restext://Martial1_018'
    # ../.source/ATimeofWar_Eng_v8.cs:3807
    - type: 'break'
      style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3814
- type: 'section'
  # ../en-US.restext:73 | "**Outpost**"
  title: 'restext://Common_069'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3822
  - type: 'text'
    # ../en-US.restext:74 | "An Outpost is open in tow..."
    value: 'restext://Common_070'
  # ../.source/ATimeofWar_Eng_v8.cs:3826
  - type: 'link'
    # ../en-US.restext:75 | "Click here for an explana..."
    label: 'restext://Common_071'
    target: 'OutpostExplain' # ./00221-OutpostExplain.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:3827
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:3831
  - type: 'popup'
    layout: 'end_of_generation'
    # ../en-US.restext:221 | "Click here at the end of ..."
    label: 'restext://Common_217'
    target: 'ATOWSabotageIntro1' # ./00162-ATOWSabotageIntro1.mws.yaml
    # ../en-US.restext:185 | "Close"
    okay: 'restext://Common_181'
    snapshot: true
    content:
    - type: 'let'
      var: 'title'
      # ../en-US.restext:76 | "Special Setup"
      expr: '"restext://Common_072"'
    - type: 'let'
      var: 'completedRound'
      expr: '-1'
    - type: 'text'
      # ../en-US.restext:77 | "Do NOT perform the End of..."
      value: 'restext://Common_073'
