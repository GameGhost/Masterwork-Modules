# ../.source/ATimeofWar_Eng_v8.cs:3624
---
format: 'mws/0.4'
passage_id: 'Martial1'
# ../en-US.restext:262 | "Martial Law"
title: 'restext://Title_MartialLaw'
# ../en-US.restext:253 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:3631
- type: 'assign'
  var: 'round'
  expr: '7'
# ../.source/ATimeofWar_Eng_v8.cs:3633
- type: 'conditional'
  if: '!martial'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3638
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:285 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:3642
    - type: 'image'
      asset: 'image://setup/AngryMob_Icon'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3644
    - type: 'text'
      # ../en-US.restext:479 | "Turn to page **4** of the..."
      value: 'restext://Martial1_002'
    # ../.source/ATimeofWar_Eng_v8.cs:3655
    - type: 'break'
    # ../.source/ATimeofWar_Eng_v8.cs:3656
    - type: 'text'
      # ../en-US.restext:93 | "Place the Suspicion Marke..."
      value: 'restext://Directive_PlaceSuspicionMarker_Lead'
    # ../.source/ATimeofWar_Eng_v8.cs:3659
    - type: 'conditional'
      if: '!Martial1'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:3661
      - type: 'assign'
        var: 'Martial1'
        expr: '1'
      # ../.source/ATimeofWar_Eng_v8.cs:3662
      - type: 'conditional'
        # ../en-US.restext:283 | "Unified Monarchists"
        if: 'warwinner == "restext://Title_UnifiedMonarchists"'
        then:
        # ../.source/ATimeofWar_Eng_v8.cs:3664
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker + 1'
        else:
        # ../.source/ATimeofWar_Eng_v8.cs:3668
        - type: 'let'
          var: '_rnd_Martial1_0'
          expr: 'rand_between(0, 1, "Martial1_0")'
        # ../.source/ATimeofWar_Eng_v8.cs:3668
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker - _rnd_Martial1_0'
    # ../.source/ATimeofWar_Eng_v8.cs:3671
    - type: 'text'
      # ../en-US.restext:108 | "**{tracker}** and the {ic..."
      value: 'restext://Directive_TrackerAndMobMarkerLeft'
    # ../.source/ATimeofWar_Eng_v8.cs:3676
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:3678
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:3679
      - type: 'text'
        # ../en-US.restext:54 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
  # ../.source/ATimeofWar_Eng_v8.cs:3683
  - type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:3685
- type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:3688
- type: 'section'
  # ../en-US.restext:184 | "**Turn the Tide**"
  title: 'restext://Heading_TurnTheTide'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3696
  - type: 'text'
    # ../en-US.restext:480 | "The {warloser} are desper..."
    value: 'restext://Martial1_006'
  # ../.source/ATimeofWar_Eng_v8.cs:3711
  - type: 'conditional'
    # ../en-US.restext:273 | "Separatists"
    if: 'warloser == "restext://Title_Separatists"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:3715
    - type: 'text'
      # ../en-US.restext:482 | "**gain a Knowledge of you..."
      value: 'restext://Martial1_008'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:3723
    - type: 'text'
      # ../en-US.restext:481 | "**gain $2 from the supply** "
      value: 'restext://Martial1_007'
  # ../.source/ATimeofWar_Eng_v8.cs:3727
  - type: 'text'
    # ../en-US.restext:483 | "as a gift from the {warloser}."
    value: 'restext://Martial1_009'
# ../.source/ATimeofWar_Eng_v8.cs:3731
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3733
- type: 'conditional'
  if: 'martweapons == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:3738
  - type: 'section'
    # ../en-US.restext:178 | "{icon:storybooktoken} **W..."
    title: 'restext://Heading_StorybookToken_WeaponsBonus'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:3747
    - type: 'text'
      # ../en-US.restext:75 | "The first player to compl..."
      value: 'restext://Directive_FirstPlayerComplete2AdvancedWeaponry_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:3753
    - type: 'link'
      # ../en-US.restext:26 | "clicks here for a special..."
      label: 'restext://Click_ClicksHereSpecialBonus_Typo'
      target: 'PackingHeat1' # ./00127-PackingHeat1.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:3755
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3758
- type: 'switch'
  on: 'warwinner'
  cases:
  # ../en-US.restext:283 | "Unified Monarchists"
  - match: 'restext://Title_UnifiedMonarchists'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:3762
    - type: 'section'
      # ../en-US.restext:147 | "**Military Demands - Barr..."
      title: 'restext://Heading_MilitaryDemandsBarracks'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:3770
      - type: 'text'
        # ../en-US.restext:80 | "The Monarchy demands a co..."
        value: 'restext://Directive_MonarchyDemandsServiceBarracksPenalty'
      # ../.source/ATimeofWar_Eng_v8.cs:3774
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:3776
      - type: 'text'
        # ../en-US.restext:92 | "When placing a piece on t..."
        value: 'restext://Directive_PlaceOnBarracksNoBonus'
  # ../en-US.restext:273 | "Separatists"
  - match: 'restext://Title_Separatists'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:3788
    - type: 'section'
      # ../en-US.restext:148 | "**Military Incentive - Ba..."
      title: 'restext://Heading_MilitaryIncentiveBarracks'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:3796
      - type: 'text'
        # ../en-US.restext:104 | "The Separatists urge citi..."
        value: 'restext://Directive_SeparatistsUrgeRallyReward'
      # ../.source/ATimeofWar_Eng_v8.cs:3799
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:3801
      - type: 'text'
        # ../en-US.restext:484 | "When placing a piece on t..."
        value: 'restext://Martial1_018'
    # ../.source/ATimeofWar_Eng_v8.cs:3807
    - type: 'break'
      style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:3814
- type: 'section'
  # ../en-US.restext:152 | "**Outpost**"
  title: 'restext://Heading_OutpostBold'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:3822
  - type: 'text'
    # ../en-US.restext:88 | "An Outpost is open in tow..."
    value: 'restext://Directive_OutpostOpenForTrading_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:3826
  - type: 'link'
    # ../en-US.restext:36 | "Click here for an explana..."
    label: 'restext://Click_HereForOutpostExplanation'
    target: 'OutpostExplain' # ./00221-OutpostExplain.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:3827
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:3831
  - type: 'popup'
    layout: 'end_of_generation'
    # ../en-US.restext:31 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'ATOWSabotageIntro1' # ./00162-ATOWSabotageIntro1.mws.yaml
    # ../en-US.restext:286 | "Close"
    okay: 'restext://UIButton_Close'
    snapshot: true
    content:
    - type: 'let'
      var: 'title'
      # ../en-US.restext:274 | "Special Setup"
      expr: '"restext://Title_SpecialSetup"'
    - type: 'let'
      var: 'completedRound'
      expr: '-1'
    - type: 'text'
      # ../en-US.restext:67 | "Do NOT perform the End of..."
      value: 'restext://Directive_DoNotPerformEndOfRoundYet'
