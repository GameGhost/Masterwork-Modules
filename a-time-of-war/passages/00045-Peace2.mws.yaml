# ../.source/ATimeofWar_Eng_v8.cs:6116
---
format: 'mws/0.4'
passage_id: 'Peace2'
# ../en-US.restext:285 | "World Conquest"
title: 'restext://Title_WorldConquest'
# ../en-US.restext:265 | "Middle Years"
subtitle: 'restext://Title_MiddleYears'
tags:
- 'HUB'
layout: 'hub_middle'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:6123
- type: 'assign'
  var: 'round'
  expr: '20'
# ../.source/ATimeofWar_Eng_v8.cs:6124
- type: 'assign'
  var: 'tempbs'
  expr: 'rand_between(1, 2, "Peace2_0")'
# ../.source/ATimeofWar_Eng_v8.cs:6127
- type: 'conditional'
  if: '!pea2'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6131
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:286 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:6135
    - type: 'image'
      asset: 'image://setup/S3_WeaponToken'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6137
    - type: 'text'
      # ../en-US.restext:73 | "Each player collects "
      value: 'restext://Directive_EachPlayerCollects_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:6140
    - type: 'conditional'
      if: 'tempbs == 1'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:6142
      - type: 'text'
        # ../en-US.restext:239 | "**1 {icon:s3_weapontoken}..."
        value: 'restext://Score_OneWeaponToken'
      else:
      # ../.source/ATimeofWar_Eng_v8.cs:6148
      - type: 'text'
        # ../en-US.restext:240 | "**2 {icon:s3_weapontoken}..."
        value: 'restext://Score_TwoWeaponTokens'
    # ../.source/ATimeofWar_Eng_v8.cs:6153
    - type: 'conditional'
      if: 'wardestroy >= 2'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:6155
      - type: 'text'
        # ../en-US.restext:74 | "Each player **pays $1** i..."
        value: 'restext://Directive_EachPlayerPays1EstateTax'
# ../.source/ATimeofWar_Eng_v8.cs:6169
- type: 'section'
  # ../en-US.restext:165 | "**Separatist Allegiance**"
  title: 'restext://Heading_SeparatistAllegiance'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6177
  - type: 'text'
    # ../en-US.restext:91 | "If a player does **NOT** ..."
    value: 'restext://Directive_NoSeparatistsFlag_OnceAction'
# ../.source/ATimeofWar_Eng_v8.cs:6197
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6201
- type: 'section'
  # ../en-US.restext:179 | "{icon:storybooktoken} **W..."
  title: 'restext://Heading_StorybookToken_WarOnTheWorld'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6211
  - type: 'link'
    # ../en-US.restext:32 | "For an explanation of war..."
    label: 'restext://Click_ExplanationOfWar'
    target: 'HowtoWar' # ./00071-HowtoWar.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:6212
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:6213
  - type: 'text'
    # ../en-US.restext:76 | "The Empire has decided to..."
    value: 'restext://Directive_EmpireAdvancedWeaponryDeck'
# ../.source/ATimeofWar_Eng_v8.cs:6218
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6220
- type: 'conditional'
  if: 'bribe == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6222
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:6226
  - type: 'section'
    # ../en-US.restext:142 | "**Everything is a Weapon**"
    title: 'restext://Heading_EverythingIsAWeapon'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6234
    - type: 'text'
      # ../en-US.restext:110 | "When performing an Experi..."
      value: 'restext://Directive_SubstituteWeaponTokenForIngredient'
  # ../.source/ATimeofWar_Eng_v8.cs:6242
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6247
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6252
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:608 | "Click here at the end of ..."
    label: 'restext://Peace2_005'
    target: 'PeaceEvent' # ./00047-PeaceEvent.mws.yaml
    # ../en-US.restext:290 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '8'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:235 | "The Middle Years of the T..."
      value: 'restext://Round_GenerationIII_MiddleEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:237 | "Then, perform all Start o..."
      value: 'restext://Round_StartLateYears_Rule'
