# ../.source/ATimeofWar_Eng_v8.cs:6116
---
format: 'mws/0.4'
passage_id: 'Peace2'
# ../en-US.restext:140 | "World Conquest"
title: 'restext://Common_136'
# ../en-US.restext:203 | "Middle Years"
subtitle: 'restext://Common_199'
tags:
- 'HUB'
layout: 'hub'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:6123
- type: 'assign'
  var: 'round'
  expr: '20'
# ../.source/ATimeofWar_Eng_v8.cs:6124
- type: 'assign'
  var: 'tempbs'
  expr: 'rand_between(1, 2, "Peace2_0")'
# ../.source/ATimeofWar_Eng_v8.cs:6127
- type: 'conditional'
  if: '!pea2'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6131
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:211 | "Accept"
    okay: 'restext://Common_207'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:6135
    - type: 'image'
      asset: 'image://setup/S3_WeaponToken'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6137
    - type: 'text'
      # ../en-US.restext:147 | "Each player collects "
      value: 'restext://Common_143'
    # ../.source/ATimeofWar_Eng_v8.cs:6140
    - type: 'conditional'
      if: 'tempbs == 1'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:6142
      - type: 'text'
        # ../en-US.restext:149 | "**1 {icon:s3_weapontoken}..."
        value: 'restext://Common_145'
      else:
      # ../.source/ATimeofWar_Eng_v8.cs:6148
      - type: 'text'
        # ../en-US.restext:148 | "**2 {icon:s3_weapontoken}..."
        value: 'restext://Common_144'
    # ../.source/ATimeofWar_Eng_v8.cs:6153
    - type: 'conditional'
      if: 'wardestroy >= 2'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:6155
      - type: 'text'
        # ../en-US.restext:141 | "Each player **pays $1** i..."
        value: 'restext://Common_137'
  # ../.source/ATimeofWar_Eng_v8.cs:6163
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6169
- type: 'section'
  # ../en-US.restext:142 | "**Separatist Allegiance**"
  title: 'restext://Common_138'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6177
  - type: 'text'
    # ../en-US.restext:143 | "If a player does **NOT** ..."
    value: 'restext://Common_139'
# ../.source/ATimeofWar_Eng_v8.cs:6197
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6201
- type: 'section'
  # ../en-US.restext:144 | "{icon:storybooktoken} **W..."
  title: 'restext://Common_140'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6211
  - type: 'link'
    # ../en-US.restext:145 | "For an explanation of war..."
    label: 'restext://Common_141'
    target: 'HowtoWar' # ./00071-HowtoWar.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:6212
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:6213
  - type: 'text'
    # ../en-US.restext:150 | "The Empire has decided to..."
    value: 'restext://Common_146'
# ../.source/ATimeofWar_Eng_v8.cs:6218
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6220
- type: 'conditional'
  if: 'bribe == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6222
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:6226
  - type: 'section'
    # ../en-US.restext:84 | "**Everything is a Weapon**"
    title: 'restext://Common_080'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6234
    - type: 'text'
      # ../en-US.restext:146 | "When performing an Experi..."
      value: 'restext://Common_142'
  # ../.source/ATimeofWar_Eng_v8.cs:6242
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6247
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6252
  - type: 'link'
    # ../en-US.restext:590 | "Click here at the end of ..."
    label: 'restext://Peace2_005'
    target: 'PeaceEvent' # ./00047-PeaceEvent.mws.yaml
    snapshot: true
