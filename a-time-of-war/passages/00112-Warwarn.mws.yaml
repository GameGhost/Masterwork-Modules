    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:13376
    - type: 'link'
      # ../en-US.restext:28 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: 'TowardsDev' # ./00190-TowardsDev.mws.yaml
      snapshot: true
  - match: 2
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:13380
    - type: 'goto'
