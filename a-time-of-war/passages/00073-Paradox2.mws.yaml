# ../.source/ATimeofWar_Eng_v8.cs:9930
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9934
- type: 'section'
  # ../en-US.restext:141 | "**In Memoriam**"
  title: 'restext://Heading_InMemoriam'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:9943
  - type: 'text'
    # ../en-US.restext:199 | "With our brand of ethical..."
    value: 'restext://Narrative_EthicallyDubiousScienceMemorial'
  # ../.source/ATimeofWar_Eng_v8.cs:9945
  - type: 'conditional'
    if: 'release >= 1'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:9949
    - type: 'text'
      # ../en-US.restext:154 | "**The player who has move..."
      value: 'restext://Heading_PlayerFurthestOnInsanityTrack'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:9958
    - type: 'text'
      # ../en-US.restext:155 | "**The player with the mos..."
