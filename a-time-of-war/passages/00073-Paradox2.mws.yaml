  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:9971
  - type: 'conditional'
    if: 'release >= 1'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:9974
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:31 | "Click here at the end of ..."
      label: 'restext://Click_EndRound_NextRound'
      target: 'ParadoxRandoEvent' # ./00224-ParadoxRandoEvent.mws.yaml
      # ../en-US.restext:287 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '8'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:234 | "The Middle Years of the T..."
        value: 'restext://Round_GenerationIII_MiddleEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:236 | "Then, perform all Start o..."
        value: 'restext://Round_StartLateYears_Rule'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:9981
    - type: 'popup'
      layout: 'end_of_round'
      # ../en-US.restext:31 | "Click here at the end of ..."
      label: 'restext://Click_EndRound_NextRound'
      target: 'Paradox3' # ./00075-Paradox3.mws.yaml
      # ../en-US.restext:287 | "End of Round"
      okay: 'restext://UIButton_EndOfRound'
      onclose:
      - type: 'assign'
        var: '_ProgressRound'
        expr: '8'
      snapshot: true
      content:
      - type: 'text'
        # ../en-US.restext:234 | "The Middle Years of the T..."
        value: 'restext://Round_GenerationIII_MiddleEnded'
      - type: 'break'
        style: 'paragraph'
      - type: 'text'
        # ../en-US.restext:236 | "Then, perform all Start o..."
        value: 'restext://Round_StartLateYears_Rule'
