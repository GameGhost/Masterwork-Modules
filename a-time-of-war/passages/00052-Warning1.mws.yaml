# ../.source/ATimeofWar_Eng_v8.cs:6787
---
format: 'mws/0.4'
passage_id: 'Warning1'
# ../en-US.restext:649 | "Peaceful Return"
title: 'restext://Warning1_001'
# ../en-US.restext:251 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:6794
- type: 'assign'
  var: 'round'
  expr: '13'
# ../.source/ATimeofWar_Eng_v8.cs:6796
- type: 'conditional'
  if: 'pgGen3 == 0'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6800
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:281 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:6804
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6806
    - type: 'text'
      # ../en-US.restext:109 | "Turn to page **16** of th..."
      value: 'restext://Directive_TurnToPage16'
    # ../.source/ATimeofWar_Eng_v8.cs:6812
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:6814
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:6815
      - type: 'text'
        # ../en-US.restext:54 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
# ../.source/ATimeofWar_Eng_v8.cs:6819
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6823
- type: 'section'
  # ../en-US.restext:180 | "**Technician**"
  title: 'restext://Heading_Technician'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6831
  - type: 'text'
    # ../en-US.restext:111 | "When visiting the **Techn..."
    value: 'restext://Directive_VisitTechnicianTradeIngredient'
# ../.source/ATimeofWar_Eng_v8.cs:6844
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6849
- type: 'section'
  # ../en-US.restext:185 | "**Utopian Experiments**"
  title: 'restext://Heading_UtopianExperiments'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6857
  - type: 'text'
    # ../en-US.restext:84 | "A new set of Experiments ..."
    value: 'restext://Directive_NewExperimentsAvailable_Any'
# ../.source/ATimeofWar_Eng_v8.cs:6860
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6864
- type: 'section'
  # ../en-US.restext:170 | "{icon:storybooktoken} **U..."
  title: 'restext://Heading_StorybookToken_University'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6874
  - type: 'text'
    # ../en-US.restext:110 | "When you visit this locat..."
    value: 'restext://Directive_VisitPay1GainCaretaker_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:6875
  - type: 'link'
    # ../en-US.restext:34 | "Click here for a detailed..."
    label: 'restext://Click_HereForDetailedExplanation'
    target: 'UniGen3' # ./00226-UniGen3.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:6876
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:6880
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:31 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'WarningEvent' # ./00053-WarningEvent.mws.yaml
    # ../en-US.restext:285 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:230 | "The Early Years of the Th..."
      value: 'restext://Round_GenerationIII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:235 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
