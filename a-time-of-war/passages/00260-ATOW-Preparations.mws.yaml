# ../.source/ATimeofWar_Eng_v8.cs:25582
---
format: 'mws/0.4'
passage_id: 'ATOW-Preparations'
# ../en-US.restext:2122 | "Preparations"
title: 'restext://ATOW_Preparations_001'
tags:
- 'Begins-Here'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:25589
- type: 'assign'
  var: 'players'
  expr: 'global:playerCount'
# ../.source/ATimeofWar_Eng_v8.cs:25590
- type: 'assign'
  var: 'nameA'
  expr: 'global:nameA'
# ../.source/ATimeofWar_Eng_v8.cs:25591
- type: 'assign'
  var: 'nameB'
  expr: 'global:nameB'
# ../.source/ATimeofWar_Eng_v8.cs:25592
- type: 'conditional'
  if: 'players > 2'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:25592
  - type: 'assign'
    var: 'nameC'
    expr: 'global:nameC'
# ../.source/ATimeofWar_Eng_v8.cs:25593
- type: 'conditional'
  if: 'players > 3'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:25593
  - type: 'assign'
    var: 'nameD'
    expr: 'global:nameD'
# ../.source/ATimeofWar_Eng_v8.cs:25594
- type: 'conditional'
  if: 'players > 4'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:25594
  - type: 'assign'
    var: 'nameE'
    expr: 'global:nameE'
# ../.source/ATimeofWar_Eng_v8.cs:25595
- type: 'assign'
  var: 'townname'
  expr: 'global:townName'
# ../.source/ATimeofWar_Eng_v8.cs:25596
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:222 | "two"
      expr: '"restext://Number_Two_Lower"'
  - match: 3
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:221 | "three"
      expr: '"restext://Number_Three_Lower"'
  - match: 4
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:220 | "four"
      expr: '"restext://Number_Four_Lower"'
  - match: 5
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:219 | "five"
      expr: '"restext://Number_Five_Lower"'
  default:
  - type: 'assign'
    var: 'playtxt'
    # ../en-US.restext:222 | "two"
    expr: '"restext://Number_Two_Lower"'
# ../.source/ATimeofWar_Eng_v8.cs:25598
- type: 'text'
  # ../en-US.restext:2123 | "Complete the standard set..."
  value: 'restext://ATOW_Preparations_002'
# ../.source/ATimeofWar_Eng_v8.cs:25609
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:25614
- type: 'image'
  asset: 'icon://scenariobox3d_war'
  size: '200'
  align: 'center'
# ../.source/ATimeofWar_Eng_v8.cs:25618
- type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:25619
- type: 'text'
  # ../en-US.restext:2124 | "Then, retrieve the **A Ti..."
  value: 'restext://ATOW_Preparations_003'
# ../.source/ATimeofWar_Eng_v8.cs:25628
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:25630
- type: 'link'
  # ../en-US.restext:27 | "Click here to continue..."
  label: 'restext://Click_ContinueEllipsis_B'
  target: 'ForewordScen2' # ./00142-ForewordScen2.mws.yaml
  snapshot: true
