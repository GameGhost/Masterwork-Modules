# ../.source/ATimeofWar_Eng_v8.cs:9278
- type: 'conditional'
  if: 'pageturn == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:9282
  - type: 'section'
    # ../en-US.restext:776 | "{icon:storybooktoken} **C..."
    title: 'restext://MonarchReign3_001'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:9291
    - type: 'text'
      # ../en-US.restext:777 | "When any player visits th..."
      value: 'restext://MonarchReign3_002'
    # ../.source/ATimeofWar_Eng_v8.cs:9292
    - type: 'link'
      # ../en-US.restext:778 | "click here to gain the be..."
      label: 'restext://MonarchReign3_003'
      target: 'CommemorativeSignIn' # ./00166-CommemorativeSignIn.mws.yaml
      snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:9294
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:9298
  - type: 'section'
    # ../en-US.restext:779 | "**Church**"
    title: 'restext://MonarchReign3_004'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:9306
    - type: 'link'
      # ../en-US.restext:780 | "Click here"
      label: 'restext://MonarchReign3_005'
      target: 'ATOW-Church' # ./00297-ATOW-Church.mws.yaml
      snapshot: true
    # ../.source/ATimeofWar_Eng_v8.cs:9307
    - type: 'text'
      # ../en-US.restext:781 | "for an explanation of the..."
      value: 'restext://MonarchReign3_006'
  # ../.source/ATimeofWar_Eng_v8.cs:9310
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9316
- type: 'conditional'
  conditions:
  - if: '!reignsep'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:9320
    - type: 'section'
      # ../en-US.restext:148 | "**Monarchist Allegiance**"
      title: 'restext://Heading_MonarchistAllegiance'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:9329
      - type: 'text'
        # ../en-US.restext:86 | "If a player does **NOT** ..."
        value: 'restext://Directive_NoMonarchistFlag_OnceAction'
  - if: 'reignsep == "yes"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:9354
    - type: 'section'
      # ../en-US.restext:148 | "**Monarchist Allegiance**"
      title: 'restext://Heading_MonarchistAllegiance'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:9363
      - type: 'text'
        # ../en-US.restext:85 | "If a player does **NOT** ..."
        value: 'restext://Directive_NoMonarchistFlag_CannotVisit'
# ../.source/ATimeofWar_Eng_v8.cs:9376
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9380
- type: 'section'
  # ../en-US.restext:165 | "{icon:storybooktoken} **R..."
  title: 'restext://Heading_StorybookToken_RoyalDecree'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:9390
  - type: 'text'
    # ../en-US.restext:81 | "The Monarchy is likely to..."
    value: 'restext://Directive_MonarchyListensGenerous_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:9398
  - type: 'link'
    # ../en-US.restext:45 | "click here to make a roya..."
    label: 'restext://Click_ToMakeRoyalDecree'
    target: 'ReignIntro' # ./00135-ReignIntro.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:9400
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9404
- type: 'section'
  # ../en-US.restext:149 | "**Most Decrees**"
  title: 'restext://Heading_MostDecrees'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:9413
  - type: 'text'
    # ../en-US.restext:94 | "The player who makes the most "
    value: 'restext://Directive_PlayerWhoMakesTheMost_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:9416
  - type: 'conditional'
    if: 'benevolent == "good"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:9418
    - type: 'text'
      # ../en-US.restext:9 | "**benevolent**"
      value: 'restext://Choice_Benevolent'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:9423
    - type: 'text'
      # ../en-US.restext:13 | "**iron fist**"
      value: 'restext://Choice_IronFist'
  # ../.source/ATimeofWar_Eng_v8.cs:9426
  - type: 'text'
    # ../en-US.restext:222 | " decrees will gain **{dec..."
    value: 'restext://Reward_DecreesGainDecbonVP_Fragment'
# ../.source/ATimeofWar_Eng_v8.cs:9437
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9441
- type: 'section'
  # ../en-US.restext:144 | "**Like a Whispering Shadow**"
  title: 'restext://Heading_LikeAWhisperingShadow'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:9449
  - type: 'text'
    # ../en-US.restext:221 | "At the End of the Generat..."
    value: 'restext://Reward_ClosestToCrownToken_Gain6VP'
# ../.source/ATimeofWar_Eng_v8.cs:9462
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9466
- type: 'section'
  # ../en-US.restext:166 | "{icon:storybooktoken} **R..."
  title: 'restext://Heading_StorybookToken_RoyalsTakeNotice'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:9477
  - type: 'text'
    # ../en-US.restext:89 | "If a player ever overlaps..."
    value: 'restext://Directive_OverlapsExceedsCrownToken_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:9484
  - type: 'conditional'
    if: 'onestcrown == 0'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:9486
    - type: 'link'
      # ../en-US.restext:35 | "click here for the negati..."
      label: 'restext://Click_HereForNegativeConsequence'
      target: '1stCrownCons' # ./00155-1stCrownCons.mws.yaml
      snapshot: true
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:9491
    - type: 'link'
      # ../en-US.restext:35 | "click here for the negati..."
      label: 'restext://Click_HereForNegativeConsequence'
      target: 'CrownCons' # ./00245-CrownCons.mws.yaml
      snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:9494
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9496
- type: 'conditional'
  if: 'onestcrown == 1'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:9500
  - type: 'section'
    # ../en-US.restext:157 | "**Royal Eye**"
    title: 'restext://Heading_RoyalEye'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:9509
    - type: 'text'
      # ../en-US.restext:62 | "Any player with a {icon:c..."
      value: 'restext://Directive_CreepyMarkerOnScoreTrackLose1VP'
  # ../.source/ATimeofWar_Eng_v8.cs:9520
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9523
- type: 'switch'
  on: 'weaponrew'
  cases:
  - match: 'money'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:9527
    - type: 'section'
      # ../en-US.restext:186 | "**Weapon Token Bonus**"
      title: 'restext://Heading_WeaponTokenBonus'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:9535
      - type: 'text'
        # ../en-US.restext:115 | "{icon:s3_weapontoken}toke..."
        value: 'restext://Directive_WeaponTokensSpendLikeMoney'
  - match: 'vp'
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:9542
    - type: 'section'
      # ../en-US.restext:186 | "**Weapon Token Bonus**"
      title: 'restext://Heading_WeaponTokenBonus'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:9550
      - type: 'text'
        # ../en-US.restext:188 | "While our attempt to infl..."
        value: 'restext://Narrative_AttemptInfluenceMilitaryUnsuccessful'
# ../.source/ATimeofWar_Eng_v8.cs:9560
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:9563
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:9569
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:30 | "Click here at the End of ..."
    label: 'restext://Click_EndGeneration_FinalScoringDetermineFate'
    target: 'Weapons' # ./00094-Weapons.mws.yaml
    # ../en-US.restext:290 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:230 | "The Late Years of the Thi..."
      value: 'restext://Round_GenerationIII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:228 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
