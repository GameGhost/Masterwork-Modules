# ../.source/ATimeofWar_Eng_v8.cs:9269
---
format: 'mws/0.4'
passage_id: 'MonarchReign3'
# ../en-US.restext:264 | "Monarchy Reigns"
title: 'restext://Title_MonarchyReigns'
# ../en-US.restext:259 | "Late Years"
