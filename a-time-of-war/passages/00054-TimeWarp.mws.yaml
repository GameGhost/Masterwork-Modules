# ../.source/ATimeofWar_Eng_v8.cs:6960
---
format: 'mws/0.4'
passage_id: 'TimeWarp'
# ../en-US.restext:281 | "Time Shifts"
title: 'restext://Title_TimeShifts'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:6967
- type: 'let'
  var: '_rnd_TimeWarp_0'
  # ../en-US.restext:669 | TimeWarp_002 | "I could see a rift - a sh..."
  # ../en-US.restext:670 | TimeWarp_003 | "After conducting my busin..."
  # ../en-US.restext:671 | TimeWarp_004 | "A bolt of lightning carve..."
  # ../en-US.restext:672 | TimeWarp_005 | "My stomach fell. A lump c..."
  expr: '["restext://TimeWarp_002", "restext://TimeWarp_003", "restext://TimeWarp_004", "restext://TimeWarp_005"].shuffled("TimeWarp_0")[0]'
# ../.source/ATimeofWar_Eng_v8.cs:6967
- type: 'text'
  value: '{_rnd_TimeWarp_0}'
  lets:
  - '_rnd_TimeWarp_0'
# ../.source/ATimeofWar_Eng_v8.cs:6973
- type: 'assign'
  var: 'twcode'
  expr: '[17, 18, 19, 20, 21, 22]'
# ../.source/ATimeofWar_Eng_v8.cs:6974
- type: 'switch'
  on: 'cont'
  cases:
  - match: 17
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:6976
    - type: 'assign'
      var: 'twcode'
      expr: 'twcode.except(17)'
  - match: 18
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:6980
    - type: 'assign'
      var: 'twcode'
      expr: 'twcode.except(18)'
  - match: 19
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:6984
    - type: 'assign'
      var: 'twcode'
      expr: 'twcode.except(19)'
  - match: 20
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:6988
    - type: 'assign'
      var: 'twcode'
      expr: 'twcode.except(20)'
  - match: 21
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:6992
    - type: 'assign'
      var: 'twcode'
      expr: 'twcode.except(21)'
  - match: 22
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:6996
    - type: 'assign'
      var: 'twcode'
      expr: 'twcode.except(22)'
# ../.source/ATimeofWar_Eng_v8.cs:6998
- type: 'assign'
  var: 'twcode'
  expr: 'twcode.shuffled("TimeWarp_1")'
# ../.source/ATimeofWar_Eng_v8.cs:6972
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:7001
- type: 'text'
  # ../en-US.restext:207 | "The sky cast a crimson gl..."
  value: 'restext://Narrative_SkyCrimsonGlowEstate'
# ../.source/ATimeofWar_Eng_v8.cs:7003
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:7008
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:28 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: '${search >= total ? "WarningEvent2" : round == 14 ? "Warning2" : "Warning3"}' # ./00057-WarningEvent2.mws.yaml, ./00056-Warning2.mws.yaml, ./00059-Warning3.mws.yaml
  # ../en-US.restext:285 | "Close"
  okay: 'restext://UIButton_Close'
  snapshot: true
  header:
  # ../.source/ATimeofWar_Eng_v8.cs:7059
  - type: 'image'
    asset: 'image://setup/ScoreTrackMarker'
    style: 'setup-image'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:7036
  - type: 'assign'
    var: 'cont'
    expr: 'twcode[0]'
  # ../.source/ATimeofWar_Eng_v8.cs:7060
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:7064
  - type: 'text'
    # ../en-US.restext:673 | "**Lost in Time** - All pl..."
    value: 'restext://TimeWarp_007'
  # ../.source/ATimeofWar_Eng_v8.cs:7074
  - type: 'let'
    var: '_rnd_TimeWarp_0'
    expr: 'rand_between(1, 2, "TimeWarp_2")'
  # ../.source/ATimeofWar_Eng_v8.cs:7068
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:7070
  - type: 'text'
    # ../en-US.restext:674 | "The player who took the a..."
    value: 'restext://TimeWarp_008'
    lets:
    - '_rnd_TimeWarp_0'
