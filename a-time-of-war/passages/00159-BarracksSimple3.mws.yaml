# ../.source/ATimeofWar_Eng_v8.cs:17585
---
format: 'mws/0.4'
passage_id: 'BarracksSimple3'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:17587
- type: 'assign'
  var: 'barrackpen'
  expr: 'rand_between(1, 5, "BarracksSimple3_0")'
# ../.source/ATimeofWar_Eng_v8.cs:17588
- type: 'conditional'
  conditions:
  - if: 'bldg1 == "Laborer\''s Union"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:17590
    - type: 'conditional'
      # ../en-US.restext:283 | "Unified Monarchists"
      if: 'warwinner == "restext://Title_UnifiedMonarchists"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:17594
      - type: 'text'
        # ../en-US.restext:163 | "**Service Required**"
        value: 'restext://Heading_ServiceRequired'
      # ../.source/ATimeofWar_Eng_v8.cs:17596
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:17597
      - type: 'text'
        # ../en-US.restext:197 | "I was admittedly distress..."
        value: 'restext://Narrative_DistressedMonarchyMilitaryService'
      # ../.source/ATimeofWar_Eng_v8.cs:17598
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:17601
      - type: 'popup'
        layout: 'setup'
        # ../en-US.restext:27 | "Click here to continue..."
        label: 'restext://Click_ContinueEllipsis_B'
        target: 'ResistSides' # ./00039-ResistSides.mws.yaml
        # ../en-US.restext:286 | "Close"
        okay: 'restext://UIButton_Close'
        snapshot: true
        header:
        # ../.source/ATimeofWar_Eng_v8.cs:17647
        - type: 'image'
          asset: 'image://setup/BuildingS3Barracks'
          style: 'setup-image'
        content:
        # ../.source/ATimeofWar_Eng_v8.cs:17649
        - type: 'text'
          # ../en-US.restext:66 | "Any player who did not pl..."
          value: 'restext://Directive_DidNotPlaceOnBarracks_Fragment'
        # ../.source/ATimeofWar_Eng_v8.cs:17650
        - type: 'switch'
          on: 'barrackpen'
          cases:
          - match: 1
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17655
            - type: 'let'
              var: '_rnd_BarracksSimple3_0'
              expr: 'rand_between(1, 2, "BarracksSimple3_1")'
            # ../.source/ATimeofWar_Eng_v8.cs:17652
            - type: 'text'
              # ../en-US.restext:1417 | "gains **{_rnd_BarracksSim..."
              value: 'restext://BarracksSimple3_001'
              lets:
              - '_rnd_BarracksSimple3_0'
          - match: 2
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17662
            - type: 'text'
              # ../en-US.restext:95 | "receives **$1 less** inco..."
              value: 'restext://Directive_Receives1LessIncome'
          - match: 3
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17678
            - type: 'let'
              var: '_rnd_BarracksSimple3_1'
              expr: 'rand_between(2, 3, "BarracksSimple3_2")'
            # ../.source/ATimeofWar_Eng_v8.cs:17673
            - type: 'text'
              # ../en-US.restext:1418 | "**must** immediately lose..."
              value: 'restext://BarracksSimple3_002'
              lets:
              - '_rnd_BarracksSimple3_1'
          - match: 4
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17687
            - type: 'text'
              # ../en-US.restext:82 | "**must** flip their Flag ..."
              value: 'restext://Directive_MustFlipToSeparatist'
          default:
          # ../.source/ATimeofWar_Eng_v8.cs:17703
          - type: 'text'
            # ../en-US.restext:78 | "is fortunate as the Monar..."
            value: 'restext://Directive_FortunateMonarchyNoPenalty'
      else:
      # ../.source/ATimeofWar_Eng_v8.cs:17605
      - type: 'goto'
        target: 'ResistSides' # ./00039-ResistSides.mws.yaml
  - if: '!bldg1'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:17610
    - type: 'conditional'
      # ../en-US.restext:283 | "Unified Monarchists"
      if: 'warwinner == "restext://Title_UnifiedMonarchists"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:17614
      - type: 'text'
        # ../en-US.restext:163 | "**Service Required**"
        value: 'restext://Heading_ServiceRequired'
      # ../.source/ATimeofWar_Eng_v8.cs:17616
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:17617
      - type: 'text'
        # ../en-US.restext:197 | "I was admittedly distress..."
        value: 'restext://Narrative_DistressedMonarchyMilitaryService'
      # ../.source/ATimeofWar_Eng_v8.cs:17618
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:17621
      - type: 'popup'
        layout: 'setup'
        # ../en-US.restext:27 | "Click here to continue..."
        label: 'restext://Click_ContinueEllipsis_B'
        target: 'ResistSides' # ./00039-ResistSides.mws.yaml
        # ../en-US.restext:286 | "Close"
        okay: 'restext://UIButton_Close'
        snapshot: true
        header:
        # ../.source/ATimeofWar_Eng_v8.cs:17721
        - type: 'image'
          asset: 'image://setup/BuildingS3Barracks'
          style: 'setup-image'
        content:
        # ../.source/ATimeofWar_Eng_v8.cs:17723
        - type: 'text'
          # ../en-US.restext:66 | "Any player who did not pl..."
          value: 'restext://Directive_DidNotPlaceOnBarracks_Fragment'
        # ../.source/ATimeofWar_Eng_v8.cs:17724
        - type: 'switch'
          on: 'barrackpen'
          cases:
          - match: 1
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17729
            - type: 'let'
              var: '_rnd_BarracksSimple3_0'
              expr: 'rand_between(1, 2, "BarracksSimple3_3")'
            # ../.source/ATimeofWar_Eng_v8.cs:17726
            - type: 'text'
              # ../en-US.restext:1417 | "gains **{_rnd_BarracksSim..."
              value: 'restext://BarracksSimple3_001'
              lets:
              - '_rnd_BarracksSimple3_0'
          - match: 2
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17736
            - type: 'text'
              # ../en-US.restext:95 | "receives **$1 less** inco..."
              value: 'restext://Directive_Receives1LessIncome'
          - match: 3
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17752
            - type: 'let'
              var: '_rnd_BarracksSimple3_1'
              expr: 'rand_between(2, 3, "BarracksSimple3_4")'
            # ../.source/ATimeofWar_Eng_v8.cs:17747
            - type: 'text'
              # ../en-US.restext:1418 | "**must** immediately lose..."
              value: 'restext://BarracksSimple3_002'
              lets:
              - '_rnd_BarracksSimple3_1'
          - match: 4
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17761
            - type: 'text'
              # ../en-US.restext:82 | "**must** flip their Flag ..."
              value: 'restext://Directive_MustFlipToSeparatist'
          default:
          # ../.source/ATimeofWar_Eng_v8.cs:17777
          - type: 'text'
            # ../en-US.restext:78 | "is fortunate as the Monar..."
            value: 'restext://Directive_FortunateMonarchyNoPenalty'
      else:
      # ../.source/ATimeofWar_Eng_v8.cs:17626
      - type: 'goto'
        target: 'ResistSides' # ./00039-ResistSides.mws.yaml
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:17631
  - type: 'goto'
    target: 'ResistSides' # ./00039-ResistSides.mws.yaml
