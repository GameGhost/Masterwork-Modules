# ../.source/ATimeofWar_Eng_v8.cs:2058
---
format: 'mws/0.4'
passage_id: 'TakeSides3'
# ../en-US.restext:276 | "TAKING SIDES"
title: 'restext://Title_TakingSidesCaps'
# ../en-US.restext:261 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:2065
- type: 'assign'
  var: 'round'
  expr: '3'
# ../.source/ATimeofWar_Eng_v8.cs:2067
- type: 'conditional'
  if: 'barracks == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:2071
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:285 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:2075
    - type: 'image'
      asset: 'image://setup/Caretaker'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:2077
    - type: 'text'
      # ../en-US.restext:368 | "Turn to page **2** of the..."
      value: 'restext://TakeSides3_003'
    # ../.source/ATimeofWar_Eng_v8.cs:2083
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:2085
    - type: 'text'
      # ../en-US.restext:369 | "Each player takes a Caret..."
      value: 'restext://TakeSides3_004'
  # ../.source/ATimeofWar_Eng_v8.cs:2096
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:2098
  - type: 'conditional'
    if: 'barracksact == "mean"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:2102
    - type: 'section'
      # ../en-US.restext:146 | "**Military Demands**"
      title: 'restext://Heading_MilitaryDemands'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2110
      - type: 'text'
        # ../en-US.restext:373 | "Before the end of the Gen..."
        value: 'restext://TakeSides3_009'
    # ../.source/ATimeofWar_Eng_v8.cs:2119
    - type: 'break'
      style: 'paragraph'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:2127
    - type: 'section'
      # ../en-US.restext:370 | "**Military Service**"
      title: 'restext://TakeSides3_005'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2135
      - type: 'text'
        # ../en-US.restext:371 | "Before the end of the Gen..."
        value: 'restext://TakeSides3_006'
      # ../.source/ATimeofWar_Eng_v8.cs:2143
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:2145
      - type: 'text'
        # ../en-US.restext:372 | "If your Caretaker piece r..."
        value: 'restext://TakeSides3_007'
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:2156
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:285 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:2160
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:2162
    - type: 'text'
      # ../en-US.restext:367 | "Turn to page **3** of the..."
      value: 'restext://TakeSides3_002'
# ../.source/ATimeofWar_Eng_v8.cs:2170
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:2172
- type: 'switch'
  on: 'gunsbonus'
  cases:
  - match: 1
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:2176
    - type: 'section'
      # ../en-US.restext:144 | "**Knowledge Bonus**"
      title: 'restext://Heading_KnowledgeBonus'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2186
      - type: 'text'
        # ../en-US.restext:374 | "At the End of the Generat..."
        value: 'restext://TakeSides3_010'
    # ../.source/ATimeofWar_Eng_v8.cs:2189
    - type: 'break'
  - match: 2
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:2196
    - type: 'section'
      # ../en-US.restext:142 | "**Ingredient Bonus**"
      title: 'restext://Heading_IngredientBonus'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2205
      - type: 'text'
        # ../en-US.restext:375 | "At the End of the Generat..."
        value: 'restext://TakeSides3_011'
    # ../.source/ATimeofWar_Eng_v8.cs:2208
    - type: 'break'
  - match: 3
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:2215
    - type: 'section'
      # ../en-US.restext:188 | "**Wealth Bonus**"
      title: 'restext://Heading_WealthBonus'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2224
      - type: 'text'
        # ../en-US.restext:376 | "At the End of the Generat..."
        value: 'restext://TakeSides3_012'
    # ../.source/ATimeofWar_Eng_v8.cs:2227
    - type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:2229
- type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:2231
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:2236
  - type: 'link'
    # ../en-US.restext:377 | "Click here at the End of ..."
    label: 'restext://TakeSides3_013'
    target: '${pass}'
    snapshot: true
    onclick:
    # ../.source/ATimeofWar_Eng_v8.cs:2245
    - type: 'let'
      var: 'pass'
      expr: 'barracks != "yes" ? (gunsbonus == 0 ? (war == 1 ? ("Warwarn") : ("TowardsWar")) : ("SeedGUNS")) : ("TSBarracksPenalty")'
    # ../.source/ATimeofWar_Eng_v8.cs:2246
    - type: 'conditional'
      if: 'pass == "Warwarn"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:2248
      - type: 'switch'
        on: 'townname'
        cases:
        - match: 'Paradox'
          nodes:
          # ../.source/ATimeofWar_Eng_v8.cs:2250
          - type: 'assign'
            var: 'war'
            expr: '1'
        - match: 'Destruction'
          nodes:
          # ../.source/ATimeofWar_Eng_v8.cs:2254
          - type: 'assign'
            var: 'war'
            expr: '2'
    # ../.source/ATimeofWar_Eng_v8.cs:2257
    - type: 'assign'
      var: '_ProgressRound'
      expr: '3'
