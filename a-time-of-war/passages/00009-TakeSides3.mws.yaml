# ../.source/ATimeofWar_Eng_v8.cs:2058
---
format: 'mws/0.4'
passage_id: 'TakeSides3'
# ../en-US.restext:209 | "TAKING SIDES"
title: 'restext://Common_205'
# ../en-US.restext:207 | "Late Years"
subtitle: 'restext://Common_203'
tags:
- 'HUB'
layout: 'hub'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:2065
- type: 'assign'
  var: 'round'
  expr: '3'
# ../.source/ATimeofWar_Eng_v8.cs:2067
- type: 'conditional'
  if: 'barracks == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:2071
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:211 | "Accept"
    okay: 'restext://Common_207'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:2075
    - type: 'image'
      asset: 'image://setup/Caretaker'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:2077
    - type: 'text'
      # ../en-US.restext:353 | "Turn to page **2** of the..."
      value: 'restext://TakeSides3_003'
    # ../.source/ATimeofWar_Eng_v8.cs:2083
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:2085
    - type: 'text'
      # ../en-US.restext:354 | "Each player takes a Caret..."
      value: 'restext://TakeSides3_004'
  # ../.source/ATimeofWar_Eng_v8.cs:2096
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:2098
  - type: 'conditional'
    if: 'barracksact == "mean"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:2102
    - type: 'section'
      # ../en-US.restext:208 | "**Military Demands**"
      title: 'restext://Common_204'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2110
      - type: 'text'
        # ../en-US.restext:358 | "Before the end of the Gen..."
        value: 'restext://TakeSides3_009'
    # ../.source/ATimeofWar_Eng_v8.cs:2119
    - type: 'break'
      style: 'paragraph'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:2127
    - type: 'section'
      # ../en-US.restext:355 | "**Military Service**"
      title: 'restext://TakeSides3_005'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2135
      - type: 'text'
        # ../en-US.restext:356 | "Before the end of the Gen..."
        value: 'restext://TakeSides3_006'
      # ../.source/ATimeofWar_Eng_v8.cs:2143
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:2145
      - type: 'text'
        # ../en-US.restext:357 | "If your Caretaker piece r..."
        value: 'restext://TakeSides3_007'
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:2156
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:211 | "Accept"
    okay: 'restext://Common_207'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:2160
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:2162
    - type: 'text'
      # ../en-US.restext:352 | "Turn to page **3** of the..."
      value: 'restext://TakeSides3_002'
# ../.source/ATimeofWar_Eng_v8.cs:2170
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:2172
- type: 'switch'
  on: 'gunsbonus'
  cases:
  - match: 1
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:2176
    - type: 'section'
      # ../en-US.restext:204 | "**Knowledge Bonus**"
      title: 'restext://Common_200'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2186
      - type: 'text'
        # ../en-US.restext:359 | "At the End of the Generat..."
        value: 'restext://TakeSides3_010'
    # ../.source/ATimeofWar_Eng_v8.cs:2189
    - type: 'break'
  - match: 2
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:2196
    - type: 'section'
      # ../en-US.restext:205 | "**Ingredient Bonus**"
      title: 'restext://Common_201'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2205
      - type: 'text'
        # ../en-US.restext:360 | "At the End of the Generat..."
        value: 'restext://TakeSides3_011'
    # ../.source/ATimeofWar_Eng_v8.cs:2208
    - type: 'break'
  - match: 3
    nodes:
    # ../.source/ATimeofWar_Eng_v8.cs:2215
    - type: 'section'
      # ../en-US.restext:206 | "**Wealth Bonus**"
      title: 'restext://Common_202'
      style: 'hub-card'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:2224
      - type: 'text'
        # ../en-US.restext:361 | "At the End of the Generat..."
        value: 'restext://TakeSides3_012'
    # ../.source/ATimeofWar_Eng_v8.cs:2227
    - type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:2229
- type: 'break'
# ../.source/ATimeofWar_Eng_v8.cs:2231
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:2236
  - type: 'link'
    # ../en-US.restext:362 | "Click here at the End of ..."
    label: 'restext://TakeSides3_013'
    snapshot: true
    onclick:
    # ../.source/ATimeofWar_Eng_v8.cs:2246
    - type: 'conditional'
      if: 'pass == "Warwarn"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:2248
      - type: 'switch'
        on: 'townname'
        cases:
        - match: 'Paradox'
          nodes:
          # ../.source/ATimeofWar_Eng_v8.cs:2250
          - type: 'assign'
            var: 'war'
            expr: '1'
        - match: 'Destruction'
          nodes:
          # ../.source/ATimeofWar_Eng_v8.cs:2254
          - type: 'assign'
            var: 'war'
            expr: '2'
    # ../.source/ATimeofWar_Eng_v8.cs:2257
    - type: 'conditional'
      if: 'barracks != "yes"'
      then:
      - type: 'conditional'
        if: 'gunsbonus == 0'
        then:
        - type: 'conditional'
          if: 'war == 1'
          then:
          - type: 'goto'
            target: 'Warwarn' # ./00112-Warwarn.mws.yaml
          else:
          - type: 'goto'
            target: 'TowardsWar' # ./00014-TowardsWar.mws.yaml
        else:
        - type: 'goto'
          target: 'SeedGUNS' # ./00125-SeedGUNS.mws.yaml
      else:
      - type: 'goto'
        target: 'TSBarracksPenalty' # ./00189-TSBarracksPenalty.mws.yaml
