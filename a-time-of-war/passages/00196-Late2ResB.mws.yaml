    # ../en-US.restext:185 | "Close"
    okay: 'restext://Common_181'
    snapshot: true
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:20513
    - type: 'image'
      asset: 'image://setup/MFWlogo'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:20515
    - type: 'text'
      # ../en-US.restext:1719 | "Each player **gains 2 Res..."
      value: 'restext://Late2ResB_003'
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:20497
  - type: 'goto'
    target: 'WarningWarEnding' # ./00203-WarningWarEnding.mws.yaml
