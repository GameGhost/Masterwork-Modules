  # ../.source/ATimeofWar_Eng_v8.cs:20473
  - type: 'text'
    # ../en-US.restext:59 | "**Gift of Silence**"
    value: 'restext://Common_055'
  # ../.source/ATimeofWar_Eng_v8.cs:20475
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:20476
  - type: 'text'
    # ../en-US.restext:1717 | "For some reason which was..."
    value: 'restext://Late2ResB_001'
  # ../.source/ATimeofWar_Eng_v8.cs:20485
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:20487
  - type: 'text'
    # ../en-US.restext:1718 | "It would have been uncout..."
    value: 'restext://Late2ResB_002'
  # ../.source/ATimeofWar_Eng_v8.cs:20489
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:20493
