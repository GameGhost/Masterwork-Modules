# ../.source/ATimeofWar_Eng_v8.cs:5946
---
format: 'mws/0.4'
passage_id: 'Peace1'
# ../en-US.restext:283 | "World Conquest"
title: 'restext://Title_WorldConquest'
# ../en-US.restext:252 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:5953
- type: 'assign'
  var: 'round'
  expr: '19'
# ../.source/ATimeofWar_Eng_v8.cs:5956
- type: 'conditional'
  if: '!pea1'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:5960
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:284 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:5964
    - type: 'image'
      asset: 'image://setup/AngryMob_Icon'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:5966
    - type: 'text'
      # ../en-US.restext:602 | "Turn to page **11** of th..."
      value: 'restext://Peace1_002'
    # ../.source/ATimeofWar_Eng_v8.cs:5972
    - type: 'conditional'
      if: 'wardestroy >= 1'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:5974
      - type: 'text'
        # ../en-US.restext:71 | "Each player **pays $1** i..."
        value: 'restext://Directive_EachPlayerPays1EstateTax'
    # ../.source/ATimeofWar_Eng_v8.cs:5981
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:5983
    - type: 'text'
      # ../en-US.restext:94 | "Place the Suspicion Marke..."
      value: 'restext://Directive_PlaceSuspicionMarker_Lead'
    # ../.source/ATimeofWar_Eng_v8.cs:5986
    - type: 'conditional'
      if: '!Peace1'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:5988
      - type: 'assign'
        var: 'Peace1'
        expr: '1'
      # ../.source/ATimeofWar_Eng_v8.cs:5989
      - type: 'assign'
        var: 'tracker'
        expr: 'tracker + 1'
      # ../.source/ATimeofWar_Eng_v8.cs:5990
      - type: 'switch'
        on: 'players'
        cases:
        - match: 4
          nodes:
          # ../.source/ATimeofWar_Eng_v8.cs:5992
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 1'
        - match: 5
          nodes:
          # ../.source/ATimeofWar_Eng_v8.cs:5996
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 2'
    # ../.source/ATimeofWar_Eng_v8.cs:5999
    - type: 'text'
      # ../en-US.restext:109 | "**{tracker}** and the {ic..."
      value: 'restext://Directive_TrackerAndMobMarkerLeft'
    # ../.source/ATimeofWar_Eng_v8.cs:6004
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:6006
      - type: 'break'
      # ../.source/ATimeofWar_Eng_v8.cs:6007
      - type: 'text'
        # ../en-US.restext:55 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
  # ../.source/ATimeofWar_Eng_v8.cs:6010
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6015
- type: 'section'
  # ../en-US.restext:162 | "**Separatist Allegiance**"
  title: 'restext://Heading_SeparatistAllegiance'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6023
  - type: 'text'
    # ../en-US.restext:88 | "If a player does **NOT** ..."
    value: 'restext://Directive_NoSeparatistsFlag_OnceAction'
# ../.source/ATimeofWar_Eng_v8.cs:6043
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6047
- type: 'section'
  # ../en-US.restext:177 | "{icon:storybooktoken} **W..."
  title: 'restext://Heading_StorybookToken_WarOnTheWorld'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6057
  - type: 'link'
    # ../en-US.restext:32 | "For an explanation of war..."
    label: 'restext://Click_ExplanationOfWar'
    target: 'HowtoWar' # ./00071-HowtoWar.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:6058
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:6059
  - type: 'text'
    # ../en-US.restext:603 | "The Empire has decided to..."
    value: 'restext://Peace1_008'
# ../.source/ATimeofWar_Eng_v8.cs:6064
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6066
- type: 'conditional'
  if: 'bribe == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6070
  - type: 'section'
    # ../en-US.restext:139 | "**Everything is a Weapon**"
    title: 'restext://Heading_EverythingIsAWeapon'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6078
    - type: 'text'
      # ../en-US.restext:107 | "When performing an Experi..."
      value: 'restext://Directive_SubstituteWeaponTokenForIngredient'
# ../.source/ATimeofWar_Eng_v8.cs:6087
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6090
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6095
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:604 | "Click here at the end of ..."
    label: 'restext://Peace1_010'
    target: 'ATOW-FamineEvent' # ./00172-ATOW-FamineEvent.mws.yaml
    # ../en-US.restext:288 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:231 | "The Early Years of the Th..."
      value: 'restext://Round_GenerationIII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:236 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
