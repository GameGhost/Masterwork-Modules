# ../.source/ATimeofWar_Eng_v8.cs:10166
---
format: 'mws/0.4'
passage_id: 'Paradox3'
# ../en-US.restext:255 | "Forward to Progress"
title: 'restext://Title_ForwardToProgress'
# ../en-US.restext:260 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:10173
- type: 'assign'
  var: 'round'
  expr: '12'
# ../.source/ATimeofWar_Eng_v8.cs:10178
- type: 'section'
  # ../en-US.restext:159 | "**Science At any Cost**"
  title: 'restext://Heading_ScienceAtAnyCost'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:10186
  - type: 'text'
    # ../en-US.restext:80 | "Ignore any {icon:angrymob..."
    value: 'restext://Directive_IgnoreMobIconsFigureTokenStays_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:10202
  - type: 'conditional'
    # ../en-US.restext:282 | "Unified Monarchists"
    if: 'warwinner == "restext://Title_UnifiedMonarchists"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:10204
    - type: 'text'
      # ../en-US.restext:228 | "**they may immediately bu..."
      value: 'restext://Reward_MayBuildVanityEstateUpgrade'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:10208
    - type: 'text'
      # ../en-US.restext:229 | "**they may immediately ta..."
      value: 'restext://Reward_MayTakePerformExperimentAction'
  # ../.source/ATimeofWar_Eng_v8.cs:10211
  - type: 'text'
    value: '.'
# ../.source/ATimeofWar_Eng_v8.cs:10213
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:10217
- type: 'section'
  # ../en-US.restext:179 | "**Technician**"
  title: 'restext://Heading_Technician'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:10225
  - type: 'text'
    # ../en-US.restext:112 | "When visiting the **Techn..."
    value: 'restext://Directive_VisitTechnicianTradeIngredient'
# ../.source/ATimeofWar_Eng_v8.cs:10238
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:10243
- type: 'section'
  # ../en-US.restext:184 | "**Utopian Experiments**"
  title: 'restext://Heading_UtopianExperiments'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:10251
  - type: 'text'
    # ../en-US.restext:85 | "A new set of Experiments ..."
    value: 'restext://Directive_NewExperimentsAvailable_Any'
# ../.source/ATimeofWar_Eng_v8.cs:10254
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:10258
- type: 'section'
  # ../en-US.restext:170 | "{icon:storybooktoken} **U..."
  title: 'restext://Heading_StorybookToken_University'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:10268
  - type: 'text'
    # ../en-US.restext:111 | "When you visit this locat..."
    value: 'restext://Directive_VisitPay1GainCaretaker_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:10269
  - type: 'link'
    # ../en-US.restext:34 | "Click here for a detailed..."
    label: 'restext://Click_HereForDetailedExplanation'
    target: 'UniGen3' # ./00226-UniGen3.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:10271
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:10275
- type: 'section'
  # ../en-US.restext:141 | "**In Memoriam**"
  title: 'restext://Heading_InMemoriam'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:10284
  - type: 'text'
    # ../en-US.restext:198 | "With our brand of ethical..."
    value: 'restext://Narrative_EthicallyDubiousScienceMemorial'
  # ../.source/ATimeofWar_Eng_v8.cs:10286
  - type: 'conditional'
    if: 'release >= 1'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:10290
    - type: 'text'
      # ../en-US.restext:154 | "**The player who has move..."
      value: 'restext://Heading_PlayerFurthestOnInsanityTrack'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:10299
    - type: 'text'
      # ../en-US.restext:155 | "**The player with the mos..."
      value: 'restext://Heading_PlayerMostUtopianExperiments'
  # ../.source/ATimeofWar_Eng_v8.cs:10302
  - type: 'text'
    # ../en-US.restext:225 | " at the end of the Genera..."
    value: 'restext://Reward_EndGenerationGainTile_Fragment'
  # ../.source/ATimeofWar_Eng_v8.cs:10308
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:10312
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:30 | "Click here at the End of ..."
    label: 'restext://Click_EndGeneration_FinalScoringDetermineFate'
    target: 'ParadoxGiantCheck' # ./00282-ParadoxGiantCheck.mws.yaml
    # ../en-US.restext:288 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:232 | "The Late Years of the Thi..."
      value: 'restext://Round_GenerationIII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:230 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
