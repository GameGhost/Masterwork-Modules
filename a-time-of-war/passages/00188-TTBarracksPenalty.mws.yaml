# ../.source/ATimeofWar_Eng_v8.cs:20001
---
format: 'mws/0.4'
passage_id: 'TTBarracksPenalty'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:20003
- type: 'conditional'
  if: 'barracks == "no"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:20007
  - type: 'text'
    # ../en-US.restext:1658 | "**Barracks Penalty**"
    value: 'restext://TTBarracksPenalty_001'
  # ../.source/ATimeofWar_Eng_v8.cs:20009
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:20010
  - type: 'text'
    # ../en-US.restext:1659 | "Any player that does **no..."
    value: 'restext://TTBarracksPenalty_002'
  # ../.source/ATimeofWar_Eng_v8.cs:20021
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:20024
  - type: 'link'
    # ../en-US.restext:24 | "Click to continue..."
    label: 'restext://Common_020'
    target: '${TTBarracksPenaltynextPsg}'
    snapshot: true
    onclick:
    # ../.source/ATimeofWar_Eng_v8.cs:20041
    - type: 'conditional'
      if: 'TTBarracksPenaltynextPsg == "" || TTBarracksPenaltynextPsg == 0'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:20043
      - type: 'assign'
        var: 'TTBarracksPenaltynextPsg'
        expr: '["TimeEnd1", "TimeEnd2"].shuffled("TTBarracksPenalty_0")[0]'
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:20028
  - type: 'conditional'
    if: 'TTBarracksPenaltynextPsg == "" || TTBarracksPenaltynextPsg == 0'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:20030
    - type: 'assign'
      var: 'TTBarracksPenaltynextPsg'
      expr: '["TimeEnd1", "TimeEnd2"].shuffled("TTBarracksPenalty_1")[0]'
  # ../.source/ATimeofWar_Eng_v8.cs:20032
  - type: 'goto'
    target: '${TTBarracksPenaltynextPsg}'
