# ../.source/ATimeofWar_Eng_v8.cs:14528
---
format: 'mws/0.4'
passage_id: 'PackingHeat1a'
# ../en-US.restext:1117 | "Attracting Attentions"
title: 'restext://PackingHeat1a_001'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:14535
- type: 'text'
  # ../en-US.restext:1118 | "While the {warwinner} wer..."
  value: 'restext://PackingHeat1a_002'
# ../.source/ATimeofWar_Eng_v8.cs:14544
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:14548
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:28 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: '${round == 7 ? "Martial1" : round == 8 ? "Martial2" : "Martial3"}' # ./00023-Martial1.mws.yaml, ./00024-Martial2.mws.yaml, ./00036-Martial3.mws.yaml
  # ../en-US.restext:287 | "Close"
  okay: 'restext://UIButton_Close'
  snapshot: true
  header:
  # ../.source/ATimeofWar_Eng_v8.cs:14610
  - type: 'image'
    asset: 'image://setup/Creepy_Icon'
    style: 'setup-image'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:14579
  - type: 'switch'
    on: 'round'
    cases:
    - match: 7
      nodes:
      # ../.source/ATimeofWar_Eng_v8.cs:14581
      - type: 'assign'
        var: 'martweapons'
        expr: '1'
      # ../.source/ATimeofWar_Eng_v8.cs:14582
      - type: 'assign'
        var: 'martial'
        expr: '1'
    - match: 8
      nodes:
      # ../.source/ATimeofWar_Eng_v8.cs:14589
      - type: 'assign'
        var: 'martweapons'
        expr: '1'
      # ../.source/ATimeofWar_Eng_v8.cs:14590
      - type: 'assign'
        var: 'martial'
        expr: '2'
    default:
    # ../.source/ATimeofWar_Eng_v8.cs:14598
    - type: 'assign'
      var: 'martweapons'
      expr: '1'
    # ../.source/ATimeofWar_Eng_v8.cs:14599
    - type: 'assign'
      var: 'martial'
      expr: '3'
  # ../.source/ATimeofWar_Eng_v8.cs:14615
  - type: 'let'
    var: '_rnd_PackingHeat1a_0'
    # ../en-US.restext:1119 | PackingHeat1a_003 | "1 {icon:creepy_icon} and ..."
    # ../en-US.restext:1120 | PackingHeat1a_004 | "1 Resource of their choic..."
    expr: '["restext://PackingHeat1a_003", "restext://PackingHeat1a_004"].shuffled("PackingHeat1a_0")[0]'
  # ../.source/ATimeofWar_Eng_v8.cs:14612
  - type: 'text'
    # ../en-US.restext:1121 | "{heat} gains {_rnd_Packin..."
    value: 'restext://PackingHeat1a_005'
    lets:
    - '_rnd_PackingHeat1a_0'
  # ../.source/ATimeofWar_Eng_v8.cs:14617
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:14619
  - type: 'text'
    # ../en-US.restext:1122 | "If they have not already ..."
    value: 'restext://PackingHeat1a_006'
