# ../.source/ATimeofWar_Eng_v8.cs:9769
- type: 'conditional'
  conditions:
  - if: 'players > 4'
    then:
    - type: 'let'
      var: '_rnd_BattleTime_0'
      expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("BattleTime_0")[0]'
  - if: 'players > 3'
    then:
    - type: 'let'
      var: '_rnd_BattleTime_0'
      expr: '[nameA, nameB, nameC, nameD].shuffled("BattleTime_1")[0]'
  - if: 'players > 2'
    then:
    - type: 'let'
      var: '_rnd_BattleTime_0'
      expr: '[nameA, nameB, nameC].shuffled("BattleTime_2")[0]'
  else:
  - type: 'let'
    var: '_rnd_BattleTime_0'
    expr: '[nameA, nameB].shuffled("BattleTime_3")[0]'
# ../.source/ATimeofWar_Eng_v8.cs:9772
- type: 'let'
  var: '_rnd_BattleTime_1'
  expr: '[I alone deserved recognition for my glorious, bombastic, chimerical, transformative creations that defied the rigors of known science. I could no longer suffer the egotistical competitive nature of my cousins, whose work so paled in comparison to my own. This was my time. This was the era of {_rnd_BattleTime_0} III!, "The fate of the world rested in my hands. It was my discoveries, my ingenious weaponry, my unslakable ambitions that would define this new epoch in human existence. And I put on a demonstration that left no doubt as to whom the glory should be bestowed upon.", "Fame meant little to me if it did not carry with it the power to alter the world. I would watch as it transformed - carefully molded by my own hands - into a boundless utopia. My influence could no longer be relegated to the shadows. It was time to claim the Earth for my own and shake it to its very core."].shuffled("BattleTime_4")[0]'
# ../.source/ATimeofWar_Eng_v8.cs:9772
- type: 'text'
  value: '{_rnd_BattleTime_1}'
  lets:
  - '_rnd_BattleTime_1'
