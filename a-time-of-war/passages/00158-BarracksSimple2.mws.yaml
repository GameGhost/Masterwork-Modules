          value: 'restext://Directive_DidNotPlaceOnBarracks_Fragment'
        # ../.source/ATimeofWar_Eng_v8.cs:17515
        - type: 'switch'
          on: 'barrackpen'
          cases:
          - match: 1
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17520
            - type: 'let'
              var: '_rnd_BarracksSimple2_0'
              expr: 'rand_between(1, 2, "BarracksSimple2_3")'
            # ../.source/ATimeofWar_Eng_v8.cs:17517
            - type: 'text'
              # ../en-US.restext:1416 | "gains **{_rnd_BarracksSim..."
              value: 'restext://BarracksSimple2_001'
              lets:
              - '_rnd_BarracksSimple2_0'
          - match: 2
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17527
            - type: 'text'
