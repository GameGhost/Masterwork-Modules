# ../.source/ATimeofWar_Eng_v8.cs:17377
---
format: 'mws/0.4'
passage_id: 'BarracksSimple2'
# ../en-US.restext:272 | "Service Required"
title: 'restext://Title_ServiceRequired'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:17379
- type: 'assign'
  var: 'barrackpen'
  expr: 'rand_between(1, 5, "BarracksSimple2_0")'
# ../.source/ATimeofWar_Eng_v8.cs:17380
- type: 'conditional'
  conditions:
  - if: 'bldg1 == "Laborer\''s Union"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:17382
    - type: 'conditional'
      # ../en-US.restext:283 | "Unified Monarchists"
      if: 'warwinner == "restext://Title_UnifiedMonarchists"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:17389
      - type: 'text'
        # ../en-US.restext:194 | "I was admittedly distress..."
        value: 'restext://Narrative_DistressedMonarchyMilitaryService'
      # ../.source/ATimeofWar_Eng_v8.cs:17390
      - type: 'break'
        style: 'paragraph'
      # ../.source/ATimeofWar_Eng_v8.cs:17393
      - type: 'popup'
        layout: 'setup'
        # ../en-US.restext:27 | "Click here to continue..."
        label: 'restext://Click_ContinueEllipsis_B'
        target: 'Sabotage1Now' # ./00213-Sabotage1Now.mws.yaml
        # ../en-US.restext:287 | "Close"
        okay: 'restext://UIButton_Close'
        snapshot: true
        header:
        # ../.source/ATimeofWar_Eng_v8.cs:17437
        - type: 'image'
          asset: 'image://setup/BuildingS3Barracks'
          style: 'setup-image'
        content:
        # ../.source/ATimeofWar_Eng_v8.cs:17439
        - type: 'text'
          # ../en-US.restext:66 | "Any player who did not pl..."
          value: 'restext://Directive_DidNotPlaceOnBarracks_Fragment'
        # ../.source/ATimeofWar_Eng_v8.cs:17440
        - type: 'switch'
          on: 'barrackpen'
          cases:
          - match: 1
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17445
            - type: 'let'
              var: '_rnd_BarracksSimple2_0'
              expr: 'rand_between(1, 2, "BarracksSimple2_1")'
            # ../.source/ATimeofWar_Eng_v8.cs:17442
            - type: 'text'
              # ../en-US.restext:1416 | "gains **{_rnd_BarracksSim..."
              value: 'restext://BarracksSimple2_001'
              lets:
              - '_rnd_BarracksSimple2_0'
          - match: 2
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17452
            - type: 'text'
              # ../en-US.restext:95 | "receives **$1 less** inco..."
              value: 'restext://Directive_Receives1LessIncome'
          - match: 3
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17468
            - type: 'let'
              var: '_rnd_BarracksSimple2_1'
              expr: 'rand_between(2, 3, "BarracksSimple2_2")'
            # ../.source/ATimeofWar_Eng_v8.cs:17463
            - type: 'text'
              # ../en-US.restext:1417 | "**must** immediately lose..."
              value: 'restext://BarracksSimple2_002'
              lets:
              - '_rnd_BarracksSimple2_1'
          - match: 4
            nodes:
            # ../.source/ATimeofWar_Eng_v8.cs:17477
            - type: 'text'
              # ../en-US.restext:82 | "**must** flip their Flag ..."
              value: 'restext://Directive_MustFlipToSeparatist'
          default:
          # ../.source/ATimeofWar_Eng_v8.cs:17493
          - type: 'text'
            # ../en-US.restext:78 | "is fortunate as the Monar..."
            value: 'restext://Directive_FortunateMonarchyNoPenalty'
      else:
      # ../.source/ATimeofWar_Eng_v8.cs:17397
      - type: 'goto'
        target: 'Sabotage1Now' # ./00213-Sabotage1Now.mws.yaml
  - if: '!bldg1'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:17402
    - type: 'conditional'
      # ../en-US.restext:283 | "Unified Monarchists"
      if: 'warwinner == "restext://Title_UnifiedMonarchists"'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:17409
