# ../.source/ATimeofWar_Eng_v8.cs:6275
---
format: 'mws/0.4'
passage_id: 'Peace3'
# ../en-US.restext:285 | "World Conquest"
title: 'restext://Title_WorldConquest'
# ../en-US.restext:262 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:6282
- type: 'assign'
  var: 'round'
  expr: '21'
# ../.source/ATimeofWar_Eng_v8.cs:6285
- type: 'conditional'
  if: '!pea3'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6289
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:286 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:6293
    - type: 'image'
      asset: 'image://setup/S3_WeaponToken'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6294
    - type: 'text'
      # ../en-US.restext:72 | "Each player collects "
      value: 'restext://Directive_EachPlayerCollects_Fragment'
    # ../.source/ATimeofWar_Eng_v8.cs:6297
    - type: 'conditional'
      conditions:
      - if: 'tempbs == 1'
        then:
        # ../.source/ATimeofWar_Eng_v8.cs:6299
        - type: 'text'
          # ../en-US.restext:239 | "**1 {icon:s3_weapontoken}..."
          value: 'restext://Score_OneWeaponToken'
      - if: 'tempbs == 2'
        then:
        # ../.source/ATimeofWar_Eng_v8.cs:6305
        - type: 'text'
          # ../en-US.restext:240 | "**2 {icon:s3_weapontoken}..."
          value: 'restext://Score_TwoWeaponTokens'
    # ../.source/ATimeofWar_Eng_v8.cs:6310
    - type: 'conditional'
      if: 'wardestroy >= 2'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:6312
      - type: 'text'
        # ../en-US.restext:73 | "Each player **pays $1** i..."
        value: 'restext://Directive_EachPlayerPays1EstateTax'
# ../.source/ATimeofWar_Eng_v8.cs:6325
- type: 'section'
  # ../en-US.restext:164 | "**Separatist Allegiance**"
  title: 'restext://Heading_SeparatistAllegiance'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6333
  - type: 'text'
    # ../en-US.restext:90 | "If a player does **NOT** ..."
    value: 'restext://Directive_NoSeparatistsFlag_OnceAction'
# ../.source/ATimeofWar_Eng_v8.cs:6353
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6355
- type: 'conditional'
  if: 'bribe == "yes"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6357
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:6361
  - type: 'section'
    # ../en-US.restext:141 | "**Everything is a Weapon**"
    title: 'restext://Heading_EverythingIsAWeapon'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6369
    - type: 'text'
      # ../en-US.restext:109 | "When performing an Experi..."
      value: 'restext://Directive_SubstituteWeaponTokenForIngredient'
  # ../.source/ATimeofWar_Eng_v8.cs:6377
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6380
- type: 'conditional'
  if: 'peac == 2'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:6384
  - type: 'section'
    # ../en-US.restext:611 | "**Office of Public Relations**"
    title: 'restext://Peace3_001'
    style: 'hub-card'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:6392
    - type: 'text'
      # ../en-US.restext:612 | "At the End of the Generat..."
      value: 'restext://Peace3_002'
  # ../.source/ATimeofWar_Eng_v8.cs:6400
  - type: 'break'
    style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:6406
- type: 'section'
  # ../en-US.restext:613 | "{icon:storybooktoken} **F..."
  title: 'restext://Peace3_003'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:6417
  - type: 'link'
    # ../en-US.restext:32 | "For an explanation of war..."
    label: 'restext://Click_ExplanationOfWar'
    target: 'HowtoWar' # ./00071-HowtoWar.mws.yaml
    snapshot: true
  # ../.source/ATimeofWar_Eng_v8.cs:6418
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:6419
  - type: 'text'
    # ../en-US.restext:75 | "The Empire has decided to..."
    value: 'restext://Directive_EmpireAdvancedWeaponryDeck'
  # ../.source/ATimeofWar_Eng_v8.cs:6423
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:6425
  - type: 'conditional'
    if: 'peac == 1'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:6427
    - type: 'text'
      # ../en-US.restext:614 | "Due to the general discon..."
      value: 'restext://Peace3_004'
    # ../.source/ATimeofWar_Eng_v8.cs:6434
    - type: 'break'
      style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:6439
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:615 | "Click here at the End of ..."
    label: 'restext://Peace3_005'
    target: 'FinalBattleTime' # ./00076-FinalBattleTime.mws.yaml
    # ../en-US.restext:290 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:234 | "The Late Years of the Thi..."
      value: 'restext://Round_GenerationIII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:232 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
