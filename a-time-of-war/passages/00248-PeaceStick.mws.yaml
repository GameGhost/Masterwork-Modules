# ../.source/ATimeofWar_Eng_v8.cs:24792
---
format: 'mws/0.4'
passage_id: 'PeaceStick'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:24794
- type: 'conditional'
  if: 'crazy >= 1'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:24798
  - type: 'text'
    # ../en-US.restext:2009 | "**An Old, Failed Sabotage**"
    value: 'restext://PeaceStick_001'
  # ../.source/ATimeofWar_Eng_v8.cs:24800
  - type: 'break'
  # ../.source/ATimeofWar_Eng_v8.cs:24801
  - type: 'text'
    # ../en-US.restext:2010 | "For as long as I could re..."
    value: 'restext://PeaceStick_002'
  # ../.source/ATimeofWar_Eng_v8.cs:24804
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:24806
  - type: 'text'
    # ../en-US.restext:2011 | "I discovered a thin circu..."
    value: 'restext://PeaceStick_003'
  # ../.source/ATimeofWar_Eng_v8.cs:24807
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:24809
  - type: 'text'
    # ../en-US.restext:2012 | "Why some individual would..."
    value: 'restext://PeaceStick_004'
  # ../.source/ATimeofWar_Eng_v8.cs:24813
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:24817
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:28 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'BattleTime' # ./00072-BattleTime.mws.yaml
    # ../en-US.restext:284 | "Close"
    okay: 'restext://UIButton_Close'
    snapshot: true
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:24836
    - type: 'image'
      asset: 'image://setup/S3_WeaponToken'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:24839
    - type: 'conditional'
      if: 'crazy == 1'
      then:
      # ../.source/ATimeofWar_Eng_v8.cs:24841
      - type: 'text'
        # ../en-US.restext:2014 | "The player with the {icon..."
        value: 'restext://PeaceStick_006'
      else:
      # ../.source/ATimeofWar_Eng_v8.cs:24850
      - type: 'text'
        # ../en-US.restext:2013 | "Each player with a {icon:..."
        value: 'restext://PeaceStick_005'
    # ../.source/ATimeofWar_Eng_v8.cs:24856
    - type: 'text'
      # ../en-US.restext:2015 | "Then, discard the tokens ..."
      value: 'restext://PeaceStick_007'
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:24821
  - type: 'goto'
    target: 'BattleTime' # ./00072-BattleTime.mws.yaml
