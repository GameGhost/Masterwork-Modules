# ../.source/ATimeofWar_Eng_v8.cs:16912
---
format: 'mws/0.4'
passage_id: 'SeparatistBarnCheck'
# ../en-US.restext:275 | "Suspicions Confirmed"
title: 'restext://Title_SuspicionsConfirmed'
layout: 'narration'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:16914
- type: 'conditional'
  # ../en-US.restext:271 | "Separatists"
  if: 'warloser == "restext://Title_Separatists"'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:16916
  - type: 'conditional'
    if: 'barn == "yes"'
    then:
    # ../.source/ATimeofWar_Eng_v8.cs:16923
    - type: 'text'
      # ../en-US.restext:1395 | "The Separatists were furi..."
      value: 'restext://SeparatistBarnCheck_001'
    # ../.source/ATimeofWar_Eng_v8.cs:16924
    - type: 'break'
      style: 'paragraph'
    # ../.source/ATimeofWar_Eng_v8.cs:16928
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:28 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: 'PeaceWar' # ./00239-PeaceWar.mws.yaml
      # ../en-US.restext:287 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      header:
      # ../.source/ATimeofWar_Eng_v8.cs:16951
      - type: 'image'
        asset: 'image://setup/S3_EstateUpgradeBack'
        style: 'setup-image'
      content:
      # ../.source/ATimeofWar_Eng_v8.cs:16955
      - type: 'text'
        # ../en-US.restext:1396 | "**The player with the \"S..."
        value: 'restext://SeparatistBarnCheck_002'
    else:
    # ../.source/ATimeofWar_Eng_v8.cs:16932
    - type: 'goto'
      target: 'PeaceWar' # ./00239-PeaceWar.mws.yaml
  else:
  # ../.source/ATimeofWar_Eng_v8.cs:16937
  - type: 'goto'
    target: 'PeaceWar' # ./00239-PeaceWar.mws.yaml
