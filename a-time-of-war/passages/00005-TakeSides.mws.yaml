# ../.source/ATimeofWar_Eng_v8.cs:1486
---
format: 'mws/0.4'
passage_id: 'TakeSides'
# ../en-US.restext:213 | "TAKING SIDES"
title: 'restext://Common_209'
# ../en-US.restext:214 | "Early Years"
subtitle: 'restext://Common_210'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/ATimeofWar_Eng_v8.cs:1493
- type: 'assign'
  var: 'round'
  expr: '1'
# ../.source/ATimeofWar_Eng_v8.cs:1494
- type: 'conditional'
  if: '!rumblings'
  then:
  # ../.source/ATimeofWar_Eng_v8.cs:1499
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:215 | "Accept"
    okay: 'restext://Common_211'
    header:
    # ../.source/ATimeofWar_Eng_v8.cs:1503
    - type: 'image'
      asset: 'image://setup/S3_ScenarioIcon'
      style: 'setup-image'
    content:
    # ../.source/ATimeofWar_Eng_v8.cs:1505
    - type: 'text'
      # ../en-US.restext:330 | "Turn to the **A Time of W..."
      value: 'restext://TakeSides_004'
    # ../.source/ATimeofWar_Eng_v8.cs:1537
    - type: 'switch'
      on: 'players'
      cases:
      - match: 2
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1539
        - type: 'assign'
          var: 'tracker'
          expr: 'rand_between(4, 6, "TakeSides_0")'
      - match: 3
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1543
        - type: 'assign'
          var: 'tracker'
          expr: 'rand_between(6, 8, "TakeSides_1")'
      - match: 4
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1547
        - type: 'assign'
          var: 'tracker'
          expr: 'rand_between(7, 9, "TakeSides_2")'
      - match: 5
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1551
        - type: 'assign'
          var: 'tracker'
          expr: 'rand_between(9, 11, "TakeSides_3")'
    # ../.source/ATimeofWar_Eng_v8.cs:1565
    - type: 'switch'
      on: 'players'
      cases:
      - match: 2
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1567
        - type: 'let'
          var: '_rnd_TakeSides_0'
          expr: '[nameA, nameB].shuffled("TakeSides_4")[0]'
      - match: 3
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1571
        - type: 'let'
          var: '_rnd_TakeSides_0'
          expr: '[nameA, nameB, nameC].shuffled("TakeSides_5")[0]'
      - match: 4
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1575
        - type: 'let'
          var: '_rnd_TakeSides_0'
          expr: '[nameA, nameB, nameC, nameD].shuffled("TakeSides_6")[0]'
      - match: 5
        nodes:
        # ../.source/ATimeofWar_Eng_v8.cs:1579
        - type: 'let'
          var: '_rnd_TakeSides_0'
          expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("TakeSides_7")[0]'
    # ../.source/ATimeofWar_Eng_v8.cs:1532
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:331 | "Place the Suspicion Marke..."
      value: 'restext://TakeSides_005'
      lets:
      - '_rnd_TakeSides_0'
# ../.source/ATimeofWar_Eng_v8.cs:1585
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:1589
- type: 'section'
  # ../en-US.restext:216 | "{icon:storybooktoken} **T..."
  title: 'restext://Common_212'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:1599
  - type: 'text'
    # ../en-US.restext:217 | "When you visit the Town H..."
    value: 'restext://Common_213'
  # ../.source/ATimeofWar_Eng_v8.cs:1607
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:1609
  - type: 'text'
    # ../en-US.restext:218 | "In addition, you will spe..."
    value: 'restext://Common_214'
  # ../.source/ATimeofWar_Eng_v8.cs:1611
  - type: 'link'
    # ../en-US.restext:219 | "Click here whenever you v..."
    label: 'restext://Common_215'
    target: 'RumorD' # ./00006-RumorD.mws.yaml
    snapshot: true
# ../.source/ATimeofWar_Eng_v8.cs:1613
- type: 'break'
  style: 'paragraph'
# ../.source/ATimeofWar_Eng_v8.cs:1617
- type: 'section'
  # ../en-US.restext:220 | "**Second Round - Pledge o..."
  title: 'restext://Common_216'
  style: 'hub-card'
  content:
  # ../.source/ATimeofWar_Eng_v8.cs:1625
  - type: 'text'
    # ../en-US.restext:332 | "The village is at a cross..."
    value: 'restext://TakeSides_011'
  # ../.source/ATimeofWar_Eng_v8.cs:1627
  - type: 'break'
    style: 'paragraph'
  # ../.source/ATimeofWar_Eng_v8.cs:1631
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:221 | "Click here at the end of ..."
    label: 'restext://Common_217'
    target: 'TownHallSpecial' # ./00108-TownHallSpecial.mws.yaml
    # ../en-US.restext:222 | "End of Round"
    okay: 'restext://Common_218'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '1'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:333 | "The Early Years of the Fi..."
      value: 'restext://TakeSides_014'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:223 | "Then, perform all Start o..."
      value: 'restext://Common_219'
