# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Same self-navigating input pattern as the player-name passages. Strings live in this module's own
# en-US.restext (Setup_* keys) — no longer borrowed from cost-of-disease's extracted restext.
---
format: 'mws/0.4'
passage_id: 'Setup_07_TownNameEntry'
title: 'restext://Setup_TownName_Title'
layout: 'player_setup'
# Setup-passage background music — see Setup_01_PlayerCountSelect's own comment.
audio:
  music: 'audio://bgm/setup_theme'
nodes:
- type: 'conditional'
  if: 'townname == ""'
  then:
  - type: 'text'
    value: 'restext://Setup_TownName_Intro'
    style: 'text-sm'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Setup_TownName_InputLabel'
    style: 'setup-input-label'
  - type: 'input'
    var: 'townname'
    style: 'setup-input'
  - type: 'link'
    label: 'restext://Common_Continue'
    style: 'btn-brown'
    target: 'Setup_07_TownNameEntry'
    snapshot: false
  # Torn-parchment note popup (screenshot: Setup-06) — auto-displays once townname is set.
  else:
  - type: 'popup'
    layout: 'note'
    content:
    - type: 'text'
      value: 'restext://Setup_TownName_ConfirmBody1'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      value: 'restext://Setup_TownName_ConfirmBody2'
    okay: 'restext://Common_Continue'
    # Hands off to the narration-voice picker (Setup_08_NarrationVoiceSelect) rather than straight
    # to 00_Preparations. That passage's own Continue link is what actually reaches 00_Preparations
    # now — every real module's own hand-maintained 00_Preparations.mws.yaml override is still the
    # canonical landing point there (each game's raw extracted Preparations-equivalent passage
    # redirects to it via its own override rather than duplicating its content) — not a placeholder.
    target: 'Setup_08_NarrationVoiceSelect'
    snapshot: true