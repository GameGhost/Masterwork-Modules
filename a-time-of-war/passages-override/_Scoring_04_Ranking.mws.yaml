# Masterwork-authored passage (not extractor output) — replaces the reference app's native
# ViewRankingPage UI. Reached once Vars.winner is already set (by _ScoreEntry.mws.yaml,
# _TieBreaker1.mws.yaml, or _TieBreaker2.mws.yaml). Builds a ranked player list the same way
# passages-override/00327-WinnerHUB.mws.yaml already validated (array-of-record + toSorted), then
# displays each player's rank position with a crown on whoever shares the top score — covers both
# a single winner and a family win. Continue hands off to VarEndingsPassage, which navigates to
# whichever ending was already decided by the story (Vars.ending) — Ranking itself never picks
# an ending, only the winner display.
#
# All four rows sit inside one outer `section style: 'rank-panel'` — the fixed-size element carrying
# panel_ranking.png's own background (style.css's own comment on .style-rank-panel explains why this
# one panel can't shrink to fit the viewport like every other card in this module does: its divider
# lines are pixel-baked into the art, not drawn by CSS). Each row is its own `section style:
# 'rank-row'` (grid, not flex — see that rule's own comment for why) so rank-degree/name/crown lay
# out as one row instead of an inline run of text nodes — a real `image` node
# (image://inputs/ranking_crown) replaces the old `{icon:crown}` reference, which never resolved:
# `{icon:...}` inline syntax only ever resolves icon://, and this asset lives under
# assets/images/inputs/ranking_crown.png, not an icons/ path.
#
# All four `rank-row` sections always render, even in a 2-3 player game — only their *content* is
# conditional (empty for a rank position that doesn't exist). This is deliberate, not an oversight:
# style.css's row layout divides the panel's fixed height evenly across however many row sections
# actually exist, to stay in registration with the panel art's own pixel-baked divider lines — with
# only 2-3 rows present, the same math would spread them across the *whole* panel height instead of
# just the top 2-3 of 4 slots, sliding them out of alignment with where the dividers actually are.
---
format: 'mws/0.4'
passage_id: 'Ranking'
title: 'restext://Scoring_Rank_Title'
layout: 'ranking'
nodes:
- type: 'let'
  var: 'players_raw'
  expr: '[{ player_name: nameA, points: scoreA + (winnerA ? 1 : 0) }, { player_name: nameB, points: scoreB + (winnerB ? 1 : 0) }, { player_name: nameC, points: scoreC + (winnerC ? 1 : 0) }, { player_name: nameD, points: scoreD + (winnerD ? 1 : 0) }]'
- type: 'let'
  var: 'players_ranked'
  expr: 'players_raw.toSorted("descending", "points")'
- type: 'assign'
  var: 'winner'
  expr: 'winnerCount > 1 ? "The family" : players_ranked[0].player_name'
- type: 'let'
  var: 'top_score'
  expr: 'players_ranked[0].points'
- type: 'section'
  style: 'rank-panel'
  content:
  - type: 'section'
    style: 'rank-row'
    content:
    - type: 'text'
      value: 'restext://Scoring_Rank_1st'
      style: 'rank-degree'
    - type: 'text'
      value: '{players_ranked[0].player_name}'
      style: 'rank-name'
    - type: 'conditional'
      if: 'players_ranked[0].points == top_score'
      then:
      - type: 'image'
        asset: 'image://inputs/ranking_crown'
  - type: 'section'
    style: 'rank-row'
    content:
    - type: 'text'
      value: 'restext://Scoring_Rank_2nd'
      style: 'rank-degree'
    - type: 'text'
      value: '{players_ranked[1].player_name}'
      style: 'rank-name'
    - type: 'conditional'
      if: 'players_ranked[1].points == top_score'
      then:
      - type: 'image'
        asset: 'image://inputs/ranking_crown'
  - type: 'section'
    style: 'rank-row'
    content:
    - type: 'conditional'
      if: 'players >= 3'
      then:
      - type: 'text'
        value: 'restext://Scoring_Rank_3rd'
        style: 'rank-degree'
      - type: 'text'
        value: '{players_ranked[2].player_name}'
        style: 'rank-name'
      - type: 'conditional'
        if: 'players_ranked[2].points == top_score'
        then:
        - type: 'image'
          asset: 'image://inputs/ranking_crown'
  - type: 'section'
    style: 'rank-row'
    content:
    - type: 'conditional'
      if: 'players >= 4'
      then:
      - type: 'text'
        value: 'restext://Scoring_Rank_4th'
        style: 'rank-degree'
      - type: 'text'
        value: '{players_ranked[3].player_name}'
        style: 'rank-name'
      - type: 'conditional'
        if: 'players_ranked[3].points == top_score'
        then:
        - type: 'image'
          asset: 'image://inputs/ranking_crown'
- type: 'link'
  label: 'restext://Common_Continue'
  style: 'btn-brown'
  target: 'VarEndingsPassage'
  snapshot: true
