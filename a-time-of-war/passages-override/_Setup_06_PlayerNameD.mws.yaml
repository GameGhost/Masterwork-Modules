# Masterwork-authored onboarding passage (not extractor output) — see Modules/cost-of-disease/README.md.
# Same self-navigating input pattern as Setup_03_PlayerNameA. D is always the last player slot this
# module supports (manifest.yaml info.players-max: 4), so this always continues to town naming.
---
format: 'mws/0.4'
passage_id: 'Setup_06_PlayerNameD'
layout: 'player_setup'
nodes:
- type: 'conditional'
  if: 'nameD == ""'
  then:
  - type: 'text'
    value: '{icon:alert} **restext://Setup_PassBook_D**'
    style: 'setup-alert'
  - type: 'break'
    style: 'paragraph'
  - type: 'text'
    value: 'restext://Setup_NameEntry_LabelD'
    style: 'setup-input-label'
  - type: 'input'
    var: 'nameD'
    style: 'setup-input'
  - type: 'link'
    label: 'restext://Common_Continue'
    style: 'btn-brown'
    target: 'Setup_06_PlayerNameD'
    snapshot: false
  else:
  - type: 'popup'
    layout: 'note_clear'
    content:
    - type: 'let'
      var: 'nameGreeting'
      expr: '["restext://Setup_Greeting_1", "restext://Setup_Greeting_2", "restext://Setup_Greeting_3", "restext://Setup_Greeting_4"].shuffled("Setup06Greeting")[0]'
    - type: 'text'
      value: '{nameGreeting}'
    - type: 'break'
    - type: 'text'
      value: '{nameD}'
      style: 'text-xl'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      value: 'restext://Setup_WarmRegards'
    okay: 'restext://Common_Continue'
    target: 'Setup_07_TownNameEntry'
    snapshot: false