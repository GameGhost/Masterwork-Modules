# ../.source/FearoftheUnknown_Eng_v15.cs:18211
---
format: 'mws/0.4'
passage_id: 'BusMeetD'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:18216
- type: 'text'
  # ../en-US.restext:317 | "**Carefully pick up this ..."
  value: 'restext://Storybook_PickUpDevicePrivate'
# ../.source/FearoftheUnknown_Eng_v15.cs:18219
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:18225
- type: 'popup'
  # ../en-US.restext:53 | "Once you are ready, click..."
  label: 'restext://Click_RevealSecretConversation'
  layout: 'reveal'
  # ../en-US.restext:371 | "Close"
  cancel: 'restext://UIButton_Close'
  snapshot: true
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:18269
  - type: 'text'
    # ../en-US.restext:146 | "**A Sly Investment**"
    value: 'restext://Heading_ASlyInvestment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18271
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18275
  - type: 'text'
    # ../en-US.restext:162 | "**Journal Entry of {busm}..."
    value: 'restext://Heading_JournalEntryOfBusm_Cont'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18286
  - type: 'let'
    var: '_rnd_BusMeetD_0'
    # ../en-US.restext:243 | Narrative_FineHairsOnPalm | "I could distinctly see fi..."
    # ../en-US.restext:250 | Narrative_LeanedForwardCoarseWhisper | "He leaned forward, speaki..."
    expr: '["restext://Narrative_FineHairsOnPalm", "restext://Narrative_LeanedForwardCoarseWhisper"].shuffled("BusMeetD_0")[0]'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18284
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18286
  - type: 'text'
    # ../en-US.restext:1417 | "{_rnd_BusMeetD_0} \"Donat..."
    value: 'restext://BusMeetD_001'
    lets:
    - '_rnd_BusMeetD_0'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18301
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18303
  - type: 'conditional'
    if: 'busvp == 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18305
    - type: 'text'
      # ../en-US.restext:253 | "The man smiled once again..."
      value: 'restext://Narrative_ManSmiledSecondTime'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18306
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18309
  - type: 'text'
    # ../en-US.restext:244 | "\"**For $1**, you have my..."
    value: 'restext://Narrative_ForOneDollarNewServant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18322
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18324
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18328
    - type: 'text'
      # ../en-US.restext:246 | "**\"For $2**, I will guar..."
      value: 'restext://Narrative_ForTwoDollarsBallChain'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18336
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18339
  - type: 'conditional'
    if: '!bhome'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18343
    - type: 'text'
      # ../en-US.restext:245 | "**\"For $3**, I will offe..."
      value: 'restext://Narrative_ForThreeDollarsDeed'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18353
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18355
  - type: 'text'
    # ../en-US.restext:257 | "I was admittedly not impr..."
    value: 'restext://Narrative_NotImpressedByOffer'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18357
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18361
  - type: 'text'
    # ../en-US.restext:159 | "**How much would you like..."
    value: 'restext://Heading_HowMuchInvest'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18363
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18365
  - type: 'conditional'
    if: '!bhome'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18368
    - type: 'link'
      # ../en-US.restext:140 | "$3."
      label: 'restext://Dollar_Three'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18232
      - type: 'assign'
        var: 'Dcont'
        expr: 'Dcont + 3'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18233
      - type: 'assign'
        var: 'bhome'
        expr: 'nameD'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18369
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18372
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18375
    - type: 'link'
      # ../en-US.restext:141 | "$2."
      label: 'restext://Dollar_Two'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18240
      - type: 'assign'
        var: 'Dcont'
        expr: 'Dcont + 2'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18241
      - type: 'assign'
        var: 'btemp'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18242
      - type: 'assign'
        var: 'bnc'
        expr: 'bnc + 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18376
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18380
  - type: 'link'
    # ../en-US.restext:139 | "$1."
    label: 'restext://Dollar_One'
    target: 'BusThanks' # ./00154-BusThanks.mws.yaml
    snapshot: true
    onclick:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18249
    - type: 'assign'
      var: 'Dcont'
      expr: 'Dcont + 1'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18381
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18383
  - type: 'switch'
    on: 'busvp'
    cases:
    - match: 0
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18386
      - type: 'link'
        # ../en-US.restext:25 | "I'm not convinced."
        label: 'restext://Choice_NotConvinced'
        target: '${BusMeetDnextpsg}'
        snapshot: true
        onclick:
        # ../.source/FearoftheUnknown_Eng_v15.cs:18256
        - type: 'conditional'
          if: 'BusMeetDnextpsg == "" || BusMeetDnextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:18258
          - type: 'assign'
            var: 'BusMeetDnextpsg'
            expr: '["BusBargain", "BusNo"].shuffled("BusMeetD_1")[0]'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18387
      - type: 'text'
        # ../en-US.restext:92 | "_This option will provide..."
        value: 'restext://Directive_FiftyPercentChanceImproveDeal'
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18391
      - type: 'link'
        # ../en-US.restext:20 | "I will pass."
        label: 'restext://Choice_IWillPass'
        target: 'BusNo' # ./00155-BusNo.mws.yaml
        snapshot: true
