# ../.source/FearoftheUnknown_Eng_v15.cs:30644
---
format: 'mws/0.4'
passage_id: 'JailEvent1c'
# ../en-US.restext:2268 | JailEvent1c_001 | "Merciful Heritage"
# ../en-US.restext:2269 | JailEvent1c_002 | "A Sacrifice is Required"
title: '{jail == 1 ? "restext://JailEvent1c_001" : "restext://JailEvent1c_002"}'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:30646
- type: 'conditional'
  if: 'jail == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:30656
  - type: 'text'
    # ../en-US.restext:185 | "**Letter from {randomname..."
    value: 'restext://Heading_LetterFromRandomname_Cont'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30664
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30666
  - type: 'text'
    # ../en-US.restext:2272 | "{warden} has made one exc..."
    value: 'restext://JailEvent1c_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30674
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30679
  - type: 'text'
    # ../en-US.restext:2273 | "**{asylumup} Rule**"
    value: 'restext://JailEvent1c_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30682
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30684
  - type: 'text'
    # ../en-US.restext:2274 | "When a player with the {a..."
    value: 'restext://JailEvent1c_007'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30687
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:30689
  - type: 'link'
    # ../en-US.restext:29 | "Click to continue..."
    label: 'restext://Click_ContinueEllipsis_C'
    target: 'EndtotheCount' # ./00273-EndtotheCount.mws.yaml
    snapshot: true
  else:
  # ../.source/FearoftheUnknown_Eng_v15.cs:30693
  - type: 'conditional'
    if: 'asylumcount >= 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:30703
    - type: 'text'
      # ../en-US.restext:185 | "**Letter from {randomname..."
      value: 'restext://Heading_LetterFromRandomname_Cont'
    # ../.source/FearoftheUnknown_Eng_v15.cs:30711
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:30713
    - type: 'text'
      # ../en-US.restext:2270 | "What will I do with this ..."
      value: 'restext://JailEvent1c_003'
    # ../.source/FearoftheUnknown_Eng_v15.cs:30716
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:30720
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:29 | "Click to continue..."
      label: 'restext://Click_ContinueEllipsis_C'
      target: 'EndtotheCount' # ./00273-EndtotheCount.mws.yaml
      # ../en-US.restext:371 | "Close"
      okay: 'restext://UIButton_Close'
      snapshot: true
      header:
      # ../.source/FearoftheUnknown_Eng_v15.cs:30741
      - type: 'image'
        asset: 'image://setup/S2_EstateUpgradeBACK'
        style: 'setup-image'
      content:
      # ../.source/FearoftheUnknown_Eng_v15.cs:30744
      - type: 'text'
        # ../en-US.restext:2271 | "All players return their ..."
        value: 'restext://JailEvent1c_004'
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:30724
    - type: 'goto'
      target: 'EndtotheCount' # ./00273-EndtotheCount.mws.yaml
