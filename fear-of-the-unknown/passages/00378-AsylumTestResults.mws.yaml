# ../.source/FearoftheUnknown_Eng_v15.cs:37878
---
format: 'mws/0.4'
passage_id: 'AsylumTestResults'
# ../en-US.restext:8 | "Patient {question}"
title: 'restext://Common_004'
# ../en-US.restext:50 | "Assessment Results"
subtitle: 'restext://Common_046'
tags:
- 'revised'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:37891
- type: 'let'
  var: '_rnd_AsylumTestResults_0'
  # ../en-US.restext:2829 | AsylumTestResults_001 | "an abnormally low result ..."
  # ../en-US.restext:2830 | AsylumTestResults_002 | "a reasonably low result w..."
  # ../en-US.restext:2831 | AsylumTestResults_003 | "no statistically signific..."
  # ../en-US.restext:2832 | AsylumTestResults_004 | "a slightly higher result ..."
  # ../en-US.restext:2833 | AsylumTestResults_005 | "an abnormally high percen..."
  expr: '["restext://AsylumTestResults_001", "restext://AsylumTestResults_002", "restext://AsylumTestResults_003", "restext://AsylumTestResults_004", "restext://AsylumTestResults_005"].shuffled("AsylumTestResults_0")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:37897
- type: 'let'
  var: '_rnd_AsylumTestResults_1'
  # ../en-US.restext:2834 | AsylumTestResults_006 | "minor signs of malnutriti..."
  # ../en-US.restext:2835 | AsylumTestResults_007 | "a healthy individual with..."
  # ../en-US.restext:2836 | AsylumTestResults_008 | "nothing particularly conc..."
  # ../en-US.restext:2837 | AsylumTestResults_009 | "signs of obesity due to a..."
  expr: '["restext://AsylumTestResults_006", "restext://AsylumTestResults_007", "restext://AsylumTestResults_008", "restext://AsylumTestResults_009"].shuffled("AsylumTestResults_1")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:37889
- type: 'text'
  # ../en-US.restext:2838 | "After completion of a ful..."
  value: 'restext://AsylumTestResults_010'
  lets:
  - '_rnd_AsylumTestResults_0'
  - '_rnd_AsylumTestResults_1'
# ../.source/FearoftheUnknown_Eng_v15.cs:37901
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:37903
- type: 'conditional'
  if: 'test <= 3'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:37905
  - type: 'conditional'
    if: 'AsylumTestResultsnextpsg == "" || AsylumTestResultsnextpsg == 0'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:37907
    - type: 'assign'
      var: 'AsylumTestResultsnextpsg'
      expr: 'rand_between(1, 5, "AsylumTestResults_2")'
  # ../.source/FearoftheUnknown_Eng_v15.cs:37909
  - type: 'assign'
    var: 'outcome'
    expr: 'AsylumTestResultsnextpsg'
  # ../.source/FearoftheUnknown_Eng_v15.cs:37910
  - type: 'switch'
    on: 'outcome'
    cases:
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37912
      - type: 'text'
        # ../en-US.restext:2840 | "It is of my informed opin..."
        value: 'restext://AsylumTestResults_012'
      # ../.source/FearoftheUnknown_Eng_v15.cs:37921
      - type: 'break'
        style: 'paragraph'
    - match: 2
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37927
      - type: 'text'
        # ../en-US.restext:2841 | "Patient {question} has be..."
        value: 'restext://AsylumTestResults_013'
      # ../.source/FearoftheUnknown_Eng_v15.cs:37933
      - type: 'break'
        style: 'paragraph'
    - match: 3
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37939
      - type: 'text'
        # ../en-US.restext:2842 | "I have offered training t..."
        value: 'restext://AsylumTestResults_014'
      # ../.source/FearoftheUnknown_Eng_v15.cs:37944
      - type: 'break'
        style: 'paragraph'
    - match: 4
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37950
      - type: 'text'
        # ../en-US.restext:2843 | "After several aggressive ..."
        value: 'restext://AsylumTestResults_015'
      # ../.source/FearoftheUnknown_Eng_v15.cs:37953
      - type: 'break'
        style: 'paragraph'
    - match: 5
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37959
      - type: 'text'
        # ../en-US.restext:2844 | "It appears patient {quest..."
        value: 'restext://AsylumTestResults_016'
      # ../.source/FearoftheUnknown_Eng_v15.cs:37962
      - type: 'break'
        style: 'paragraph'
  else:
  # ../.source/FearoftheUnknown_Eng_v15.cs:37969
  - type: 'text'
    # ../en-US.restext:2839 | "Patient {question} has be..."
    value: 'restext://AsylumTestResults_011'
  # ../.source/FearoftheUnknown_Eng_v15.cs:37972
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:37976
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:37979
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:295 | "Click to continue..."
  label: 'restext://Common_291'
  target: '${round == 19 ? "Liberal" : round == 20 ? "Liberal2" : "Liberal3"}' # ./00026-Liberal.mws.yaml, ./00050-Liberal2.mws.yaml, ./00051-Liberal3.mws.yaml
  # ../en-US.restext:284 | "Close"
  okay: 'restext://Common_280'
  snapshot: true
  header:
  - type: 'conditional'
    if: 'test <= 3'
    then: []
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:38118
    - type: 'image'
      asset: 'image://setup/Self'
      style: 'setup-image'
  content:
  - type: 'conditional'
    if: 'test <= 3'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:38003
    - type: 'switch'
      on: 'outcome'
      cases:
      - match: 1
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:38009
        - type: 'image'
          asset: 'image://setup/Money_Icon'
          style: 'setup-image'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38012
        - type: 'text'
          # ../en-US.restext:2848 | "Pay **$1 to the supply** ..."
          value: 'restext://AsylumTestResults_020'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38018
        - type: 'break'
          style: 'paragraph'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38020
        - type: 'text'
          # ../en-US.restext:51 | "Then, return your {icon:c..."
          value: 'restext://Common_047'
      - match: 2
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:38030
        - type: 'image'
          asset: 'image://setup/MaladjustmentBack'
          style: 'setup-image'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38033
        - type: 'text'
          # ../en-US.restext:2849 | "Gain a **Maladjustment** ..."
          value: 'restext://AsylumTestResults_021'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38040
        - type: 'break'
          style: 'paragraph'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38042
        - type: 'text'
          # ../en-US.restext:51 | "Then, return your {icon:c..."
          value: 'restext://Common_047'
      - match: 3
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:38052
        - type: 'image'
          asset: 'image://setup/Caretaker'
          style: 'setup-image'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38055
        - type: 'text'
          # ../en-US.restext:2850 | "Immediately place one of ..."
          value: 'restext://AsylumTestResults_022'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38066
        - type: 'break'
          style: 'paragraph'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38068
        - type: 'text'
          # ../en-US.restext:51 | "Then, return your {icon:c..."
          value: 'restext://Common_047'
      - match: 4
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:38078
        - type: 'image'
          asset: 'image://setup/MaladjustmentBack'
          style: 'setup-image'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38081
        - type: 'text'
          # ../en-US.restext:2849 | "Gain a **Maladjustment** ..."
          value: 'restext://AsylumTestResults_021'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38088
        - type: 'break'
          style: 'paragraph'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38090
        - type: 'text'
          # ../en-US.restext:51 | "Then, return your {icon:c..."
          value: 'restext://Common_047'
      - match: 5
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:38096
        - type: 'image'
          asset: 'image://setup/Caretaker'
          style: 'setup-image'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38101
        - type: 'break'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38102
        - type: 'text'
          # ../en-US.restext:2851 | "Gain 2 {icon:insanity_icon}."
          value: 'restext://AsylumTestResults_023'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38105
        - type: 'break'
          style: 'paragraph'
        # ../.source/FearoftheUnknown_Eng_v15.cs:38107
        - type: 'text'
          # ../en-US.restext:51 | "Then, return your {icon:c..."
          value: 'restext://Common_047'
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:38121
    - type: 'conditional'
      if: 'round == 0'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:38123
      - type: 'text'
        # ../en-US.restext:2846 | "Lose 4 VP."
        value: 'restext://AsylumTestResults_018'
      else:
      # ../.source/FearoftheUnknown_Eng_v15.cs:38127
      - type: 'text'
        # ../en-US.restext:2845 | "If you have not placed yo..."
        value: 'restext://AsylumTestResults_017'
    # ../.source/FearoftheUnknown_Eng_v15.cs:38135
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:38137
    - type: 'text'
      # ../en-US.restext:2847 | "Then, **remove your** {ic..."
      value: 'restext://AsylumTestResults_019'
