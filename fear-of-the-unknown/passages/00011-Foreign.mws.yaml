# ../.source/FearoftheUnknown_Eng_v15.cs:2658
---
format: 'mws/0.4'
passage_id: 'Foreign'
# ../en-US.restext:324 | "Blame it on the Foreigners"
title: 'restext://Title_BlameItOnForeigners'
# ../en-US.restext:329 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:2665
- type: 'assign'
  var: 'mog'
  expr: '0'
# ../.source/FearoftheUnknown_Eng_v15.cs:2666
- type: 'assign'
  var: 'round'
  expr: '4'
# ../.source/FearoftheUnknown_Eng_v15.cs:2668
- type: 'conditional'
  if: '!forpg'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2672
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:370 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2676
    - type: 'image'
      asset: 'image://setup/AngryMobSetup1'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2678
    - type: 'text'
      # ../en-US.restext:466 | "Retrieve the **Memorial B..."
      value: 'restext://Foreign_002'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2689
    - type: 'conditional'
      if: 'players <= 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2691
      - type: 'text'
        # ../en-US.restext:467 | "For {playtxt} players, yo..."
        value: 'restext://Foreign_003'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2700
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2701
    - type: 'text'
      # ../en-US.restext:110 | "Place the Suspicion Marke..."
      value: 'restext://Directive_PlaceSuspicionMarker_Lead'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2704
    - type: 'conditional'
      if: '!Foreign'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2706
      - type: 'assign'
        var: 'Foreign'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:2707
      - type: 'switch'
        on: 'players'
        cases:
        - match: 4
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:2709
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 1'
        - match: 5
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:2713
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2716
    - type: 'text'
      # ../en-US.restext:130 | "**{tracker}** and the {ic..."
      value: 'restext://Directive_TrackerAndMobMarkerLeft'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2721
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2722
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2724
      - type: 'text'
        # ../en-US.restext:66 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
# ../.source/FearoftheUnknown_Eng_v15.cs:2732
- type: 'section'
  # ../en-US.restext:231 | "**Witching Hour**"
  title: 'restext://Heading_WitchingHour'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2741
  - type: 'text'
    # ../en-US.restext:468 | "The **{witch1}** has been..."
    value: 'restext://Foreign_008'
# ../.source/FearoftheUnknown_Eng_v15.cs:2749
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2751
- type: 'conditional'
  # ../en-US.restext:327 | "Church"
  if: 'witch1 == "restext://Title_Church"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2755
  - type: 'section'
    # ../en-US.restext:218 | "{icon:storybooktoken} **R..."
    title: 'restext://Heading_StorybookToken_RumorMill'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2764
    - type: 'text'
      # ../en-US.restext:470 | "With the Church placed un..."
      value: 'restext://Foreign_013'
  else:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2772
  - type: 'section'
    # ../en-US.restext:218 | "{icon:storybooktoken} **R..."
    title: 'restext://Heading_StorybookToken_RumorMill'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2781
    - type: 'text'
      # ../en-US.restext:133 | "When you visit the Church, "
      value: 'restext://Directive_VisitChurch_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2782
    - type: 'link'
      # ../en-US.restext:47 | "click here to spy on anot..."
      label: 'restext://Click_HereToSpyOnPlayer'
      target: 'CheckW1' # ./00079-CheckW1.mws.yaml
      snapshot: true
    # ../.source/FearoftheUnknown_Eng_v15.cs:2783
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2784
    - type: 'text'
      # ../en-US.restext:469 | "This will allow you to se..."
      value: 'restext://Foreign_012'
# ../.source/FearoftheUnknown_Eng_v15.cs:2787
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2791
- type: 'section'
  # ../en-US.restext:221 | "{icon:storybooktoken} **T..."
  title: 'restext://Heading_StorybookToken_TownStrength'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2802
  - type: 'text'
    # ../en-US.restext:100 | "Players may visit the Tow..."
    value: 'restext://Directive_MemorialBrickPurchase_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2812
  - type: 'link'
    # ../en-US.restext:49 | "click here."
    label: 'restext://Click_Here_Period'
    target: 'TownHallExplanation' # ./00228-TownHallExplanation.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:2814
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2818
- type: 'section'
  # ../en-US.restext:171 | "**Key to the City**"
  title: 'restext://Heading_KeyToTheCity'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2826
  - type: 'text'
    # ../en-US.restext:285 | "At the End of the Generat..."
    value: 'restext://Reward_MostBricks_KeyToCity'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2838
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2840
    - type: 'text'
      # ../en-US.restext:288 | "The player who has the se..."
      value: 'restext://Reward_SecondMostBricks'
# ../.source/FearoftheUnknown_Eng_v15.cs:2844
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2849
- type: 'section'
  # ../en-US.restext:471 | "{icon:storybooktoken} **B..."
  title: 'restext://Foreign_019'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2860
  - type: 'text'
    # ../en-US.restext:472 | "The only signs of moderni..."
    value: 'restext://Foreign_020'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2862
  - type: 'link'
    # ../en-US.restext:50 | "click here"
    label: 'restext://Click_Here_Plain'
    target: 'BankLibExplain' # ./00280-BankLibExplain.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:2863
  - type: 'text'
    value: '.'
# ../.source/FearoftheUnknown_Eng_v15.cs:2866
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2870
- type: 'section'
  # ../en-US.restext:200 | "**Second Round Event - Ac..."
  title: 'restext://Heading_SecondRoundEvent_Accusations'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2879
  - type: 'text'
    # ../en-US.restext:247 | "With a hideous hex upon t..."
    value: 'restext://Narrative_HideousHexSacrificeCousin'
# ../.source/FearoftheUnknown_Eng_v15.cs:2889
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2891
- type: 'conditional'
  if: 'revresolve == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2895
  - type: 'section'
    # ../en-US.restext:216 | "{icon:storybooktoken} **P..."
    title: 'restext://Heading_StorybookToken_PressingForward'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2905
    - type: 'text'
      # ../en-US.restext:98 | "If a player reaches 35VP, "
      value: 'restext://Directive_IfPlayerReaches35VP_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2907
    - type: 'conditional'
      if: 'revplot == "fortune"'
      then:
      - type: 'link'
        # ../en-US.restext:39 | "click here..."
        label: 'restext://Click_HereEllipsis_Lower'
        target: '35Fortune' # ./00193-35Fortune.mws.yaml
        snapshot: true
      else:
      - type: 'link'
        # ../en-US.restext:39 | "click here..."
        label: 'restext://Click_HereEllipsis_Lower'
        target: '35Misfortune' # ./00194-35Misfortune.mws.yaml
        snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:2911
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2915
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2920
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:35 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'WallEvent' # ./00071-WallEvent.mws.yaml
    # ../en-US.restext:375 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '4'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:295 | "The Early Years of the Se..."
      value: 'restext://Round_GenerationII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:299 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
