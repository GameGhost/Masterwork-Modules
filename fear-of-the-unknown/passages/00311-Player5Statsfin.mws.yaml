# ../.source/FearoftheUnknown_Eng_v15.cs:33336
---
format: 'mws/0.4'
passage_id: 'Player5Statsfin'
# ../en-US.restext:2504 | Player5Statsfin_001 | "{_rpl_Player5Statsfin_0} ..."
# ../en-US.restext:65 | Common_006 | "Complete"
title: '{warriorE ? "restext://Player5Statsfin_001" : "restext://Common_006"}'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:33339
- type: 'conditional'
  if: '!warriorE_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:97 | "Please enter the epic nam..."
      value: 'restext://Directive_EnterWarriorName'
    - type: 'input'
      label: ''
      var: 'warriorE'
    # ../en-US.restext:371 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'warriorE_submitted'
      expr: 'true'
    snapshot: true
    target: 'Player5Statsfin' # ./00311-Player5Statsfin.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:33355
- type: 'conditional'
  if: 'warriorE'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:33356
  - type: 'let'
    var: '_rpl_Player5Statsfin_0'
    expr: 'warriorE.replace("_5", "")'
# ../.source/FearoftheUnknown_Eng_v15.cs:33363
- type: 'text'
  # ../en-US.restext:2505 | "Agility: **{agiE}**"
  value: 'restext://Player5Statsfin_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:33368
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:33369
- type: 'text'
  # ../en-US.restext:2506 | "Strength: **{strE}**"
  value: 'restext://Player5Statsfin_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:33374
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:33375
- type: 'text'
  # ../en-US.restext:2507 | "Life: **{hitE}**"
  value: 'restext://Player5Statsfin_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:33380
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:33384
- type: 'text'
  # ../en-US.restext:200 | "**You are ready for a tri..."
  value: 'restext://Heading_ReadyForTrialByCombat'
# ../.source/FearoftheUnknown_Eng_v15.cs:33386
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:33388
- type: 'text'
  # ../en-US.restext:103 | "If this is correct, please "
  value: 'restext://Directive_IfCorrectPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:33389
- type: 'link'
  # ../en-US.restext:59 | "click to continue..."
  label: 'restext://Click_ToContinueEllipsis_Lower'
  target: 'BattleIntro' # ./00225-BattleIntro.mws.yaml
  snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:33390
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:33393
- type: 'text'
  # ../en-US.restext:104 | "If this is in error, please "
  value: 'restext://Directive_IfErrorPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:33394
- type: 'link'
  # ../en-US.restext:52 | "return to the start..."
  label: 'restext://Click_ReturnToStart'
  target: 'Player5StatEntry' # ./00307-Player5StatEntry.mws.yaml
  snapshot: true
