# ../.source/FearoftheUnknown_Eng_v15.cs:23067
- type: 'let'
  var: '_rnd_GainFamilyPlot_0'
  expr: '["I have planned for a grave plot to be installed upon the estate grounds to keep my remains from being contaminated in death by those who never accepted me in life. Yes, I take full responsibility for the rift this will cause between myself and the whole superstitious lot. Damn those insufferable peons!", "I refuse to mend bridges built between myself and these simpletons. Why would I risk the inevitable defilement of our esteemed heritage in a public cemetery? My family will be buried upon my own lands by my own terms! I deserve to rest in peace while they deserve to rot in a hell of their own creation!"].shuffled("GainFamilyPlot_0")[0]'
