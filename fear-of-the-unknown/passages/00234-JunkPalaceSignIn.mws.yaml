# ../.source/FearoftheUnknown_Eng_v15.cs:26871
- type: 'let'
  var: '_rnd_JunkPalaceSignIn_0'
  expr: '["Let me tell you of the day I ventured to the center of {townname} and met with {warden}. Though I will spare you the gory details of the horrors I witnessed upon my arrival.", "The grounds of the old jail appeared even more imposing than they had been when the inmates were enclosed inside its iron walls. I made sure that my visit was brief, but with delinquent eyes upon me and obscene messages written on the walls in crude scarlet streaks, it was certainly not made short enough.", "As I arrived at the steps of the Junk Palace, I was greeted by a rough guard wearing an apron fashioned with protective scraps of steel. ''Nice to meat you,'' the man who introduced himself as ''Grinder'' said. ''I have no beef with you.'' And so I gained entrance to this decaying institution where the walls fall to pieces and metal springs from the Earth."].shuffled("JunkPalaceSignIn_0")[0]'
