    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:19329
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:19333
- type: 'section'
  # ../en-US.restext:223 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:19341
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:19342
  - type: 'text'
    # ../en-US.restext:76 | " for an explanation of th..."
