  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:19326
  - type: 'text'
    # ../en-US.restext:77 | "When a player completes o..."
    value: 'restext://Directive_CompletesMonsterExperiment_Fragment'
