# ../.source/FearoftheUnknown_Eng_v15.cs:19192
---
format: 'mws/0.4'
passage_id: 'Creature2'
# ../en-US.restext:360 | "The Creature Re emerges"
title: 'restext://Title_TheCreatureReemerges'
# ../en-US.restext:344 | "Middle Years"
subtitle: 'restext://Title_MiddleYears'
tags:
- 'HUB'
layout: 'hub_middle'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:19199
- type: 'assign'
  var: 'round'
  expr: '8'
# ../.source/FearoftheUnknown_Eng_v15.cs:19200
- type: 'assign'
  var: 'busvp'
  expr: '0'
# ../.source/FearoftheUnknown_Eng_v15.cs:19201
- type: 'assign'
  var: 'btemp'
  expr: '0'
# ../.source/FearoftheUnknown_Eng_v15.cs:19203
- type: 'conditional'
  if: 'crpg == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:19207
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:370 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:19211
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:19213
    - type: 'switch'
      on: 'kill'
      cases:
      - match: 'butcher'
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:19215
        - type: 'text'
          # ../en-US.restext:1477 | "Turn to page 6 of the Vil..."
          value: 'restext://Creature2_001'
      - match: 'blacksmith'
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:19219
        - type: 'text'
          # ../en-US.restext:1478 | "Turn to page 7 of the Vil..."
          value: 'restext://Creature2_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:19227
- type: 'section'
  # ../en-US.restext:206 | "{icon:storybooktoken} **A..."
  title: 'restext://Heading_StorybookToken_Asylum'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:19237
  - type: 'text'
    # ../en-US.restext:132 | "Visiting the Asylum allow..."
    value: 'restext://Directive_VisitAsylumLose1Insanity_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:19249
  - type: 'link'
    # ../en-US.restext:41 | "click here for a message"
    label: 'restext://Click_HereForMessage_NoPunct'
    target: 'AsylumSignIn' # ./00244-AsylumSignIn.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:19251
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:19255
- type: 'section'
  # ../en-US.restext:209 | "{icon:storybooktoken} **B..."
  title: 'restext://Heading_StorybookToken_BusinessMeeting'
