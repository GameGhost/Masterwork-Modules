  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:19265
  - type: 'text'
    # ../en-US.restext:134 | "Visiting the **House on t..."
    value: 'restext://Directive_VisitHouseOnHillGain2_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:19282
  - type: 'link'
    # ../en-US.restext:42 | "click here for a message."
    label: 'restext://Click_HereForMessage_Period'
    target: 'BusinessMeet' # ./00146-BusinessMeet.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:19284
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:19289
- type: 'section'
  # ../en-US.restext:210 | "{icon:storybooktoken} **C..."
  title: 'restext://Heading_StorybookToken_CreaturesRequests'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:19300
  - type: 'text'
    # ../en-US.restext:112 | "When taking the **Perform..."
    value: 'restext://Directive_PuppyBrideExperimentsAvailable'
