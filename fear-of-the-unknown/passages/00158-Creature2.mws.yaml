# ../.source/FearoftheUnknown_Eng_v15.cs:19345
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:19348
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:19354
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:34 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_MoveNextRound'
    target: 'S4Asylum' # ./00021-S4Asylum.mws.yaml
    # ../en-US.restext:375 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '5'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:297 | "The Middle Years of the S..."
      value: 'restext://Round_GenerationII_MiddleEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:298 | "Then, perform all Start o..."
      value: 'restext://Round_StartLateYears_Rule'
