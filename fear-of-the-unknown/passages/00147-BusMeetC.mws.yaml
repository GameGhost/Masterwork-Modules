# ../.source/FearoftheUnknown_Eng_v15.cs:17612
---
format: 'mws/0.4'
passage_id: 'BusMeetC'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:17617
- type: 'text'
  # ../en-US.restext:327 | "**Carefully pick up this ..."
  value: 'restext://Storybook_PickUpDevicePrivate'
# ../.source/FearoftheUnknown_Eng_v15.cs:17620
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:17626
- type: 'popup'
  # ../en-US.restext:53 | "Once you are ready, click..."
  label: 'restext://Click_RevealSecretConversation'
  layout: 'reveal'
  # ../en-US.restext:371 | "Close"
  cancel: 'restext://UIButton_Close'
  snapshot: true
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:17669
  - type: 'text'
    # ../en-US.restext:156 | "**A Sly Investment**"
    value: 'restext://Heading_ASlyInvestment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17671
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17675
  - type: 'text'
    # ../en-US.restext:172 | "**Journal Entry of {busm}..."
    value: 'restext://Heading_JournalEntryOfBusm_Cont'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17686
  - type: 'let'
    var: '_rnd_BusMeetC_0'
    # ../en-US.restext:253 | Narrative_FineHairsOnPalm | "I could distinctly see fi..."
    # ../en-US.restext:260 | Narrative_LeanedForwardCoarseWhisper | "He leaned forward, speaki..."
    expr: '["restext://Narrative_FineHairsOnPalm", "restext://Narrative_LeanedForwardCoarseWhisper"].shuffled("BusMeetC_0")[0]'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17684
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17686
  - type: 'text'
    # ../en-US.restext:1406 | "{_rnd_BusMeetC_0} \"Donat..."
    value: 'restext://BusMeetC_005'
    lets:
    - '_rnd_BusMeetC_0'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17701
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17703
  - type: 'conditional'
    if: 'busvp == 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17705
    - type: 'text'
      # ../en-US.restext:263 | "The man smiled once again..."
      value: 'restext://Narrative_ManSmiledSecondTime'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17706
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17709
  - type: 'text'
    # ../en-US.restext:254 | "\"**For $1**, you have my..."
    value: 'restext://Narrative_ForOneDollarNewServant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17722
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17724
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17728
    - type: 'text'
      # ../en-US.restext:256 | "**\"For $2**, I will guar..."
      value: 'restext://Narrative_ForTwoDollarsBallChain'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17736
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17739
  - type: 'conditional'
    if: '!bhome'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17743
    - type: 'text'
      # ../en-US.restext:255 | "**\"For $3**, I will offe..."
      value: 'restext://Narrative_ForThreeDollarsDeed'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17753
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17755
  - type: 'text'
    # ../en-US.restext:267 | "I was admittedly not impr..."
    value: 'restext://Narrative_NotImpressedByOffer'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17757
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17761
  - type: 'text'
    # ../en-US.restext:169 | "**How much would you like..."
    value: 'restext://Heading_HowMuchInvest'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17763
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17765
  - type: 'conditional'
    if: '!bhome'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17768
    - type: 'link'
      # ../en-US.restext:150 | "$3."
      label: 'restext://Dollar_Three'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17633
      - type: 'assign'
        var: 'Ccont'
        expr: 'Ccont + 3'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17634
      - type: 'assign'
        var: 'bhome'
        expr: 'nameC'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17769
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17772
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17775
    - type: 'link'
      # ../en-US.restext:151 | "$2."
      label: 'restext://Dollar_Two'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17641
      - type: 'assign'
        var: 'Ccont'
        expr: 'Ccont + 2'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17642
      - type: 'assign'
        var: 'btemp'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17643
      - type: 'assign'
        var: 'bnc'
        expr: 'bnc + 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17776
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17780
  - type: 'link'
    # ../en-US.restext:149 | "$1."
    label: 'restext://Dollar_One'
    target: 'BusThanks' # ./00154-BusThanks.mws.yaml
    snapshot: true
    onclick:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17650
    - type: 'assign'
      var: 'Ccont'
      expr: 'Ccont + 1'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17781
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17783
  - type: 'switch'
    on: 'busvp'
    cases:
    - match: 0
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17786
      - type: 'link'
        # ../en-US.restext:25 | "I'm not convinced."
        label: 'restext://Choice_NotConvinced'
        target: '${BusMeetCnextpsg}'
        snapshot: true
        onclick:
        # ../.source/FearoftheUnknown_Eng_v15.cs:17657
        - type: 'conditional'
          if: 'BusMeetCnextpsg == "" || BusMeetCnextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:17659
          - type: 'assign'
            var: 'BusMeetCnextpsg'
            expr: '["BusBargain", "BusNo"].shuffled("BusMeetC_1")[0]'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17787
      - type: 'text'
        # ../en-US.restext:102 | "_This option will provide..."
        value: 'restext://Directive_FiftyPercentChanceImproveDeal'
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17791
      - type: 'link'
        # ../en-US.restext:20 | "I will pass."
        label: 'restext://Choice_IWillPass'
        target: 'BusNo' # ./00155-BusNo.mws.yaml
        snapshot: true
