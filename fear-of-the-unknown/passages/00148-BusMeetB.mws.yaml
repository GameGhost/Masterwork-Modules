# ../.source/FearoftheUnknown_Eng_v15.cs:17811
---
format: 'mws/0.4'
passage_id: 'BusMeetB'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:17816
- type: 'text'
  # ../en-US.restext:325 | "**Carefully pick up this ..."
  value: 'restext://Storybook_PickUpDevicePrivate'
# ../.source/FearoftheUnknown_Eng_v15.cs:17819
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:17825
- type: 'popup'
  # ../en-US.restext:53 | "Once you are ready, click..."
  label: 'restext://Click_RevealSecretConversation'
  layout: 'reveal'
  # ../en-US.restext:368 | "Close"
  cancel: 'restext://UIButton_Close'
  snapshot: true
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:17869
  - type: 'text'
    # ../en-US.restext:149 | "**A Sly Investment**"
    value: 'restext://Heading_ASlyInvestment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17871
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17875
  - type: 'text'
    # ../en-US.restext:167 | "**Journal Entry of {busm}..."
    value: 'restext://Heading_JournalEntryOfBusm_Cont'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17886
  - type: 'let'
    var: '_rnd_BusMeetB_0'
    # ../en-US.restext:251 | Narrative_FineHairsOnPalm | "I could distinctly see fi..."
    # ../en-US.restext:258 | Narrative_LeanedForwardCoarseWhisper | "He leaned forward, speaki..."
    expr: '["restext://Narrative_FineHairsOnPalm", "restext://Narrative_LeanedForwardCoarseWhisper"].shuffled("BusMeetB_0")[0]'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17884
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17886
  - type: 'text'
    # ../en-US.restext:1410 | "{_rnd_BusMeetB_0} \"Donat..."
    value: 'restext://BusMeetB_001'
    lets:
    - '_rnd_BusMeetB_0'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17901
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17903
  - type: 'conditional'
    if: 'busvp == 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17905
    - type: 'text'
      # ../en-US.restext:261 | "The man smiled once again..."
      value: 'restext://Narrative_ManSmiledSecondTime'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17906
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17909
  - type: 'text'
    # ../en-US.restext:252 | "\"**For $1**, you have my..."
    value: 'restext://Narrative_ForOneDollarNewServant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17922
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17924
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17928
    - type: 'text'
      # ../en-US.restext:254 | "**\"For $2**, I will guar..."
      value: 'restext://Narrative_ForTwoDollarsBallChain'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17936
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17939
  - type: 'conditional'
    if: '!bhome'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17943
    - type: 'text'
      # ../en-US.restext:253 | "**\"For $3**, I will offe..."
      value: 'restext://Narrative_ForThreeDollarsDeed'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17953
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17955
  - type: 'text'
    # ../en-US.restext:265 | "I was admittedly not impr..."
    value: 'restext://Narrative_NotImpressedByOffer'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17957
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17961
  - type: 'text'
    # ../en-US.restext:164 | "**How much would you like..."
    value: 'restext://Heading_HowMuchInvest'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17963
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17965
  - type: 'conditional'
    if: '!bhome'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17968
    - type: 'link'
      # ../en-US.restext:143 | "$3."
      label: 'restext://Dollar_Three'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17832
      - type: 'assign'
        var: 'Bcont'
        expr: 'Bcont + 3'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17833
      - type: 'assign'
        var: 'bhome'
        expr: 'nameB'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17969
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17972
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17975
    - type: 'link'
      # ../en-US.restext:144 | "$2."
      label: 'restext://Dollar_Two'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17840
      - type: 'assign'
        var: 'Bcont'
        expr: 'Bcont + 2'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17841
      - type: 'assign'
        var: 'btemp'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17842
      - type: 'assign'
        var: 'bnc'
        expr: 'bnc + 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:17976
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17980
  - type: 'link'
    # ../en-US.restext:142 | "$1."
    label: 'restext://Dollar_One'
    target: 'BusThanks' # ./00154-BusThanks.mws.yaml
    snapshot: true
    onclick:
    # ../.source/FearoftheUnknown_Eng_v15.cs:17849
    - type: 'assign'
      var: 'Bcont'
      expr: 'Bcont + 1'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17981
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:17983
  - type: 'switch'
    on: 'busvp'
    cases:
    - match: 0
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17986
      - type: 'link'
        # ../en-US.restext:25 | "I'm not convinced."
        label: 'restext://Choice_NotConvinced'
        target: '${BusMeetBnextpsg}'
        snapshot: true
        onclick:
        # ../.source/FearoftheUnknown_Eng_v15.cs:17856
        - type: 'conditional'
          if: 'BusMeetBnextpsg == "" || BusMeetBnextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:17858
          - type: 'assign'
            var: 'BusMeetBnextpsg'
            expr: '["BusBargain", "BusNo"].shuffled("BusMeetB_1")[0]'
      # ../.source/FearoftheUnknown_Eng_v15.cs:17987
      - type: 'text'
        # ../en-US.restext:95 | "_This option will provide..."
        value: 'restext://Directive_FiftyPercentChanceImproveDeal'
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:17991
      - type: 'link'
        # ../en-US.restext:20 | "I will pass."
        label: 'restext://Choice_IWillPass'
        target: 'BusNo' # ./00155-BusNo.mws.yaml
        snapshot: true
