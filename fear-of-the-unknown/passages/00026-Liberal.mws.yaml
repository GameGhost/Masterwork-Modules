# ../.source/FearoftheUnknown_Eng_v15.cs:4554
---
format: 'mws/0.4'
passage_id: 'Liberal'
# ../en-US.restext:325 | "Acceptance"
title: 'restext://Title_Acceptance'
# ../en-US.restext:332 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:4562
- type: 'conditional'
  if: '!gen3pg'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4566
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:366 | "Accept"
    okay: 'restext://UIButton_Accept'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4571
    - type: 'switch'
      on: 'creature'
      cases:
      - match: 2
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:4573
        - type: 'image'
          asset: 'image://setup/VillageChronicleCover'
          style: 'setup-image'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4574
        - type: 'text'
          # ../en-US.restext:596 | "Turn to page **10** of th..."
          value: 'restext://Liberal_001'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4580
        - type: 'break'
          style: 'paragraph'
      - match: 1
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:4585
        - type: 'image'
          asset: 'image://setup/S2_HuntTokenFRONT'
          style: 'setup-image'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4586
        - type: 'text'
          # ../en-US.restext:597 | "Turn to page **11** of th..."
          value: 'restext://Liberal_002'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4592
        - type: 'break'
          style: 'paragraph'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4594
        - type: 'text'
          # ../en-US.restext:121 | "Retrieve the Hunt tokens ..."
          value: 'restext://Directive_RetrieveHuntTokensFaceUp'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4597
        - type: 'break'
          style: 'paragraph'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4599
        - type: 'text'
          # ../en-US.restext:598 | "Shuffle them and randomly..."
          value: 'restext://Liberal_003'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4602
        - type: 'break'
        # ../.source/FearoftheUnknown_Eng_v15.cs:4603
        - type: 'conditional'
          if: 'players == 3'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:4605
          - type: 'text'
            # ../en-US.restext:68 | "Then, since this is a 3 p..."
            value: 'restext://Directive_3Player_PassMarker_A'
          # ../.source/FearoftheUnknown_Eng_v15.cs:4606
          - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:4613
- type: 'section'
  # ../en-US.restext:210 | "**Special Servant Rule**"
  title: 'restext://Heading_SpecialServantRule'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4622
  - type: 'text'
    # ../en-US.restext:140 | "Due to the government-fun..."
    value: 'restext://Directive_WorkReintroductionServantsNotLost'
# ../.source/FearoftheUnknown_Eng_v15.cs:4629
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:4632
- type: 'section'
  # ../en-US.restext:199 | "**Rehabilitation Token**"
  title: 'restext://Heading_RehabilitationToken'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4641
  - type: 'text'
    # ../en-US.restext:119 | "The {icon:s2_rehabilitati..."
    value: 'restext://Directive_RehabilitationTokenMovesLikeMob'
# ../.source/FearoftheUnknown_Eng_v15.cs:4650
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4654
- type: 'section'
  # ../en-US.restext:219 | "{icon:storybooktoken} **A..."
  title: 'restext://Heading_StorybookToken_FocusOnRehabilitation'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4665
  - type: 'text'
    # ../en-US.restext:131 | "When a player's token ove..."
    value: 'restext://Directive_TokenOverlapsRehabilitation_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4674
  - type: 'link'
    # ../en-US.restext:44 | "click here to be committed."
    label: 'restext://Click_HereToBeCommitted'
    target: 'AsylumTreatment' # ./00179-AsylumTreatment.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:4677
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4679
- type: 'conditional'
  if: 'creature == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4683
  - type: 'section'
    # ../en-US.restext:225 | "{icon:storybooktoken}**Th..."
    title: 'restext://Heading_StorybookToken_TheHuntIsOn_NoSpace'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4693
    - type: 'text'
      # ../en-US.restext:137 | "Any time a player visits ..."
      value: 'restext://Directive_VisitLocationClaimHuntToken'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4696
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4698
    - type: 'text'
      # ../en-US.restext:93 | "At the end of each round,..."
      value: 'restext://Directive_ExpeditionKillCreature_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4705
    - type: 'link'
      # ../en-US.restext:49 | "click here."
      label: 'restext://Click_Here_Period'
      target: 'HuntExplanation' # ./00076-HuntExplanation.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:4708
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4712
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4732
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:30 | "Click here to continue to..."
    label: 'restext://Click_ContinueNextRound'
    target: '${creature == 1 && exped == 0 ? "Expedition1" : "LiberalEvent3"}' # ./00049-Expedition1.mws.yaml, ./00258-LiberalEvent3.mws.yaml
    # ../en-US.restext:371 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:299 | "The Early Years of the Th..."
      value: 'restext://Round_GenerationIII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:306 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
# ../.source/FearoftheUnknown_Eng_v15.cs:4737
- type: 'assign'
  var: 'round'
  expr: '19'
