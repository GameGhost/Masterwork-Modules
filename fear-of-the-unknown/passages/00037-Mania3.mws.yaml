# ../.source/FearoftheUnknown_Eng_v15.cs:5731
---
format: 'mws/0.4'
passage_id: 'Mania3'
# ../en-US.restext:365 | "WITCH HUNT"
title: 'restext://Title_WitchHuntCaps'
# ../en-US.restext:340 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:5738
- type: 'assign'
  var: 'round'
  expr: '3'
# ../.source/FearoftheUnknown_Eng_v15.cs:5740
- type: 'conditional'
  if: '!whpg'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5742
  - type: 'switch'
    on: 'kill'
    cases:
    - match: 'butcher'
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:5746
      - type: 'popup'
        layout: 'setup'
        # ../en-US.restext:366 | "Accept"
        okay: 'restext://UIButton_Accept'
        header:
        # ../.source/FearoftheUnknown_Eng_v15.cs:5750
        - type: 'image'
          asset: 'image://setup/VillageChronicleCover'
          style: 'setup-image'
        content:
        # ../.source/FearoftheUnknown_Eng_v15.cs:5752
        - type: 'text'
          # ../en-US.restext:667 | "Turn to page **2** of the..."
          value: 'restext://Mania3_002'
    - match: 'blacksmith'
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:5765
      - type: 'popup'
        layout: 'setup'
        # ../en-US.restext:366 | "Accept"
        okay: 'restext://UIButton_Accept'
        header:
        # ../.source/FearoftheUnknown_Eng_v15.cs:5769
        - type: 'image'
          asset: 'image://setup/VillageChronicleCover'
          style: 'setup-image'
        content:
        # ../.source/FearoftheUnknown_Eng_v15.cs:5771
        - type: 'text'
          # ../en-US.restext:668 | "Turn to page **3** of the..."
          value: 'restext://Mania3_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:5781
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:5784
- type: 'section'
  # ../en-US.restext:669 | "**PARANOIA - Town Hall**"
  title: 'restext://Mania3_004'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5793
  - type: 'text'
    # ../en-US.restext:670 | "By visiting the Town Hall..."
    value: 'restext://Mania3_005'
# ../.source/FearoftheUnknown_Eng_v15.cs:5805
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:5809
- type: 'section'
  # ../en-US.restext:218 | "{icon:storybooktoken} **F..."
  title: 'restext://Heading_StorybookToken_FamilyPlot'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5819
  - type: 'text'
    # ../en-US.restext:105 | "Any time a player is over..."
    value: 'restext://Directive_OvertakenByMob_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:5823
  - type: 'link'
    # ../en-US.restext:55 | "click here for a special ..."
    label: 'restext://Click_SpecialMessage_Generic1'
    target: 'PlotPlayerCheckin' # ./00202-PlotPlayerCheckin.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:5825
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:5829
- type: 'conditional'
  if: 'fp10vp == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5833
  - type: 'section'
    # ../en-US.restext:211 | "{icon:storybooktoken} **10VP**"
    title: 'restext://Heading_StorybookToken_10VP'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:5842
    - type: 'text'
      # ../en-US.restext:114 | "Whenever a player reaches..."
      value: 'restext://Directive_Reaches10VP_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:5843
    - type: 'link'
      # ../en-US.restext:49 | "click here."
      label: 'restext://Click_Here_Period'
      target: 'FP10VP' # ./00129-FP10VP.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:5845
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:5849
- type: 'conditional'
  if: 'fpresearch2 == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5853
  - type: 'section'
    # ../en-US.restext:223 | "{icon:storybooktoken} **R..."
    title: 'restext://Heading_StorybookToken_ResearchLevel2'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:5862
    - type: 'text'
      # ../en-US.restext:117 | "Whenever a player reaches..."
      value: 'restext://Directive_ReachesJournalLevel2_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:5863
    - type: 'link'
      # ../en-US.restext:50 | "click here"
      label: 'restext://Click_Here_Plain'
      target: 'FPResearch2' # ./00130-FPResearch2.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:5865
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:5869
- type: 'conditional'
  if: 'fpsanity3 == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5873
  - type: 'section'
    # ../en-US.restext:221 | "{icon:storybooktoken} **I..."
    title: 'restext://Heading_StorybookToken_InsanityOf3'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:5883
    - type: 'text'
      # ../en-US.restext:116 | "Whenever a player reaches..."
      value: 'restext://Directive_ReachesInsanitySpace3_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:5886
    - type: 'link'
      # ../en-US.restext:37 | "Click here..."
      label: 'restext://Click_HereEllipsis'
      target: 'FPSanity3' # ./00131-FPSanity3.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:5888
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:5892
- type: 'conditional'
  if: 'fpcreepy3 == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5896
  - type: 'section'
    # ../en-US.restext:217 | "{icon:storybooktoken} **C..."
    title: 'restext://Heading_StorybookToken_Creepy'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:5906
    - type: 'text'
      # ../en-US.restext:115 | "Whenever a player reaches..."
      value: 'restext://Directive_ReachesCreepySpace3_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:5909
    - type: 'link'
      # ../en-US.restext:671 | "click here…"
      label: 'restext://Mania3_006'
      target: 'FPCreepy3' # ./00132-FPCreepy3.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:5911
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:5915
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:5918
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:5923
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:672 | "Click here at the End of ..."
    label: 'restext://Mania3_007'
    target: 'FPFateHub' # ./00138-FPFateHub.mws.yaml
    # ../en-US.restext:371 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '3'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:673 | "The Late Years of the Fir..."
      value: 'restext://Mania3_008'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:298 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
