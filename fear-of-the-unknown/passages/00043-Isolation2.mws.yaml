    label: 'restext://Click_HereToCompleteVerification'
    target: 'IsoIdentificationSignIn' # ./00211-IsoIdentificationSignIn.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:6792
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6796
  - type: 'text'
    # ../en-US.restext:102 | "_(If you have not verifie..."
    value: 'restext://Directive_NotVerifiedLose4VP'
# ../.source/FearoftheUnknown_Eng_v15.cs:6804
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6808
- type: 'section'
  # ../en-US.restext:214 | "{icon:storybooktoken} **B..."
  title: 'restext://Heading_StorybookToken_BrazenOffer'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6818
  - type: 'text'
    # ../en-US.restext:125 | "Once per round, each play..."
    value: 'restext://Directive_SmugglersDockVisit_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6837
  - type: 'link'
    # ../en-US.restext:40 | "click here for the conseq..."
    label: 'restext://Click_HereForConsequences_NoPunct'
    target: 'SmugConsequence' # ./00090-SmugConsequence.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:6838
  - type: 'text'
    value: '.'
# ../.source/FearoftheUnknown_Eng_v15.cs:6840
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6845
- type: 'section'
  # ../en-US.restext:230 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6853
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:6854
  - type: 'text'
    # ../en-US.restext:76 | " for an explanation of th..."
    value: 'restext://Directive_ChurchExplanation_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:6857
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6861
- type: 'section'
  # ../en-US.restext:731 | "**The Experiment**"
  title: 'restext://Isolation2_004'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6869
  - type: 'text'
    # ../en-US.restext:732 | "Anytime a player completes "
    value: 'restext://Isolation2_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6872
  - type: 'switch'
    on: 'ex'
    cases:
    - match: 'bio'
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:6874
      - type: 'text'
        # ../en-US.restext:734 | "**a Biology**"
        value: 'restext://Isolation2_007'
    - match: 'chem'
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:6878
      - type: 'text'
        # ../en-US.restext:735 | "**a Chemistry**"
        value: 'restext://Isolation2_008'
    default:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6882
    - type: 'text'
      # ../en-US.restext:733 | "**an Engineering**"
      value: 'restext://Isolation2_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6884
  - type: 'text'
    # ../en-US.restext:736 | " **Experiment**, that pla..."
    value: 'restext://Isolation2_009'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6890
  - type: 'conditional'
    if: 'players >= 3'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6894
    - type: 'text'
      # ../en-US.restext:737 | "_Only 1 token can be coll..."
      value: 'restext://Isolation2_010'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6897
  - type: 'conditional'
    if: 'players == 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6899
    - type: 'text'
      # ../en-US.restext:738 | "The player who gains the ..."
      value: 'restext://Isolation2_011'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6912
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6916
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:35 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'SmugEvent2' # ./00094-SmugEvent2.mws.yaml
    # ../en-US.restext:369 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '8'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:301 | "The Middle Years of the T..."
      value: 'restext://Round_GenerationIII_MiddleEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:305 | "Then, perform all Start o..."
      value: 'restext://Round_StartLateYears_Rule'
