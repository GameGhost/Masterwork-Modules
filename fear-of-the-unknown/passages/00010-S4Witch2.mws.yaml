- type: 'popup'
  layout: 'end_of_generation'
  # ../en-US.restext:372 | "Confirm"
  okay: 'restext://UIButton_Confirm'
  content:
  - type: 'text'
    # ../en-US.restext:95 | "Remove all player pieces ..."
    value: 'restext://Directive_EndGeneration_ReturnUnusedStorybookTokens'
