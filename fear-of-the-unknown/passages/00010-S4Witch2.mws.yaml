  # ../.source/FearoftheUnknown_Eng_v15.cs:2614
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2616
  - type: 'text'
    # ../en-US.restext:457 | "You must forgive me for n..."
    value: 'restext://S4Witch2_004'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2617
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2619
  - type: 'text'
    # ../en-US.restext:458 | "However, these rumors wer..."
    value: 'restext://S4Witch2_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2626
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2629
