    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2529
  - type: 'text'
    # ../en-US.restext:191 | "My dear {randomname} II,"
    value: 'restext://Heading_MyDearRandomnameII'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2550
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2552
  - type: 'text'
    # ../en-US.restext:460 | "You must forgive the late..."
    value: 'restext://S4Witch2_007'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2557
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2559
  - type: 'text'
    # ../en-US.restext:461 | "For a few years, I watche..."
    value: 'restext://S4Witch2_008'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2562
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2564
  - type: 'text'
    # ../en-US.restext:462 | "With **no one overtaken t..."
