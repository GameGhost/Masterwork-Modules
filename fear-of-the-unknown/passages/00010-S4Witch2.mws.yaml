  # ../.source/FearoftheUnknown_Eng_v15.cs:2531
  - type: 'switch'
    on: 'players'
    cases:
    - match: 2
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2533
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB].shuffled("S4Witch2_0")[0]'
    - match: 3
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2537
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB, nameC].shuffled("S4Witch2_1")[0]'
