# ../.source/FearoftheUnknown_Eng_v15.cs:6470
---
format: 'mws/0.4'
passage_id: 'Tension2'
tags:
- 'format'
- 'HUB'
layout: 'hub_middle'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:6472
- type: 'conditional'
  if: 'tension == "bad"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6476
  - type: 'text'
    # ../en-US.restext:723 | "**The Enemy of My Friend ..."
    value: 'restext://Tension2_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6478
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6482
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:366 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6486
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6488
    - type: 'text'
      # ../en-US.restext:724 | "Turn to page **21** of th..."
      value: 'restext://Tension2_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6499
  - type: 'section'
    # ../en-US.restext:208 | "**Special Rule**"
    title: 'restext://Heading_SpecialRule'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6507
    - type: 'text'
      # ../en-US.restext:72 | "Visiting any Location wit..."
      value: 'restext://Directive_BlackBorderMovesMobLeft'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6511
  - type: 'break'
  else:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6518
  - type: 'text'
    # ../en-US.restext:720 | "**A Peace Through Generat..."
    value: 'restext://Tension2_001'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6522
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:366 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6526
    - type: 'image'
      asset: 'image://setup/VillageChronicleCover'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6528
    - type: 'text'
      # ../en-US.restext:721 | "Turn to page **20** of th..."
      value: 'restext://Tension2_002'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6538
  - type: 'section'
    # ../en-US.restext:722 | "{icon:storybooktoken}**A ..."
    title: 'restext://Tension2_003'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6547
    - type: 'text'
      # ../en-US.restext:94 | "The first time any player..."
      value: 'restext://Directive_FirstTimeReachesCrossroads_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6555
    - type: 'link'
      # ../en-US.restext:49 | "click here."
      label: 'restext://Click_Here_Period'
      target: 'Gen3Token2SignIn' # ./00287-Gen3Token2SignIn.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:6557
  - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:6559
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:6560
- type: 'conditional'
  if: 'walls == "no"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6564
  - type: 'section'
    # ../en-US.restext:195 | "**Plot Expansion**"
    title: 'restext://Heading_PlotExpansion'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6573
    - type: 'text'
      # ../en-US.restext:74 | "Bricks can now be used to..."
      value: 'restext://Directive_BricksExpandEstatePlot'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6577
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6583
- type: 'section'
  # ../en-US.restext:192 | "**Occult Experimentation**"
  title: 'restext://Heading_OccultExperimentation'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6592
  - type: 'text'
    # ../en-US.restext:294 | "At the End of the Generat..."
    value: 'restext://Reward_MostOccultExperiments_CabinetOfCuriosities'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6605
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6607
    - type: 'text'
      # ../en-US.restext:297 | "The player with the secon..."
      value: 'restext://Reward_SecondMostExperiments_WithVariant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6609
  - type: 'text'
    # ../en-US.restext:129 | " _Ties are broken by the ..."
    value: 'restext://Directive_TieBreak_LowestVP_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:6616
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6620
- type: 'section'
  # ../en-US.restext:230 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6629
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:6630
  - type: 'text'
    # ../en-US.restext:77 | " for an explanation of th..."
    value: 'restext://Directive_ChurchExplanation_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:6635
- type: 'assign'
  var: 'round'
  expr: '14'
# ../.source/FearoftheUnknown_Eng_v15.cs:6638
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6650
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:35 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: '${tension == "good" ? "Caravancheck" : "TenseEventBad2"}' # ./00105-Caravancheck.mws.yaml, ./00118-TenseEventBad2.mws.yaml
    # ../en-US.restext:371 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '8'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:301 | "The Middle Years of the T..."
      value: 'restext://Round_GenerationIII_MiddleEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:305 | "Then, perform all Start o..."
      value: 'restext://Round_StartLateYears_Rule'
