# ../.source/FearoftheUnknown_Eng_v15.cs:3865
---
format: 'mws/0.4'
passage_id: 'Tension'
# ../en-US.restext:549 | "Tensions Increase in Peac..."
title: 'restext://Tension_001'
# ../en-US.restext:333 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:3872
- type: 'assign'
  var: 'round'
  expr: '13'
# ../.source/FearoftheUnknown_Eng_v15.cs:3874
- type: 'conditional'
  if: '!ten'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3878
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:368 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3882
    - type: 'image'
      asset: 'image://setup/S2_EstateUpgradeBACK'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3884
    - type: 'text'
      # ../en-US.restext:550 | "Turn to page **19** of th..."
      value: 'restext://Tension_002'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3890
    - type: 'conditional'
      if: 'walls == "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:3892
      - type: 'text'
        # ../en-US.restext:551 | "Return all bricks to the box. "
        value: 'restext://Tension_003'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3894
    - type: 'text'
      # ../en-US.restext:552 | "Retrieve the **Cabinet of..."
      value: 'restext://Tension_004'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3900
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3901
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:3903
      - type: 'text'
        # ../en-US.restext:74 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
      # ../.source/FearoftheUnknown_Eng_v15.cs:3904
      - type: 'break'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3911
  - type: 'section'
    # ../en-US.restext:210 | "**Special Rule**"
    title: 'restext://Heading_SpecialRule'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3919
    - type: 'text'
      # ../en-US.restext:553 | "Visiting any location wit..."
      value: 'restext://Tension_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3937
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3941
  - type: 'section'
    # ../en-US.restext:554 | "{icon:storybooktoken}**Sp..."
    title: 'restext://Tension_007'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3951
    - type: 'text'
      # ../en-US.restext:555 | "If the {icon:angrymob_ico..."
      value: 'restext://Tension_008'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3956
    - type: 'link'
      # ../en-US.restext:556 | "click here to resolve the..."
      label: 'restext://Tension_009'
      target: 'TenseConfirm' # ./00128-TenseConfirm.mws.yaml
      snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:3959
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3961
- type: 'conditional'
  if: 'walls == "no"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3965
  - type: 'section'
    # ../en-US.restext:197 | "**Plot Expansion**"
    title: 'restext://Heading_PlotExpansion'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3974
    - type: 'text'
      # ../en-US.restext:81 | "Bricks can now be used to..."
      value: 'restext://Directive_BricksExpandEstatePlot'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3978
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3984
- type: 'section'
  # ../en-US.restext:194 | "**Occult Experimentation**"
  title: 'restext://Heading_OccultExperimentation'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3992
  - type: 'text'
    # ../en-US.restext:295 | "At the End of the Generat..."
    value: 'restext://Reward_MostOccultExperiments_CabinetOfCuriosities'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4005
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4007
    - type: 'text'
      # ../en-US.restext:298 | "The player with the secon..."
      value: 'restext://Reward_SecondMostExperiments_WithVariant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4009
  - type: 'text'
    # ../en-US.restext:136 | " _Ties are broken by the ..."
    value: 'restext://Directive_TieBreak_LowestVP_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:4015
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4019
- type: 'section'
  # ../en-US.restext:231 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4027
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:4028
  - type: 'text'
    # ../en-US.restext:84 | " for an explanation of th..."
    value: 'restext://Directive_ChurchExplanation_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4033
  - type: 'conditional'
    if: 'ten == 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4035
    - type: 'assign'
      var: 'eor'
      expr: '1'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4032
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4042
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:35 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: '${ten == 0 ? "TenseConfirm" : "ConsequencesTense"}' # ./00128-TenseConfirm.mws.yaml, ./00084-ConsequencesTense.mws.yaml
    # ../en-US.restext:373 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:300 | "The Early Years of the Th..."
      value: 'restext://Round_GenerationIII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:307 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
