    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3901
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:3903
      - type: 'text'
        # ../en-US.restext:96 | "Then, since this is a 3 p..."
        value: 'restext://Common_092'
      # ../.source/FearoftheUnknown_Eng_v15.cs:3904
      - type: 'break'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3907
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3911
  - type: 'section'
    # ../en-US.restext:315 | "**Special Rule**"
    title: 'restext://Common_311'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3919
    - type: 'text'
      # ../en-US.restext:538 | "Visiting any location wit..."
      value: 'restext://Tension_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3937
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3941
  - type: 'section'
    # ../en-US.restext:539 | "{icon:storybooktoken}**Sp..."
    title: 'restext://Tension_007'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3951
    - type: 'text'
      # ../en-US.restext:540 | "If the {icon:angrymob_ico..."
      value: 'restext://Tension_008'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3956
    - type: 'link'
      # ../en-US.restext:541 | "click here to resolve the..."
      label: 'restext://Tension_009'
      target: 'TenseConfirm' # ./00128-TenseConfirm.mws.yaml
      snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:3959
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3961
- type: 'conditional'
  if: 'walls == "no"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3965
  - type: 'section'
    # ../en-US.restext:316 | "**Plot Expansion**"
    title: 'restext://Common_312'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3974
    - type: 'text'
      # ../en-US.restext:317 | "Bricks can now be used to..."
      value: 'restext://Common_313'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3978
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3984
- type: 'section'
  # ../en-US.restext:318 | "**Occult Experimentation**"
  title: 'restext://Common_314'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3992
  - type: 'text'
    # ../en-US.restext:319 | "At the End of the Generat..."
    value: 'restext://Common_315'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4005
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4007
    - type: 'text'
      # ../en-US.restext:320 | "The player with the secon..."
      value: 'restext://Common_316'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4009
  - type: 'text'
    # ../en-US.restext:321 | " _Ties are broken by the ..."
    value: 'restext://Common_317'
# ../.source/FearoftheUnknown_Eng_v15.cs:4015
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4019
- type: 'section'
  # ../en-US.restext:66 | "**The Church**"
  title: 'restext://Common_062'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4027
  - type: 'link'
    # ../en-US.restext:67 | "Click here"
    label: 'restext://Common_063'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:4028
  - type: 'text'
    # ../en-US.restext:68 | " for an explanation of th..."
    value: 'restext://Common_064'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4033
  - type: 'conditional'
    if: 'ten == 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4035
    - type: 'assign'
      var: 'eor'
      expr: '1'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4032
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:4042
  - type: 'link'
    # ../en-US.restext:173 | "Click here at the end of ..."
    label: 'restext://Common_169'
    target: '${ten == 0 ? "TenseConfirm" : "ConsequencesTense"}' # ./00128-TenseConfirm.mws.yaml, ./00084-ConsequencesTense.mws.yaml
    snapshot: true
