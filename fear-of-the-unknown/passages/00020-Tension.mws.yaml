# ../.source/FearoftheUnknown_Eng_v15.cs:3865
---
format: 'mws/0.4'
passage_id: 'Tension'
# ../en-US.restext:534 | "Tensions Increase in Peac..."
title: 'restext://Tension_001'
# ../en-US.restext:155 | "Early Years"
subtitle: 'restext://Common_151'
tags:
- 'HUB'
layout: 'hub'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:3872
- type: 'assign'
  var: 'round'
  expr: '13'
# ../.source/FearoftheUnknown_Eng_v15.cs:3874
- type: 'conditional'
  if: '!ten'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3878
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:156 | "Accept"
    okay: 'restext://Common_152'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3882
    - type: 'image'
      asset: 'image://setup/S2_EstateUpgradeBACK'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3884
    - type: 'text'
      # ../en-US.restext:535 | "Turn to page **19** of th..."
      value: 'restext://Tension_002'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3890
    - type: 'conditional'
      if: 'walls == "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:3892
      - type: 'text'
        # ../en-US.restext:536 | "Return all bricks to the box. "
        value: 'restext://Tension_003'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3894
    - type: 'text'
      # ../en-US.restext:537 | "Retrieve the **Cabinet of..."
      value: 'restext://Tension_004'
