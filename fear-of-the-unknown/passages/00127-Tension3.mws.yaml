# ../.source/FearoftheUnknown_Eng_v15.cs:15173
---
format: 'mws/0.4'
passage_id: 'Tension3'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:15175
- type: 'assign'
  var: 'round'
  expr: '15'
# ../.source/FearoftheUnknown_Eng_v15.cs:15176
- type: 'conditional'
  if: 'tension == "bad"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:15180
  - type: 'text'
    # ../en-US.restext:1296 | "**The Enemy of My Friend ..."
    value: 'restext://Tension3_003'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15182
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15186
  - type: 'section'
    # ../en-US.restext:209 | "**Special Rule**"
    title: 'restext://Heading_SpecialRule'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:15195
    - type: 'text'
      # ../en-US.restext:74 | "Visiting any Location wit..."
      value: 'restext://Directive_BlackBorderMovesMobLeft'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15200
  - type: 'break'
  else:
  # ../.source/FearoftheUnknown_Eng_v15.cs:15207
  - type: 'text'
    # ../en-US.restext:1294 | "**A Peace Through Generat..."
    value: 'restext://Tension3_001'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15209
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15213
  - type: 'section'
    # ../en-US.restext:1295 | "{icon:storybooktoken} **A..."
    title: 'restext://Tension3_002'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:15223
    - type: 'text'
      # ../en-US.restext:96 | "The first time any player..."
      value: 'restext://Directive_FirstTimeReachesCrossroads_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:15231
    - type: 'link'
      # ../en-US.restext:49 | "click here."
      label: 'restext://Click_Here_Period'
      target: 'Gen3Token2SignIn' # ./00287-Gen3Token2SignIn.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:15234
  - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:15236
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:15237
- type: 'conditional'
  if: 'walls == "no"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:15241
  - type: 'section'
    # ../en-US.restext:196 | "**Plot Expansion**"
    title: 'restext://Heading_PlotExpansion'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:15250
    - type: 'text'
      # ../en-US.restext:76 | "Bricks can now be used to..."
      value: 'restext://Directive_BricksExpandEstatePlot'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15254
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:15259
- type: 'section'
  # ../en-US.restext:193 | "**Occult Experimentation**"
  title: 'restext://Heading_OccultExperimentation'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:15268
  - type: 'text'
    # ../en-US.restext:295 | "At the End of the Generat..."
    value: 'restext://Reward_MostOccultExperiments_CabinetOfCuriosities'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15281
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:15283
    - type: 'text'
      # ../en-US.restext:298 | "The player with the secon..."
      value: 'restext://Reward_SecondMostExperiments_WithVariant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15285
  - type: 'text'
    # ../en-US.restext:131 | " _Ties are broken by the ..."
    value: 'restext://Directive_TieBreak_LowestVP_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:15292
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:15297
- type: 'section'
  # ../en-US.restext:231 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:15306
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:15307
  - type: 'text'
    # ../en-US.restext:79 | " for an explanation of th..."
    value: 'restext://Directive_ChurchExplanation_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:15311
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:15313
- type: 'conditional'
  if: 'tensebad == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:15317
  - type: 'section'
    # ../en-US.restext:1297 | "**Obsession Penalty**"
    title: 'restext://Tension3_004'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:15326
    - type: 'text'
      # ../en-US.restext:1298 | "Any player who does not D..."
      value: 'restext://Tension3_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:15336
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:15340
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:15344
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:33 | "Click here at the End of ..."
    label: 'restext://Click_EndGeneration_FinalScoringDetermineFate'
    target: 'TensionBonus' # ./00092-TensionBonus.mws.yaml
    # ../en-US.restext:372 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:301 | "The Late Years of the Thi..."
      value: 'restext://Round_GenerationIII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:299 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
