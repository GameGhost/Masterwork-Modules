# ../.source/FearoftheUnknown_Eng_v15.cs:12416
---
format: 'mws/0.4'
passage_id: 'SmugEvent2A'
# ../en-US.restext:1034 | "Town Hall Destroyed"
title: 'restext://SmugEvent2A_001'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:12426
- type: 'text'
  # ../en-US.restext:1035 | "**Newsprint - {newspaper}..."
  value: 'restext://SmugEvent2A_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:12436
- type: 'assign'
  var: 'ending'
  expr: '"FOTU-End1"' # ./00209-FOTU-End1.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:12435
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:12438
- type: 'text'
  # ../en-US.restext:1036 | "Four dead and several inj..."
  value: 'restext://SmugEvent2A_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:12443
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:12447
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:29 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: 'SmugEvent2ACont' # ./00213-SmugEvent2ACont.mws.yaml
  # ../en-US.restext:360 | "Close"
  okay: 'restext://UIButton_Close'
  snapshot: true
  header:
  # ../.source/FearoftheUnknown_Eng_v15.cs:12462
  - type: 'image'
    asset: 'image://setup/S2_CollaborativeToken'
    style: 'setup-image'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:12465
  - type: 'conditional'
    if: 'players == 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:12467
    - type: 'text'
      # ../en-US.restext:1037 | "The player with the most ..."
      value: 'restext://SmugEvent2A_004'
  # ../.source/FearoftheUnknown_Eng_v15.cs:12475
  - type: 'conditional'
    if: 'id > 0'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:12477
    - type: 'assign'
      var: 'tempcreep'
      expr: 'rand_between(2, 3, "SmugEvent2A_0")'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12478
    - type: 'text'
      # ../en-US.restext:1039 | "Players that have already..."
      value: 'restext://SmugEvent2A_006'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12479
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12480
    - type: 'conditional'
      if: 'idA == "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:12482
      - type: 'text'
        # ../en-US.restext:1038 | "{nameA} loses **{tempcree..."
        value: 'restext://SmugEvent2A_005'
      # ../.source/FearoftheUnknown_Eng_v15.cs:12490
      - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12492
    - type: 'conditional'
      if: 'idB == "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:12494
      - type: 'text'
        # ../en-US.restext:1040 | "{nameB} loses **{tempcree..."
        value: 'restext://SmugEvent2A_007'
      # ../.source/FearoftheUnknown_Eng_v15.cs:12502
      - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12504
    - type: 'conditional'
      if: 'idC == "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:12506
      - type: 'text'
        # ../en-US.restext:1041 | "{nameC} loses **{tempcree..."
        value: 'restext://SmugEvent2A_008'
      # ../.source/FearoftheUnknown_Eng_v15.cs:12514
      - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12516
    - type: 'conditional'
      if: 'idD == "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:12518
      - type: 'text'
        # ../en-US.restext:1042 | "{nameD} loses **{tempcree..."
        value: 'restext://SmugEvent2A_009'
      # ../.source/FearoftheUnknown_Eng_v15.cs:12526
      - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12528
    - type: 'conditional'
      if: 'idE == "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:12530
      - type: 'text'
        # ../en-US.restext:1043 | "{nameE} loses **{tempcree..."
        value: 'restext://SmugEvent2A_010'
      # ../.source/FearoftheUnknown_Eng_v15.cs:12538
      - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12540
    - type: 'conditional'
      if: 'idA != "yes" && idB != "yes" && idC != "yes" && idD != "yes" && idE != "yes"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:12542
      - type: 'text'
        # ../en-US.restext:1038 | "{nameA} loses **{tempcree..."
        value: 'restext://SmugEvent2A_005'
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:12555
    - type: 'assign'
      var: 'tempcreep'
      expr: 'rand_between(2, 3, "SmugEvent2A_1")'
    # ../.source/FearoftheUnknown_Eng_v15.cs:12556
    - type: 'text'
      # ../en-US.restext:1038 | "{nameA} loses **{tempcree..."
      value: 'restext://SmugEvent2A_005'
