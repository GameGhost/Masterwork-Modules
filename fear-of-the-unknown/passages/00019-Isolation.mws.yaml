# ../.source/FearoftheUnknown_Eng_v15.cs:3715
---
format: 'mws/0.4'
passage_id: 'Isolation'
# ../en-US.restext:368 | "Walled City"
title: 'restext://Title_WalledCity'
# ../en-US.restext:329 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:3722
- type: 'assign'
  var: 'round'
  expr: '10'
# ../.source/FearoftheUnknown_Eng_v15.cs:3724
- type: 'conditional'
  if: '!isooff'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3728
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:370 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3732
    - type: 'image'
      asset: 'image://setup/AngryMobSetup1'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:3734
    - type: 'text'
      # ../en-US.restext:546 | "Turn to page **14** of th..."
      value: 'restext://Isolation_002'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3749
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3750
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:3752
      - type: 'text'
        # ../en-US.restext:66 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
      # ../.source/FearoftheUnknown_Eng_v15.cs:3753
      - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:3761
- type: 'section'
  # ../en-US.restext:547 | "**Rising Prices**"
  title: 'restext://Isolation_003'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3769
  - type: 'text'
    # ../en-US.restext:548 | "With the town's isolation..."
    value: 'restext://Isolation_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:3784
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3788
- type: 'section'
  # ../en-US.restext:222 | "{icon:storybooktoken} **V..."
  title: 'restext://Heading_StorybookToken_VerificationOfIdentity'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3799
  - type: 'text'
    # ../en-US.restext:264 | "As a registered citizen w..."
    value: 'restext://Narrative_RegisteredCitizenBackgroundCheck'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3801
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3803
  - type: 'text'
    # ../en-US.restext:101 | "You MUST place your **Sel..."
    value: 'restext://Directive_MustPlaceSelfTownHall_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3810
  - type: 'link'
    # ../en-US.restext:45 | "click here to complete ve..."
    label: 'restext://Click_HereToCompleteVerification'
    target: 'IsoIdentificationSignIn' # ./00211-IsoIdentificationSignIn.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:3811
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3815
  - type: 'text'
    # ../en-US.restext:102 | "_(If you have not verifie..."
    value: 'restext://Directive_NotVerifiedLose4VP'
# ../.source/FearoftheUnknown_Eng_v15.cs:3823
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3827
- type: 'section'
  # ../en-US.restext:223 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3835
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:3836
  - type: 'text'
    # ../en-US.restext:76 | " for an explanation of th..."
    value: 'restext://Directive_ChurchExplanation_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3838
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3842
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:35 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'Caravancheck' # ./00105-Caravancheck.mws.yaml
    # ../en-US.restext:375 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:292 | "The Early Years of the Th..."
      value: 'restext://Round_GenerationIII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:299 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
