# ../.source/FearoftheUnknown_Eng_v15.cs:25675
---
format: 'mws/0.4'
passage_id: 'Player1Statsfin'
# ../en-US.restext:1893 | Player1Statsfin_001 | "{_rpl_Player1Statsfin_0} ..."
# ../en-US.restext:328 | Title_Complete | "Complete"
title: '{warriorA ? "restext://Player1Statsfin_001" : "restext://Title_Complete"}'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:25678
- type: 'conditional'
  if: '!warriorA_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:89 | "Please enter the epic nam..."
      value: 'restext://Directive_EnterWarriorName'
    - type: 'input'
      label: ''
      var: 'warriorA'
    # ../en-US.restext:373 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'warriorA_submitted'
      expr: 'true'
    snapshot: true
    target: 'Player1Statsfin' # ./00222-Player1Statsfin.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:25694
- type: 'conditional'
  if: 'warriorA'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:25695
  - type: 'let'
    var: '_rpl_Player1Statsfin_0'
    expr: 'warriorA.replace("_1", "")'
# ../.source/FearoftheUnknown_Eng_v15.cs:25701
- type: 'text'
  # ../en-US.restext:1894 | "Agility: **{agiA}**"
  value: 'restext://Player1Statsfin_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:25706
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:25707
- type: 'text'
  # ../en-US.restext:1895 | "Strength: **{strA}**"
  value: 'restext://Player1Statsfin_005'
# ../.source/FearoftheUnknown_Eng_v15.cs:25712
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:25713
- type: 'text'
  # ../en-US.restext:1896 | "Life: **{hitA}**"
  value: 'restext://Player1Statsfin_006'
# ../.source/FearoftheUnknown_Eng_v15.cs:25718
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:25722
- type: 'text'
  # ../en-US.restext:192 | "**You are ready for a tri..."
  value: 'restext://Heading_ReadyForTrialByCombat'
# ../.source/FearoftheUnknown_Eng_v15.cs:25724
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:25726
- type: 'text'
  # ../en-US.restext:95 | "If this is correct, please "
  value: 'restext://Directive_IfCorrectPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:25727
- type: 'link'
  # ../en-US.restext:59 | "click to continue..."
  label: 'restext://Click_ToContinueEllipsis_Lower'
  target: 'Player2StatEntry' # ./00293-Player2StatEntry.mws.yaml
  snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:25728
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:25731
- type: 'text'
  # ../en-US.restext:96 | "If this is in error, please "
  value: 'restext://Directive_IfErrorPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:25732
- type: 'link'
  # ../en-US.restext:52 | "return to the start..."
  label: 'restext://Click_ReturnToStart'
  target: 'Player1StatEntry' # ./00292-Player1StatEntry.mws.yaml
  snapshot: true
