      # ../en-US.restext:234 | "Please enter the epic nam..."
      value: 'restext://Common_230'
    - type: 'input'
      label: ''
      var: 'warriorC'
    # ../en-US.restext:277 | "Continue"
    okay: 'restext://Common_273'
    onclose:
    - type: 'assign'
      var: 'warriorC_submitted'
      expr: 'true'
    snapshot: true
    target: 'Player3Statsfin' # ./00301-Player3Statsfin.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:32846
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:32850
