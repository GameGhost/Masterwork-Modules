# ../.source/FearoftheUnknown_Eng_v15.cs:32831
---
format: 'mws/0.4'
passage_id: 'Player3Statsfin'
# ../en-US.restext:2464 | Player3Statsfin_001 | "{_rpl_Player3Statsfin_0} ..."
# ../en-US.restext:328 | Title_Complete | "Complete"
title: '{warriorC ? "restext://Player3Statsfin_001" : "restext://Title_Complete"}'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:32834
- type: 'conditional'
  if: '!warriorC_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:89 | "Please enter the epic nam..."
      value: 'restext://Directive_EnterWarriorName'
    - type: 'input'
      label: ''
      var: 'warriorC'
    # ../en-US.restext:373 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'warriorC_submitted'
      expr: 'true'
    snapshot: true
    target: 'Player3Statsfin' # ./00301-Player3Statsfin.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:32850
- type: 'conditional'
  if: 'warriorC'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:32851
  - type: 'let'
    var: '_rpl_Player3Statsfin_0'
    expr: 'warriorC.replace("_3", "")'
# ../.source/FearoftheUnknown_Eng_v15.cs:32858
- type: 'text'
  # ../en-US.restext:2465 | "Agility: **{agiC}**"
  value: 'restext://Player3Statsfin_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:32863
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:32864
- type: 'text'
  # ../en-US.restext:2466 | "Strength: **{strC}**"
  value: 'restext://Player3Statsfin_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:32869
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:32870
- type: 'text'
  # ../en-US.restext:2467 | "Life: **{hitC}**"
  value: 'restext://Player3Statsfin_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:32875
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:32879
- type: 'text'
  # ../en-US.restext:192 | "**You are ready for a tri..."
  value: 'restext://Heading_ReadyForTrialByCombat'
# ../.source/FearoftheUnknown_Eng_v15.cs:32881
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:32883
- type: 'text'
  # ../en-US.restext:95 | "If this is correct, please "
  value: 'restext://Directive_IfCorrectPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:32884
- type: 'link'
  # ../en-US.restext:59 | "click to continue..."
  label: 'restext://Click_ToContinueEllipsis_Lower'
  target: 'Player4StatEntry' # ./00302-Player4StatEntry.mws.yaml
  snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:32885
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:32888
- type: 'text'
  # ../en-US.restext:96 | "If this is in error, please "
  value: 'restext://Directive_IfErrorPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:32889
- type: 'link'
  # ../en-US.restext:52 | "return to the start..."
  label: 'restext://Click_ReturnToStart'
  target: 'Player3StatEntry' # ./00297-Player3StatEntry.mws.yaml
  snapshot: true
