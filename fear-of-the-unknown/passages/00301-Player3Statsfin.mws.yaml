    expr: 'warriorC.replace("_3", "")'
  # ../.source/FearoftheUnknown_Eng_v15.cs:32851
  - type: 'text'
    # ../en-US.restext:2416 | "**{_rpl_Player3Statsfin_0}**"
    value: 'restext://Player3Statsfin_001'
