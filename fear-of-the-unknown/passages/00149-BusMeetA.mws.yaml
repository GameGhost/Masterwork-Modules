# ../.source/FearoftheUnknown_Eng_v15.cs:18011
---
format: 'mws/0.4'
passage_id: 'BusMeetA'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:18016
- type: 'text'
  # ../en-US.restext:324 | "**Carefully pick up this ..."
  value: 'restext://Storybook_PickUpDevicePrivate'
# ../.source/FearoftheUnknown_Eng_v15.cs:18019
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:18025
- type: 'popup'
  # ../en-US.restext:53 | "Once you are ready, click..."
  label: 'restext://Click_RevealSecretConversation'
  layout: 'reveal'
  # ../en-US.restext:367 | "Close"
  cancel: 'restext://UIButton_Close'
  snapshot: true
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:18068
  - type: 'text'
    # ../en-US.restext:147 | "**A Sly Investment**"
    value: 'restext://Heading_ASlyInvestment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18070
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18074
  - type: 'text'
    # ../en-US.restext:166 | "**Journal Entry of {busm}..."
    value: 'restext://Heading_JournalEntryOfBusm_Cont'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18085
  - type: 'let'
    var: '_rnd_BusMeetA_0'
    # ../en-US.restext:250 | Narrative_FineHairsOnPalm | "I could distinctly see fi..."
    # ../en-US.restext:257 | Narrative_LeanedForwardCoarseWhisper | "He leaned forward, speaki..."
    expr: '["restext://Narrative_FineHairsOnPalm", "restext://Narrative_LeanedForwardCoarseWhisper"].shuffled("BusMeetA_0")[0]'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18083
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18085
  - type: 'text'
    # ../en-US.restext:1413 | "{_rnd_BusMeetA_0} \"Donat..."
    value: 'restext://BusMeetA_001'
    lets:
    - '_rnd_BusMeetA_0'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18100
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18102
  - type: 'conditional'
    if: 'busvp == 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18104
    - type: 'text'
      # ../en-US.restext:260 | "The man smiled once again..."
      value: 'restext://Narrative_ManSmiledSecondTime'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18105
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18108
  - type: 'text'
    # ../en-US.restext:251 | "\"**For $1**, you have my..."
    value: 'restext://Narrative_ForOneDollarNewServant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18121
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18123
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18125
    - type: 'text'
      # ../en-US.restext:1414 | "\"**For $2**, I will guar..."
      value: 'restext://BusMeetA_002'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18136
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18139
  - type: 'conditional'
    if: '!bhome || String.IsNullOrEmpty(bhome)'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18141
    - type: 'text'
      # ../en-US.restext:1415 | "\"**For $3**, I will offe..."
      value: 'restext://BusMeetA_003'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18153
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18155
  - type: 'text'
    # ../en-US.restext:264 | "I was admittedly not impr..."
    value: 'restext://Narrative_NotImpressedByOffer'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18157
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18161
  - type: 'text'
    # ../en-US.restext:163 | "**How much would you like..."
    value: 'restext://Heading_HowMuchInvest'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18163
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18165
  - type: 'conditional'
    if: '!bhome || String.IsNullOrEmpty(bhome)'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18168
    - type: 'link'
      # ../en-US.restext:140 | "$3."
      label: 'restext://Dollar_Three'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18032
      - type: 'assign'
        var: 'Acont'
        expr: 'Acont + 3'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18033
      - type: 'assign'
        var: 'bhome'
        expr: 'nameA'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18169
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18172
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18175
    - type: 'link'
      # ../en-US.restext:141 | "$2."
      label: 'restext://Dollar_Two'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18040
      - type: 'assign'
        var: 'Acont'
        expr: 'Acont + 2'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18041
      - type: 'assign'
        var: 'btemp'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18042
      - type: 'assign'
        var: 'bnc'
        expr: 'bnc + 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18176
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18180
  - type: 'link'
    # ../en-US.restext:139 | "$1."
    label: 'restext://Dollar_One'
    target: 'BusThanks' # ./00154-BusThanks.mws.yaml
    snapshot: true
    onclick:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18049
    - type: 'assign'
      var: 'Acont'
      expr: 'Acont + 1'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18181
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18183
  - type: 'switch'
    on: 'busvp'
    cases:
    - match: 0
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18186
      - type: 'link'
        # ../en-US.restext:25 | "I'm not convinced."
        label: 'restext://Choice_NotConvinced'
        target: '${BusMeetAnextpsg}'
        snapshot: true
        onclick:
        # ../.source/FearoftheUnknown_Eng_v15.cs:18056
        - type: 'conditional'
          if: 'BusMeetAnextpsg == "" || BusMeetAnextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:18058
          - type: 'assign'
            var: 'BusMeetAnextpsg'
            expr: '["BusBargain", "BusNo"].shuffled("BusMeetA_1")[0]'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18187
      - type: 'text'
        # ../en-US.restext:92 | "_This option will provide..."
        value: 'restext://Directive_FiftyPercentChanceImproveDeal'
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18191
      - type: 'link'
        # ../en-US.restext:20 | "I will pass."
        label: 'restext://Choice_IWillPass'
        target: 'BusNo' # ./00155-BusNo.mws.yaml
        snapshot: true
