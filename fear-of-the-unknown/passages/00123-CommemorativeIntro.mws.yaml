# ../.source/FearoftheUnknown_Eng_v15.cs:14815
---
format: 'mws/0.4'
passage_id: 'CommemorativeIntro'
# ../en-US.restext:1262 | "Strengthening the Town"
title: 'restext://CommemorativeIntro_001'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:14827
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:14829
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB].shuffled("CommemorativeIntro_0")[0]'
  - match: 3
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:14833
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC].shuffled("CommemorativeIntro_1")[0]'
  - match: 4
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:14837
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC, nameD].shuffled("CommemorativeIntro_2")[0]'
  - match: 5
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:14841
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("CommemorativeIntro_3")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:14843
- type: 'assign'
  var: 'randomname'
  expr: 'randomplayer'
# ../.source/FearoftheUnknown_Eng_v15.cs:14825
- type: 'text'
  # ../en-US.restext:1263 | "**Letter from** **{random..."
  value: 'restext://CommemorativeIntro_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:14852
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:14854
- type: 'text'
  # ../en-US.restext:1264 | "Despite the gloom and hys..."
  value: 'restext://CommemorativeIntro_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:14860
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:14862
- type: 'text'
  # ../en-US.restext:1265 | "Doomed to failure, most l..."
  value: 'restext://CommemorativeIntro_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:14865
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:14869
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:29 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: 'PEWitch2' # ./00214-PEWitch2.mws.yaml
  # ../en-US.restext:365 | "Close"
  okay: 'restext://UIButton_Close'
  snapshot: true
  header:
  # ../.source/FearoftheUnknown_Eng_v15.cs:14880
  - type: 'image'
    asset: 'image://setup/S2_BrickTokens'
    style: 'setup-image'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:14881
  - type: 'text'
    # ../en-US.restext:1266 | "During this Generation, p..."
    value: 'restext://CommemorativeIntro_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:14884
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:14886
  - type: 'text'
    # ../en-US.restext:1267 | "Each Memorial Brick is wo..."
    value: 'restext://CommemorativeIntro_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:14907
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:14909
    - type: 'text'
      # ../en-US.restext:295 | "The player who has the se..."
      value: 'restext://Reward_SecondMostBricks'
