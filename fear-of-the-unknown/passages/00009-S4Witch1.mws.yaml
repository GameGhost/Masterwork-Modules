# ../.source/FearoftheUnknown_Eng_v15.cs:2342
---
format: 'mws/0.4'
passage_id: 'S4Witch1'
# ../en-US.restext:444 | S4Witch1_001 | "Flames of Hysteria"
# ../en-US.restext:445 | S4Witch1_002 | "Paranoia Fades"
title: '{kill == "butcher" ? "restext://S4Witch1_001" : "restext://S4Witch1_002"}'
tags:
- 'END'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:2352
- type: 'conditional'
  if: 'kill == "butcher"'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2362
  - type: 'text'
    # ../en-US.restext:165 | "**Collected Letters -** _..."
    value: 'restext://Heading_CollectedLetters_StokerVictoria'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2372
  - type: 'switch'
    on: 'players'
    cases:
    - match: 2
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2374
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB].shuffled("S4Witch1_0")[0]'
    - match: 3
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2378
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB, nameC].shuffled("S4Witch1_1")[0]'
    - match: 4
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2382
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB, nameC, nameD].shuffled("S4Witch1_2")[0]'
    - match: 5
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2386
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("S4Witch1_3")[0]'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2388
  - type: 'assign'
    var: 'randomname'
    expr: 'randomplayer'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2368
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2370
  - type: 'text'
    # ../en-US.restext:191 | "My dear {randomname} II,"
    value: 'restext://Heading_MyDearRandomnameII'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2391
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2393
  - type: 'text'
    # ../en-US.restext:447 | "With your return from uni..."
    value: 'restext://S4Witch1_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2397
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2399
  - type: 'text'
    # ../en-US.restext:450 | "For a few years, I watche..."
    value: 'restext://S4Witch1_010'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2406
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2409
  - type: 'link'
    # ../en-US.restext:451 | "Unfortunately, the town b..."
    label: 'restext://S4Witch1_011'
    target: 'ForeignIntro' # ./00013-ForeignIntro.mws.yaml
    snapshot: true
  else:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2422
  - type: 'text'
    # ../en-US.restext:446 | "**Collected Letters -** _..."
    value: 'restext://S4Witch1_003'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2432
  - type: 'switch'
    on: 'players'
    cases:
    - match: 2
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2434
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB].shuffled("S4Witch1_4")[0]'
    - match: 3
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2438
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB, nameC].shuffled("S4Witch1_5")[0]'
    - match: 4
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2442
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB, nameC, nameD].shuffled("S4Witch1_6")[0]'
    - match: 5
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2446
      - type: 'assign'
        var: 'randomplayer'
        expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("S4Witch1_7")[0]'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2448
  - type: 'assign'
    var: 'randomname'
    expr: 'randomplayer'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2428
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2430
  - type: 'text'
    # ../en-US.restext:190 | "My dear, {randomname} II,"
    value: 'restext://Heading_MyDearCommaRandomnameII'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2451
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2453
  - type: 'text'
    # ../en-US.restext:447 | "With your return from uni..."
    value: 'restext://S4Witch1_005'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2457
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2459
  - type: 'text'
    # ../en-US.restext:448 | "For a few years, I watche..."
    value: 'restext://S4Witch1_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2469
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2472
  - type: 'link'
    # ../en-US.restext:449 | "It is a curious thing to ..."
    label: 'restext://S4Witch1_007'
    target: 'CreatureIntro' # ./00014-CreatureIntro.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:2475
- type: 'conditional'
  if: 'onecount < 4'
  then: []
# ../.source/FearoftheUnknown_Eng_v15.cs:2476
- type: 'popup'
  layout: 'end_of_generation'
  # ../en-US.restext:372 | "Confirm"
  okay: 'restext://UIButton_Confirm'
  content:
  - type: 'text'
    # ../en-US.restext:95 | "Remove all player pieces ..."
    value: 'restext://Directive_EndGeneration_ReturnUnusedStorybookTokens'
  - type: 'let'
    var: 'generation'
    expr: '3'
