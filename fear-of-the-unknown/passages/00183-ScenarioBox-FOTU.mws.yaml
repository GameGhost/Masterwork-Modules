# ../.source/FearoftheUnknown_Eng_v15.cs:21148
---
format: 'mws/0.4'
passage_id: 'ScenarioBox-FOTU'
# ../en-US.restext:349 | "Preparations"
title: 'restext://Title_Preparations'
tags:
- 'Begins-Here'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:21156
- type: 'assign'
  var: 'players'
  expr: 'global:playerCount'
# ../.source/FearoftheUnknown_Eng_v15.cs:21157
- type: 'assign'
  var: 'nameA'
  expr: 'global:nameA'
# ../.source/FearoftheUnknown_Eng_v15.cs:21158
- type: 'assign'
  var: 'nameB'
  expr: 'global:nameB'
# ../.source/FearoftheUnknown_Eng_v15.cs:21159
- type: 'conditional'
  if: 'players > 2'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:21159
  - type: 'assign'
    var: 'nameC'
    expr: 'global:nameC'
# ../.source/FearoftheUnknown_Eng_v15.cs:21160
- type: 'conditional'
  if: 'players > 3'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:21160
  - type: 'assign'
    var: 'nameD'
    expr: 'global:nameD'
# ../.source/FearoftheUnknown_Eng_v15.cs:21161
- type: 'conditional'
  if: 'players > 4'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:21161
  - type: 'assign'
    var: 'nameE'
    expr: 'global:nameE'
# ../.source/FearoftheUnknown_Eng_v15.cs:21162
- type: 'assign'
  var: 'townname'
  expr: 'global:townName'
# ../.source/FearoftheUnknown_Eng_v15.cs:21163
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:283 | "two"
      expr: '"restext://Number_Two_Lower"'
  - match: 3
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:282 | "three"
      expr: '"restext://Number_Three_Lower"'
  - match: 4
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:281 | "four"
      expr: '"restext://Number_Four_Lower"'
  - match: 5
    nodes:
    - type: 'assign'
      var: 'playtxt'
      # ../en-US.restext:280 | "five"
      expr: '"restext://Number_Five_Lower"'
  default:
  - type: 'assign'
    var: 'playtxt'
    # ../en-US.restext:283 | "two"
    expr: '"restext://Number_Two_Lower"'
# ../.source/FearoftheUnknown_Eng_v15.cs:21165
- type: 'text'
  # ../en-US.restext:1588 | "Complete the standard set..."
  value: 'restext://ScenarioBox_FOTU_001'
# ../.source/FearoftheUnknown_Eng_v15.cs:21176
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:21181
- type: 'image'
  asset: 'icon://scenariobox3d_fear'
  size: '200'
  align: 'center'
# ../.source/FearoftheUnknown_Eng_v15.cs:21185
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:21186
- type: 'text'
  # ../en-US.restext:1589 | "Then, retrieve the **Fear..."
  value: 'restext://ScenarioBox_FOTU_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:21195
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:21197
- type: 'link'
  # ../en-US.restext:28 | "Click here to continue..."
  label: 'restext://Click_ContinueEllipsis_B'
  target: 'Prologue-FOTU' # ./00182-Prologue-FOTU.mws.yaml
  snapshot: true
