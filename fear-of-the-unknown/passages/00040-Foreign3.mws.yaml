# ../.source/FearoftheUnknown_Eng_v15.cs:6320
---
format: 'mws/0.4'
passage_id: 'Foreign3'
# ../en-US.restext:328 | "Blame it on the Foreigners"
title: 'restext://Title_BlameItOnForeigners'
# ../en-US.restext:340 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:6327
- type: 'assign'
  var: 'round'
  expr: '6'
# ../.source/FearoftheUnknown_Eng_v15.cs:6329
- type: 'conditional'
  if: 'cursed == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6333
  - type: 'section'
    # ../en-US.restext:238 | "**Witching Hour**"
    title: 'restext://Heading_WitchingHour'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6341
    - type: 'text'
      # ../en-US.restext:717 | "The location in town with..."
      value: 'restext://Foreign3_001'
# ../.source/FearoftheUnknown_Eng_v15.cs:6344
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6348
- type: 'section'
  # ../en-US.restext:227 | "{icon:storybooktoken} **T..."
  title: 'restext://Heading_StorybookToken_TownStrength'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6360
  - type: 'text'
    # ../en-US.restext:101 | "Players may visit the Tow..."
    value: 'restext://Directive_MemorialBrickPurchase_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6370
  - type: 'link'
    # ../en-US.restext:49 | "click here."
    label: 'restext://Click_Here_Period'
    target: 'TownHallExplanation' # ./00228-TownHallExplanation.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:6373
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6377
- type: 'section'
  # ../en-US.restext:175 | "**Key to the City**"
  title: 'restext://Heading_KeyToTheCity'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6386
  - type: 'text'
    # ../en-US.restext:292 | "At the End of the Generat..."
    value: 'restext://Reward_MostBricks_KeyToCity'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6398
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6400
    - type: 'text'
      # ../en-US.restext:295 | "The player who has the se..."
      value: 'restext://Reward_SecondMostBricks'
# ../.source/FearoftheUnknown_Eng_v15.cs:6405
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6409
- type: 'conditional'
  if: 'revresolve == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6413
  - type: 'section'
    # ../en-US.restext:222 | "{icon:storybooktoken} **P..."
    title: 'restext://Heading_StorybookToken_PressingForward'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6422
    - type: 'text'
      # ../en-US.restext:99 | "If a player reaches 35VP, "
      value: 'restext://Directive_IfPlayerReaches35VP_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6424
    - type: 'conditional'
      if: 'revplot == "fortune"'
      then:
      - type: 'link'
        # ../en-US.restext:39 | "click here..."
        label: 'restext://Click_HereEllipsis_Lower'
        target: '35Fortune' # ./00193-35Fortune.mws.yaml
        snapshot: true
      else:
      - type: 'link'
        # ../en-US.restext:39 | "click here..."
        label: 'restext://Click_HereEllipsis_Lower'
        target: '35Misfortune' # ./00194-35Misfortune.mws.yaml
        snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:6427
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6430
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6435
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:32 | "Click here at the End of ..."
    label: 'restext://Click_EndGeneration_DetermineFate'
    target: 'S4IsoBrick' # ./00035-S4IsoBrick.mws.yaml
    # ../en-US.restext:371 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '6'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:303 | "The Late Years of the Sec..."
      value: 'restext://Round_GenerationII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:298 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
