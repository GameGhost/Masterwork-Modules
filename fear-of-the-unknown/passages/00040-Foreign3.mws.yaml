- type: 'assign'
  var: 'round'
  expr: '6'
# ../.source/FearoftheUnknown_Eng_v15.cs:6329
- type: 'conditional'
  if: 'cursed == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6333
  - type: 'section'
    # ../en-US.restext:99 | "**Witching Hour**"
    title: 'restext://Common_095'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6341
    - type: 'text'
      # ../en-US.restext:713 | "The location in town with..."
      value: 'restext://Foreign3_001'
# ../.source/FearoftheUnknown_Eng_v15.cs:6344
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6348
- type: 'section'
  # ../en-US.restext:103 | "{icon:storybooktoken} **T..."
  title: 'restext://Common_099'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6360
  - type: 'text'
    # ../en-US.restext:104 | "Players may visit the Tow..."
    value: 'restext://Common_100'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6370
  - type: 'link'
    # ../en-US.restext:317 | "click here."
    label: 'restext://Common_313'
    target: 'TownHallExplanation' # ./00228-TownHallExplanation.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:6373
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6377
- type: 'section'
  # ../en-US.restext:105 | "**Key to the City**"
  title: 'restext://Common_101'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6386
  - type: 'text'
    # ../en-US.restext:106 | "At the End of the Generat..."
    value: 'restext://Common_102'
  # ../.source/FearoftheUnknown_Eng_v15.cs:6398
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6400
    - type: 'text'
      # ../en-US.restext:107 | "The player who has the se..."
      value: 'restext://Common_103'
# ../.source/FearoftheUnknown_Eng_v15.cs:6405
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6409
- type: 'conditional'
  if: 'revresolve == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6413
  - type: 'section'
    # ../en-US.restext:110 | "{icon:storybooktoken} **P..."
    title: 'restext://Common_106'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6422
    - type: 'text'
      # ../en-US.restext:111 | "If a player reaches 35VP, "
      value: 'restext://Common_107'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6424
    - type: 'conditional'
      if: 'revplot == "fortune"'
      then:
      - type: 'link'
        # ../en-US.restext:177 | "click here..."
        label: 'restext://Common_173'
        target: '35Fortune' # ./00193-35Fortune.mws.yaml
        snapshot: true
      else:
      - type: 'link'
        # ../en-US.restext:177 | "click here..."
        label: 'restext://Common_173'
        target: '35Misfortune' # ./00194-35Misfortune.mws.yaml
        snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:6427
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:6430
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6435
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:87 | "Click here at the End of ..."
    label: 'restext://Common_083'
    target: 'S4IsoBrick' # ./00035-S4IsoBrick.mws.yaml
    # ../en-US.restext:181 | "End of Round"
    okay: 'restext://Common_177'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '6'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:88 | "The Late Years of the Sec..."
      value: 'restext://Common_084'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:160 | "Perform any End of Round ..."
      value: 'restext://Common_156'
