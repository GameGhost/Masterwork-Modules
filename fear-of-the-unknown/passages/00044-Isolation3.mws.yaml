# ../.source/FearoftheUnknown_Eng_v15.cs:6937
---
format: 'mws/0.4'
passage_id: 'Isolation3'
# ../en-US.restext:362 | "Walled City"
title: 'restext://Title_WalledCity'
# ../en-US.restext:338 | "Late Years"
subtitle: 'restext://Title_LateYears'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:6944
- type: 'assign'
  var: 'round'
  expr: '12'
# ../.source/FearoftheUnknown_Eng_v15.cs:6946
- type: 'conditional'
  if: '!isooff'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6948
  - type: 'conditional'
    if: 'dev > 0'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6952
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:364 | "Accept"
      okay: 'restext://UIButton_Accept'
      header:
      # ../.source/FearoftheUnknown_Eng_v15.cs:6956
      - type: 'image'
        asset: 'image://setup/VillageChronicleCover'
        style: 'setup-image'
      content:
      # ../.source/FearoftheUnknown_Eng_v15.cs:6958
      - type: 'text'
        # ../en-US.restext:741 | "Turn to page **{dev}** of..."
        value: 'restext://Isolation3_001'
# ../.source/FearoftheUnknown_Eng_v15.cs:6969
- type: 'conditional'
  if: 'dev == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6973
  - type: 'section'
    # ../en-US.restext:228 | "{icon:storybooktoken} **V..."
    title: 'restext://Heading_StorybookToken_VerificationOfIdentity'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6982
    - type: 'text'
      # ../en-US.restext:271 | "As a registered citizen w..."
      value: 'restext://Narrative_RegisteredCitizenBackgroundCheck'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6984
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6986
    - type: 'text'
      # ../en-US.restext:101 | "You MUST place your **Sel..."
      value: 'restext://Directive_MustPlaceSelfTownHall_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6992
    - type: 'link'
      # ../en-US.restext:45 | "click here to complete ve..."
      label: 'restext://Click_HereToCompleteVerification'
      target: 'IsoIdentificationSignIn' # ./00211-IsoIdentificationSignIn.mws.yaml
      snapshot: true
    # ../.source/FearoftheUnknown_Eng_v15.cs:6993
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6997
    - type: 'text'
      # ../en-US.restext:102 | "_(If you have not verifie..."
      value: 'restext://Directive_NotVerifiedLose4VP'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7005
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7010
- type: 'section'
  # ../en-US.restext:230 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7019
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:7020
  - type: 'text'
    # ../en-US.restext:76 | " for an explanation of th..."
    value: 'restext://Directive_ChurchExplanation_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:7025
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7029
- type: 'section'
  # ../en-US.restext:214 | "{icon:storybooktoken} **B..."
  title: 'restext://Heading_StorybookToken_BrazenOffer'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7039
  - type: 'text'
    # ../en-US.restext:125 | "Once per round, each play..."
    value: 'restext://Directive_SmugglersDockVisit_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7059
  - type: 'link'
    # ../en-US.restext:40 | "click here for the conseq..."
    label: 'restext://Click_HereForConsequences_NoPunct'
    target: 'SmugConsequence' # ./00090-SmugConsequence.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:7060
  - type: 'text'
    value: '.'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7061
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7064
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:33 | "Click here at the End of ..."
    label: 'restext://Click_EndGeneration_FinalScoringDetermineFate'
    target: 'IsolationCaravanResolve' # ./00241-IsolationCaravanResolve.mws.yaml
    # ../en-US.restext:369 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:300 | "The Late Years of the Thi..."
      value: 'restext://Round_GenerationIII_LateEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:298 | "Perform any End of Round ..."
      value: 'restext://Round_EndOfRoundActions_Rule'
