---
format: 'mws/0.4'
passage_id: 'Isolation3'
# ../en-US.restext:128 | "Walled City"
title: 'restext://Common_124'
# ../en-US.restext:159 | "Late Years"
subtitle: 'restext://Common_155'
tags:
- 'HUB'
layout: 'hub_late'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:6944
- type: 'assign'
  var: 'round'
  expr: '12'
# ../.source/FearoftheUnknown_Eng_v15.cs:6946
- type: 'conditional'
  if: '!isooff'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6948
  - type: 'conditional'
    if: 'dev > 0'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6952
    - type: 'popup'
      layout: 'setup'
      # ../en-US.restext:163 | "Accept"
      okay: 'restext://Common_159'
      header:
      # ../.source/FearoftheUnknown_Eng_v15.cs:6956
      - type: 'image'
        asset: 'image://setup/VillageChronicleCover'
        style: 'setup-image'
      content:
      # ../.source/FearoftheUnknown_Eng_v15.cs:6958
      - type: 'text'
        # ../en-US.restext:739 | "Turn to page **{dev}** of..."
        value: 'restext://Isolation3_001'
# ../.source/FearoftheUnknown_Eng_v15.cs:6969
- type: 'conditional'
  if: 'dev == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:6973
  - type: 'section'
    # ../en-US.restext:129 | "{icon:storybooktoken} **V..."
    title: 'restext://Common_125'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:6982
    - type: 'text'
      # ../en-US.restext:130 | "As a registered citizen w..."
      value: 'restext://Common_126'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6984
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6986
    - type: 'text'
      # ../en-US.restext:131 | "You MUST place your **Sel..."
      value: 'restext://Common_127'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6992
    - type: 'link'
      # ../en-US.restext:132 | "click here to complete ve..."
      label: 'restext://Common_128'
      target: 'IsoIdentificationSignIn' # ./00211-IsoIdentificationSignIn.mws.yaml
      snapshot: true
    # ../.source/FearoftheUnknown_Eng_v15.cs:6993
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:6997
    - type: 'text'
      # ../en-US.restext:133 | "_(If you have not verifie..."
      value: 'restext://Common_129'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7005
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7010
- type: 'section'
  # ../en-US.restext:66 | "**The Church**"
  title: 'restext://Common_062'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7019
  - type: 'link'
    # ../en-US.restext:67 | "Click here"
    label: 'restext://Common_063'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:7020
  - type: 'text'
    # ../en-US.restext:68 | " for an explanation of th..."
    value: 'restext://Common_064'
# ../.source/FearoftheUnknown_Eng_v15.cs:7025
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7029
- type: 'section'
  # ../en-US.restext:118 | "{icon:storybooktoken} **B..."
  title: 'restext://Common_114'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7039
  - type: 'text'
    # ../en-US.restext:119 | "Once per round, each play..."
    value: 'restext://Common_115'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7059
  - type: 'link'
    # ../en-US.restext:120 | "click here for the conseq..."
    label: 'restext://Common_116'
    target: 'SmugConsequence' # ./00090-SmugConsequence.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:7060
  - type: 'text'
    value: '.'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7061
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7064
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:121 | "Click here at the End of ..."
    label: 'restext://Common_117'
    target: 'IsolationCaravanResolve' # ./00241-IsolationCaravanResolve.mws.yaml
    # ../en-US.restext:181 | "End of Round"
    okay: 'restext://Common_177'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '9'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:122 | "The Late Years of the Thi..."
      value: 'restext://Common_118'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:160 | "Perform any End of Round ..."
      value: 'restext://Common_156'
