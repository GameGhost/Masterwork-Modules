- type: 'let'
  var: '_rnd_BusinessMeetb_0'
  expr: '["The Count and what appeared to be several visitors sharing similar, friendly, yet distant demeanors urged me towards a sumptuous banquet table arranged as if my presence had been expected that very evening. I dined upon portions of creamed pheasant, black puddings, ostropel, and a healthy share of plum brandy. The food was so varied and rich that I was surprised that when the courses waned a hunger still remained with me.", "The Count''s attendant ushered me into the study, where the gentleman relaxed in a daychair sipping from a glass full of deep red wine. He bid me sit and we talked for many minutes as I observed the mahogany shelves that lined the room, overloaded with books that appeared so new the spines had not been cracked."].shuffled("BusinessMeetb_0")[0]'
