    expr: 'warriorB.replace("_2", "")'
  # ../.source/FearoftheUnknown_Eng_v15.cs:32600
  - type: 'text'
    # ../en-US.restext:2411 | "**{_rpl_Player2Statsfin_0}**"
    value: 'restext://Player2Statsfin_001'
