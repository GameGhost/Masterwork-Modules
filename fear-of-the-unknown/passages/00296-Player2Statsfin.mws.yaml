      # ../en-US.restext:243 | "Please enter the epic nam..."
      value: 'restext://Common_239'
    - type: 'input'
      label: ''
      var: 'warriorB'
    # ../en-US.restext:286 | "Continue"
    okay: 'restext://Common_282'
    onclose:
    - type: 'assign'
      var: 'warriorB_submitted'
      expr: 'true'
    snapshot: true
    target: 'Player2Statsfin' # ./00296-Player2Statsfin.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:32595
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:32599
