# ../.source/FearoftheUnknown_Eng_v15.cs:32580
---
format: 'mws/0.4'
passage_id: 'Player2Statsfin'
# ../en-US.restext:2444 | Player2Statsfin_001 | "{_rpl_Player2Statsfin_0} ..."
# ../en-US.restext:65 | Common_006 | "Complete"
title: '{warriorB ? "restext://Player2Statsfin_001" : "restext://Common_006"}'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:32583
- type: 'conditional'
  if: '!warriorB_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:97 | "Please enter the epic nam..."
      value: 'restext://Directive_EnterWarriorName'
    - type: 'input'
      label: ''
      var: 'warriorB'
    # ../en-US.restext:371 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'warriorB_submitted'
      expr: 'true'
    snapshot: true
    target: 'Player2Statsfin' # ./00296-Player2Statsfin.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:32599
- type: 'conditional'
  if: 'warriorB'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:32600
  - type: 'let'
    var: '_rpl_Player2Statsfin_0'
    expr: 'warriorB.replace("_2", "")'
# ../.source/FearoftheUnknown_Eng_v15.cs:32607
- type: 'text'
  # ../en-US.restext:2445 | "Agility: **{agiB}**"
  value: 'restext://Player2Statsfin_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:32612
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:32613
- type: 'text'
  # ../en-US.restext:2446 | "Strength: **{strB}**"
  value: 'restext://Player2Statsfin_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:32618
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:32619
- type: 'text'
  # ../en-US.restext:2447 | "Life: **{hitB}**"
  value: 'restext://Player2Statsfin_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:32624
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:32628
- type: 'text'
  # ../en-US.restext:200 | "**You are ready for a tri..."
  value: 'restext://Heading_ReadyForTrialByCombat'
# ../.source/FearoftheUnknown_Eng_v15.cs:32630
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:32632
- type: 'text'
  # ../en-US.restext:103 | "If this is correct, please "
  value: 'restext://Directive_IfCorrectPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:32633
- type: 'link'
  # ../en-US.restext:59 | "click to continue..."
  label: 'restext://Click_ToContinueEllipsis_Lower'
  target: 'Player3StatEntry' # ./00297-Player3StatEntry.mws.yaml
  snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:32634
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:32637
- type: 'text'
  # ../en-US.restext:104 | "If this is in error, please "
  value: 'restext://Directive_IfErrorPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:32638
- type: 'link'
  # ../en-US.restext:52 | "return to the start..."
  label: 'restext://Click_ReturnToStart'
