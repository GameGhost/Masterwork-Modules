# ../.source/FearoftheUnknown_Eng_v15.cs:12282
---
format: 'mws/0.4'
passage_id: 'LiberalBonus'
# ../en-US.restext:1035 | "The {menname} Program"
title: 'restext://LiberalBonus_001'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:12293
- type: 'text'
  # ../en-US.restext:1036 | "The **Menagerie** Estate ..."
  value: 'restext://LiberalBonus_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:12308
- type: 'conditional'
  if: 'players >= 4'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:12310
  - type: 'text'
    # ../en-US.restext:1037 | "The player who has the se..."
    value: 'restext://LiberalBonus_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:12312
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:12314
- type: 'link'
  # ../en-US.restext:31 | "Continue to Scoring..."
  label: 'restext://Click_ContinueToScoring'
  target: 'PEWitchEnding' # ./00217-PEWitchEnding.mws.yaml
  snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:12317
- type: 'conditional'
  if: 'players <= 3'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:12319
  - type: 'conditional'
    if: 'asylumcount >= 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:12321
    - type: 'assign'
      var: 'ending'
      expr: '"FOTU-End7"' # ./00262-FOTU-End7.mws.yaml
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:12325
    - type: 'assign'
      var: 'ending'
      expr: '"FOTU-End8"' # ./00263-FOTU-End8.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:12328
- type: 'conditional'
  if: 'players >= 4'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:12330
  - type: 'conditional'
    if: 'asylumcount >= 3'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:12332
    - type: 'assign'
      var: 'ending'
      expr: '"FOTU-End7"' # ./00262-FOTU-End7.mws.yaml
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:12336
    - type: 'assign'
      var: 'ending'
      expr: '"FOTU-End8"' # ./00263-FOTU-End8.mws.yaml
