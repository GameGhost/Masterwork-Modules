# ../.source/FearoftheUnknown_Eng_v15.cs:1817
---
format: 'mws/0.4'
passage_id: 'Mania'
# ../en-US.restext:363 | "WITCH HUNT"
title: 'restext://Title_WitchHuntCaps'
# ../en-US.restext:332 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:1824
- type: 'assign'
  var: 'round'
  expr: '1'
# ../.source/FearoftheUnknown_Eng_v15.cs:1827
- type: 'conditional'
  if: '!whpg'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:1831
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:364 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:1835
    - type: 'image'
      asset: 'image://setup/AngryMobSetup1'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:1837
    - type: 'text'
      # ../en-US.restext:411 | "Turn to the **Fear of the..."
      value: 'restext://Mania_004'
    # ../.source/FearoftheUnknown_Eng_v15.cs:1863
    - type: 'switch'
      on: 'players'
      cases:
      - match: 2
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1865
        - type: 'assign'
          var: 'tracker'
          expr: '6'
      - match: 3
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1869
        - type: 'assign'
          var: 'tracker'
          expr: 'rand_between(6, 7, "Mania_0")'
      - match: 4
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1873
        - type: 'assign'
          var: 'tracker'
          expr: 'rand_between(7, 9, "Mania_1")'
      - match: 5
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1877
        - type: 'assign'
          var: 'tracker'
          expr: 'rand_between(8, 10, "Mania_2")'
      - match: 2
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1891
        - type: 'assign'
          var: 'randomplayer'
          expr: '[nameA, nameB].shuffled("Mania_3")[0]'
      - match: 3
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1895
        - type: 'assign'
          var: 'randomplayer'
          expr: '[nameA, nameB, nameC].shuffled("Mania_4")[0]'
      - match: 4
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1899
        - type: 'assign'
          var: 'randomplayer'
          expr: '[nameA, nameB, nameC, nameD].shuffled("Mania_5")[0]'
      - match: 5
        nodes:
        # ../.source/FearoftheUnknown_Eng_v15.cs:1903
        - type: 'assign'
          var: 'randomplayer'
          expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("Mania_6")[0]'
    # ../.source/FearoftheUnknown_Eng_v15.cs:1905
    - type: 'assign'
      var: 'randomname'
      expr: 'randomplayer'
    # ../.source/FearoftheUnknown_Eng_v15.cs:1858
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:1860
    - type: 'text'
      # ../en-US.restext:412 | "Place the Suspicion Marke..."
      value: 'restext://Mania_005'
# ../.source/FearoftheUnknown_Eng_v15.cs:1916
- type: 'section'
  # ../en-US.restext:218 | "{icon:storybooktoken} **F..."
  title: 'restext://Heading_StorybookToken_FamilyPlot'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:1926
  - type: 'text'
    # ../en-US.restext:104 | "Any time a player is over..."
    value: 'restext://Directive_OvertakenByMob_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:1930
  - type: 'link'
    # ../en-US.restext:55 | "click here for a special ..."
    label: 'restext://Click_SpecialMessage_Generic1'
    target: 'PlotPlayerCheckin' # ./00202-PlotPlayerCheckin.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:1933
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:1936
- type: 'conditional'
  if: 'fp10vp == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:1940
  - type: 'section'
    # ../en-US.restext:211 | "{icon:storybooktoken} **10VP**"
    title: 'restext://Heading_StorybookToken_10VP'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:1950
    - type: 'text'
      # ../en-US.restext:113 | "Whenever a player reaches..."
      value: 'restext://Directive_Reaches10VP_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:1951
    - type: 'link'
      # ../en-US.restext:50 | "click here"
      label: 'restext://Click_Here_Plain'
      target: 'FP10VP' # ./00129-FP10VP.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:1953
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:1957
- type: 'conditional'
  if: 'fpresearch2 == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:1961
  - type: 'section'
    # ../en-US.restext:223 | "{icon:storybooktoken} **R..."
    title: 'restext://Heading_StorybookToken_ResearchLevel2'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:1972
    - type: 'text'
      # ../en-US.restext:116 | "Whenever a player reaches..."
      value: 'restext://Directive_ReachesJournalLevel2_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:1973
    - type: 'link'
      # ../en-US.restext:413 | "Click here."
      label: 'restext://Mania_014'
      target: 'FPResearch2' # ./00130-FPResearch2.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:1976
  - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:1978
- type: 'conditional'
  if: 'fpsanity3 == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:1982
  - type: 'section'
    # ../en-US.restext:221 | "{icon:storybooktoken} **I..."
    title: 'restext://Heading_StorybookToken_InsanityOf3'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:1993
    - type: 'text'
      # ../en-US.restext:115 | "Whenever a player reaches..."
      value: 'restext://Directive_ReachesInsanitySpace3_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:1996
    - type: 'link'
      # ../en-US.restext:38 | "Click here…"
      label: 'restext://Click_HereEllipsisChar'
      target: 'FPSanity3' # ./00131-FPSanity3.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:1999
  - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:2001
- type: 'conditional'
  if: 'fpcreepy3 == 0'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2005
  - type: 'section'
    # ../en-US.restext:217 | "{icon:storybooktoken} **C..."
    title: 'restext://Heading_StorybookToken_Creepy'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2015
    - type: 'text'
      # ../en-US.restext:114 | "Whenever a player reaches..."
      value: 'restext://Directive_ReachesCreepySpace3_Fragment'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2018
    - type: 'link'
      # ../en-US.restext:39 | "click here..."
      label: 'restext://Click_HereEllipsis_Lower'
      target: 'FPCreepy3' # ./00132-FPCreepy3.mws.yaml
      snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:2020
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:2025
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:2028
- type: 'section'
  # ../en-US.restext:205 | "**Second Round Event**"
  title: 'restext://Heading_SecondRoundEvent'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2037
  - type: 'text'
    # ../en-US.restext:273 | "As tensions rise and accu..."
    value: 'restext://Narrative_TensionsRiseAngryMob'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2039
  - type: 'break'
  # ../.source/FearoftheUnknown_Eng_v15.cs:2042
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:35 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_NextRound'
    target: 'Mania2' # ./00036-Mania2.mws.yaml
    # ../en-US.restext:369 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '1'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:414 | "The Early Years of the Fi..."
      value: 'restext://Mania_025'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:306 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
