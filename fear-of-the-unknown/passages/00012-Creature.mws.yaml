# ../.source/FearoftheUnknown_Eng_v15.cs:2956
---
format: 'mws/0.4'
passage_id: 'Creature'
# ../en-US.restext:360 | "The Creature Re emerges"
title: 'restext://Title_TheCreatureReemerges'
# ../en-US.restext:329 | "Early Years"
subtitle: 'restext://Title_EarlyYears'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:2963
- type: 'assign'
  var: 'round'
  expr: '7'
# ../.source/FearoftheUnknown_Eng_v15.cs:2965
- type: 'conditional'
  if: '!crpg'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:2969
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:370 | "Accept"
    okay: 'restext://UIButton_Accept'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2973
    - type: 'image'
      asset: 'image://setup/AngryMobSetup1'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:2975
    - type: 'conditional'
      if: 'kill == "butcher"'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2977
      - type: 'text'
        # ../en-US.restext:476 | "Turn to page **4** of the..."
        value: 'restext://Creature_003'
      else:
      # ../.source/FearoftheUnknown_Eng_v15.cs:2987
      - type: 'text'
        # ../en-US.restext:475 | "Turn to page **5** of the..."
        value: 'restext://Creature_002'
    # ../.source/FearoftheUnknown_Eng_v15.cs:2994
    - type: 'text'
      # ../en-US.restext:477 | " Retrieve the **Puppy** a..."
      value: 'restext://Creature_004'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3013
    - type: 'conditional'
      if: '!Creature'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:3015
      - type: 'assign'
        var: 'Creature'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:3016
      - type: 'assign'
        var: 'tracker'
        expr: 'tracker + 2'
      # ../.source/FearoftheUnknown_Eng_v15.cs:3017
      - type: 'switch'
        on: 'players'
        cases:
        - match: 4
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:3019
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 1'
        - match: 5
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:3023
          - type: 'assign'
            var: 'tracker'
            expr: 'tracker + 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3026
    - type: 'text'
      # ../en-US.restext:130 | "**{tracker}** and the {ic..."
      value: 'restext://Directive_TrackerAndMobMarkerLeft'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3031
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:3032
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:3034
      - type: 'text'
        # ../en-US.restext:66 | "Then, since this is a 3 p..."
        value: 'restext://Directive_3Player_PassMarker_A'
      # ../.source/FearoftheUnknown_Eng_v15.cs:3035
      - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:3044
- type: 'section'
  # ../en-US.restext:210 | "{icon:storybooktoken} **C..."
  title: 'restext://Heading_StorybookToken_CreaturesRequests'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3055
  - type: 'text'
    # ../en-US.restext:478 | "When taking the **Perform..."
    value: 'restext://Creature_006'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3079
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3081
  - type: 'text'
    # ../en-US.restext:479 | "However, if a player comp..."
    value: 'restext://Creature_007'
  # ../.source/FearoftheUnknown_Eng_v15.cs:3082
  - type: 'link'
    # ../en-US.restext:46 | "click here to see the con..."
    label: 'restext://Click_HereToSeeConsequences'
    target: 'Guilt' # ./00120-Guilt.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:3085
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3091
- type: 'section'
  # ../en-US.restext:223 | "**The Church**"
  title: 'restext://Heading_TheChurch'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3099
  - type: 'link'
    # ../en-US.restext:36 | "Click here"
    label: 'restext://Click_HereBare'
    target: 'FOTU-Church' # ./00352-FOTU-Church.mws.yaml
    snapshot: true
  # ../.source/FearoftheUnknown_Eng_v15.cs:3100
  - type: 'text'
    # ../en-US.restext:76 | " for an explanation of th..."
    value: 'restext://Directive_ChurchExplanation_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:3103
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3108
- type: 'section'
  # ../en-US.restext:480 | "**The Asylum**"
  title: 'restext://Creature_012'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3116
  - type: 'text'
    # ../en-US.restext:481 | "The town has resolved to ..."
    value: 'restext://Creature_013'
# ../.source/FearoftheUnknown_Eng_v15.cs:3120
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:3123
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:3130
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:34 | "Click here at the end of ..."
    label: 'restext://Click_EndRound_MoveNextRound'
    target: 'AsylumOpps' # ./00145-AsylumOpps.mws.yaml
    # ../en-US.restext:375 | "End of Round"
    okay: 'restext://UIButton_EndOfRound'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '4'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:295 | "The Early Years of the Se..."
      value: 'restext://Round_GenerationII_EarlyEnded'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:299 | "Then, perform all Start o..."
      value: 'restext://Round_StartMiddleYears_Rule'
