  # ../en-US.restext:1788 | journal1a_003 | "Collected Notes - "
  # ../en-US.restext:1789 | journal1a_004 | "Diary Entry - "
  expr: '["restext://journal1a_001", "restext://journal1a_002", "restext://journal1a_003", "restext://journal1a_004"].shuffled("journal1a_4")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:23321
- type: 'text'
  # ../en-US.restext:1790 | "**{_rnd_journal1a_0}**"
  value: 'restext://journal1a_005'
  lets:
  - '_rnd_journal1a_0'
# ../.source/FearoftheUnknown_Eng_v15.cs:23339
- type: 'assign'
