    # ../.source/FearoftheUnknown_Eng_v15.cs:23325
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB].shuffled("journal1a_0")[0]'
  - match: 3
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:23329
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC].shuffled("journal1a_1")[0]'
