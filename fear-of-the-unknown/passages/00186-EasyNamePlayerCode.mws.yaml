# ../.source/FearoftheUnknown_Eng_v15.cs:21753
---
format: 'mws/0.4'
passage_id: 'EasyNamePlayerCode'
tags:
- 'NOTE'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:21755
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:21757
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB]'
  - match: 3
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:21761
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC]'
  - match: 4
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:21765
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC, nameD]'
  - match: 5
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:21769
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC, nameD, nameE]'
