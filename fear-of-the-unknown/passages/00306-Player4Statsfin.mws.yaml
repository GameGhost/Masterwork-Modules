# ../.source/FearoftheUnknown_Eng_v15.cs:33082
---
format: 'mws/0.4'
passage_id: 'Player4Statsfin'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:33085
- type: 'conditional'
  if: '!warriorD_submitted'
  then:
  - type: 'popup'
    layout: 'prompt'
    content:
    - type: 'text'
      # ../en-US.restext:91 | "Please enter the epic nam..."
      value: 'restext://Directive_EnterWarriorName'
    - type: 'input'
      label: ''
      var: 'warriorD'
    # ../en-US.restext:369 | "Continue"
    okay: 'restext://UIButton_Continue'
    onclose:
    - type: 'assign'
      var: 'warriorD_submitted'
      expr: 'true'
    snapshot: true
    target: 'Player4Statsfin' # ./00306-Player4Statsfin.mws.yaml
# ../.source/FearoftheUnknown_Eng_v15.cs:33097
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:33101
- type: 'conditional'
  if: 'warriorD'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:33102
  - type: 'let'
    var: '_rpl_Player4Statsfin_0'
    expr: 'warriorD.replace("_4", "")'
  # ../.source/FearoftheUnknown_Eng_v15.cs:33102
  - type: 'text'
    # ../en-US.restext:2481 | "**{_rpl_Player4Statsfin_0}**"
    value: 'restext://Player4Statsfin_001'
    lets:
    - '_rpl_Player4Statsfin_0'
# ../.source/FearoftheUnknown_Eng_v15.cs:33104
- type: 'text'
  # ../en-US.restext:161 | " **Complete**"
  value: 'restext://Heading_Complete_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:33107
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:33109
- type: 'text'
  # ../en-US.restext:2482 | "Agility: **{agiD}**"
  value: 'restext://Player4Statsfin_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:33114
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:33115
- type: 'text'
  # ../en-US.restext:2483 | "Strength: **{strD}**"
  value: 'restext://Player4Statsfin_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:33120
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:33121
- type: 'text'
  # ../en-US.restext:2484 | "Life: **{hitD}**"
  value: 'restext://Player4Statsfin_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:33126
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:33130
- type: 'text'
  # ../en-US.restext:198 | "**You are ready for a tri..."
  value: 'restext://Heading_ReadyForTrialByCombat'
# ../.source/FearoftheUnknown_Eng_v15.cs:33132
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:33134
- type: 'text'
  # ../en-US.restext:97 | "If this is correct, please "
  value: 'restext://Directive_IfCorrectPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:33135
- type: 'link'
  # ../en-US.restext:59 | "click to continue..."
  label: 'restext://Click_ToContinueEllipsis_Lower'
  target: 'Player5StatEntry' # ./00307-Player5StatEntry.mws.yaml
  snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:33136
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:33139
- type: 'text'
  # ../en-US.restext:98 | "If this is in error, please "
  value: 'restext://Directive_IfErrorPlease_Fragment'
# ../.source/FearoftheUnknown_Eng_v15.cs:33140
- type: 'link'
  # ../en-US.restext:52 | "return to the start..."
  label: 'restext://Click_ReturnToStart'
