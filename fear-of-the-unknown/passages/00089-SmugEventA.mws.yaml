  # ../.source/FearoftheUnknown_Eng_v15.cs:11784
  - type: 'text'
    # ../en-US.restext:1007 | " Experiment face-up on th..."
    value: 'restext://SmugEventA_013'
  # ../.source/FearoftheUnknown_Eng_v15.cs:11787
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:11789
  - type: 'text'
    # ../en-US.restext:1008 | "Then, retrieve **{collab}..."
    value: 'restext://SmugEventA_014'
  # ../.source/FearoftheUnknown_Eng_v15.cs:11798
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:11802
  - type: 'text'
    # ../en-US.restext:1009 | "**WARNING: COMPLETING THI..."
    value: 'restext://SmugEventA_015'
