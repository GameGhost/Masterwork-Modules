# ../.source/FearoftheUnknown_Eng_v15.cs:11677
---
format: 'mws/0.4'
passage_id: 'SmugEventA'
# ../en-US.restext:349 | "Preparations"
title: 'restext://Title_Preparations'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:11684
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:11686
    - type: 'assign'
      var: 'collab'
      expr: '3'
  - match: 3
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:11690
    - type: 'assign'
      var: 'collab'
      expr: '2'
  - match: 4
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:11694
    - type: 'assign'
      var: 'collab'
      expr: 'rand_between(2, 3, "SmugEventA_0")'
  - match: 5
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:11698
    - type: 'assign'
      var: 'collab'
      expr: 'rand_between(3, 4, "SmugEventA_1")'
# ../.source/FearoftheUnknown_Eng_v15.cs:11701
- type: 'text'
  # ../en-US.restext:996 | "To properly introduce the..."
  value: 'restext://SmugEventA_002'
# ../.source/FearoftheUnknown_Eng_v15.cs:11711
- type: 'switch'
  on: 'ex'
  cases:
  - match: 'bio'
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:11713
    - type: 'text'
      # ../en-US.restext:998 | "a Biology"
      value: 'restext://SmugEventA_004'
  - match: 'chem'
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:11717
    - type: 'text'
      # ../en-US.restext:999 | "a Chemistry"
      value: 'restext://SmugEventA_005'
  default:
  # ../.source/FearoftheUnknown_Eng_v15.cs:11721
  - type: 'text'
    # ../en-US.restext:997 | "an Engineering"
    value: 'restext://SmugEventA_003'
# ../.source/FearoftheUnknown_Eng_v15.cs:11723
- type: 'text'
  # ../en-US.restext:1000 | " Experiment. "
  value: 'restext://SmugEventA_006'
# ../.source/FearoftheUnknown_Eng_v15.cs:11725
- type: 'conditional'
  if: 'players >= 3'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:11727
  - type: 'text'
    # ../en-US.restext:1001 | "Each player can only gain..."
    value: 'restext://SmugEventA_007'
# ../.source/FearoftheUnknown_Eng_v15.cs:11736
- type: 'conditional'
  if: 'players == 2'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:11738
  - type: 'text'
    # ../en-US.restext:1002 | "The player who gains the ..."
    value: 'restext://SmugEventA_008'
# ../.source/FearoftheUnknown_Eng_v15.cs:11747
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:11751
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:29 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: 'Isolation2' # ./00043-Isolation2.mws.yaml
  # ../en-US.restext:369 | "Close"
  okay: 'restext://UIButton_Close'
  snapshot: true
  header:
  # ../.source/FearoftheUnknown_Eng_v15.cs:11766
  - type: 'image'
    asset: 'image://setup/S2_CollaborativeToken'
    style: 'setup-image'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:11768
  - type: 'text'
    # ../en-US.restext:1003 | "Place the "
    value: 'restext://SmugEventA_009'
  # ../.source/FearoftheUnknown_Eng_v15.cs:11771
  - type: 'switch'
    on: 'ex'
    cases:
    - match: 'bio'
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:11773
      - type: 'text'
        # ../en-US.restext:1005 | "**Injecting an Agitated G..."
        value: 'restext://SmugEventA_011'
    - match: 'chem'
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:11777
      - type: 'text'
        # ../en-US.restext:1006 | "**A Fabric That Cannot Be..."
        value: 'restext://SmugEventA_012'
    default:
    # ../.source/FearoftheUnknown_Eng_v15.cs:11781
    - type: 'text'
      # ../en-US.restext:1004 | "**A Robot Servant That Pr..."
