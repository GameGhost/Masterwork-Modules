# ../.source/FearoftheUnknown_Eng_v15.cs:18411
---
format: 'mws/0.4'
passage_id: 'BusMeetE'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:18416
- type: 'text'
  # ../en-US.restext:324 | "**Carefully pick up this ..."
  value: 'restext://Storybook_PickUpDevicePrivate'
# ../.source/FearoftheUnknown_Eng_v15.cs:18419
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:18425
- type: 'popup'
  # ../en-US.restext:53 | "Once you are ready, click..."
  label: 'restext://Click_RevealSecretConversation'
  layout: 'reveal'
  # ../en-US.restext:367 | "Close"
  cancel: 'restext://UIButton_Close'
  snapshot: true
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:18469
  - type: 'text'
    # ../en-US.restext:147 | "**A Sly Investment**"
    value: 'restext://Heading_ASlyInvestment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18471
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18475
  - type: 'text'
    # ../en-US.restext:166 | "**Journal Entry of {busm}..."
    value: 'restext://Heading_JournalEntryOfBusm_Cont'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18486
  - type: 'let'
    var: '_rnd_BusMeetE_0'
    # ../en-US.restext:250 | Narrative_FineHairsOnPalm | "I could distinctly see fi..."
    # ../en-US.restext:257 | Narrative_LeanedForwardCoarseWhisper | "He leaned forward, speaki..."
    expr: '["restext://Narrative_FineHairsOnPalm", "restext://Narrative_LeanedForwardCoarseWhisper"].shuffled("BusMeetE_0")[0]'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18484
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18486
  - type: 'text'
    # ../en-US.restext:1421 | "{_rnd_BusMeetE_0} \"Donat..."
    value: 'restext://BusMeetE_001'
    lets:
    - '_rnd_BusMeetE_0'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18501
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18503
  - type: 'conditional'
    if: 'busvp == 1'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18505
    - type: 'text'
      # ../en-US.restext:260 | "The man smiled once again..."
      value: 'restext://Narrative_ManSmiledSecondTime'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18506
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18509
  - type: 'text'
    # ../en-US.restext:251 | "\"**For $1**, you have my..."
    value: 'restext://Narrative_ForOneDollarNewServant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18522
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18524
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18528
    - type: 'text'
      # ../en-US.restext:253 | "**\"For $2**, I will guar..."
      value: 'restext://Narrative_ForTwoDollarsBallChain'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18536
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18539
  - type: 'conditional'
    if: '!bhome || String.IsNullOrEmpty(bhome)'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18543
    - type: 'text'
      # ../en-US.restext:252 | "**\"For $3**, I will offe..."
      value: 'restext://Narrative_ForThreeDollarsDeed'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18553
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18555
  - type: 'text'
    # ../en-US.restext:264 | "I was admittedly not impr..."
    value: 'restext://Narrative_NotImpressedByOffer'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18557
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18561
  - type: 'text'
    # ../en-US.restext:163 | "**How much would you like..."
    value: 'restext://Heading_HowMuchInvest'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18563
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18565
  - type: 'conditional'
    if: '!bhome || String.IsNullOrEmpty(bhome)'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18568
    - type: 'link'
      # ../en-US.restext:140 | "$3."
      label: 'restext://Dollar_Three'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18432
      - type: 'assign'
        var: 'Econt'
        expr: 'Econt + 3'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18433
      - type: 'assign'
        var: 'bhome'
        expr: 'nameE'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18569
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18572
  - type: 'conditional'
    if: 'bnc < 2'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18575
    - type: 'link'
      # ../en-US.restext:141 | "$2."
      label: 'restext://Dollar_Two'
      target: 'BusThanks' # ./00154-BusThanks.mws.yaml
      snapshot: true
      onclick:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18440
      - type: 'assign'
        var: 'Econt'
        expr: 'Econt + 2'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18441
      - type: 'assign'
        var: 'btemp'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18442
      - type: 'assign'
        var: 'bnc'
        expr: 'bnc + 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:18576
    - type: 'break'
      style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18580
  - type: 'link'
    # ../en-US.restext:139 | "$1."
    label: 'restext://Dollar_One'
    target: 'BusThanks' # ./00154-BusThanks.mws.yaml
    snapshot: true
    onclick:
    # ../.source/FearoftheUnknown_Eng_v15.cs:18449
    - type: 'assign'
      var: 'Econt'
      expr: 'Econt + 1'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18581
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:18583
  - type: 'switch'
    on: 'busvp'
    cases:
    - match: 0
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18586
      - type: 'link'
        # ../en-US.restext:25 | "I'm not convinced."
        label: 'restext://Choice_NotConvinced'
        target: '${BusMeetEnextpsg}'
        snapshot: true
        onclick:
        # ../.source/FearoftheUnknown_Eng_v15.cs:18456
        - type: 'conditional'
          if: 'BusMeetEnextpsg == "" || BusMeetEnextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:18458
          - type: 'assign'
            var: 'BusMeetEnextpsg'
            expr: '["BusBargain", "BusNo"].shuffled("BusMeetE_1")[0]'
      # ../.source/FearoftheUnknown_Eng_v15.cs:18587
      - type: 'text'
        # ../en-US.restext:92 | "_This option will provide..."
        value: 'restext://Directive_FiftyPercentChanceImproveDeal'
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:18591
      - type: 'link'
        # ../en-US.restext:20 | "I will pass."
        label: 'restext://Choice_IWillPass'
        target: 'BusNo' # ./00155-BusNo.mws.yaml
        snapshot: true
