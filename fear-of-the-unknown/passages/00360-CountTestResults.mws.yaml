# ../.source/FearoftheUnknown_Eng_v15.cs:37725
---
format: 'mws/0.4'
passage_id: 'CountTestResults'
# ../en-US.restext:197 | "Patient {question}"
title: 'restext://Heading_PatientQuestion'
# ../en-US.restext:157 | "Assessment Results"
subtitle: 'restext://Heading_AssessmentResults'
tags:
- 'revised'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:37736
- type: 'conditional'
  conditions:
  - if: 'question == cureplayer'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:37738
    - type: 'text'
      # ../en-US.restext:2752 | "The patient is perfectly ..."
      value: 'restext://CountTestResults_004'
    # ../.source/FearoftheUnknown_Eng_v15.cs:37739
    - type: 'break'
      style: 'paragraph'
  - if: 'test >= 3'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:37745
    - type: 'text'
      # ../en-US.restext:2753 | "Alas, despite such a **he..."
      value: 'restext://CountTestResults_005'
    # ../.source/FearoftheUnknown_Eng_v15.cs:37759
    - type: 'break'
      style: 'paragraph'
  else:
  # ../.source/FearoftheUnknown_Eng_v15.cs:37765
  - type: 'text'
    # ../en-US.restext:2750 | "Uggh. "
    value: 'restext://CountTestResults_002'
  # ../.source/FearoftheUnknown_Eng_v15.cs:37766
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:37768
  - type: 'text'
    # ../en-US.restext:2751 | "Perhaps it is unprofessio..."
    value: 'restext://CountTestResults_003'
  # ../.source/FearoftheUnknown_Eng_v15.cs:37771
  - type: 'break'
    style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:37775
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:37778
- type: 'popup'
  layout: 'setup'
  # ../en-US.restext:29 | "Click to continue..."
  label: 'restext://Click_ContinueEllipsis_C'
  target: '${round == 19 ? "Liberal" : round == 20 ? "Liberal2" : "Liberal3"}' # ./00026-Liberal.mws.yaml, ./00050-Liberal2.mws.yaml, ./00051-Liberal3.mws.yaml
  # ../en-US.restext:371 | "Close"
  okay: 'restext://UIButton_Close'
  snapshot: true
  header:
  - type: 'conditional'
    conditions:
    - if: 'question == cureplayer'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37806
      - type: 'image'
        asset: 'image://setup/S2_BlessingOfTheStrigoi'
        style: 'setup-image'
    - if: 'test >= 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37824
      - type: 'image'
        asset: 'image://setup/ScoreTrackMarker'
        style: 'setup-image'
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:37846
    - type: 'image'
      asset: 'image://setup/ScoreTrackMarker'
      style: 'setup-image'
  content:
  - type: 'conditional'
    conditions:
    - if: 'question == cureplayer'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37809
      - type: 'text'
        # ../en-US.restext:2755 | "You suffer no penalty. _T..."
        value: 'restext://CountTestResults_008'
    - if: 'test >= 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:37827
      - type: 'text'
        # ../en-US.restext:2756 | "Immediately place one of ..."
        value: 'restext://CountTestResults_009'
      # ../.source/FearoftheUnknown_Eng_v15.cs:37834
      - type: 'break'
        style: 'paragraph'
      # ../.source/FearoftheUnknown_Eng_v15.cs:37836
      - type: 'text'
        # ../en-US.restext:130 | "Then, return your {icon:c..."
        value: 'restext://Directive_ReturnCreepyMarkerStart'
    else:
    # ../.source/FearoftheUnknown_Eng_v15.cs:37851
    - type: 'text'
      # ../en-US.restext:2754 | "**Lose 1VP.** Then, immed..."
      value: 'restext://CountTestResults_006'
    # ../.source/FearoftheUnknown_Eng_v15.cs:37860
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:37862
    - type: 'text'
      # ../en-US.restext:130 | "Then, return your {icon:c..."
      value: 'restext://Directive_ReturnCreepyMarkerStart'
