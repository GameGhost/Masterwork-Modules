# ../.source/FearoftheUnknown_Eng_v15.cs:23186
---
format: 'mws/0.4'
passage_id: 'letter1a'
layout: 'narration'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:23192
- type: 'switch'
  on: 'players'
  cases:
  - match: 2
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:23194
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB].shuffled("letter1a_0")[0]'
  - match: 3
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:23198
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC].shuffled("letter1a_1")[0]'
  - match: 4
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:23202
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC, nameD].shuffled("letter1a_2")[0]'
  - match: 5
    nodes:
    # ../.source/FearoftheUnknown_Eng_v15.cs:23206
    - type: 'assign'
      var: 'randomplayer'
      expr: '[nameA, nameB, nameC, nameD, nameE].shuffled("letter1a_3")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:23190
- type: 'let'
  var: '_rnd_letter1a_0'
  # ../en-US.restext:1754 | letter1a_001 | "Letter from "
  # ../en-US.restext:1755 | letter1a_002 | "Noted Letters - "
  # ../en-US.restext:1756 | letter1a_003 | "Letter Excerpt from "
  # ../en-US.restext:1757 | letter1a_004 | "Correspondence - "
  expr: '["restext://letter1a_001", "restext://letter1a_002", "restext://letter1a_003", "restext://letter1a_004"].shuffled("letter1a_4")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:23190
- type: 'text'
  # ../en-US.restext:1758 | "**{_rnd_letter1a_0}**"
  value: 'restext://letter1a_005'
  lets:
  - '_rnd_letter1a_0'
# ../.source/FearoftheUnknown_Eng_v15.cs:23208
- type: 'assign'
  var: 'randomname'
  expr: 'randomplayer'
# ../.source/FearoftheUnknown_Eng_v15.cs:23213
- type: 'let'
  var: '_rnd_letter1a_1'
  expr: 'rand_between(1, 29, "letter1a_5")'
# ../.source/FearoftheUnknown_Eng_v15.cs:23215
- type: 'let'
  var: '_rnd_letter1a_2'
  # ../en-US.restext:32 | Common_028 | "January"
  # ../en-US.restext:33 | Common_029 | "February"
  # ../en-US.restext:34 | Common_030 | "March"
  # ../en-US.restext:35 | Common_031 | "April"
  # ../en-US.restext:36 | Common_032 | "May"
  # ../en-US.restext:37 | Common_033 | "June"
  # ../en-US.restext:38 | Common_034 | "July"
  # ../en-US.restext:39 | Common_035 | "August"
  # ../en-US.restext:40 | Common_036 | "September"
  # ../en-US.restext:41 | Common_037 | "October"
  # ../en-US.restext:42 | Common_038 | "November"
  # ../en-US.restext:43 | Common_039 | "December"
  expr: '["restext://Common_028", "restext://Common_029", "restext://Common_030", "restext://Common_031", "restext://Common_032", "restext://Common_033", "restext://Common_034", "restext://Common_035", "restext://Common_036", "restext://Common_037", "restext://Common_038", "restext://Common_039"].shuffled("letter1a_6")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:23217
- type: 'switch'
