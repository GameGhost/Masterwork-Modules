# ../.source/FearoftheUnknown_Eng_v15.cs:7779
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7781
- type: 'conditional'
  if: 'creature == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7783
  - type: 'conditional'
    if: 'exped == 0'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:7787
    - type: 'section'
      # ../en-US.restext:268 | "{icon:storybooktoken}**Th..."
      title: 'restext://Common_264'
      style: 'hub-card'
      content:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7797
      - type: 'text'
        # ../en-US.restext:269 | "Any time a player visits ..."
        value: 'restext://Common_265'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7800
      - type: 'break'
        style: 'paragraph'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7802
      - type: 'text'
        # ../en-US.restext:149 | "At the end of each round,..."
        value: 'restext://Common_145'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7809
      - type: 'link'
        # ../en-US.restext:308 | "click here."
        label: 'restext://Common_304'
        target: 'HuntExplanation' # ./00076-HuntExplanation.mws.yaml
        snapshot: true
    # ../.source/FearoftheUnknown_Eng_v15.cs:7812
    - type: 'break'
      style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7818
- type: 'section'
  # ../en-US.restext:131 | "**The** **{menname}** **P..."
  title: 'restext://Common_127'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7829
  - type: 'text'
    # ../en-US.restext:132 | "At the End of the Generat..."
    value: 'restext://Common_128'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7844
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:7846
    - type: 'text'
      # ../en-US.restext:133 | "The player who has the se..."
      value: 'restext://Common_129'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7849
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7852
  - type: 'switch'
    on: 'creature'
    cases:
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7854
      - type: 'switch'
        on: 'exped'
        cases:
        - match: 1
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7857
          - type: 'link'
            # ../en-US.restext:69 | "Click here at the end of ..."
            label: 'restext://Common_065'
            target: '${Liberal2nextpsg}'
            snapshot: true
            onclick:
            # ../.source/FearoftheUnknown_Eng_v15.cs:7883
            - type: 'conditional'
              if: 'Liberal2nextpsg == "" || Liberal2nextpsg == 0'
              then:
              # ../.source/FearoftheUnknown_Eng_v15.cs:7885
              - type: 'assign'
                var: 'Liberal2nextpsg'
                expr: '["LiberalEvent", "LiberalTaxes"].shuffled("Liberal2_0")[0]'
        - match: 0
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7863
          - type: 'link'
            # ../en-US.restext:69 | "Click here at the end of ..."
            label: 'restext://Common_065'
            target: 'Expedition1' # ./00049-Expedition1.mws.yaml
            snapshot: true
    - match: 2
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7870
      - type: 'link'
        # ../en-US.restext:69 | "Click here at the end of ..."
        label: 'restext://Common_065'
        target: '${Liberal2nextpsg}'
        snapshot: true
        onclick:
        # ../.source/FearoftheUnknown_Eng_v15.cs:7894
        - type: 'conditional'
          if: 'Liberal2nextpsg == "" || Liberal2nextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7896
          - type: 'assign'
            var: 'Liberal2nextpsg'
            expr: '["LiberalEvent", "LiberalTaxes"].shuffled("Liberal2_1")[0]'
# ../.source/FearoftheUnknown_Eng_v15.cs:7875
- type: 'assign'
  var: 'round'
  expr: '20'
