- type: 'section'
  # ../en-US.restext:147 | "**Special Servant Rule**"
  title: 'restext://Common_143'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7720
  - type: 'text'
    # ../en-US.restext:148 | "Due to the government-fun..."
    value: 'restext://Common_144'
# ../.source/FearoftheUnknown_Eng_v15.cs:7728
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7732
- type: 'section'
  # ../en-US.restext:149 | "**Rehabilitation Token**"
  title: 'restext://Common_145'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7741
  - type: 'text'
    # ../en-US.restext:150 | "The {icon:s2_rehabilitati..."
    value: 'restext://Common_146'
# ../.source/FearoftheUnknown_Eng_v15.cs:7750
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7755
- type: 'section'
  # ../en-US.restext:151 | "{icon:storybooktoken} **A..."
  title: 'restext://Common_147'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7767
  - type: 'text'
    # ../en-US.restext:152 | "When a player's token ove..."
    value: 'restext://Common_148'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7776
  - type: 'link'
    # ../en-US.restext:153 | "click here to be committed."
    label: 'restext://Common_149'
    target: 'AsylumTreatment' # ./00179-AsylumTreatment.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:7779
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7781
- type: 'conditional'
  if: 'creature == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7783
  - type: 'conditional'
    if: 'exped == 0'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:7787
    - type: 'section'
      # ../en-US.restext:277 | "{icon:storybooktoken}**Th..."
      title: 'restext://Common_273'
      style: 'hub-card'
      content:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7797
      - type: 'text'
        # ../en-US.restext:278 | "Any time a player visits ..."
        value: 'restext://Common_274'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7800
      - type: 'break'
        style: 'paragraph'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7802
      - type: 'text'
        # ../en-US.restext:154 | "At the end of each round,..."
        value: 'restext://Common_150'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7809
      - type: 'link'
        # ../en-US.restext:317 | "click here."
        label: 'restext://Common_313'
        target: 'HuntExplanation' # ./00076-HuntExplanation.mws.yaml
        snapshot: true
    # ../.source/FearoftheUnknown_Eng_v15.cs:7812
    - type: 'break'
      style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7818
- type: 'section'
  # ../en-US.restext:136 | "**The** **{menname}** **P..."
  title: 'restext://Common_132'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7829
  - type: 'text'
    # ../en-US.restext:137 | "At the End of the Generat..."
    value: 'restext://Common_133'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7844
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:7846
    - type: 'text'
      # ../en-US.restext:138 | "The player who has the se..."
      value: 'restext://Common_134'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7849
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7852
  - type: 'switch'
    on: 'creature'
    cases:
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7854
      - type: 'switch'
        on: 'exped'
        cases:
        - match: 1
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7857
          - type: 'popup'
            layout: 'end_of_round'
            # ../en-US.restext:69 | "Click here at the end of ..."
            label: 'restext://Common_065'
            target: '${Liberal2nextpsg}'
            # ../en-US.restext:181 | "End of Round"
            okay: 'restext://Common_177'
            onclose:
            # ../.source/FearoftheUnknown_Eng_v15.cs:7883
            - type: 'conditional'
              if: 'Liberal2nextpsg == "" || Liberal2nextpsg == 0'
              then:
              # ../.source/FearoftheUnknown_Eng_v15.cs:7885
              - type: 'assign'
                var: 'Liberal2nextpsg'
                expr: '["LiberalEvent", "LiberalTaxes"].shuffled("?")[0]'
            - type: 'assign'
              var: '_ProgressRound'
              expr: '8'
            snapshot: true
            content:
            - type: 'text'
              # ../en-US.restext:323 | "The Middle Years of the T..."
              value: 'restext://Common_319'
            - type: 'break'
              style: 'paragraph'
            - type: 'text'
              # ../en-US.restext:158 | "Then, perform all Start o..."
              value: 'restext://Common_154'
        - match: 0
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7863
          - type: 'popup'
            layout: 'end_of_round'
            # ../en-US.restext:69 | "Click here at the end of ..."
            label: 'restext://Common_065'
            target: 'Expedition1' # ./00049-Expedition1.mws.yaml
            # ../en-US.restext:181 | "End of Round"
            okay: 'restext://Common_177'
            onclose:
            - type: 'assign'
              var: '_ProgressRound'
              expr: '8'
            snapshot: true
            content:
            - type: 'text'
              # ../en-US.restext:323 | "The Middle Years of the T..."
              value: 'restext://Common_319'
            - type: 'break'
              style: 'paragraph'
            - type: 'text'
              # ../en-US.restext:158 | "Then, perform all Start o..."
              value: 'restext://Common_154'
    - match: 2
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7870
      - type: 'popup'
        layout: 'end_of_round'
        # ../en-US.restext:69 | "Click here at the end of ..."
        label: 'restext://Common_065'
        target: '${Liberal2nextpsg}'
        # ../en-US.restext:181 | "End of Round"
        okay: 'restext://Common_177'
        onclose:
        # ../.source/FearoftheUnknown_Eng_v15.cs:7894
        - type: 'conditional'
          if: 'Liberal2nextpsg == "" || Liberal2nextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7896
          - type: 'assign'
            var: 'Liberal2nextpsg'
            expr: '["LiberalEvent", "LiberalTaxes"].shuffled("?")[0]'
        - type: 'assign'
          var: '_ProgressRound'
          expr: '8'
        snapshot: true
        content:
        - type: 'text'
          # ../en-US.restext:323 | "The Middle Years of the T..."
          value: 'restext://Common_319'
        - type: 'break'
          style: 'paragraph'
        - type: 'text'
          # ../en-US.restext:158 | "Then, perform all Start o..."
          value: 'restext://Common_154'
# ../.source/FearoftheUnknown_Eng_v15.cs:7875
- type: 'assign'
  var: 'round'
  expr: '20'
