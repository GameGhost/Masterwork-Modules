# ../.source/FearoftheUnknown_Eng_v15.cs:7701
---
format: 'mws/0.4'
passage_id: 'Liberal2'
# ../en-US.restext:325 | "Acceptance"
title: 'restext://Title_Acceptance'
# ../en-US.restext:343 | "Middle Years"
subtitle: 'restext://Title_MiddleYears'
tags:
- 'HUB'
layout: 'hub_middle'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:7711
- type: 'section'
  # ../en-US.restext:210 | "**Special Servant Rule**"
  title: 'restext://Heading_SpecialServantRule'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7720
  - type: 'text'
    # ../en-US.restext:138 | "Due to the government-fun..."
    value: 'restext://Directive_WorkReintroductionServantsNotLost'
# ../.source/FearoftheUnknown_Eng_v15.cs:7728
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7732
- type: 'section'
  # ../en-US.restext:199 | "**Rehabilitation Token**"
  title: 'restext://Heading_RehabilitationToken'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7741
  - type: 'text'
    # ../en-US.restext:117 | "The {icon:s2_rehabilitati..."
    value: 'restext://Directive_RehabilitationTokenMovesLikeMob'
# ../.source/FearoftheUnknown_Eng_v15.cs:7750
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7755
- type: 'section'
  # ../en-US.restext:219 | "{icon:storybooktoken} **A..."
  title: 'restext://Heading_StorybookToken_FocusOnRehabilitation'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7767
  - type: 'text'
    # ../en-US.restext:129 | "When a player's token ove..."
    value: 'restext://Directive_TokenOverlapsRehabilitation_Fragment'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7776
  - type: 'link'
    # ../en-US.restext:44 | "click here to be committed."
    label: 'restext://Click_HereToBeCommitted'
    target: 'AsylumTreatment' # ./00179-AsylumTreatment.mws.yaml
    snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:7779
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7781
- type: 'conditional'
  if: 'creature == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7783
  - type: 'conditional'
    if: 'exped == 0'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:7787
    - type: 'section'
      # ../en-US.restext:225 | "{icon:storybooktoken}**Th..."
      title: 'restext://Heading_StorybookToken_TheHuntIsOn_NoSpace'
      style: 'hub-card'
      content:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7797
      - type: 'text'
        # ../en-US.restext:135 | "Any time a player visits ..."
        value: 'restext://Directive_VisitLocationClaimHuntToken'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7800
      - type: 'break'
        style: 'paragraph'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7802
      - type: 'text'
        # ../en-US.restext:91 | "At the end of each round,..."
        value: 'restext://Directive_ExpeditionKillCreature_Fragment'
      # ../.source/FearoftheUnknown_Eng_v15.cs:7809
      - type: 'link'
        # ../en-US.restext:49 | "click here."
        label: 'restext://Click_Here_Period'
        target: 'HuntExplanation' # ./00076-HuntExplanation.mws.yaml
        snapshot: true
    # ../.source/FearoftheUnknown_Eng_v15.cs:7812
    - type: 'break'
      style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7818
- type: 'section'
  # ../en-US.restext:234 | "**The** **{menname}** **P..."
  title: 'restext://Heading_TheMennameProgram'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7829
  - type: 'text'
    # ../en-US.restext:293 | "At the End of the Generat..."
    value: 'restext://Reward_MostMentypeExperiments_Menagerie'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7844
  - type: 'conditional'
    if: 'players >= 4'
    then:
    # ../.source/FearoftheUnknown_Eng_v15.cs:7846
    - type: 'text'
      # ../en-US.restext:296 | "The player who has the se..."
      value: 'restext://Reward_SecondMostExperiments_HasVariant'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7849
  - type: 'break'
    style: 'paragraph'
  # ../.source/FearoftheUnknown_Eng_v15.cs:7852
  - type: 'switch'
    on: 'creature'
    cases:
    - match: 1
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7854
      - type: 'switch'
        on: 'exped'
        cases:
        - match: 1
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7857
          - type: 'popup'
            layout: 'end_of_round'
            # ../en-US.restext:34 | "Click here at the end of ..."
            label: 'restext://Click_EndRound_MoveNextRound'
            target: '${Liberal2nextpsg}'
            # ../en-US.restext:371 | "End of Round"
            okay: 'restext://UIButton_EndOfRound'
            onclose:
            # ../.source/FearoftheUnknown_Eng_v15.cs:7883
            - type: 'conditional'
              if: 'Liberal2nextpsg == "" || Liberal2nextpsg == 0'
              then:
              # ../.source/FearoftheUnknown_Eng_v15.cs:7885
              - type: 'assign'
                var: 'Liberal2nextpsg'
                expr: '["LiberalEvent", "LiberalTaxes"].shuffled("?")[0]'
            - type: 'assign'
              var: '_ProgressRound'
              expr: '8'
            snapshot: true
            content:
            - type: 'text'
              # ../en-US.restext:301 | "The Middle Years of the T..."
              value: 'restext://Round_GenerationIII_MiddleEnded'
            - type: 'break'
              style: 'paragraph'
            - type: 'text'
              # ../en-US.restext:305 | "Then, perform all Start o..."
              value: 'restext://Round_StartLateYears_Rule'
        - match: 0
          nodes:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7863
          - type: 'popup'
            layout: 'end_of_round'
            # ../en-US.restext:34 | "Click here at the end of ..."
            label: 'restext://Click_EndRound_MoveNextRound'
            target: 'Expedition1' # ./00049-Expedition1.mws.yaml
            # ../en-US.restext:371 | "End of Round"
            okay: 'restext://UIButton_EndOfRound'
            onclose:
            - type: 'assign'
              var: '_ProgressRound'
              expr: '8'
            snapshot: true
            content:
            - type: 'text'
              # ../en-US.restext:301 | "The Middle Years of the T..."
              value: 'restext://Round_GenerationIII_MiddleEnded'
            - type: 'break'
              style: 'paragraph'
            - type: 'text'
              # ../en-US.restext:305 | "Then, perform all Start o..."
              value: 'restext://Round_StartLateYears_Rule'
    - match: 2
      nodes:
      # ../.source/FearoftheUnknown_Eng_v15.cs:7870
      - type: 'popup'
        layout: 'end_of_round'
        # ../en-US.restext:34 | "Click here at the end of ..."
        label: 'restext://Click_EndRound_MoveNextRound'
        target: '${Liberal2nextpsg}'
        # ../en-US.restext:371 | "End of Round"
        okay: 'restext://UIButton_EndOfRound'
        onclose:
        # ../.source/FearoftheUnknown_Eng_v15.cs:7894
        - type: 'conditional'
          if: 'Liberal2nextpsg == "" || Liberal2nextpsg == 0'
          then:
          # ../.source/FearoftheUnknown_Eng_v15.cs:7896
          - type: 'assign'
            var: 'Liberal2nextpsg'
            expr: '["LiberalEvent", "LiberalTaxes"].shuffled("?")[0]'
        - type: 'assign'
          var: '_ProgressRound'
          expr: '8'
        snapshot: true
        content:
        - type: 'text'
          # ../en-US.restext:301 | "The Middle Years of the T..."
          value: 'restext://Round_GenerationIII_MiddleEnded'
        - type: 'break'
          style: 'paragraph'
        - type: 'text'
          # ../en-US.restext:305 | "Then, perform all Start o..."
          value: 'restext://Round_StartLateYears_Rule'
# ../.source/FearoftheUnknown_Eng_v15.cs:7875
- type: 'assign'
  var: 'round'
  expr: '20'
