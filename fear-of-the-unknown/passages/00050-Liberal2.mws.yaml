# ../.source/FearoftheUnknown_Eng_v15.cs:7732
- type: 'section'
  # ../en-US.restext:144 | "**Rehabilitation Token**"
  title: 'restext://Common_140'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:7741
  - type: 'text'
    # ../en-US.restext:145 | "The {icon:s2_rehabilitati..."
    value: 'restext://Common_141'
# ../.source/FearoftheUnknown_Eng_v15.cs:7750
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:7755
- type: 'section'
  # ../en-US.restext:146 | "{icon:storybooktoken} **A..."
  title: 'restext://Common_142'
