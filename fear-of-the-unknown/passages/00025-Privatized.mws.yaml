# ../.source/FearoftheUnknown_Eng_v15.cs:4369
---
format: 'mws/0.4'
passage_id: 'Privatized'
# ../en-US.restext:282 | "Private Investors"
title: 'restext://Common_278'
# ../en-US.restext:162 | "Early Years"
subtitle: 'restext://Common_158'
tags:
- 'HUB'
layout: 'hub_early'
nodes:
# ../.source/FearoftheUnknown_Eng_v15.cs:4376
- type: 'assign'
  var: 'round'
  expr: '16'
# ../.source/FearoftheUnknown_Eng_v15.cs:4378
- type: 'conditional'
  if: '!gen3pg'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4382
  - type: 'popup'
    layout: 'setup'
    # ../en-US.restext:163 | "Accept"
    okay: 'restext://Common_159'
    header:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4386
    - type: 'image'
      asset: 'image://setup/AngryMobSetup1'
      style: 'setup-image'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4388
    - type: 'conditional'
      if: 'creature == 1'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:4390
      - type: 'text'
        # ../en-US.restext:276 | "Retrieve the Hunt tokens ..."
        value: 'restext://Common_272'
      # ../.source/FearoftheUnknown_Eng_v15.cs:4393
      - type: 'break'
        style: 'paragraph'
      # ../.source/FearoftheUnknown_Eng_v15.cs:4395
      - type: 'text'
        # ../en-US.restext:584 | "Shuffle them and randomly..."
        value: 'restext://Privatized_002'
      # ../.source/FearoftheUnknown_Eng_v15.cs:4398
      - type: 'break'
        style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4401
    - type: 'text'
      # ../en-US.restext:96 | "Place the Suspicion Marke..."
      value: 'restext://Common_092'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4404
    - type: 'conditional'
      if: '!Privatized'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:4406
      - type: 'assign'
        var: 'Privatized'
        expr: '1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:4407
      - type: 'assign'
        var: 'tracker'
        expr: 'tracker - 1'
      # ../.source/FearoftheUnknown_Eng_v15.cs:4408
      - type: 'conditional'
        if: 'players > 3'
        then:
        # ../.source/FearoftheUnknown_Eng_v15.cs:4410
        - type: 'assign'
          var: 'tracker'
          expr: 'tracker - 1'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4413
    - type: 'text'
      # ../en-US.restext:97 | "**{tracker}** and the {ic..."
      value: 'restext://Common_093'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4418
    - type: 'break'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4419
    - type: 'conditional'
      if: 'players == 3'
      then:
      # ../.source/FearoftheUnknown_Eng_v15.cs:4421
      - type: 'text'
        # ../en-US.restext:98 | "Then, since this is a 3 p..."
        value: 'restext://Common_094'
      # ../.source/FearoftheUnknown_Eng_v15.cs:4422
      - type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:4426
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4431
- type: 'section'
  # ../en-US.restext:585 | "**Investment in Town**"
  title: 'restext://Privatized_003'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4439
  - type: 'text'
    # ../en-US.restext:586 | "To visit a Location with ..."
    value: 'restext://Privatized_004'
# ../.source/FearoftheUnknown_Eng_v15.cs:4454
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4458
- type: 'section'
  # ../en-US.restext:587 | "**Jail**"
  title: 'restext://Privatized_005'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4466
  - type: 'text'
    # ../en-US.restext:588 | "Our business investments ..."
    value: 'restext://Privatized_006'
# ../.source/FearoftheUnknown_Eng_v15.cs:4475
- type: 'break'
  style: 'paragraph'
# ../.source/FearoftheUnknown_Eng_v15.cs:4477
- type: 'conditional'
  if: 'creature == 1'
  then:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4482
  - type: 'section'
    # ../en-US.restext:277 | "{icon:storybooktoken}**Th..."
    title: 'restext://Common_273'
    style: 'hub-card'
    content:
    # ../.source/FearoftheUnknown_Eng_v15.cs:4491
    - type: 'text'
      # ../en-US.restext:278 | "Any time a player visits ..."
      value: 'restext://Common_274'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4494
    - type: 'break'
      style: 'paragraph'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4496
    - type: 'text'
      # ../en-US.restext:589 | "At the end of each round,..."
      value: 'restext://Privatized_009'
    # ../.source/FearoftheUnknown_Eng_v15.cs:4503
    - type: 'link'
      # ../en-US.restext:317 | "click here."
      label: 'restext://Common_313'
      target: 'HuntExplanation' # ./00076-HuntExplanation.mws.yaml
      snapshot: true
# ../.source/FearoftheUnknown_Eng_v15.cs:4506
- type: 'break'
# ../.source/FearoftheUnknown_Eng_v15.cs:4509
- type: 'section'
  style: 'hub-card'
  content:
  # ../.source/FearoftheUnknown_Eng_v15.cs:4531
  - type: 'popup'
    layout: 'end_of_round'
    # ../en-US.restext:69 | "Click here at the end of ..."
    label: 'restext://Common_065'
    target: '${creature == 1 && exped == 0 ? "Expedition1" : "JailEventA"}' # ./00049-Expedition1.mws.yaml, ./00290-JailEventA.mws.yaml
    # ../en-US.restext:181 | "End of Round"
    okay: 'restext://Common_177'
    onclose:
    - type: 'assign'
      var: '_ProgressRound'
      expr: '7'
    snapshot: true
    content:
    - type: 'text'
      # ../en-US.restext:134 | "The Early Years of the Th..."
      value: 'restext://Common_130'
    - type: 'break'
      style: 'paragraph'
    - type: 'text'
      # ../en-US.restext:182 | "Then, perform all Start o..."
      value: 'restext://Common_178'
