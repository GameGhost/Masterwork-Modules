id: 'renegade.fear_of_the_unknown'
version: '0.3.0'
languages:
  - 'en-US'
title:
  - en-US: 'Fear of the Unknown'
description:
  - en-US: 'It is with great reticence that I relay a grievous event which occurred upon my arrival. Upon entering that dismal village to settle my deceased father''s affairs, a commotion drew my attention -- and revealed a horror I would spend the rest of my time there trying to understand.'
thumbnail:
  image: 'image://scenario_tile_fotu'
info:
  players-min: 2
  players-max: 4
  playtime:
  - en-US: '180 minutes'
entry: 'Setup_01_PlayerCountSelect'

# Extractor-owned passages vs. hand-maintained ones. Base passages load first; passage_overrides
# load after and win on a matching passage_id (new IDs are simply added). Re-running the extractor
# only touches passages/, so hand-authored content here always survives a re-extraction.
passages: 'passages'
passages_override: 'passages-override'

# This module's own visual styling — the app's chrome only emits structural class hooks
# (layout-{value}, style-{value}); everything those hooks actually look like lives here.
style: 'assets/style.css'

# Standalone module — no dependencies field/mechanism exists yet for a real shared asset pack
# (masterwork-plan Q27). For now, my-fathers-work-template's layouts/style.css/fonts/etc. are
# applied by direct copy (see scripts/apply-template.ps1) rather than a runtime dependency.
dependencies: []

# Module-wide default background music and SFX — see docs/mws-format-latest.md §9 (Audio) in the
# code repo. Real audio, sourced from Renegade Game Studios' own community-resources release for
# *My Father's Work* — see NOTICE.md's "Audio assets" section for full provenance. Applies to every
# passage/popup/link in this module that doesn't declare its own audio: override.
#
# music.default_tracks (Phase 5 Milestone 6.2): no distinct per-scenario theme track for Fear of the
# Unknown was confirmed in the reference project's static Main.unity clip mapping
# (Masterwork-Design/Design/audio-inventory.md §3/§4), so this uses the same shared 4-track sequence
# playlist every official module now uses — template-canonical (assets/audio/bgm/, propagated via
# scripts/apply-template.ps1), not Fear-of-the-Unknown-specific.
audio:
  music:
    default_tracks:
    - 'audio://bgm/cost_of_disease_theme'
    - 'audio://bgm/chronicle_part_1'
    - 'audio://bgm/chronicle_part_2'
    - 'audio://bgm/chronicle_part_3'
    order: 'sequence'
  sfx:
    popup_open:
    - 'audio://sfx/popup_open'
    popup_close:
    - 'audio://sfx/popup_close'
    click:
    - 'audio://sfx/click'
