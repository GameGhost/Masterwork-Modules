# Real three-layer composite (VIEW-REQUIREMENTS.md §1.2/§1.7/§1.8) — leather background image node
# (style-layer-bg, shared hook with setup/introduction/hub) plus TWO border-image 9-slices applied
# via CSS pseudo-elements, not image nodes: the outer frame (narration_normal.png, on
# `.mws-passage::after`) and the parchment content panel (panel_parchment.png, on
# `.mws-passage-body`'s own border — see style.css). Both used to be separate `image` nodes
# stretched via object-fit: fill, which non-uniformly squashed every frame edge (and, for the
# parchment specifically, its baked-in transparent gutter + drop-shadow) as the viewport resized.
# border-image only stretches each straight edge along its own single axis, and keeps corners at a
# constant on-screen thickness — see style.css's own comment for the full reasoning and the
# measured slice values. Footer is the real round progress bar (§1.4): `roundNum` is an integer 1-9
# (matching the module-scoped session variable a real module's chrome would read; the showcase demo
# passages assign it directly). The switch picks how much of the bar is revealed; the nine
# conditionals each add a label overlay (glow = current round, diffuse = a passed round, nothing
# for a round not yet reached).
format: 'mws/0.4'
layout_id: 'narration'
header:
# fear-of-the-unknown-specific: the template's own copy of this layout assumes a module already supplies
# roundNum (1-9) directly. This module's extractor-synthesized progress tracking (progress-map.json,
# --progress-map) instead sets _ProgressRound, a 0-based "rounds completed so far" count (0 while
# playing round 1, ..., 8 while playing round 9, reaching 9 only once round 9's hub has been left) --
# so roundNum is derived here rather than being a real module variable. min(..., 9) clamps the
# ending/scoring narration (rendered after _ProgressRound reaches 9) to a full bar instead of an
# out-of-range 10th case the switch below has no match for. Reproduced by
# scripts/apply-template.ps1 -ProgressVariable _ProgressRound (see that script's own
# .DESCRIPTION) -- re-running it regenerates this exact block, so hand-edits here don't need to
# survive a re-run.
- type: 'let'
  var: 'roundNum'
  expr: 'min(_ProgressRound + 1, 9)'
- type: 'image'
  asset: 'image://backgrounds/leather_large'
  style: 'layer-bg'
footer:
- type: 'switch'
  on: 'roundNum'
  cases:
  - match: 1
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-1'
  - match: 2
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-2'
  - match: 3
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-3'
  - match: 4
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-4'
  - match: 5
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-5'
  - match: 6
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-6'
  - match: 7
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-7'
  - match: 8
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-8'
  - match: 9
    nodes:
    - type: 'image'
      asset: 'image://progress/background'
      style: 'progress-bg-9'
- type: 'conditional'
  if: 'roundNum == 1'
  then:
  - type: 'image'
    asset: 'image://progress/I1-glow'
    style: 'progress-label-1'
  else:
  - type: 'conditional'
    if: 'roundNum > 1'
    then:
    - type: 'image'
      asset: 'image://progress/I1-diffuse'
      style: 'progress-label-1'
- type: 'conditional'
  if: 'roundNum == 2'
  then:
  - type: 'image'
    asset: 'image://progress/I2-glow'
    style: 'progress-label-2'
  else:
  - type: 'conditional'
    if: 'roundNum > 2'
    then:
    - type: 'image'
      asset: 'image://progress/I2-diffuse'
      style: 'progress-label-2'
- type: 'conditional'
  if: 'roundNum == 3'
  then:
  - type: 'image'
    asset: 'image://progress/I3-glow'
    style: 'progress-label-3'
  else:
  - type: 'conditional'
    if: 'roundNum > 3'
    then:
    - type: 'image'
      asset: 'image://progress/I3-diffuse'
      style: 'progress-label-3'
- type: 'conditional'
  if: 'roundNum == 4'
  then:
  - type: 'image'
    asset: 'image://progress/II1-glow'
    style: 'progress-label-4'
  else:
  - type: 'conditional'
    if: 'roundNum > 4'
    then:
    - type: 'image'
      asset: 'image://progress/II1-diffuse'
      style: 'progress-label-4'
- type: 'conditional'
  if: 'roundNum == 5'
  then:
  - type: 'image'
    asset: 'image://progress/II2-glow'
    style: 'progress-label-5'
  else:
  - type: 'conditional'
    if: 'roundNum > 5'
    then:
    - type: 'image'
      asset: 'image://progress/II2-diffuse'
      style: 'progress-label-5'
- type: 'conditional'
  if: 'roundNum == 6'
  then:
  - type: 'image'
    asset: 'image://progress/II3-glow'
    style: 'progress-label-6'
  else:
  - type: 'conditional'
    if: 'roundNum > 6'
    then:
    - type: 'image'
      asset: 'image://progress/II3-diffuse'
      style: 'progress-label-6'
- type: 'conditional'
  if: 'roundNum == 7'
  then:
  - type: 'image'
    asset: 'image://progress/III1-glow'
    style: 'progress-label-7'
  else:
  - type: 'conditional'
    if: 'roundNum > 7'
    then:
    - type: 'image'
      asset: 'image://progress/III1-diffuse'
      style: 'progress-label-7'
- type: 'conditional'
  if: 'roundNum == 8'
  then:
  - type: 'image'
    asset: 'image://progress/III2-glow'
    style: 'progress-label-8'
  else:
  - type: 'conditional'
    if: 'roundNum > 8'
    then:
    - type: 'image'
      asset: 'image://progress/III2-diffuse'
      style: 'progress-label-8'
- type: 'conditional'
  if: 'roundNum == 9'
  then:
  - type: 'image'
    asset: 'image://progress/III3-glow'
    style: 'progress-label-9'
